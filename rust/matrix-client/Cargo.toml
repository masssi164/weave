[package]
name = "weave-matrix-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Keep the shipped Flutter FFI library name stable across the protocol/client
# crate split. Generated Dart bindings and existing native bundles load this
# ABI as `weave_matrix_core`.
name = "weave_matrix_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
flutter = ["dep:flutter_rust_bridge"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0-beta.4", optional = true }
matrix-sdk = { version = "0.18.0", default-features = false, features = ["bundled-sqlite", "e2e-encryption", "sqlite"] }
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "rustls"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
weave-matrix-protocol = { path = "../matrix-protocol" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
