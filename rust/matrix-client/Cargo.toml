[package]
name = "weave-matrix-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "weave_matrix_client"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
flutter = ["dep:flutter_rust_bridge"]

[dependencies]
base64 = "0.22"
flutter_rust_bridge = { version = "=2.13.0-beta.4", optional = true }
matrix-sdk = { version = "0.18.0", default-features = false, features = ["bundled-sqlite", "e2e-encryption", "sqlite"] }
matrix-sdk-store-encryption = "=0.18.0"
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
url = "2.5"
weave-matrix-protocol = { path = "../matrix-protocol" }

[dev-dependencies]
ed25519-dalek = "2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
