[package]
name = "weave-matrix-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "weave_matrix_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
flutter = [
    "dep:flutter_rust_bridge",
    "dep:matrix-sdk",
    "dep:matrix-sdk-base",
    "dep:reqwest",
    "dep:tokio",
]
jni = ["dep:jni"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0-beta.4", optional = true }
jni = { version = "0.22.4", optional = true }
matrix-sdk = { version = "0.18.0", default-features = false, features = ["bundled-sqlite", "e2e-encryption", "experimental-send-custom-to-device", "sqlite"], optional = true }
matrix-sdk-base = { version = "0.18.0", default-features = false, features = ["e2e-encryption"], optional = true }
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "rustls"], optional = true }
ruma = { version = "0.16.0", features = ["client-api-c", "client-api-s"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["rt", "sync", "time"], optional = true }
tracing = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
