[package]
name = "weave-matrix-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "weave_matrix_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
flutter = ["dep:flutter_rust_bridge"]
jni = ["dep:jni"]

[dependencies]
flutter_rust_bridge = { version = "2.13.0-beta.4", optional = true }
jni = { version = "0.22.4", optional = true }
ruma = { version = "0.16.0", features = ["client-api-c", "client-api-s"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
