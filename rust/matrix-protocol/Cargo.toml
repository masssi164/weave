[package]
name = "weave-matrix-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Keep the server JNI library filename stable while the crate responsibility
# becomes explicitly protocol-only.
name = "weave_matrix_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
jni = ["dep:jni"]

[dependencies]
jni = { version = "0.22.4", optional = true }
ruma = { version = "0.16.0", features = ["client-api-c", "client-api-s"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
