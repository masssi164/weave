spec_id: WEAVE-SPEC-0003
version: 0.2.0
status: deprecated
github_issue: 216
release_notes_label: release-notes-feature
depends_on:
- WEAVE-SPEC-0001
issue_dag:
  sequential:
  - issue: 216
    title: Encrypted contextual meetings
domain_entities:
- ChannelMeetingPreview
- ChannelMeetingAttachPoint
- ChannelMeetingEncryptionBoundary
- ChannelMeetingUxRequirement
- ChannelMeetingControl
provider_neutral_invariants:
- meeting join and start controls fail closed until MatrixRTC Profile 0 signaling, RTC authorization, and media capability are evidenced
- meeting surfaces attach to Weave context instead of generic provider links
- Matrix v1.19 plus pinned MatrixRTC Profile 0 is the only member signaling contract
- LiveKit is only a replaceable southbound SFU adapter
- encryption claims name signaling, media, captions, transcripts, recordings, and metadata boundaries
- recording and transcription are off by default and require explicit participant-visible
  consent
- member meeting views do not expose provider URLs, tokens, SFU internals, credentials,
  or raw diagnostics
acceptance_features:
- e2e/features/weave_spec_0003_acceptance.feature
evidence_gates:
- ./gradlew specContract
- ./gradlew acceptanceContract
- flutter test test/features/chat/channel_workspace_test.dart test/architecture/meetings_contract_test.dart
resolved_architecture_boundaries:
- MAS fronts Matrix Native OAuth with Keycloak upstream
- the internal RTC Authorizer independently validates current call context before SFU token issuance
- member Calls REST and proprietary join grants are removed
acceptance_scenarios:
- tag: '@weave-spec-0003-meeting-consent-boundary'
  evidence:
  - client/test/live_stack_feature_mapping_test.dart
  - e2e/scenario_mappings.json
  - e2e/suites/scenario_catalog.json
  assertions:
  - meeting consent boundary
  - join blocked until evidence
  - WEAVE_SPEC_0003_MEETING_CONSENT_BOUNDARY
- tag: '@weave-spec-0003-transcript-retention-followup'
  evidence:
  - client/test/live_stack_feature_mapping_test.dart
  - e2e/scenario_mappings.json
  - e2e/suites/scenario_catalog.json
  assertions:
  - transcript retention
  - follow-up evidence
  - WEAVE_SPEC_0003_TRANSCRIPT_RETENTION_FOLLOWUP
