spec_id: WEAVE-SPEC-0003
version: 0.2.0
status: proposed
capability_state: experimental-guarded
github_issue: 968
release_notes_label: release-notes-feature
depends_on:
- WEAVE-SPEC-0001
issue_dag:
  sequential:
  - issue: 968
    title: Migrate Calls and Meetings to Matrix-native MatrixRTC Profile 0
domain_entities:
- ChannelMeetingPreview
- ChannelMeetingAttachPoint
- ChannelMeetingEncryptionBoundary
- ChannelMeetingUxRequirement
- ChannelMeetingControl
protocol_entities:
- m.rtc.slot
- m.rtc.member
- m.rtc.notification
- m.rtc.decline
- m.rtc.encryption_key
provider_neutral_invariants:
- Matrix v1.19 plus pinned MatrixRTC Profile 0 is the member northbound contract
- one exact Profile-0 wire shape is used for reads and writes with no compatibility reader
- LiveKit is a replaceable RTC transport and SFU, not a Weave Calls API
- Matrix OpenID identity proof never substitutes for current room and call authorization
- private-call claims require Matrix room encryption and MatrixRTC media E2EE evidence
- recording and transcription are off by default and require visible consent and decryption truth
- member clients never receive provider admin APIs, secrets, durable grants, or raw diagnostics
- proprietary Calls routes events DTOs generated clients and fixtures are removed
acceptance_features:
- e2e/features/weave_spec_0003_acceptance.feature
evidence_gates:
- ./gradlew specContract
- ./gradlew acceptanceContract
- flutter test test/features/chat/channel_workspace_test.dart test/architecture/meetings_contract_test.dart
open_product_core_decisions:
- federated MatrixRTC membership attestation remains guarded
- recording and transcription decrypting profiles remain default-off
- release requires physical-device and live interoperability evidence
acceptance_scenarios:
- tag: '@weave-spec-0003-meeting-consent-boundary'
  evidence:
  - client/test/live_stack_feature_mapping_test.dart
  - e2e/scenario_mappings.json
  - e2e/suites/scenario_catalog.json
  assertions:
  - meeting consent boundary
  - join blocked until evidence
  - WEAVE_SPEC_0003_MEETING_CONSENT_BOUNDARY
- tag: '@weave-spec-0003-transcript-retention-followup'
  evidence:
  - client/test/live_stack_feature_mapping_test.dart
  - e2e/scenario_mappings.json
  - e2e/suites/scenario_catalog.json
  assertions:
  - transcript retention
  - follow-up evidence
  - WEAVE_SPEC_0003_TRANSCRIPT_RETENTION_FOLLOWUP
