include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb
moduleload argon2 m=65536 t=3 p=1
moduleload ppolicy
moduleload refint
moduleload unique

pidfile /run/ldap/slapd.pid
argsfile /run/ldap/slapd.args
loglevel 0
TLSCACertificateFile /run/certs/ca.pem
TLSCertificateFile /run/certs/ldap-cert.pem
TLSCertificateKeyFile /run/certs/ldap-key.pem
TLSProtocolMin 3.3
security simple_bind=128
password-hash {ARGON2}

database config
rootdn "gidNumber=0+uidNumber=1000,cn=peercred,cn=external,cn=auth"
access to * by dn.exact="gidNumber=0+uidNumber=1000,cn=peercred,cn=external,cn=auth" manage by * none

database mdb
maxsize 1073741824
suffix "dc=weave,dc=test"
rootdn "gidNumber=0+uidNumber=1000,cn=peercred,cn=external,cn=auth"
directory /var/lib/ldap/data
index objectClass,uid,entryUUID,member eq

access to attrs=userPassword by anonymous auth by * none
access to dn.subtree="ou=people,dc=weave,dc=test" attrs=entry,objectClass,uid,cn,sn,givenName,mail,entryUUID,pwdAccountLockedTime
  by dn.exact="uid=keycloak,ou=services,dc=weave,dc=test" read by * none
access to dn.subtree="ou=groups,dc=weave,dc=test" attrs=entry,objectClass,cn,member,entryUUID
  by dn.exact="uid=keycloak,ou=services,dc=weave,dc=test" read by * none
access to * by * none

overlay ppolicy
ppolicy_default "cn=default,ou=policies,dc=weave,dc=test"
ppolicy_use_lockout

overlay refint
refint_attributes member

overlay unique
unique_uri "serialize ldap:///ou=people,dc=weave,dc=test?uid?sub"
