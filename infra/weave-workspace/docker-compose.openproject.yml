# Optional OpenProject provider profile for local/demo/full-suite validation.
# Not part of the default Weave core stack and not a normal Weave product route.
# Start only after setting TF_VAR_openproject_secret_key_base in a private env file:
#   docker compose -f docker-compose.openproject.yml --profile openproject up -d

services:
  openproject:
    profiles:
      - openproject
    image: ${TF_VAR_openproject_image:-openproject/openproject:15}
    container_name: weave-openproject
    restart: unless-stopped
    environment:
      OPENPROJECT_HOST__NAME: ${TF_VAR_openproject_host_name:-openproject.weave.test}
      OPENPROJECT_HTTPS: ${TF_VAR_openproject_https:-false}
      OPENPROJECT_SECRET_KEY_BASE: ${TF_VAR_openproject_secret_key_base:?Set TF_VAR_openproject_secret_key_base in a private env file before starting OpenProject}
    ports:
      - "${TF_VAR_openproject_host_port:-48086}:80"
    volumes:
      - weave_openproject_pgdata:/var/openproject/pgdata
      - weave_openproject_assets:/var/openproject/assets
    networks:
      weave:
        aliases:
          - weave-openproject

volumes:
  weave_openproject_pgdata:
    name: weave_openproject_pgdata
  weave_openproject_assets:
    name: weave_openproject_assets

networks:
  weave:
    external: true
    name: ${TF_VAR_docker_network_name:-weave_network}
