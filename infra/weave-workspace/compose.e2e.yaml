# Disposable E2E-only overlay. The run namespace, project, resources, ports,
# SecretRefs, and generated root are computed from WEAVE_E2E_RUN_ID before
# Compose renders this file. The proof surface must never enter dogfood/prod.
services:
  backend:
    environment:
      WEAVE_CHAT_E2E_PROOF_ENABLED: "true"
      WEAVE_CHAT_E2E_PROOF_TOKEN_FILE: /run/secrets/weave/chat-e2e-proof-token
      WEAVE_CHAT_E2E_PROOF_RUN_ID: ${WEAVE_E2E_RUN_ID:?isolated run ID is required}
      WEAVE_CHAT_E2E_PROOF_STACK_SCOPE: isolated
      WEAVE_CONTEXT_AUTHORIZATION_SEED_MEMBERSHIPS_FILE: /run/weave-e2e/context-authorization-memberships.json
    volumes:
      - type: bind
        source: ${WEAVE_SECRET_ROOT:?isolated SecretRef root is required}/chat-e2e-proof-token
        target: /run/secrets/weave/chat-e2e-proof-token
        read_only: true
      - type: bind
        source: ${WEAVE_GENERATED_ROOT:?isolated generated root is required}/context-authorization-memberships.json
        target: /run/weave-e2e/context-authorization-memberships.json
        read_only: true
