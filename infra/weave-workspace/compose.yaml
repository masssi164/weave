name: ${WEAVE_COMPOSE_PROJECT:-weave-dev}

x-weave-resource-labels: &weave-resource-labels
  com.massimotter.weave.managed: "true"
  com.massimotter.weave.environment: ${WEAVE_RESOURCE_ENVIRONMENT:-dev}
  com.massimotter.weave.scope: ${WEAVE_STACK_SCOPE:-persistent}
  com.massimotter.weave.stack: ${WEAVE_RESOURCE_STACK:-weave}
  com.massimotter.weave.generation: ${WEAVE_RESOURCE_GENERATION:-fresh-v1}
  com.massimotter.weave.namespace: ${WEAVE_RESOURCE_PREFIX:-weave}
  com.massimotter.weave.fresh-start-eligible: "true"
  com.massimotter.weave.spec-commit: ${WEAVE_SPEC_COMMIT:?prepared deployment descriptor required}
  com.massimotter.weave.spec-digest: ${WEAVE_SPEC_DIGEST:?prepared deployment descriptor required}
  com.massimotter.weave.candidate-commit: ${WEAVE_CANDIDATE_COMMIT:?prepared deployment descriptor required}
  com.massimotter.weave.candidate-manifest-digest: ${WEAVE_CANDIDATE_MANIFEST_DIGEST:?prepared deployment descriptor required}

x-weave-service: &weave-service
  init: true
  restart: unless-stopped
  labels:
    <<: *weave-resource-labels
    com.massimotter.weave.data-class: runtime-ephemeral
  networks:
    weave:

x-identity-profiles: &identity-profiles
  - dev
  - dogfood
  - e2e
  - prod

x-deployment-profiles: &deployment-profiles
  - dogfood
  - e2e
  - prod

x-mail-profiles: &mail-profiles
  - dev-tools
  - dogfood
  - e2e

x-application-profiles: &application-profiles
  - dogfood
  - e2e
  - prod

x-provider-matrix-profiles: &provider-matrix-profiles
  - provider-matrix

x-provider-nextcloud-profiles: &provider-nextcloud-profiles
  - provider-nextcloud

x-storage-s3-profiles: &storage-s3-profiles
  - storage-s3

services:
  postgres:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: postgres
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *deployment-profiles
    image: ${WEAVE_POSTGRES_IMAGE:-postgres:16.9-alpine}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${WEAVE_DB_ADMIN_USERNAME:-weave_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
    secrets:
      - postgres-admin-password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres-reconcile:
    profiles: *deployment-profiles
    image: ${WEAVE_POSTGRES_IMAGE:-postgres:16.9-alpine}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-postgres-reconcile
    restart: "no"
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: postgres
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${WEAVE_DB_ADMIN_USERNAME:-weave_admin}
      WEAVE_BACKEND_DB_NAME: ${WEAVE_BACKEND_DB_NAME:-weave_backend}
      WEAVE_BACKEND_DB_USERNAME: ${WEAVE_BACKEND_DB_USERNAME:-weave_backend}
      WEAVE_KEYCLOAK_DB_NAME: ${WEAVE_KEYCLOAK_DB_NAME:-weave_keycloak}
      WEAVE_KEYCLOAK_DB_USERNAME: ${WEAVE_KEYCLOAK_DB_USERNAME:-keycloak}
      WEAVE_CONTROL_DB_USERNAME: ${WEAVE_CONTROL_DB_USERNAME:-weave_control}
    entrypoint:
      - /bin/sh
      - /opt/weave/postgres-reconcile.sh
    volumes:
      - ./database/postgres-reconcile.sh:/opt/weave/postgres-reconcile.sh:ro
    secrets:
      - postgres-admin-password
      - backend-db-password
      - keycloak-db-password
      - control-db-password
    networks:
      weave:

  postgres-reconcile-provider-matrix:
    profiles: *provider-matrix-profiles
    image: ${WEAVE_POSTGRES_IMAGE:-postgres:16.9-alpine}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-postgres-reconcile-provider-matrix
    restart: "no"
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: postgres-provider-matrix
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
    depends_on:
      postgres-reconcile:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${WEAVE_DB_ADMIN_USERNAME:-weave_admin}
      WEAVE_PROVIDER_DATABASE_SET: matrix
      WEAVE_MAS_DB_NAME: ${WEAVE_MAS_DB_NAME:-weave_mas}
      WEAVE_MAS_DB_USERNAME: ${WEAVE_MAS_DB_USERNAME:-mas}
      WEAVE_SYNAPSE_DB_NAME: ${WEAVE_SYNAPSE_DB_NAME:-weave_synapse}
      WEAVE_SYNAPSE_DB_USERNAME: ${WEAVE_SYNAPSE_DB_USERNAME:-synapse}
    entrypoint:
      - /bin/sh
      - /opt/weave/postgres-provider-reconcile.sh
    volumes:
      - ./database/postgres-provider-reconcile.sh:/opt/weave/postgres-provider-reconcile.sh:ro
    secrets:
      - postgres-admin-password
      - mas-db-password
      - synapse-db-password
    networks:
      weave:

  postgres-reconcile-provider-nextcloud:
    profiles: *provider-nextcloud-profiles
    image: ${WEAVE_POSTGRES_IMAGE:-postgres:16.9-alpine}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-postgres-reconcile-provider-nextcloud
    restart: "no"
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: postgres-provider-nextcloud
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
    depends_on:
      postgres-reconcile:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${WEAVE_DB_ADMIN_USERNAME:-weave_admin}
      WEAVE_PROVIDER_DATABASE_SET: nextcloud
      WEAVE_NEXTCLOUD_DB_NAME: ${WEAVE_NEXTCLOUD_DB_NAME:-weave_nextcloud}
      WEAVE_NEXTCLOUD_DB_USERNAME: ${WEAVE_NEXTCLOUD_DB_USERNAME:-nextcloud}
    entrypoint:
      - /bin/sh
      - /opt/weave/postgres-provider-reconcile.sh
    volumes:
      - ./database/postgres-provider-reconcile.sh:/opt/weave/postgres-provider-reconcile.sh:ro
    secrets:
      - postgres-admin-password
      - nextcloud-db-password
    networks:
      weave:

  caddy:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: gateway
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *deployment-profiles
    image: ${WEAVE_CADDY_IMAGE:-caddy:2.10.0-alpine}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-proxy
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "${WEAVE_PROXY_HTTP_HOST_PORT:-44080}:80"
      - "${WEAVE_PROXY_HTTPS_HOST_PORT:-44443}:443"
    networks:
      weave:
        aliases:
          - ${WEAVE_TENANT_DOMAIN:-weave.test}
          - ${WEAVE_API_SUBDOMAIN:-api}.${WEAVE_TENANT_DOMAIN:-weave.test}
          - ${WEAVE_AUTH_SUBDOMAIN:-auth}.${WEAVE_TENANT_DOMAIN:-weave.test}
          - ${WEAVE_MATRIX_SUBDOMAIN:-matrix}.${WEAVE_TENANT_DOMAIN:-weave.test}
          - ${WEAVE_FILES_SUBDOMAIN:-files}.${WEAVE_TENANT_DOMAIN:-weave.test}
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/ca.pem:/certs/ca.pem:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/cert.pem:/certs/cert.pem:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/key.pem:/certs/key.pem:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: identity
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *identity-profiles
    image: ${WEAVE_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.1}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-keycloak
    user: "${WEAVE_RUNTIME_UID:-1000}:0"
    depends_on:
      postgres-reconcile:
        condition: service_completed_successfully
    entrypoint:
      - /bin/bash
      - /opt/weave/run-keycloak.sh
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${WEAVE_KEYCLOAK_DB_NAME:-weave_keycloak}
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: ${WEAVE_KEYCLOAK_DB_USERNAME:-keycloak}
      KC_HOSTNAME: ${WEAVE_AUTH_URL:-https://auth.weave.test:44443}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_PROXY_HEADERS: xforwarded
      KC_TRUSTSTORE_PATHS: /opt/weave/trust/ca.pem
    secrets:
      - keycloak-db-password
    volumes:
      - ./scripts/run-keycloak.sh:/opt/weave/run-keycloak.sh:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/ca.pem:/opt/weave/trust/ca.pem:ro
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/keycloak/import:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${WEAVE_KEYCLOAK_HOST_PORT:-48080}:8080"
      - "127.0.0.1:${WEAVE_KEYCLOAK_MANAGEMENT_HOST_PORT:-49000}:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  keycloak-realm-migration-bootstrap:
    profiles:
      - identity-migration
    image: ${WEAVE_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.1}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-keycloak-realm-migration-bootstrap
    user: "${WEAVE_RUNTIME_UID:-1000}:0"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint:
      - /bin/bash
      - /opt/weave/run-keycloak.sh
    command:
      - bootstrap-admin
      - service
      - --optimized
      - --client-id
      - weave-realm-migration-bootstrap
      - --client-secret:env=KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
      - --no-prompt
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${WEAVE_KEYCLOAK_DB_NAME:-weave_keycloak}
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: ${WEAVE_KEYCLOAK_DB_USERNAME:-keycloak}
    secrets:
      - keycloak-db-password
      - source: keycloak-realm-migration-bootstrap-secret
        target: keycloak-realm-migration-bootstrap-secret
        uid: "${WEAVE_RUNTIME_UID:-1000}"
        gid: "0"
        mode: 0600
    volumes:
      - ./scripts/run-keycloak.sh:/opt/weave/run-keycloak.sh:ro
      - keycloak-data:/opt/keycloak/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=${WEAVE_RUNTIME_UID:-1000},gid=0
    networks:
      weave:
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: keycloak-realm-migration-bootstrap
      com.massimotter.weave.data-class: security-sensitive
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"

  keycloak-realm-migration:
    profiles:
      - identity-migration
    image: ${WEAVE_BACKEND_IMAGE:-weave-backend:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-keycloak-realm-migration
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: keycloak-realm-migration-bootstrap-secret
        target: keycloak-realm-migration-bootstrap-secret
        uid: "${WEAVE_RUNTIME_UID:-1000}"
        gid: "${WEAVE_RUNTIME_GID:-1000}"
        mode: 0600
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}:/run/weave-generated:ro
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/keycloak/migrations:/run/weave-generated/keycloak/migrations
    networks:
      weave:
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: keycloak-realm-migration
      com.massimotter.weave.data-class: security-sensitive
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"

  mailpit:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: mail
      com.massimotter.weave.data-class: activation-sensitive
    profiles: *mail-profiles
    image: ${WEAVE_MAILPIT_IMAGE:-axllent/mailpit:v1.27.8}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${WEAVE_MAILPIT_MAX_MESSAGES:-500}
      MP_SMTP_REQUIRE_TLS: ${WEAVE_MAILPIT_REQUIRE_TLS:-false}
      MP_SMTP_TLS_CERT: /run/mailpit/tls/cert.pem
      MP_SMTP_TLS_KEY: /run/mailpit/tls/key.pem
    volumes:
      - mailpit-data:/data
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/mailpit-cert.pem:/run/mailpit/tls/cert.pem:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/mailpit-key.pem:/run/mailpit/tls/key.pem:ro
    ports:
      - "127.0.0.1:${WEAVE_MAILPIT_WEB_HOST_PORT:-48025}:8025"
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 10s
      timeout: 5s
      retries: 12

  mas:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: matrix-auth
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *provider-matrix-profiles
    image: ${WEAVE_MAS_IMAGE:-ghcr.io/element-hq/matrix-authentication-service:1.15.0}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-mas
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres-reconcile-provider-matrix:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    command:
      - server
      - -c
      - /config/config.yaml
    environment:
      SSL_CERT_FILE: /certs/ca.pem
      CURL_CA_BUNDLE: /certs/ca.pem
      REQUESTS_CA_BUNDLE: /certs/ca.pem
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/mas/config.yaml:/config/config.yaml:ro
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/mas/signing.key:/config/signing.key:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/ca.pem:/certs/ca.pem:ro
    ports:
      - "127.0.0.1:${WEAVE_MAS_HOST_PORT:-48082}:8080"
    healthcheck:
      test:
        - CMD
        - mas-cli
        - -c
        - /config/config.yaml
        - doctor
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  synapse-init:
    profiles: *provider-matrix-profiles
    image: ${WEAVE_SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.136.0}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-synapse-init
    restart: "no"
    user: "0:0"
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: chat
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        install -d -m 0750 -o ${WEAVE_SYNAPSE_UID:-991} -g ${WEAVE_SYNAPSE_GID:-991} /data /data/media_store
        install -m 0400 -o ${WEAVE_SYNAPSE_UID:-991} -g ${WEAVE_SYNAPSE_GID:-991} /source-config/homeserver.yaml /data/homeserver.yaml
        install -d -m 0700 /appservice
        install -m 0400 -o ${WEAVE_SYNAPSE_UID:-991} -g ${WEAVE_SYNAPSE_GID:-991} /source/registration.yaml /appservice/registration.yaml
        install -m 0400 -o ${WEAVE_SYNAPSE_UID:-991} -g ${WEAVE_SYNAPSE_GID:-991} /source/as-token /appservice/as-token
        install -m 0400 -o ${WEAVE_SYNAPSE_UID:-991} -g ${WEAVE_SYNAPSE_GID:-991} /source/hs-token /appservice/hs-token
        chown -R ${WEAVE_SYNAPSE_UID:-991}:${WEAVE_SYNAPSE_GID:-991} /data
        chown ${WEAVE_SYNAPSE_UID:-991}:${WEAVE_SYNAPSE_GID:-991} /appservice
        chmod 0500 /appservice
        test -s /appservice/registration.yaml
        test -s /appservice/as-token
        test -s /appservice/hs-token
        ! cmp -s /appservice/as-token /appservice/hs-token
    volumes:
      - synapse-data:/data
      - matrix-appservice:/appservice
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/synapse/appservice:/source:ro
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/synapse/homeserver.yaml:/source-config/homeserver.yaml:ro
    networks:
      weave:

  synapse:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: chat
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *provider-matrix-profiles
    image: ${WEAVE_SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.136.0}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-synapse
    user: "${WEAVE_SYNAPSE_UID:-991}:${WEAVE_SYNAPSE_GID:-991}"
    depends_on:
      postgres-reconcile-provider-matrix:
        condition: service_completed_successfully
      mas:
        condition: service_started
      synapse-init:
        condition: service_completed_successfully
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_SERVER_NAME: ${WEAVE_MATRIX_HOST:-matrix.weave.test}
      SYNAPSE_REPORT_STATS: "no"
      SSL_CERT_FILE: /certs/ca.pem
      CURL_CA_BUNDLE: /certs/ca.pem
      REQUESTS_CA_BUNDLE: /certs/ca.pem
    volumes:
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/ca.pem:/certs/ca.pem:ro
      - synapse-data:/data
      - matrix-appservice:/run/weave-chat-appservice:ro
    ports:
      - "127.0.0.1:${WEAVE_SYNAPSE_HOST_PORT:-48008}:8008"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8008/health", timeout=3)'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nextcloud:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: files-calendar
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *provider-nextcloud-profiles
    image: ${WEAVE_NEXTCLOUD_IMAGE:-nextcloud:31.0.7-apache}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-nextcloud
    depends_on:
      postgres-reconcile-provider-nextcloud:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${WEAVE_NEXTCLOUD_DB_NAME:-weave_nextcloud}
      POSTGRES_USER: ${WEAVE_NEXTCLOUD_DB_USERNAME:-nextcloud}
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud-db-password
      NEXTCLOUD_ADMIN_USER: ${WEAVE_NEXTCLOUD_ADMIN_USERNAME:-admin}
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud-admin-password
      NEXTCLOUD_TRUSTED_DOMAINS: ${WEAVE_FILES_HOST:-files.weave.test} ${WEAVE_RESOURCE_PREFIX:-weave}-nextcloud localhost 127.0.0.1
      OVERWRITEHOST: ${WEAVE_FILES_PUBLIC_AUTHORITY:-files.weave.test:44443}
      OVERWRITECLIURL: ${WEAVE_FILES_URL:-https://files.weave.test:44443}
      OVERWRITEPROTOCOL: https
      FORWARDEDFORHEADERS: HTTP_X_FORWARDED_FOR
    secrets:
      - nextcloud-db-password
      - nextcloud-admin-password
    volumes:
      - nextcloud-data:/var/www/html
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/ca.pem:/certs/ca.pem:ro
    ports:
      - "127.0.0.1:${WEAVE_NEXTCLOUD_HOST_PORT:-48083}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/status.php | grep -q '"installed"'
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  runtime-state-volume-init:
    profiles: *storage-s3-profiles
    image: ${WEAVE_RUNTIME_STATE_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-runtime-state-volume-init
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        chmod 0700 /data
        chown "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}" /data
    volumes:
      - runtime-state-data:/data
    network_mode: none
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: runtime-state
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: volume-initialize

  runtime-state:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: runtime-state
      com.massimotter.weave.data-class: runtime-state-sensitive
      com.massimotter.weave.protocol: s3-compatible
    profiles: *storage-s3-profiles
    image: ${WEAVE_RUNTIME_STATE_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-runtime-state
    restart: unless-stopped
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/runtime-state-s3-access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/runtime-state-s3-secret-key
      MC_CONFIG_DIR: /tmp/.mc
    command:
      - server
      - /data
      - --console-address
      - :9001
    depends_on:
      runtime-state-volume-init:
        condition: service_completed_successfully
    secrets:
      - source: runtime-state-s3-access-key
        target: runtime-state-s3-access-key
        mode: 0400
      - source: runtime-state-s3-secret-key
        target: runtime-state-s3-secret-key
        mode: 0400
    volumes:
      - runtime-state-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        - CMD-SHELL
        - mc ready local
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  runtime-state-init:
    profiles: *storage-s3-profiles
    image: ${WEAVE_RUNTIME_STATE_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-runtime-state-init
    restart: "no"
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        access_key="$$(cat /run/secrets/runtime-state-s3-access-key)"
        secret_key="$$(cat /run/secrets/runtime-state-s3-secret-key)"
        mc alias set -- runtime-state http://runtime-state:9000 "$${access_key}" "$${secret_key}" >/dev/null
        mc mb --ignore-existing runtime-state/weave-runtime-state >/dev/null
        mc version enable runtime-state/weave-runtime-state >/dev/null
        mc stat runtime-state/weave-runtime-state >/dev/null
    depends_on:
      runtime-state:
        condition: service_healthy
    secrets:
      - source: runtime-state-s3-access-key
        target: runtime-state-s3-access-key
        mode: 0400
      - source: runtime-state-s3-secret-key
        target: runtime-state-s3-secret-key
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      weave:
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: runtime-state
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: bucket-initialize

  agent-runtime-keys-init:
    profiles: *application-profiles
    image: ${WEAVE_BACKEND_IMAGE:-weave-backend:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-agent-runtime-keys-init
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none
    entrypoint:
      - /bin/bash
      - -euc
    command:
      - |
        if test -s /run/secrets/agent-runtime/profile-signing/runtime-profile-signing-keys.json; then
          java -jar /app/app.jar runtime-profile-signing-keys --action=status --root=/run/secrets/agent-runtime/profile-signing >/dev/null
        else
          java -jar /app/app.jar runtime-profile-signing-keys --action=initialize --root=/run/secrets/agent-runtime/profile-signing --operation-ref=compose:fresh-start:profile-signing >/dev/null
        fi
        if test -s /run/secrets/agent-runtime/state-wrapping/runtime-state-wrapping-keys.json; then
          java -jar /app/app.jar runtime-state-wrapping-keys --action=status --root=/run/secrets/agent-runtime/state-wrapping >/dev/null
        else
          java -jar /app/app.jar runtime-state-wrapping-keys --action=initialize --root=/run/secrets/agent-runtime/state-wrapping --operation-ref=compose:fresh-start:state-wrapping >/dev/null
        fi
    volumes:
      - ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/agent-runtime/profile-signing:/run/secrets/agent-runtime/profile-signing
      - ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/agent-runtime/state-wrapping:/run/secrets/agent-runtime/state-wrapping
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: agent-runtime-control
      com.massimotter.weave.data-class: credential-sensitive
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: key-initialize

  schema-init:
    profiles: *application-profiles
    image: ${WEAVE_BACKEND_IMAGE:-weave-backend:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-schema-init
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres-reconcile:
        condition: service_completed_successfully
    command:
      - schema-init
    environment:
      SPRING_PROFILES_ACTIVE: ${WEAVE_ENVIRONMENT:?environment required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${WEAVE_BACKEND_DB_NAME:-weave_backend}
      SPRING_DATASOURCE_USERNAME: ${WEAVE_BACKEND_DB_USERNAME:-weave_backend}
      WEAVE_CANDIDATE_COMMIT: ${WEAVE_CANDIDATE_COMMIT}
      WEAVE_PERSISTENCE_PASSWORD_FILE: /run/secrets/backend-db-password
      WEAVE_SCHEMA_INIT_RECEIPT_FILE: /run/weave-schema-init/receipt.json
    secrets:
      - source: backend-db-password
        target: backend-db-password
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/schema-init:/run/weave-schema-init
    networks:
      - weave
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: server-schema
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: schema-initialize

  native-files-volume-init:
    profiles: *application-profiles
    image: ${WEAVE_POSTGRES_IMAGE:-postgres:16.9-alpine}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-native-files-volume-init
    restart: "no"
    user: "0:0"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        mkdir -p /data/blobs
        chmod 0700 /data /data/blobs
        chown ${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000} /data /data/blobs
    volumes:
      - native-files-data:/data
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: files-native
      com.massimotter.weave.data-class: collaboration-sensitive
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: volume-initialize

  schema-receipt-check:
    profiles: *application-profiles
    image: ${WEAVE_BACKEND_IMAGE:-weave-backend:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-schema-receipt-check
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      schema-init:
        condition: service_completed_successfully
    command:
      - schema-receipt-check
    environment:
      WEAVE_CANDIDATE_COMMIT: ${WEAVE_CANDIDATE_COMMIT}
      WEAVE_SCHEMA_INIT_RECEIPT_FILE: /run/weave-schema-init/receipt.json
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/schema-init:/run/weave-schema-init:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: server-schema
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: schema-receipt-verify

  keycloak-realm-migration-receipt-check:
    profiles: *application-profiles
    image: ${WEAVE_BACKEND_IMAGE:-weave-backend:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-keycloak-realm-migration-receipt-check
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        exec java -jar /app/app.jar keycloak-realm-migration-receipt-check \
          --artifact-root=/run/weave-generated \
          --manifest-digest="$${WEAVE_KEYCLOAK_MIGRATION_MANIFEST_DIGEST}" \
          --baseline-digest="$${WEAVE_KEYCLOAK_MIGRATION_BASELINE_DIGEST}" \
          --target-revision="$${WEAVE_KEYCLOAK_MIGRATION_TARGET_REVISION}" \
          --backup-proof-file=/run/weave-generated/keycloak/migrations/fgap-v2-primary-organization-post-import.backup-proof.json \
          --environment="$${WEAVE_KEYCLOAK_MIGRATION_ENVIRONMENT}" \
          --candidate-commit="$${WEAVE_KEYCLOAK_MIGRATION_CANDIDATE_COMMIT}" \
          --compose-project="$${WEAVE_KEYCLOAK_MIGRATION_COMPOSE_PROJECT}"
    env_file:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/keycloak/migrations/receipt-check.env
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}:/run/weave-generated:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: keycloak-realm-migration-receipt-check
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"
      com.massimotter.weave.operation: keycloak-realm-migration-receipt-verify

  backend:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: server
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *application-profiles
    image: ${WEAVE_BACKEND_IMAGE:-weave-backend:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-backend
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    depends_on:
      schema-receipt-check:
        condition: service_completed_successfully
      native-files-volume-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      agent-runtime-keys-init:
        condition: service_completed_successfully
      keycloak-realm-migration-receipt-check:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${WEAVE_ENVIRONMENT:?environment required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${WEAVE_BACKEND_DB_NAME:-weave_backend}
      SPRING_DATASOURCE_USERNAME: ${WEAVE_BACKEND_DB_USERNAME:-weave_backend}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/weave/,optional:configtree:/run/secrets/providers/
    secrets:
      - source: backend-db-password
        target: weave/spring.datasource.password
      - source: identity-admin-private-jwk
        target: /run/secrets/identity-admin/weave-identity-admin-private-jwk.json
      - source: identity-reference-hmac-key
        target: identity-reference-hmac-key
    volumes:
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/agent-runtime-policy.json:/app/agent-runtime-policy.json:ro
      - ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/agent-runtime/workloads:/run/secrets/agent-runtime/workloads
      - ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/agent-runtime/profile-signing:/run/secrets/agent-runtime/profile-signing:ro
      - ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/agent-runtime/state-wrapping:/run/secrets/agent-runtime/state-wrapping:ro
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/backend/configtree:/run/secrets/providers:ro
      - native-files-data:/var/lib/weave/files
    ports:
      - "127.0.0.1:${WEAVE_BACKEND_HOST_PORT:-48084}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/api/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  mcp-secret-check:
    profiles: *application-profiles
    image: ${WEAVE_MCP_IMAGE:-weave-mcp-server:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-mcp-secret-check
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint:
      - /bin/bash
      - -euc
    command:
      - |
        path=/run/secrets/weave/mcp-private-jwk.json
        test -f "$${path}"
        test ! -L "$${path}"
        test -r "$${path}"
        test "$$(stat -c '%a' "$${path}")" = 600
    volumes:
      - type: bind
        source: ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/keycloak-weave-mcp-server-jwk.json
        target: /run/secrets/weave/mcp-private-jwk.json
        read_only: true
    networks:
      weave:
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: mcp
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"

  mcp-keycloak-connectivity-check:
    profiles: *application-profiles
    image: ${WEAVE_MCP_IMAGE:-weave-mcp-server:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-mcp-keycloak-connectivity-check
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -euc
    command:
      - |
        curl --fail --silent --show-error http://keycloak:8080/realms/weave/protocol/openid-connect/certs >/dev/null
        status="$$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://keycloak:8080/realms/weave/protocol/openid-connect/token)"
        test "$${status}" = 400
    networks:
      weave:
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: mcp
      com.massimotter.weave.data-class: runtime-ephemeral
      com.massimotter.weave.fresh-start-eligible: "false"
      com.massimotter.weave.one-shot: "true"

  mcp:
    <<: *weave-service
    labels:
      <<: *weave-resource-labels
      com.massimotter.weave.component: mcp
      com.massimotter.weave.data-class: runtime-ephemeral
    profiles: *application-profiles
    image: ${WEAVE_MCP_IMAGE:-weave-mcp-server:local}
    container_name: ${WEAVE_RESOURCE_PREFIX:-weave}-mcp-server
    user: "${WEAVE_RUNTIME_UID:-1000}:${WEAVE_RUNTIME_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mcp-secret-check:
        condition: service_completed_successfully
      mcp-keycloak-connectivity-check:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${WEAVE_ENVIRONMENT:?environment required}
    volumes:
      - type: bind
        source: ${WEAVE_SECRET_ROOT:-./.generated/dev/secrets}/keycloak-weave-mcp-server-jwk.json
        target: /run/secrets/weave/mcp-private-jwk.json
        read_only: true
    ports:
      - "127.0.0.1:${WEAVE_MCP_HOST_PORT:-48085}:8091"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8091/actuator/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

secrets:
