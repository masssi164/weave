services:
  caddy:
    extra_hosts:
      - host.docker.internal:host-gateway

  keycloak:
    command:
      - start-dev
    environment:
      WEAVE_IDENTITY_EVENTS_ENDPOINT: http://host.docker.internal:${WEAVE_HOST_DEV_BACKEND_PORT:-8080}/api/internal/keycloak/events

  synapse:
    extra_hosts:
      - host.docker.internal:host-gateway

  mailpit:
    environment:
      MP_SMTP_REQUIRE_TLS: "false"
