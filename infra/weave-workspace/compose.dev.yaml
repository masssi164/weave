services:
  caddy:
    extra_hosts:
      - host.docker.internal:host-gateway

  keycloak:
    depends_on: !reset {}
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: dev-file
    secrets: !reset []
    volumes: !override
      - ./scripts/run-keycloak.sh:/opt/weave/run-keycloak.sh:ro
      - ${WEAVE_TLS_ROOT:-./.generated/dev/tls}/ca.pem:/opt/weave/trust/ca.pem:ro
      - ${WEAVE_GENERATED_ROOT:-./.generated/dev}/keycloak/import:/opt/keycloak/data/import:ro

  keycloak-realm-migration-bootstrap:
    environment:
      KC_DB: dev-file
    secrets: !override
      - source: keycloak-realm-migration-bootstrap-secret
        target: keycloak-realm-migration-bootstrap-secret
        uid: "${WEAVE_RUNTIME_UID:-1000}"
        gid: "0"
        mode: 0600

  synapse:
    extra_hosts:
      - host.docker.internal:host-gateway

  mailpit:
    environment:
      MP_SMTP_REQUIRE_TLS: "false"
