# Persistent dogfood overlay. Weave-native Files, Calendar, and Chat are the
# default data plane; optional external providers are selected explicitly.
services:
  keycloak:
    command:
      - start
      - --import-realm

  mailpit:
    environment:
      MP_SMTP_REQUIRE_TLS: "true"

  backend:
    environment:
      WEAVE_RELEASE_POSTURE: dogfood
