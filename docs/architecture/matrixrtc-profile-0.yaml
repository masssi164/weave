# Repo-local implementation projection. Canonical product/domain truth is the
# pinned weave-specs corpus. MatrixRTC remains an open-MSC profile and is
# therefore Guarded rather than a stable interoperability claim.
profile:
  id: weave.matrixrtc/profile-0
  version: 0.2.0
  status: experimental-guarded
  frozen_at: 2026-07-19
  compatibility_policy: strict-cutover
  statement: >-
    Weave Calls uses Matrix Client-Server and one revision-pinned MatrixRTC
    wire profile. It exposes no proprietary member Calls endpoint or event.

stable_matrix:
  specification: v1.19
  client_server_base: /_matrix/client
  required:
    - GET /.well-known/matrix/client
    - GET /_matrix/client/v1/auth_metadata
    - OAuth 2.0 Dynamic Client Registration (RFC 7591) where required
    - Authorization Code with PKCE S256
    - GET /_matrix/client/v3/account/whoami
    - POST /_matrix/client/v3/user/{userId}/openid/request_token

matrixrtc_snapshots:
  # These were verified against the live pull-request heads on 2026-07-19.
  - msc: 4143
    role: base-slot-membership-transport-discovery-e2ee
    commit: 0c5f1877ef163c02521f22c710a18b49bb527f21
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4143
  - msc: 4195
    role: livekit-transport
    commit: a8464ae82ca85eae2ca1882cd8a38305a14b8bd2
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4195
  - msc: 4196
    role: m.call-application
    commit: 5add2f0c96974c4996a6e5e0907018117cbb5934
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4196
  - msc: 4075
    role: notifications-and-ringing
    commit: 39cc54743a4f2187fdee1a69909b4a84eb7af014
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4075
  - msc: 4310
    role: decline
    commit: 67687dc381f56c626edf6e00a2bd2c5e2d04e56b
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4310
  - msc: 4140
    role: cancellable-delayed-leave
    commit: cd878d211fc855951e79cbb940bd68c304eecc87
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4140
  - msc: 4354
    role: sticky-events
    commit: 74fc75e1dc1301230cc3fcb7435205bf4f567ef8
    pull_request: https://github.com/matrix-org/matrix-spec-proposals/pull/4354

authentication:
  visible_authorization_server: matrix-authentication-service
  upstream_identity_backbone: keycloak
  rule: >-
    Clients authenticate through Matrix Native OAuth. MAS uses Keycloak as its
    upstream organizational IdP. Matrix OAuth access tokens, OIDC ID tokens,
    and Matrix OpenID credentials are distinct token types.

client_flow:
  - discover_matrix_homeserver_from_well_known
  - fetch_auth_metadata
  - register_oauth_client_or_use_pre_registered_client
  - authorize_with_code_and_pkce_s256_in_system_browser
  - confirm_identity_with_whoami
  - discover_transports_via_authenticated_get_matrix_client_v1_rtc_transports
  - resolve_or_open_m_rtc_slot
  - publish_sticky_m_rtc_member
  - request_matrix_openid_credential
  - exchange_openid_credential_at_rtc_authorizer
  - connect_to_livekit_over_webrtc

transport_discovery:
  endpoint: /_matrix/client/v1/rtc/transports
  feature_flag: org.matrix.msc4143.stable
  authenticated: true
  rule: >-
    Profile 0 requires this exact endpoint and feature flag. A server that
    exposes only an older or unstable alias is incompatible and fails closed.

wire_contract:
  authoritative_shape: msc4143-slot-sticky-membership
  read_policy: strict-profile-0-only
  write_policy: strict-profile-0-only
  reject_unknown_or_legacy_shapes: true
  events:
    slot: m.rtc.slot
    membership: m.rtc.member
    notification: m.rtc.notification
    decline: m.rtc.decline
    encryption_key: m.rtc.encryption_key
  forbidden:
    - com.weave.call.*
    - org.matrix.msc3401.call.member
    - legacy-msc4195-rtc_transports-array
    - legacy-msc4196-membership-relations
    - unstable-profile-event-aliases
  rule: >-
    There is no dual-read or translation layer. Conflicting shapes in older
    proposal revisions are rejected. Interoperability stays Guarded until
    peers implement this exact profile or the profile is deliberately revised.

rtc_authorizer:
  identity_input: matrix-openid-credential
  output: short-lived-livekit-jwt
  required_bindings:
    - matrix_user_id
    - matrix_room_id
    - slot_id
    - member_id
    - livekit_alias
    - permissions
    - issued_at
    - expires_at
    - nonce
    - policy_revision
  authorization:
    local_publish_or_room_create: current-room-membership-and-weave-policy-required
    subscribe: least-privilege-and-current-call-policy-required
    federated_membership: guarded-until-standard-membership-attestation-is-proven
  forbidden:
    - treating-openid-identity-proof-as-room-authorization
    - exposing-livekit-api-secret-to-client
    - long-lived-join-token
    - deriving-room-authorization-from-identity-proof-alone

ruma_projection:
  pinned_main_commit: ea3455221fd99985256b196866abb85e22ff4bdd
  local_gap_module: matrixrtc_wire
  local_types:
    - m.rtc.slot-state-event
    - m.rtc.member-sticky-room-event
    - m.rtc.encryption_key-to-device-event
    - rtc-transports-endpoint-profile-0
  constraints:
    - use-ruma-custom-event-extension-pattern
    - dispatch-custom-events-through-raw-wrapper-and-event-type
    - retain-exact-matrix-wire-names
    - delete-local-type-when-equivalent-upstream-ruma-type-is-adopted

flutter_projection:
  matrix_protocol_core: shared-rust-ruma-via-flutter_rust_bridge
  media_transport: livekit-client
  native_call_coordinator:
    owns:
      - callkit-and-core-telecom-ui-lifecycle
      - answer-decline-end-hold-mute-correlation
      - audio-route-synchronization
      - idempotent-os-protocol-state-correlation
    must_not_own:
      - matrix-discovery-or-oauth
      - matrix-sync-or-e2ee
      - matrixrtc-wire-semantics
      - rtc-authorizer-policy
      - livekit-room-administration

security_claims:
  encrypted_matrix_room: required-for-private-calls
  matrixrtc_media_e2ee: required-for-private-calls
  dtls_srtp_only_is_e2ee: false
  sfu_observes_metadata: true
  recording_or_transcription: >-
    Requires explicit policy and consent plus a disclosed trusted decrypting
    participant or a separately named non-E2EE profile.

release_gates:
  - exact-profile-golden-wire-fixtures
  - incompatible-shape-negative-tests
  - element-call-and-third-party-interoperability
  - local-and-federated-authorization-negative-tests
  - matrixrtc-key-lifecycle-and-device-recovery
  - ios-callkit-and-android-core-telecom-physical-device-evidence
  - reconnect-turn-and-accessibility-evidence
  - no-provider-secret-or-proprietary-call-surface-scan

claim:
  allowed: Experimental MatrixRTC Profile 0; Guarded
  forbidden:
    - stable-matrixrtc-standard
    - production-ready-calls
    - lossless-live-call-provider-migration
    - openid-alone-proves-call-membership
