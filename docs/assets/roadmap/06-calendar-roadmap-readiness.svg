<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Weave calendar roadmap readiness screen</title>
  <desc id="desc">The guarded Calendar roadmap shows active workspace/team/channel readiness copy for the shared scheduling path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.52" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="56" y="54" width="1328" height="792" rx="46" fill="#f8fafc" stroke="#bae6fd" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="111" cy="96" r="13" fill="#38bdf8"/>
  <circle cx="149" cy="96" r="13" fill="#22d3ee"/>
  <circle cx="187" cy="96" r="13" fill="#14b8a6"/>
  <text x="234" y="105" font-size="34" font-weight="900" fill="#075985">Weave</text>

    <rect x="86" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="110" y="153" font-size="22" font-weight="700" fill="#475569">Setup</text>


    <rect x="284" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="308" y="153" font-size="22" font-weight="700" fill="#475569">Chat</text>


    <rect x="482" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="506" y="153" font-size="22" font-weight="700" fill="#475569">Files</text>


    <rect x="680" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="704" y="153" font-size="22" font-weight="700" fill="#475569">Settings</text>

  <rect x="104" y="212" width="1096" height="150" rx="34" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="144" y="270" font-size="42" font-weight="900" fill="#0f172a">Calendar channel schedule readiness</text>
  <text x="144" y="316" font-size="26" font-weight="400" fill="#475569">The shared Calendar path uses workspace, team, and channel scopes;</text>
<text x="144" y="350" font-size="26" font-weight="400" fill="#475569">channel event CRUD is validated through the backend Calendar</text>
<text x="144" y="384" font-size="26" font-weight="400" fill="#475569">facade.</text>

    <rect x="104" y="402" width="346" height="116" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="132" y="444" font-size="21" font-weight="700" fill="#0369a1">Scope</text>
    <text x="132" y="480" font-size="20" font-weight="400" fill="#0f172a">Workspace · team · channel</text>


    <rect x="480" y="402" width="346" height="116" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="508" y="444" font-size="21" font-weight="700" fill="#0369a1">Access</text>
    <text x="508" y="480" font-size="20" font-weight="400" fill="#0f172a">Private calendars blocked</text>


    <rect x="856" y="402" width="346" height="116" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="884" y="444" font-size="21" font-weight="700" fill="#0369a1">Live proof</text>
    <text x="884" y="480" font-size="20" font-weight="400" fill="#0f172a">Channel event</text>
<text x="884" y="507" font-size="20" font-weight="400" fill="#0f172a">create/read/update/delete</text>


    <rect x="104" y="566" width="336" height="210" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="158" cy="624" r="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="146" y="634" font-size="26" font-weight="800" fill="#0e7490">👥</text>
    <text x="200" y="631" font-size="24" font-weight="800" fill="#0f172a">Access model</text>
    <text x="136" y="678" font-size="22" font-weight="400" fill="#475569">Workspace/team/channel</text>
<text x="136" y="708" font-size="22" font-weight="400" fill="#475569">scope metadata is</text>
<text x="136" y="738" font-size="22" font-weight="400" fill="#475569">visible; private</text>
<text x="136" y="768" font-size="22" font-weight="400" fill="#475569">personal calendars stay</text>
<text x="136" y="798" font-size="22" font-weight="400" fill="#475569">out of the core path.</text>


    <rect x="480" y="566" width="336" height="210" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="534" cy="624" r="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="522" y="634" font-size="26" font-weight="800" fill="#0e7490">🔐</text>
    <text x="576" y="631" font-size="24" font-weight="800" fill="#0f172a">Credential readiness</text>
    <text x="512" y="678" font-size="22" font-weight="400" fill="#475569">Backend actor</text>
<text x="512" y="708" font-size="22" font-weight="400" fill="#475569">credentials are not</text>
<text x="512" y="738" font-size="22" font-weight="400" fill="#475569">exposed to generated</text>
<text x="512" y="768" font-size="22" font-weight="400" fill="#475569">setup artifacts.</text>


    <rect x="856" y="566" width="336" height="210" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="910" cy="624" r="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="898" y="634" font-size="26" font-weight="800" fill="#0e7490">#</text>
    <text x="952" y="631" font-size="24" font-weight="800" fill="#0f172a">Channel context</text>
    <text x="888" y="678" font-size="22" font-weight="400" fill="#475569">Events carry channel</text>
<text x="888" y="708" font-size="22" font-weight="400" fill="#475569">scope metadata so</text>
<text x="888" y="738" font-size="22" font-weight="400" fill="#475569">meeting-thread context</text>
<text x="888" y="768" font-size="22" font-weight="400" fill="#475569">can attach without raw</text>
<text x="888" y="798" font-size="22" font-weight="400" fill="#475569">CalDAV concepts.</text>

  <rect x="1012" y="96" width="300" height="54" rx="20" fill="#0f172a"/>
  <text x="1042" y="132" font-size="22" font-weight="800" fill="#ffffff">Guarded roadmap</text>
</svg>
