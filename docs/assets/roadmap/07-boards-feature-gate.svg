<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Weave boards feature-gated roadmap screen</title>
  <desc id="desc">A clearly labelled feature-gated boards/tasks roadmap screen with provider-neutral columns, tasks, and non-drag actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.52" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="56" y="54" width="1328" height="792" rx="46" fill="#f8fafc" stroke="#bae6fd" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="111" cy="96" r="13" fill="#38bdf8"/>
  <circle cx="149" cy="96" r="13" fill="#22d3ee"/>
  <circle cx="187" cy="96" r="13" fill="#14b8a6"/>
  <text x="234" y="105" font-size="34" font-weight="900" fill="#075985">Weave</text>

    <rect x="86" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="110" y="153" font-size="22" font-weight="700" fill="#475569">Setup</text>


    <rect x="284" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="308" y="153" font-size="22" font-weight="700" fill="#475569">Chat</text>


    <rect x="482" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="506" y="153" font-size="22" font-weight="700" fill="#475569">Files</text>


    <rect x="680" y="116" width="180" height="56" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="704" y="153" font-size="22" font-weight="700" fill="#475569">Settings</text>

  <rect x="104" y="212" width="1096" height="150" rx="34" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="144" y="270" font-size="42" font-weight="900" fill="#0f172a">Boards/tasks feature-gated scope</text>
  <text x="144" y="316" font-size="26" font-weight="400" fill="#475569">A Weave-owned board model behind the backend facade. The live gate</text>
<text x="144" y="350" font-size="26" font-weight="400" fill="#475569">validates provider-neutral create, move, and complete actions</text>
<text x="144" y="384" font-size="26" font-weight="400" fill="#475569">without drag-and-drop.</text>

    <rect x="104" y="402" width="346" height="116" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="132" y="444" font-size="21" font-weight="700" fill="#0369a1">Release</text>
    <text x="132" y="480" font-size="20" font-weight="400" fill="#0f172a">feature-gated roadmap</text>


    <rect x="480" y="402" width="346" height="116" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="508" y="444" font-size="21" font-weight="700" fill="#0369a1">Source</text>
    <text x="508" y="480" font-size="20" font-weight="400" fill="#0f172a">backend-facade fixture</text>


    <rect x="856" y="402" width="346" height="116" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="884" y="444" font-size="21" font-weight="700" fill="#0369a1">Movement</text>
    <text x="884" y="480" font-size="20" font-weight="400" fill="#0f172a">Non-drag actions validated</text>


    <rect x="104" y="566" width="336" height="210" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="158" cy="624" r="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="146" y="634" font-size="26" font-weight="800" fill="#0e7490">⌨</text>
    <text x="200" y="631" font-size="24" font-weight="800" fill="#0f172a">Keyboard path</text>
    <text x="136" y="678" font-size="22" font-weight="400" fill="#475569">Move to another column,</text>
<text x="136" y="708" font-size="22" font-weight="400" fill="#475569">mark done, or mark</text>
<text x="136" y="738" font-size="22" font-weight="400" fill="#475569">blocked without pointer-</text>
<text x="136" y="768" font-size="22" font-weight="400" fill="#475569">only drag-and-drop.</text>


    <rect x="480" y="566" width="336" height="210" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="534" cy="624" r="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="522" y="634" font-size="26" font-weight="800" fill="#0e7490">🔌</text>
    <text x="576" y="631" font-size="24" font-weight="800" fill="#0f172a">Provider boundary</text>
    <text x="512" y="678" font-size="22" font-weight="400" fill="#475569">The app talks to Weave</text>
<text x="512" y="708" font-size="22" font-weight="400" fill="#475569">backend DTOs; no secret-</text>
<text x="512" y="738" font-size="22" font-weight="400" fill="#475569">bearing provider client</text>
<text x="512" y="768" font-size="22" font-weight="400" fill="#475569">is exposed.</text>


    <rect x="856" y="566" width="336" height="210" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="910" cy="624" r="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="898" y="634" font-size="26" font-weight="800" fill="#0e7490">♿</text>
    <text x="952" y="631" font-size="24" font-weight="800" fill="#0f172a">Screen-reader copy</text>
    <text x="888" y="678" font-size="22" font-weight="400" fill="#475569">Columns, statuses, due</text>
<text x="888" y="708" font-size="22" font-weight="400" fill="#475569">dates, and priority use</text>
<text x="888" y="738" font-size="22" font-weight="400" fill="#475569">text labels, not color</text>
<text x="888" y="768" font-size="22" font-weight="400" fill="#475569">alone.</text>

  <rect x="1012" y="96" width="300" height="54" rx="20" fill="#0f172a"/>
  <text x="1042" y="132" font-size="22" font-weight="800" fill="#ffffff">Feature gate</text>
</svg>
