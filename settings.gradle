pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { mavenCentral() }
}

rootProject.name = 'weave-orchestration'
include 'weave-application-core',
        'server:domains:files:model',
        'server:domains:files:persistence',
        'server:domains:calendar:model',
        'server:domains:calendar:persistence',
        'weave-persistence-jpa',
        'weave-runtime-provider-adapters',
        'weave-runtime-security-adapters',
        'infra',
        'server',
        'weave-user-api-client',
        'weave-admin-api-client',
        'weave-mcp-server',
        'weave-product-e2e'

// Verification bridges remain IDE-visible; selected tests do not imply extracted production modules.
def domainCatalog = new groovy.json.JsonSlurper().parse(file('server/domains/catalog.json'))
include 'server:domains'
domainCatalog.domains.keySet().sort().each { domain -> include "server:domains:${domain}" }
