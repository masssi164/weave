plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

group = 'com.massimotter.weave.core'
base { archivesName = 'weave-core' }

dependencies {
    api 'org.springframework:spring-web'
    api 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    api libs.swagger.annotations
    implementation 'io.micrometer:micrometer-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-persistence'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly libs.h2.test
    api platform(libs.spring.boot.bom)
    api project(':server:core:model')
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-jpa'
    api libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    testImplementation 'org.hibernate.orm:hibernate-core'
    testRuntimeOnly libs.h2.test
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
