# Existing deployment aliases and defaults owned by calendar.
# Active provider bindings remain runtime state; legacy startup selectors retain their tracked ratchet.
weave.calendar.provider=${WEAVE_CALENDAR_PROVIDER:weave-native}
weave.calendar.caldav.public-base-url=${WEAVE_CALDAV_PUBLIC_BASE_URL:https://calendar.weave.test}
weave.calendar.caldav.base-url=${WEAVE_CALDAV_BASE_URL:${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}}
weave.calendar.caldav.calendar-path-template=${WEAVE_CALDAV_CALENDAR_PATH_TEMPLATE:/remote.php/dav/calendars/${WEAVE_CALDAV_BACKEND_USERNAME:weave-backend}/personal/}
weave.calendar.caldav.auth-mode=${WEAVE_CALDAV_AUTH_MODE:BASIC}
weave.calendar.caldav.backend-username=${WEAVE_CALDAV_BACKEND_USERNAME:}
weave.calendar.caldav.backend-token=${WEAVE_CALDAV_BACKEND_TOKEN:}
weave.calendar.caldav.request-timeout-seconds=${WEAVE_CALDAV_REQUEST_TIMEOUT_SECONDS:10}
weave.workspace.calendar.enabled=${WEAVE_WORKSPACE_CALENDAR_ENABLED:false}
weave.workspace.calendar.dependency-url=${WEAVE_CALDAV_BASE_URL:${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}}
weave.workspace.calendar.readiness=${WEAVE_WORKSPACE_CALENDAR_READINESS:}
