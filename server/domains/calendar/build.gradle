plugins { id 'java-library' }

// This library owns real application-context tests in addition to its unit tests.
ext.weaveContextTests = true

apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

group = 'com.massimotter.weave.calendar'
base { archivesName = 'weave-calendar' }

dependencies {
    api platform(libs.spring.boot.bom)
    api project(':server:core')
    api project(':server:domains:calendar:model')
    api project(':server:domains:calendar:persistence')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation libs.ical4j
    testImplementation testFixtures(project(':server:core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.archunit.junit5
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly libs.h2.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('check') {
    dependsOn ':server:core:check', ':server:core:model:check',
            ':server:domains:calendar:model:check', ':server:domains:calendar:persistence:check'
}

// Database correctness is a distinct, required-on-demand lane over disposable PostgreSQL.
tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'postgres' }
}

tasks.register('postgresTest', Test) {
    group = 'verification'
    description = 'Run Calendar persistence/provider regressions against disposable PostgreSQL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    maxParallelForks = 1
    shouldRunAfter tasks.named('test')
}
