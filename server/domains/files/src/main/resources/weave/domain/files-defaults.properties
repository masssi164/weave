# Existing deployment aliases and defaults owned by files.
# Active provider bindings remain runtime state; legacy startup selectors retain their tracked ratchet.
weave.files.provider=${WEAVE_FILES_PROVIDER:weave-native}
weave.files.provider-accounts.secret-root=/run/secrets/weave-files
weave.files.native.filesystem-root=${WEAVE_FILES_NATIVE_FILESYSTEM_ROOT:.weave/files/blobs}
weave.files.native.maximum-blob-bytes=${WEAVE_FILES_NATIVE_MAXIMUM_BLOB_BYTES:67108864}
weave.files.native.reconciliation-limit=${WEAVE_FILES_NATIVE_RECONCILIATION_LIMIT:10000}
weave.nextcloud.files.base-url=${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}
weave.nextcloud.files.webdav-root-path=${WEAVE_NEXTCLOUD_FILES_WEBDAV_ROOT_PATH:/remote.php/dav/files}
weave.nextcloud.files.actor-model=${WEAVE_NEXTCLOUD_FILES_ACTOR_MODEL:backend-service-account}
weave.nextcloud.files.actor-username=${WEAVE_NEXTCLOUD_FILES_ACTOR_USERNAME:}
weave.nextcloud.files.actor-token=${WEAVE_NEXTCLOUD_FILES_ACTOR_TOKEN:}
weave.workspace.files.enabled=${WEAVE_WORKSPACE_FILES_ENABLED:true}
weave.workspace.files.dependency-url=${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}
weave.workspace.files.readiness=${WEAVE_WORKSPACE_FILES_READINESS:}
