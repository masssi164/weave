plugins { id 'java-library' }

apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

dependencies {
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-persistence'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly libs.h2.test
    api project(':server:domains:files:model')
    api platform(libs.spring.boot.bom)
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-jpa'
    // Existing Hibernate conflict translation belongs to this adapter, never the Files model.
    implementation 'org.hibernate.orm:hibernate-core'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
