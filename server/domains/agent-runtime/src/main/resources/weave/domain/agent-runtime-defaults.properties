# Existing deployment aliases and defaults owned by agent-runtime.
# Active provider bindings remain runtime state; legacy startup selectors retain their tracked ratchet.
weave.agent-runtime.state-store.enabled=${WEAVE_AGENT_RUNTIME_STATE_STORE_ENABLED:false}
weave.agent-runtime.state-store.wrapping-key-root=${WEAVE_AGENT_RUNTIME_STATE_WRAPPING_KEY_ROOT:}
weave.agent-runtime.state-store.maximum-generation-size=${WEAVE_AGENT_RUNTIME_STATE_MAXIMUM_GENERATION_SIZE:64MB}
weave.agent-runtime.state-store.endpoint=${WEAVE_AGENT_RUNTIME_STATE_S3_ENDPOINT:}
weave.agent-runtime.state-store.region=${WEAVE_AGENT_RUNTIME_STATE_S3_REGION:us-east-1}
weave.agent-runtime.state-store.bucket=${WEAVE_AGENT_RUNTIME_STATE_S3_BUCKET:}
weave.agent-runtime.state-store.credential-ref=${WEAVE_AGENT_RUNTIME_STATE_S3_CREDENTIAL_REF:}
weave.agent-runtime.state-store.access-key-file=${WEAVE_AGENT_RUNTIME_STATE_S3_ACCESS_KEY_FILE:}
weave.agent-runtime.state-store.secret-key-file=${WEAVE_AGENT_RUNTIME_STATE_S3_SECRET_KEY_FILE:}
weave.agent-runtime.state-store.path-style-access=${WEAVE_AGENT_RUNTIME_STATE_S3_PATH_STYLE_ACCESS:true}
weave.agent-runtime.profile-signing.enabled=${WEAVE_AGENT_RUNTIME_PROFILE_SIGNING_ENABLED:false}
weave.agent-runtime.profile-signing.secret-root=${WEAVE_AGENT_RUNTIME_PROFILE_SIGNING_SECRET_ROOT:}
weave.agent-runtime.profile-signing.key-lifetime=${WEAVE_AGENT_RUNTIME_PROFILE_SIGNING_KEY_LIFETIME:P365D}
weave.agent-runtime.profile-signing.trust-overlap=${WEAVE_AGENT_RUNTIME_PROFILE_SIGNING_TRUST_OVERLAP:10m}
weave.agent-runtime.profile-signing.maximum-profile-ttl=${WEAVE_AGENT_RUNTIME_PROFILE_TTL:5m}
weave.agent-runtime.policy.enabled=${WEAVE_AGENT_RUNTIME_POLICY_ENABLED:false}
weave.agent-runtime.policy.file=${WEAVE_AGENT_RUNTIME_POLICY_FILE:}
weave.agent-runtime.entitlement.enabled=${WEAVE_AGENT_RUNTIME_ENTITLEMENT_ENABLED:false}
weave.agent-runtime.entitlement.observation-ttl=${WEAVE_AGENT_RUNTIME_ENTITLEMENT_OBSERVATION_TTL:5m}
weave.agent-runtime.entitlement.allowed-capabilities=${WEAVE_AGENT_RUNTIME_ENTITLEMENT_CAPABILITIES:files.read,calendar.read,calendar.write}
weave.agent-runtime.workload-identity.enabled=${WEAVE_AGENT_RUNTIME_WORKLOAD_IDENTITY_ENABLED:false}
weave.agent-runtime.workload-identity.keycloak-admin-base-url=${WEAVE_AGENT_RUNTIME_KEYCLOAK_ADMIN_BASE_URL:}
weave.agent-runtime.workload-identity.issuer=${WEAVE_AGENT_RUNTIME_ISSUER:}
weave.agent-runtime.workload-identity.realm=${WEAVE_AGENT_RUNTIME_REALM:weave}
weave.agent-runtime.workload-identity.organization-ref=${WEAVE_AGENT_RUNTIME_ORGANIZATION_REF:tenant-default}
weave.agent-runtime.workload-identity.keycloak-organization-id=${WEAVE_AGENT_RUNTIME_KEYCLOAK_ORGANIZATION_ID:}
weave.agent-runtime.workload-identity.keycloak-organization-alias=${WEAVE_AGENT_RUNTIME_KEYCLOAK_ORGANIZATION_ALIAS:}
weave.agent-runtime.workload-identity.admin-client-id=${WEAVE_AGENT_RUNTIME_ADMIN_CLIENT_ID:weave-agent-runtime-admin}
weave.agent-runtime.workload-identity.admin-credential-ref=${WEAVE_AGENT_RUNTIME_ADMIN_CREDENTIAL_REF:}
weave.agent-runtime.workload-identity.secret-root=${WEAVE_AGENT_RUNTIME_SECRET_ROOT:}
weave.agent-runtime.workload-identity.timeout=${WEAVE_AGENT_RUNTIME_KEYCLOAK_TIMEOUT:10s}
weave.agent-runtime.workload-identity.workload-role=weaver-runtime
weave.agent-runtime.workload-identity.default-client-scopes=${WEAVE_AGENT_RUNTIME_DEFAULT_CLIENT_SCOPES:weaver-runtime-workload}
weave.agent-runtime.workload-identity.optional-client-scopes=${WEAVE_AGENT_RUNTIME_OPTIONAL_CLIENT_SCOPES:agent-runtime.profile.read,mcp.tools,files.read,calendar.read,calendar.write}
weave.agent-runtime.workload-identity.access-token-lifespan-seconds=${WEAVE_AGENT_RUNTIME_ACCESS_TOKEN_LIFESPAN_SECONDS:59}
weave.workspace.agent-runtime-control.enabled=${WEAVE_WORKSPACE_AGENT_RUNTIME_CONTROL_ENABLED:false}
weave.workspace.agent-runtime-control.readiness=${WEAVE_WORKSPACE_AGENT_RUNTIME_CONTROL_READINESS:}
