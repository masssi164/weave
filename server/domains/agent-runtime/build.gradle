plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

ext.weaveContextTests = true
apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

group = 'com.massimotter.weave.agentruntime'
base { archivesName = 'weave-agent-runtime' }

dependencies {
    api platform(libs.spring.boot.bom)
    api project(':server:core')
    api project(':server:domains:agent-runtime:model')
    api project(':server:domains:agent-runtime:persistence')
    api project(':server:domains:agent-runtime:provider')
    api project(':server:domains:agent-runtime:security')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'io.micrometer:micrometer-core'
    implementation libs.aws.s3
    implementation libs.aws.url.connection.client
    testImplementation testFixtures(project(':server:core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly libs.h2.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('check') {
    dependsOn ':server:core:check', ':server:domains:agent-runtime:model:check',
            ':server:domains:agent-runtime:persistence:check',
            ':server:domains:agent-runtime:provider:check',
            ':server:domains:agent-runtime:security:check'
}
