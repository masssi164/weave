plugins { id 'java-library' }

apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

group = 'com.massimotter.weave.domains.agent-runtime.provider'
base { archivesName = 'weave-domains-agent-runtime-provider' }

dependencies {
    api platform(libs.spring.boot.bom)
    api project(':server:core:model')
    api project(':server:domains:agent-runtime:model')
    implementation 'tools.jackson.core:jackson-databind'
    implementation libs.jcs
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
