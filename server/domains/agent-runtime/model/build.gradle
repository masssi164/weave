plugins { id 'java-library' }

apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

group = 'com.massimotter.weave.domains.agent-runtime.model'
base { archivesName = 'weave-domains-agent-runtime-model' }

dependencies {
    api platform(libs.spring.boot.bom)
    api project(':server:core:model')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
