openapi: 3.0.3
info:
  title: Weave Boards/Tasks Workspace Contract
  version: v0.1-dogfood
  description: >-
    Provider-neutral Boards/Tasks workspace contract for v0.1 dogfood production.
    Runtime routes are fail-closed by default, require the normal authenticated Weave
    workspace boundary, expose support-safe local or explicitly gated provider workspace
    snapshots, and allow user-write task actions only behind Context/Space EDIT authorization.
paths:
  /api/boards/workspace:
    get:
      summary: Read Boards/Tasks workspace snapshot
      responses:
        '200':
          description: Provider-neutral Boards/Tasks workspace snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardsWorkspaceResponse'
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing weave:workspace scope. }
        '503': { description: Boards workspace runtime is disabled or unavailable. }
  /api/boards/{boardId}/tasks:
    post:
      summary: Create a user-authorized workspace task
      parameters:
        - name: boardId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardsCreateTaskRequest'
      responses:
        '200':
          description: Created provider-neutral task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItem'
  /api/boards/tasks/{taskId}/move:
    post:
      summary: Move a user-authorized workspace task without drag-and-drop
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardsMoveTaskRequest'
      responses:
        '200':
          description: Moved provider-neutral task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItem'
  /api/boards/tasks/{taskId}/status:
    post:
      summary: Update a user-authorized workspace task status
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardsUpdateTaskStatusRequest'
      responses:
        '200':
          description: Updated provider-neutral task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItem'
  /api/boards/tasks/{taskId}/decision-links:
    post:
      summary: Link a workspace decision to a user-authorized task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardsLinkDecisionRequest'
      responses:
        '200':
          description: Task with linked decision reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItem'
  /api/boards/tasks/{taskId}/complete:
    post:
      summary: Complete a user-authorized workspace task without drag-and-drop
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Completed provider-neutral task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItem'

components:
  schemas:

    BoardsWorkspaceResponse:
      type: object
      required: [workspace, releaseStatus, source, capabilities, syncMetadata, projects, boards, tasks]
      properties:
        workspace: { type: boolean }
        releaseStatus:
          type: string
          enum: [active-dogfood-production]
        source:
          type: string
          enum: [local-workspace-backend-facade, openproject-workspace-sync-backend-facade, provider-neutral-workspace-backend-facade]
        capabilities:
          $ref: '#/components/schemas/BoardProviderCapabilities'
        syncMetadata:
          $ref: '#/components/schemas/BoardsSyncMetadataResponse'
        projects:
          type: array
          items: { $ref: '#/components/schemas/WeaveProject' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/Board' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskItem' }
    BoardsSyncMetadataResponse:
      type: object
      required: [provider, mode, userWriteAudited, contextScoped, supportSafe, nextCursors]
      properties:
        provider:
          type: string
          enum: [vikunja, openproject, nextcloud-deck, in-memory, unknown]
        mode:
          type: string
          description: Support-safe source/mode such as workspace-sync or local-workspace-backend-facade.
        userWriteAudited:
          type: boolean
        contextScoped:
          type: boolean
        supportSafe:
          type: boolean
        nextCursors:
          type: object
          additionalProperties:
            type: string
          description: Opaque adapter-owned cursors only; raw provider offsets, URLs, and secrets are forbidden.
        lastSyncedAt:
          type: string
          format: date-time
    BoardProviderCapabilities:
      type: object
      required: [provider, enabled, supported, unsupported, supportSafeSummary]
      properties:
        provider:
          type: string
          enum: [vikunja, openproject, nextcloud-deck, in-memory, unknown]
        enabled: { type: boolean }
        supported:
          type: array
          items:
            type: string
            enum: [comments, attachments, non_destructive_archive, status_updates, decision_links, webhook_events, incremental_sync, checklists, custom_fields, accessible_non_drag_moves]
        unsupported:
          type: array
          items:
            type: string
            enum: [comments, attachments, non_destructive_archive, status_updates, decision_links, webhook_events, incremental_sync, checklists, custom_fields, accessible_non_drag_moves]
        supportSafeSummary: { type: string }
    BoardsCreateTaskRequest:
      type: object
      required: [columnId, title]
      properties:
        columnId: { type: string, maxLength: 128 }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        assigneeRefs:
          type: array
          items: { type: string, maxLength: 128 }
        labelRefs:
          type: array
          items: { type: string, maxLength: 128 }
        dueAt: { type: string, format: date-time }
    BoardsMoveTaskRequest:
      type: object
      required: [targetColumnId, targetPosition]
      properties:
        targetColumnId: { type: string, maxLength: 128 }
        targetPosition: { type: integer, minimum: 0 }
    BoardsUpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, blocked, completed, archived]
        targetColumnId: { type: string, maxLength: 128 }
    BoardsLinkDecisionRequest:
      type: object
      required: [decisionRef]
      properties:
        decisionRef: { type: string, maxLength: 160 }

    ProviderRef:
      type: object
      required: [provider, externalId]
      properties:
        provider:
          type: string
          enum: [vikunja, openproject, nextcloud-deck, in-memory, unknown]
        externalId:
          type: string
        externalUrl:
          type: string
          format: uri
        version:
          type: string
        etag:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
    WeaveProject:
      type: object
      required: [id, name, visibility, memberRefs, providerRefs]
      properties:
        id: { type: string }
        name: { type: string }
        visibility:
          type: string
          enum: [private, workspace, public]
        memberRefs:
          type: array
          items: { type: string }
        providerRefs:
          type: array
          items: { $ref: '#/components/schemas/ProviderRef' }
    Board:
      type: object
      required: [id, projectId, name, columns, archived, providerRefs]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        description: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumn' }
        archived: { type: boolean }
        providerRefs:
          type: array
          items: { $ref: '#/components/schemas/ProviderRef' }
    BoardColumn:
      type: object
      required: [id, boardId, name, position, semanticStatus, providerRefs]
      properties:
        id: { type: string }
        boardId: { type: string }
        name: { type: string }
        position: { type: integer, minimum: 0 }
        semanticStatus:
          type: string
          enum: [not_started, in_progress, blocked, done, archived]
        wipLimit:
          type: integer
          minimum: 1
        providerRefs:
          type: array
          items: { $ref: '#/components/schemas/ProviderRef' }
    TaskItem:
      type: object
      required: [id, boardId, columnId, title, status, position, assigneeRefs, labelRefs, decisionRefs, updatedAt, providerRefs]
      properties:
        id: { type: string }
        boardId: { type: string }
        columnId: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [open, blocked, completed, archived]
        position: { type: integer, minimum: 0 }
        assigneeRefs:
          type: array
          items: { type: string }
        labelRefs:
          type: array
          items: { type: string }
        decisionRefs:
          type: array
          items: { type: string }
        priority:
          type: string
          enum: [low, normal, high, urgent]
        startAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        providerRefs:
          type: array
          items: { $ref: '#/components/schemas/ProviderRef' }
    TaskBoardEvent:
      type: object
      required: [idempotencyKey, type, actorRef, occurredAt, workspaceId, redactionLevel, payload]
      properties:
        idempotencyKey: { type: string }
        type:
          type: string
          enum:
            - task.created
            - task.updated
            - task.completed
            - task.archived
            - task.moved
            - assignment.changed
            - label.changed
            - priority.changed
            - due_date.changed
            - comment.added
            - attachment.changed
            - sync.conflict_detected
        actorRef: { type: string }
        occurredAt: { type: string, format: date-time }
        workspaceId: { type: string }
        projectId: { type: string }
        boardId: { type: string }
        taskId: { type: string }
        providerRef: { $ref: '#/components/schemas/ProviderRef' }
        redactionLevel:
          type: string
          enum: [public_metadata, workspace_internal, support_safe, private_content]
        payload:
          type: object
          additionalProperties: true
