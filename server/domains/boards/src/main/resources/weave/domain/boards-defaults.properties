# Existing deployment aliases and defaults owned by boards.
# Active provider bindings remain runtime state; legacy startup selectors retain their tracked ratchet.
weave.boards.runtime-enabled=${WEAVE_BOARDS_RUNTIME_ENABLED:false}
weave.boards.provider=${WEAVE_BOARDS_PROVIDER:local-workspace}
weave.boards.openproject.provider-runtime-enabled=${WEAVE_BOARDS_OPENPROJECT_RUNTIME_ENABLED:false}
weave.boards.openproject.read-sync-enabled=${WEAVE_BOARDS_OPENPROJECT_READ_SYNC_ENABLED:false}
weave.boards.openproject.context-authorization-enabled=${WEAVE_BOARDS_OPENPROJECT_CONTEXT_AUTHORIZATION_ENABLED:false}
weave.boards.openproject.audit-consent-enabled=${WEAVE_BOARDS_OPENPROJECT_AUDIT_CONSENT_ENABLED:false}
weave.boards.openproject.provider-writes-enabled=${WEAVE_BOARDS_OPENPROJECT_PROVIDER_WRITES_ENABLED:false}
weave.boards.openproject.auth-mode=${WEAVE_BOARDS_OPENPROJECT_AUTH_MODE:disabled}
weave.workspace.boards.enabled=${WEAVE_WORKSPACE_BOARDS_ENABLED:false}
weave.workspace.boards.readiness=${WEAVE_WORKSPACE_BOARDS_READINESS:}
