plugins {
    id 'base'
}

description = 'Selected owning domain checks and remaining transitional unit bridges.'

def selectedDomains = project(':server').ext.weaveDomainSelection.domains

tasks.register('test') {
    group = 'verification'
    description = 'Run selected owning domain tasks and remaining transitional unit inventories.'
    dependsOn selectedDomains.collect { ":server:domains:${it}:test" }
}

tasks.register('selectionContractTest', Exec) {
    group = 'verification'
    description = 'Verify domain selection and source-branch pin semantics.'
    workingDir rootProject.projectDir
    commandLine 'python3', '-m', 'unittest', 'tools.domain_selection_resolver_test'
}

tasks.named('check') {
    description = 'Check the selected JVM unit inventories without replacing serverCi.'
    dependsOn 'selectionContractTest'
    dependsOn selectedDomains.collect { ":server:domains:${it}:check" }
}
