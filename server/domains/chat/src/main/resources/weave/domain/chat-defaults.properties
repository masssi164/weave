# Existing deployment aliases and defaults owned by chat.
# Active provider bindings remain runtime state; legacy startup selectors retain their tracked ratchet.
weave.chat.provider=${WEAVE_CHAT_PROVIDER:weave-native}
weave.chat.e2e-proof.enabled=${WEAVE_CHAT_E2E_PROOF_ENABLED:false}
weave.chat.e2e-proof.token-file=${WEAVE_CHAT_E2E_PROOF_TOKEN_FILE:}
weave.chat.e2e-proof.run-id=${WEAVE_CHAT_E2E_PROOF_RUN_ID:}
weave.chat.e2e-proof.stack-scope=${WEAVE_E2E_STACK_SCOPE:}
weave.chat.matrix.internal-base-url=${WEAVE_CHAT_MATRIX_INTERNAL_BASE_URL:}
weave.chat.matrix.server-name=${WEAVE_CHAT_MATRIX_SERVER_NAME:}
weave.chat.matrix.appservice-id=${WEAVE_CHAT_MATRIX_APPSERVICE_ID:weave-chat-synapse}
weave.chat.matrix.virtual-user-prefix=${WEAVE_CHAT_MATRIX_VIRTUAL_USER_PREFIX:_weave_}
weave.chat.matrix.as-token-file=${WEAVE_CHAT_MATRIX_APPSERVICE_AS_TOKEN_FILE:}
weave.chat.matrix.hs-token-file=${WEAVE_CHAT_MATRIX_APPSERVICE_HS_TOKEN_FILE:}
weave.chat.matrix.connect-timeout=${WEAVE_CHAT_MATRIX_CONNECT_TIMEOUT:5s}
weave.chat.matrix.request-timeout=${WEAVE_CHAT_MATRIX_REQUEST_TIMEOUT:10s}
weave.chat.matrix.readiness-cache-ttl=${WEAVE_CHAT_MATRIX_READINESS_CACHE_TTL:60s}
weave.chat.matrix.callback-max-bytes=${WEAVE_CHAT_MATRIX_CALLBACK_MAX_BYTES:1048576}
weave.chat.matrix.callback-max-events=${WEAVE_CHAT_MATRIX_CALLBACK_MAX_EVENTS:100}
weave.matrix.facade.server-name=${WEAVE_MATRIX_FACADE_SERVER_NAME:api.weave.test}
weave.matrix.facade.base-url=${WEAVE_MATRIX_FACADE_BASE_URL:https://api.weave.test}
weave.matrix.federation-enabled=${WEAVE_MATRIX_FEDERATION_ENABLED:false}
weave.matrix.e2ee.persistence=relational-jpa
weave.matrix.e2ee.encrypted-rooms-validated=${WEAVE_MATRIX_E2EE_ENCRYPTED_ROOMS_VALIDATED:false}
weave.matrix.e2ee.device-verification-validated=${WEAVE_MATRIX_E2EE_DEVICE_VERIFICATION_VALIDATED:false}
weave.matrix.e2ee.key-backup-validated=${WEAVE_MATRIX_E2EE_KEY_BACKUP_VALIDATED:false}
weave.matrix.e2ee.lost-device-recovery-validated=${WEAVE_MATRIX_E2EE_LOST_DEVICE_RECOVERY_VALIDATED:false}
weave.matrix.e2ee.multi-device-validated=${WEAVE_MATRIX_E2EE_MULTI_DEVICE_VALIDATED:false}
weave.matrix.e2ee.accessibility-reviewed=${WEAVE_MATRIX_E2EE_ACCESSIBILITY_REVIEWED:false}
weave.matrix.e2ee.status-source=${WEAVE_MATRIX_E2EE_STATUS_SOURCE:backend_runtime_flags_only}
weave.matrix.backend-boundary.agent-participation=${WEAVE_MATRIX_AGENT_PARTICIPATION_POLICY:blocked_until_explicit_consent_audit_and_matrix_device_trust_are_implemented}
weave.matrix.backend-boundary.connector-write-policy=${WEAVE_MATRIX_CONNECTOR_WRITE_POLICY:fail_closed_until_audit_consent_and_matrix_e2ee_client_identity_are_implemented}
weave.workspace.chat.enabled=${WEAVE_WORKSPACE_CHAT_ENABLED:true}
weave.workspace.chat.dependency-url=${WEAVE_MATRIX_BASE_URL:https://matrix.weave.test}
weave.workspace.chat.readiness=${WEAVE_WORKSPACE_CHAT_READINESS:}
