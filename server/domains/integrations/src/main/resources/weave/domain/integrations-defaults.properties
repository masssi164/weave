# Existing deployment aliases and defaults owned by integrations.
# Active provider bindings remain runtime state; legacy startup selectors retain their tracked ratchet.
weave.interop.enabled=${WEAVE_INTEROP_ENABLED:false}
weave.interop.support-bundle-redaction-mode=${WEAVE_INTEROP_SUPPORT_BUNDLE_REDACTION_MODE:support-safe-redacted}
weave.interop.slack.enabled=${WEAVE_INTEROP_SLACK_ENABLED:false}
weave.interop.slack.client-id=${WEAVE_INTEROP_SLACK_CLIENT_ID:}
weave.interop.slack.client-secret-ref=${WEAVE_INTEROP_SLACK_CLIENT_SECRET_REF:}
weave.interop.slack.signing-secret-ref=${WEAVE_INTEROP_SLACK_SIGNING_SECRET_REF:}
weave.interop.slack.token-ref=${WEAVE_INTEROP_SLACK_TOKEN_REF:}
weave.interop.slack.workspace-id=${WEAVE_INTEROP_SLACK_WORKSPACE_ID:}
weave.interop.slack.channel-id=${WEAVE_INTEROP_SLACK_CHANNEL_ID:}
weave.interop.slack.room-id=${WEAVE_INTEROP_SLACK_ROOM_ID:}
weave.interop.teams.enabled=${WEAVE_INTEROP_TEAMS_ENABLED:false}
weave.connectors.public-sdk-enabled=${WEAVE_CONNECTORS_PUBLIC_SDK_ENABLED:false}
