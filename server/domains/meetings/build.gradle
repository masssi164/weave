plugins { id 'java-library' }

// This library owns real application-context tests in addition to its unit tests.
ext.weaveContextTests = true

apply from: rootProject.file('server/gradle/scripts/domain-library.gradle')

group = 'com.massimotter.weave.meetings'
base { archivesName = 'weave-meetings' }

dependencies {
    api platform(libs.spring.boot.bom)
    api project(':server:core')
    api project(':server:domains:chat')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation testFixtures(project(':server:core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testRuntimeOnly libs.h2.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('check') { dependsOn ':server:core:check', ':server:domains:chat:check' }

tasks.named('contextTest', Test) {
    dependsOn ':server:domains:chat:buildMatrixRustCoreJni'
    doFirst {
        systemProperty 'weave.matrix.protocol.library.path', project(':server:domains:chat').ext.matrixProtocolLibrary.absolutePath
    }
}
