spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.datasource.url=jdbc:h2:mem:weave-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
# Named resource-server decoders are constructed in full-context tests. A non-routable
# JWK URI avoids issuer discovery during context startup; tests that decode tokens provide
# their own in-process JWK endpoint.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:9/test-jwks

weave.chat.provider=in-memory-test

# Explicit authority for human test sessions; production has no default coordinate.
weave.security.primary-organization.keycloak-id=test-primary-organization
weave.security.primary-organization.keycloak-alias=weave-dogfood
