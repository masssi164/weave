spring:
  config:
    activate:
      on-profile: dogfood
  datasource:
    url: jdbc:postgresql://postgres:5432/${WEAVE_BACKEND_DB_NAME:weave_backend}
    username: ${WEAVE_BACKEND_DB_USERNAME:weave_backend}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.weave.test/realms/weave
          jwk-set-uri: http://keycloak:8080/realms/weave/protocol/openid-connect/certs

weave:
  deployment:
    profile: dogfood
  platform:
    public-base-url: https://weave.test
    api-base-url: https://api.weave.test/api
    auth-base-url: https://auth.weave.test
    release-posture: dogfood
  security:
    required-audience: https://api.weave.test/api
  files:
    provider: weave-native
    native:
      blob-store: filesystem
      filesystem-root: /var/lib/weave/files/blobs
  chat:
    provider: weave-native
  calendar:
    provider: weave-native
  workspace:
    chat:
      enabled: true
      readiness: ready
    files:
      enabled: true
      readiness: ready
    calendar:
      enabled: true
      readiness: ready
  identity:
    invitations:
      keycloak:
        base-url: http://keycloak:8080
        realm: weave
        organization-alias: weave
        admin-client-id: weave-identity-admin
        admin-credential-ref: credentialref://weave/keycloak/weave-identity-admin
        admin-private-jwk-file: /run/secrets/identity-admin/weave-identity-admin-private-jwk.json
        private-key-jwt-audience: https://auth.weave.test/realms/weave
        reference-hmac-secret-file: /run/secrets/identity-reference-hmac-key
  agent-runtime:
    state-store:
      enabled: false
    profile-signing:
      enabled: false
    policy:
      enabled: false
    entitlement:
      enabled: false
    workload-identity:
      enabled: false
