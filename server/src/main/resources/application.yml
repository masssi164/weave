server:
  port: ${PORT:8080}

spring:
  application:
    name: weave-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          # Required for a ready auth contract. Leave blank to start in blocked mode until
          # the backend can validate JWT iss, exp, nbf, and signature against the public issuer.
          # Canonical local/dev issuer: https://auth.weave.test/realms/weave
          issuer-uri: ${WEAVE_OIDC_ISSUER_URI:}
          # Optional. Use when the backend must fetch signing keys through an internal/private route
          # while preserving the public issuer URI in token validation.
          jwk-set-uri: ${WEAVE_OIDC_JWK_SET_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

weave:
  platform:
    public-base-url: ${WEAVE_PUBLIC_BASE_URL:https://weave.test}
    api-base-url: ${WEAVE_API_BASE_URL:https://api.weave.test/api}
    auth-base-url: ${WEAVE_AUTH_BASE_URL:https://auth.weave.test}
    matrix-homeserver-url: ${WEAVE_MATRIX_HOMESERVER_URL:https://matrix.weave.test}
    files-product-url: ${WEAVE_FILES_PRODUCT_URL:https://weave.test/files}
    calendar-product-url: ${WEAVE_CALENDAR_PRODUCT_URL:https://weave.test/calendar}
    nextcloud-base-url: ${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}
    targets:
      mobile: ${WEAVE_TARGET_MOBILE:true}
      desktop: ${WEAVE_TARGET_DESKTOP:true}
      web: ${WEAVE_TARGET_WEB:false}
  security:
    # JWT aud must include the first-party Weave app audience.
    required-audience: ${WEAVE_OIDC_REQUIRED_AUDIENCE:weave-app}
    # JWT azp and/or client_id must identify the first-party Weave app client.
    client-id: ${WEAVE_CLIENT_ID:weave-app}
  nextcloud:
    files:
      base-url: ${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}
      webdav-root-path: ${WEAVE_NEXTCLOUD_FILES_WEBDAV_ROOT_PATH:/remote.php/dav/files}
      # MVP backend-owned actor seam. Leave username/token blank to fail closed with
      # nextcloud-adapter-not-configured instead of exposing caller credentials.
      actor-model: ${WEAVE_NEXTCLOUD_FILES_ACTOR_MODEL:backend-service-account}
      actor-username: ${WEAVE_NEXTCLOUD_FILES_ACTOR_USERNAME:}
      actor-token: ${WEAVE_NEXTCLOUD_FILES_ACTOR_TOKEN:${WEAVE_NEXTCLOUD_FILES_APP_PASSWORD:}}
  calendar:
    caldav:
      # Calendar product operations stay on /api; this backend actor is the only component
      # that talks to Nextcloud CalDAV. The first safe slice targets a backend-owned
      # workspace calendar; private per-user templates containing {user} fail closed until
      # a delegated/sharing access model is contracted. Leave credentials blank to fail
      # safely with a normalized nextcloud-adapter-not-configured error until wired.
      base-url: ${WEAVE_CALDAV_BASE_URL:${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}}
      calendar-path-template: ${WEAVE_CALDAV_CALENDAR_PATH_TEMPLATE:/remote.php/dav/calendars/${WEAVE_CALDAV_BACKEND_USERNAME:weave-backend}/personal/}
      auth-mode: ${WEAVE_CALDAV_AUTH_MODE:BASIC}
      backend-username: ${WEAVE_CALDAV_BACKEND_USERNAME:}
      backend-token: ${WEAVE_CALDAV_BACKEND_TOKEN:}
      request-timeout-seconds: ${WEAVE_CALDAV_REQUEST_TIMEOUT_SECONDS:10}
  matrix:
    # Backend diagnostics must remain E2EE-compatible: the backend never inspects
    # encrypted Matrix message bodies. These validation flags are false until real
    # encrypted-room, device verification, recovery, lost-device, multi-device, and
    # accessibility gates are proven by Matrix-native client/smoke/E2E flows.
    federation-enabled: ${WEAVE_MATRIX_FEDERATION_ENABLED:false}
    e2ee:
      encrypted-rooms-validated: ${WEAVE_MATRIX_E2EE_ENCRYPTED_ROOMS_VALIDATED:false}
      device-verification-validated: ${WEAVE_MATRIX_E2EE_DEVICE_VERIFICATION_VALIDATED:false}
      key-backup-validated: ${WEAVE_MATRIX_E2EE_KEY_BACKUP_VALIDATED:false}
      lost-device-recovery-validated: ${WEAVE_MATRIX_E2EE_LOST_DEVICE_RECOVERY_VALIDATED:false}
      multi-device-validated: ${WEAVE_MATRIX_E2EE_MULTI_DEVICE_VALIDATED:false}
      accessibility-reviewed: ${WEAVE_MATRIX_E2EE_ACCESSIBILITY_REVIEWED:false}
      status-source: ${WEAVE_MATRIX_E2EE_STATUS_SOURCE:backend_runtime_flags_only}
    backend-boundary:
      agent-participation: ${WEAVE_MATRIX_AGENT_PARTICIPATION_POLICY:blocked_until_explicit_consent_audit_and_matrix_device_trust_are_implemented}
      connector-write-policy: ${WEAVE_MATRIX_CONNECTOR_WRITE_POLICY:fail_closed_until_audit_consent_and_matrix_e2ee_client_identity_are_implemented}
  workspace:
    shell-access:
      enabled: ${WEAVE_WORKSPACE_SHELL_ACCESS_ENABLED:true}
    chat:
      enabled: ${WEAVE_WORKSPACE_CHAT_ENABLED:true}
      dependency-url: ${WEAVE_MATRIX_HOMESERVER_URL:https://matrix.weave.test}
      readiness: ${WEAVE_WORKSPACE_CHAT_READINESS:}
    files:
      enabled: ${WEAVE_WORKSPACE_FILES_ENABLED:true}
      dependency-url: ${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}
      readiness: ${WEAVE_WORKSPACE_FILES_READINESS:}
    calendar:
      enabled: ${WEAVE_WORKSPACE_CALENDAR_ENABLED:false}
      dependency-url: ${WEAVE_CALDAV_BASE_URL:${WEAVE_NEXTCLOUD_BASE_URL:https://files.weave.test}}
      readiness: ${WEAVE_WORKSPACE_CALENDAR_READINESS:}
    boards:
      enabled: ${WEAVE_WORKSPACE_BOARDS_ENABLED:false}
      readiness: ${WEAVE_WORKSPACE_BOARDS_READINESS:}
    weaver:
      # Weaver is a policy-controlled category. Runtime startup remains
      # disabled-by-default unless organization policy enables the category and
      # the governed runtime generator grants a per-user profile.
      enabled: ${WEAVE_WORKSPACE_WEAVER_ENABLED:false}
      readiness: ${WEAVE_WORKSPACE_WEAVER_READINESS:}
  weaver:
    runtime:
      # Generated Weaver/OpenClaw config is implementation output from Weave
      # policy, never a second product policy model. Defaults fail closed.
      enabled: ${WEAVE_WEAVER_RUNTIME_ENABLED:false}
      baseline-profile: ${WEAVE_WEAVER_RUNTIME_BASELINE_PROFILE:weaver-governed-baseline}
      image: ${WEAVE_WEAVER_RUNTIME_IMAGE:ghcr.io/masssi164/weaver-openclaw:policy-generated}
      workspace-root-template: ${WEAVE_WEAVER_RUNTIME_WORKSPACE_ROOT_TEMPLATE:/var/lib/weave/weaver/{userId}}
      isolated-agent-directory: ${WEAVE_WEAVER_RUNTIME_AGENT_DIRECTORY:.weaver/agents}
      docker-network-mode: ${WEAVE_WEAVER_RUNTIME_DOCKER_NETWORK_MODE:none}
      enabled-groups: ${WEAVE_WEAVER_RUNTIME_ENABLED_GROUPS:weaver-group,weave-weaver-runtime}
      allowed-capabilities: ${WEAVE_WEAVER_RUNTIME_ALLOWED_CAPABILITIES:weaver.files_read,weaver.exec_disabled}
      plugin-allowlist: ${WEAVE_WEAVER_RUNTIME_PLUGIN_ALLOWLIST:weave-files-readonly}
      tool-allowlist: ${WEAVE_WEAVER_RUNTIME_TOOL_ALLOWLIST:files.read}
      exec-enabled: ${WEAVE_WEAVER_RUNTIME_EXEC_ENABLED:false}
      elevated-enabled: ${WEAVE_WEAVER_RUNTIME_ELEVATED_ENABLED:false}
      audit-required: true
      fork-required: ${WEAVE_WEAVER_RUNTIME_FORK_REQUIRED:false}
    pa-chat:
      # Real PA Weaver chat must call a governed Weaver runtime bridge. When
      # disabled or unset, Weave Chat fails closed instead of synthesizing
      # Weaver/LM Studio success evidence.
      enabled: ${WEAVE_WEAVER_PA_CHAT_ENABLED:false}
      bridge-url: ${WEAVE_WEAVER_PA_CHAT_BRIDGE_URL:}
      timeout: ${WEAVE_WEAVER_PA_CHAT_TIMEOUT:10s}
      runtime-token-ref: ${WEAVE_WEAVER_PA_CHAT_RUNTIME_TOKEN_REF:credentialref://weave/channels/weave-chat/runtime-token}
  boards:
    runtime-enabled: ${WEAVE_BOARDS_RUNTIME_ENABLED:${WEAVE_BOARDS_WORKSPACE_RUNTIME_ENABLED:false}}
    provider: ${WEAVE_BOARDS_PROVIDER:${WEAVE_BOARDS_WORKSPACE_PROVIDER:local-workspace}}
    openproject:
      provider-runtime-enabled: ${WEAVE_BOARDS_OPENPROJECT_RUNTIME_ENABLED:false}
      read-sync-enabled: ${WEAVE_BOARDS_OPENPROJECT_READ_SYNC_ENABLED:false}
      context-authorization-enabled: ${WEAVE_BOARDS_OPENPROJECT_CONTEXT_AUTHORIZATION_ENABLED:false}
      audit-consent-enabled: ${WEAVE_BOARDS_OPENPROJECT_AUDIT_CONSENT_ENABLED:false}
      provider-writes-enabled: ${WEAVE_BOARDS_OPENPROJECT_PROVIDER_WRITES_ENABLED:false}
      auth-mode: ${WEAVE_BOARDS_OPENPROJECT_AUTH_MODE:disabled}
  meetings:
    livekit:
      # LiveKit is the active meetings/video-call provider contract. The backend
      # returns only support-safe readiness metadata; it never exposes API keys,
      # API secrets, room tokens, credential-bearing URLs, or raw LiveKit errors.
      # Leave credentials/token endpoint blank to fail closed until infra wires a
      # backend-owned token facade.
      enabled: ${WEAVE_LIVEKIT_ENABLED:true}
      url: ${WEAVE_LIVEKIT_URL:}
      api-key: ${WEAVE_LIVEKIT_API_KEY:}
      api-secret: ${WEAVE_LIVEKIT_API_SECRET:}
      token-endpoint: ${WEAVE_LIVEKIT_TOKEN_ENDPOINT:}
  onboarding:
    matrix:
      # Optional first-run provisioning override. When blank, status is derived from
      # the workspace chat capability. Accepted values: not_configured, pending,
      # ready, degraded, failed.
      provisioning-state: ${WEAVE_ONBOARDING_MATRIX_PROVISIONING_STATE:}
    nextcloud:
      # Optional first-run provisioning override. When blank, status is derived from
      # the files/calendar capabilities and canonical Nextcloud route.
      provisioning-state: ${WEAVE_ONBOARDING_NEXTCLOUD_PROVISIONING_STATE:}
  profile:
    # Persistent product-profile override store for mutable fields accepted by PATCH /api/profile.
    # Mount this path on durable storage for containerized runs.
    storage:
      path: ${WEAVE_PROFILE_STORAGE_PATH:./data/profile-overrides.json}
  provider:
    selections:
      # Persistent Admin Console provider selections. Mount this path on durable storage for server restarts.
      storage:
        path: ${WEAVE_PROVIDER_SELECTIONS_STORAGE_PATH:./data/provider-selections.json}
  audit:
    events:
      # Append-only support-safe audit sink for provider/control-plane apply decisions.
      storage:
        path: ${WEAVE_AUDIT_EVENTS_STORAGE_PATH:./data/audit-events.jsonl}
  interop:
    enabled: ${WEAVE_INTEROP_ENABLED:false}
    support-bundle-redaction-mode: ${WEAVE_INTEROP_SUPPORT_BUNDLE_REDACTION_MODE:support-safe-redacted}
    slack:
      enabled: ${WEAVE_INTEROP_SLACK_ENABLED:false}
      client-id: ${WEAVE_INTEROP_SLACK_CLIENT_ID:}
      client-secret-ref: ${WEAVE_INTEROP_SLACK_CLIENT_SECRET_REF:}
      signing-secret-ref: ${WEAVE_INTEROP_SLACK_SIGNING_SECRET_REF:}
      token-ref: ${WEAVE_INTEROP_SLACK_TOKEN_REF:}
      workspace-id: ${WEAVE_INTEROP_SLACK_WORKSPACE_ID:}
      channel-id: ${WEAVE_INTEROP_SLACK_CHANNEL_ID:}
      room-id: ${WEAVE_INTEROP_SLACK_ROOM_ID:}
    teams:
      enabled: ${WEAVE_INTEROP_TEAMS_ENABLED:false}
  guest:
    enabled: ${WEAVE_GUEST_ENABLED:false}
  migration:
    enabled: ${WEAVE_MIGRATION_ENABLED:false}
    evidence:
      # Persistent support-safe dry-run/apply evidence. Mount this path on durable storage for server restarts.
      storage:
        path: ${WEAVE_MIGRATION_EVIDENCE_STORAGE_PATH:./data/migration-run-evidence.json}
  connectors:
    public-sdk-enabled: ${WEAVE_CONNECTORS_PUBLIC_SDK_ENABLED:false}
