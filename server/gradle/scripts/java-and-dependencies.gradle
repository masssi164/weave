def weaveOpenDalClassifier = System.getenv('WEAVE_OPENDAL_CLASSIFIER') ?: {
    def os = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
    def arch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
    def arm = arch in ['aarch64', 'arm64']
    if (os.contains('mac') || os.contains('darwin')) return arm ? 'osx-aarch_64' : 'osx-x86_64'
    if (os.contains('win')) return 'windows-x86_64'
    if (os.contains('linux')) return arm ? 'linux-aarch_64' : 'linux-x86_64'
    throw new GradleException("Unsupported OpenDAL native platform: ${os}/${arch}; set WEAVE_OPENDAL_CLASSIFIER explicitly")
}.call()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.springdoc.webmvc.api
    implementation libs.jcs
    implementation libs.ical4j
    implementation libs.flyway.core
    implementation libs.flyway.postgresql
    implementation libs.opendal
    runtimeOnly "org.apache.opendal:opendal:${libs.versions.opendal.get()}:${weaveOpenDalClassifier}"
    implementation project(':weave-application-core')
    implementation project(':weave-files-core')
    implementation project(':weave-persistence-jpa')
    implementation project(':weave-runtime-provider-adapters')
    implementation project(':weave-runtime-security-adapters')
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.spring
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
    testRuntimeOnly libs.h2.test
    testRuntimeOnly libs.cucumber.junit.platform
}
