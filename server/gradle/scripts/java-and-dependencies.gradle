java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.springdoc.webmvc.api
    implementation libs.jcs
    implementation libs.zxing.core
    implementation libs.flyway.core
    implementation libs.flyway.postgresql

    // Separate southbound S3 provider / ARC object-store support. This is not part of weave-native Files.
    implementation libs.aws.s3
    implementation libs.aws.url.connection.client

    implementation project(':server:core:model')
    implementation project(':server:domains:files')
    implementation project(':server:domains:calendar')
    implementation project(':server:core')
    testImplementation testFixtures(project(':server:core'))
    testImplementation testFixtures(project(':server:domains:chat'))
    implementation project(':server:domains:agent-runtime:persistence')
    implementation project(':server:domains:chat')
    implementation project(':server:domains:decisions')
    implementation project(':server:domains:meetings')
    implementation project(':server:domains:portability:persistence')
    implementation project(':server:domains:agent-runtime:model')
    implementation project(':server:domains:portability:model')
    implementation project(':server:domains:agent-runtime:provider')
    implementation project(':server:domains:agent-runtime:security')
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.spring
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
    testRuntimeOnly libs.h2.test
    testRuntimeOnly libs.cucumber.junit.platform
}
