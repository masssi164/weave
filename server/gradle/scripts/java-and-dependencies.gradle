java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.springdoc.webmvc.api
    implementation libs.jcs
    implementation libs.zxing.core
    implementation libs.flyway.core
    implementation libs.flyway.postgresql


    implementation project(':server:core')
    // One resolver supplies production composition. Broad integration fixtures are test-only.
    project(':server').ext.weaveDomainSelection.domains.each { domain ->
        implementation project(":server:domains:${domain}")
    }
    project(':server').ext.weaveDomainCatalog.domains.keySet().each { domain ->
        testImplementation project(":server:domains:${domain}")
    }
    testImplementation testFixtures(project(':server:domains:agent-runtime'))
    testImplementation testFixtures(project(':server:domains:portability'))
    testImplementation testFixtures(project(':server:core'))
    testImplementation testFixtures(project(':server:domains:chat'))
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'com.h2database:h2'

    testImplementation libs.aws.s3
    testImplementation libs.aws.url.connection.client
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.spring
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
    testRuntimeOnly libs.h2.test
    testRuntimeOnly libs.cucumber.junit.platform
}
