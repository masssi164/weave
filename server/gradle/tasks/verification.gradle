tasks.withType(Test).configureEach {
    maxParallelForks = 1
    maxHeapSize = '1g'

    def identityReferenceKey = layout.buildDirectory
            .file("test-secretrefs/${name}/identity-reference-hmac-key")
    systemProperty(
            'weave.identity.invitations.keycloak.reference-hmac-secret-file',
            identityReferenceKey.get().asFile.absolutePath)
    doFirst {
        def keyPath = identityReferenceKey.get().asFile.toPath()
        java.nio.file.Files.createDirectories(keyPath.parent)
        if (java.nio.file.Files.isSymbolicLink(keyPath)) {
            throw new GradleException('identity-reference test SecretRef must not be a symlink')
        }
        if (!java.nio.file.Files.exists(keyPath)) {
            byte[] random = new byte[48]
            new java.security.SecureRandom().nextBytes(random)
            byte[] encoded = java.util.Base64.urlEncoder.withoutPadding().encode(random)
            java.nio.file.Files.write(
                    keyPath,
                    encoded,
                    java.nio.file.StandardOpenOption.CREATE_NEW,
                    java.nio.file.StandardOpenOption.WRITE)
            try {
                java.nio.file.Files.setPosixFilePermissions(
                        keyPath,
                        java.nio.file.attribute.PosixFilePermissions.fromString('rw-------'))
            } catch (UnsupportedOperationException ignored) {
                // Windows test workers do not expose POSIX file permissions.
            }
            java.util.Arrays.fill(random, (byte) 0)
            java.util.Arrays.fill(encoded, (byte) 0)
        }
    }
}

tasks.named('test') {
    dependsOn tasks.named('buildMatrixRustCoreJni')
    useJUnitPlatform {
        excludeTags 'postgres'
    }
    systemProperty 'weave.matrix.protocol.library.path', matrixProtocolLibrary.absolutePath
}

tasks.register('openApiContractExport', Test) {
    group = 'verification'
    description = 'Export the server-owned OpenAPI contract without mutating the main test results.'
    dependsOn tasks.named('buildMatrixRustCoreJni'), tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'weave.matrix.protocol.library.path', matrixProtocolLibrary.absolutePath
    systemProperty 'weave.openapi.export.path', rootProject.layout.buildDirectory
            .file('openapi/weave-openapi.raw.json')
            .get()
            .asFile
            .absolutePath
    filter {
        includeTestsMatching '*OpenApiDocumentationTest'
    }
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

tasks.register('runnerPostgresLeaseTest', Test) {
    group = 'verification'
    description = 'Run focused PostgreSQL task-control and Runner X.509/HTTP contracts.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'weave.test.postgres', 'true'
    testLogging {
        exceptionFormat = 'full'
    }
    filter {
        includeTestsMatching '*JpaRunnerTaskStorePostgresTest'
        includeTestsMatching '*RunnerTaskQueuePostgresTest'
        includeTestsMatching '*JpaRunnerWorkloadIdentityDirectoryPostgresTest'
        includeTestsMatching '*RunnerCertificateFingerprintExtractorTest'
        includeTestsMatching '*RunnerX509UserDetailsServiceTest'
        includeTestsMatching '*RunnerControlSecurityConfigurationTest'
    }
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
    outputs.upToDateWhen { false }
}

