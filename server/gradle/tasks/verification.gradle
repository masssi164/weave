tasks.withType(Test).configureEach {
    // The suite intentionally boots many isolated Spring/JPA contexts. Keep one
    // bounded fork while providing enough heap for the complete architecture gate.
    maxParallelForks = 1
    maxHeapSize = '1g'
}

tasks.named('test') {
    dependsOn tasks.named('buildMatrixRustCoreJni')
    useJUnitPlatform {
        excludeTags 'postgres'
    }
    systemProperty 'weave.matrix.core.library.path', matrixCoreLibrary.absolutePath
}

tasks.register('openApiContractExport', Test) {
    group = 'verification'
    description = 'Export the server-owned OpenAPI contract without mutating the main test results.'
    dependsOn tasks.named('buildMatrixRustCoreJni'), tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'weave.matrix.core.library.path', matrixCoreLibrary.absolutePath
    systemProperty 'weave.openapi.export.path', rootProject.layout.buildDirectory
            .file('openapi/weave-openapi.raw.json')
            .get()
            .asFile
            .absolutePath
    filter {
        includeTestsMatching '*OpenApiDocumentationTest'
    }
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

tasks.register('postgresJpaTest', Test) {
    group = 'verification'
    description = 'Run the authoritative JPA repository, constraint, transaction, and migration contracts against PostgreSQL.'
    dependsOn tasks.named('buildMatrixRustCoreJni'), tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'weave.matrix.core.library.path', matrixCoreLibrary.absolutePath
    systemProperty 'weave.test.postgres', 'true'
    filter {
        includeTestsMatching '*PostgresJpaSchemaValidationTest'
        includeTestsMatching '*JpaEncryptedRuntimeStateStoreTest'
        includeTestsMatching '*JpaRuntimeCellRepositoryTest'
        includeTestsMatching '*JpaRuntimeCommandRepositoryTest'
        includeTestsMatching '*JpaRuntimeGovernanceRepositoryTest'
        includeTestsMatching '*JpaRuntimeProfileRepositoryTest'
        includeTestsMatching '*AgentRuntimeAdminServiceTest'
        includeTestsMatching '*AgentRuntimeControlServiceTest'
        includeTestsMatching '*AgentRuntimeWorkloadReconciliationServiceTest'
        includeTestsMatching '*JpaAuditEventPublisherTest'
        includeTestsMatching '*JpaCanonicalChatLedgerRecoveryTest'
        includeTestsMatching '*JpaCanonicalChatStoreTest'
        includeTestsMatching '*MatrixE2eeStateServicePersistenceTest'
        includeTestsMatching '*MatrixFacadeClientStateServicePersistenceTest'
        includeTestsMatching '*JpaProviderSelectionRepositoryTest'
        includeTestsMatching '*JpaDeviceCredentialRepositoryTest'
        includeTestsMatching '*AdminControlPlaneServiceTest'
        includeTestsMatching '*JpaProductProfileOverrideRepositoryTest'
        includeTestsMatching '*JpaMigrationRunEvidenceRepositoryTest'
        includeTestsMatching '*JpaOperationIntentRepositoryPostgresTest'
        includeTestsMatching '*FilesMutationIntentServicePostgresTest'
    }
    useJUnitPlatform()
}
