// Transitional full-App alias; the actual JNI build and library belong to Chat.
ext.matrixProtocolLibrary = providers.provider {
    project(':server:domains:chat').ext.matrixProtocolLibrary
}

tasks.register('buildMatrixRustCoreJni') {
    group = 'build'
    description = 'Build the Chat-owned protocol JNI library required by the current full App.'
    dependsOn ':server:domains:chat:buildMatrixRustCoreJni'
}
