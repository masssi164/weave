tasks.register('dogfoodReset', Exec) {
    group = 'application'
    description = 'Delete only the dogfood project and its three session volumes, then recreate an empty stack.'
    workingDir rootProject.projectDir
    commandLine bootstrapPython.get(), 'infra/weave-workspace/scripts/dogfood_lifecycle.py', 'reset', '--root', 'infra/weave-workspace'
