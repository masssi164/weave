name: Weave Control Local Deployment

on:
  workflow_dispatch:
    inputs:
      evidence_mode:
        description: "support-safe evidence mode; local deployment handoff is required for #665 deployment proof"
        required: false
        default: "live-stack"
  push:
    branches:
      - test/local-forgejo-deployed-stack-e2e-665

jobs:
  support-safe-preflight:
    name: Support-safe Forgejo dispatch preflight
    runs-on:
      - ubuntu-latest
      - docker
    timeout-minutes: 20
    steps:
      - name: Check out weave
        uses: actions/checkout@v4
      - name: Validate support-safe local Forgejo contracts
        run: |
          set -euo pipefail
          python3 tools/local_forgejo_runner_readiness_check.py
          python3 tools/local_forgejo_pipeline_provider_check.py
          python3 tools/local_domain_adapter_plan_check.py
          python3 tools/local_forgejo_e2e_handoff_check.py
      - name: Emit preflight claim boundary
        run: |
          set -euo pipefail
          echo "dispatch_preflight_complete=true"
          echo "claim_boundary=dispatch_preflight_only_until_local_deployment_handoff_passes"

  deployed-stack-e2e:
    name: Deploy Weave Control, server, and infra
    needs: support-safe-preflight
    runs-on:
      - ubuntu-latest
      - docker
    timeout-minutes: 90
    env:
      WEAVE_BACKEND_IMAGE: weave-backend:local-forgejo-e2e
      WEAVE_TEST_PASSWORD: ${{ secrets.WEAVE_TEST_PASSWORD }}
      TF_VAR_test_user_password: ${{ secrets.WEAVE_TEST_PASSWORD }}
      TF_VAR_db_admin_password: ci-db-admin-password
      TF_VAR_keycloak_admin_password: ci-keycloak-admin-password
      TF_VAR_keycloak_db_password: ci-keycloak-db-password
      TF_VAR_mas_db_password: ci-mas-db-password
      TF_VAR_synapse_db_password: ci-synapse-db-password
      TF_VAR_nextcloud_db_password: ci-nextcloud-db-password
      TF_VAR_nextcloud_admin_password: ci-nextcloud-admin-password
      TF_VAR_matrix_mas_client_secret: ci-matrix-mas-client-secret
      TF_VAR_mas_encryption_secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TF_VAR_mas_matrix_secret: ci-mas-matrix-secret
      TF_VAR_synapse_registration_shared_secret: ci-synapse-registration-shared-secret
      TF_VAR_synapse_macaroon_secret_key: ci-synapse-macaroon-secret-key
      TF_VAR_synapse_form_secret: ci-synapse-form-secret
      TF_VAR_create_test_user: 'true'
      TF_VAR_boards_runtime_enabled: 'true'
      TF_VAR_boards_provider: local-workspace
      TF_VAR_tenant_domain: weave.local
      TF_VAR_proxy_http_host_port: '44080'
      TF_VAR_proxy_host_port: '44443'
      TF_VAR_keycloak_host_port: '48080'
      TF_VAR_mas_host_port: '48082'
      TF_VAR_synapse_host_port: '48008'
      TF_VAR_nextcloud_host_port: '48083'
      TF_VAR_backend_host_port: '48084'
      WEAVE_RUNNER_HYGIENE: 'true'
      WEAVE_REMOVE_VOLUMES: 'true'
      WEAVE_CONFIRM_DESTRUCTIVE_RESET: weave
      DOCKER_HOST: unix:///var/run/docker.sock
      WEAVE_IAC_BIN: tofu
      WEAVE_LOOPBACK_HOST: host.docker.internal
    steps:
      - name: Check out weave
        uses: actions/checkout@v4
      - name: Install Docker CLI and infra prerequisites
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1 \
            && command -v curl >/dev/null 2>&1 \
            && command -v git >/dev/null 2>&1 \
            && command -v ip >/dev/null 2>&1 \
            && command -v jq >/dev/null 2>&1 \
            && command -v make >/dev/null 2>&1 \
            && command -v unzip >/dev/null 2>&1 \
            && command -v zstd >/dev/null 2>&1; then
            echo "local_forgejo_prerequisites=preinstalled"
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            docker.io \
            git \
            iproute2 \
            jq \
            make \
            unzip \
            xz-utils \
            zstd
      - name: Install OpenTofu without external setup actions
        run: |
          set -euo pipefail
          if ! command -v tofu >/dev/null 2>&1; then
            arch="$(uname -m)"
            case "$arch" in
              aarch64|arm64) tofu_arch=arm64 ;;
              x86_64|amd64) tofu_arch=amd64 ;;
              *) echo "unsupported_tofu_arch=$arch"; exit 2 ;;
            esac
            curl -fsSL -o /tmp/opentofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.10.6/tofu_1.10.6_linux_${tofu_arch}.zip"
            unzip -q /tmp/opentofu.zip -d /usr/local/bin tofu
            chmod +x /usr/local/bin/tofu
          fi
          tofu version >/dev/null
      - name: Prepare support-safe evidence directory
        run: |
          set -euo pipefail
          evidence_dir="$PWD/.weave-local-forgejo-e2e-evidence"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          echo "WEAVE_ACCEPTANCE_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
      - name: Verify deployment prerequisites without exposing secrets
        run: |
          set -euo pipefail
          missing=()
          for cmd in docker tofu make python3; do
            command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
          done
          if ! docker info >/dev/null 2>&1; then
            missing+=("docker-daemon")
          fi
          if [ -z "${WEAVE_TEST_PASSWORD:-}" ]; then
            missing+=("SecretRef:WEAVE_TEST_PASSWORD")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'pipeline_terminal_success=false\n'
            printf 'server_infra_readiness_passed=false\n'
            printf 'weave_control_ready=false\n'
            printf 'client_bootstrap_handoff_ready=false\n'
            printf 'blocked_missing_prerequisites=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 2
          fi
      - name: Ensure local Weave hostnames resolve inside the runner
        run: |
          set -euo pipefail
          gateway_ip="$(getent hosts host.docker.internal | awk '$1 ~ /^[0-9]+([.][0-9]+){3}$/ || $1 ~ /:/ {print $1; exit}')"
          if [ -z "$gateway_ip" ]; then
            gateway_ip="$(ip route | awk '/default/ && $3 ~ /^[0-9]+([.][0-9]+){3}$/ {print $3; exit}')"
          fi
          if [ -z "$gateway_ip" ]; then
            if docker info --format '{{ .OSType }}' >/dev/null 2>&1; then
              gateway_ip="127.0.0.1"
            else
              echo "unable_to_resolve_host_docker_internal_gateway=true"
              exit 2
            fi
          fi
          echo "WEAVE_LOOPBACK_RESOLVE_HOST=$gateway_ip" >> "$GITHUB_ENV"
          line="$gateway_ip weave.local api.weave.local auth.weave.local files.weave.local matrix.weave.local"
          if ! grep -Eq '(^|[[:space:]])api[.]weave[.]local([[:space:]]|$)' /etc/hosts \
            || ! grep -Eq '(^|[[:space:]])auth[.]weave[.]local([[:space:]]|$)' /etc/hosts; then
            echo "$line" >> /etc/hosts
          fi
          for host in weave.local api.weave.local auth.weave.local files.weave.local matrix.weave.local; do
            grep -Eq "(^|[[:space:]])${host//./[.]}([[:space:]]|$)" /etc/hosts
          done
      - name: Clean stale stack state
        working-directory: infra/weave-workspace
        env:
          WEAVE_IAC_BIN: tofu
        run: bash ./teardown.sh
      - name: Verify prebuilt backend image from monorepo server
        run: |
          set -euo pipefail
          current_commit="$(git rev-parse HEAD)"
          image_commit="$(docker image inspect "$WEAVE_BACKEND_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
          if [ "$image_commit" != "$current_commit" ]; then
            echo "backend_image_ready=false"
            echo "backend_image_expected_commit=$current_commit"
            echo "backend_image_actual_commit=${image_commit:-missing}"
            echo "Build the local Forgejo backend image on the host before dispatching: docker build --label org.opencontainers.image.revision=$current_commit -t $WEAVE_BACKEND_IMAGE server"
            exit 2
          fi
          echo "backend_image_ready=true"
          echo "backend_image_commit=$current_commit"
      - name: Bootstrap local stack
        working-directory: infra/weave-workspace
        env:
          TF_VAR_weave_backend_image: ${{ env.WEAVE_BACKEND_IMAGE }}
          WEAVE_IAC_BIN: tofu
        run: ./install.sh
      - name: Route public Weave hostnames to the deployed reverse proxy
        run: |
          set -euo pipefail
          hosts="weave.local api.weave.local auth.weave.local files.weave.local matrix.weave.local"
          candidates_file="$(mktemp)"
          docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' weave-proxy 2>/dev/null | awk '$1 ~ /^[0-9]+([.][0-9]+){3}$/ {print $1 " 443"}' >> "$candidates_file" || true
          docker network inspect weave_network -f '{{range .Containers}}{{if eq .Name "weave-proxy"}}{{println .IPv4Address}}{{end}}{{end}}' 2>/dev/null | cut -d/ -f1 | awk '$1 ~ /^[0-9]+([.][0-9]+){3}$/ {print $1 " 443"}' >> "$candidates_file" || true
          printf '%s %s\n' "${WEAVE_LOOPBACK_RESOLVE_HOST:-}" "${TF_VAR_proxy_host_port}" >> "$candidates_file"
          getent hosts host.docker.internal 2>/dev/null | awk -v port="${TF_VAR_proxy_host_port}" '$1 ~ /^[0-9]+([.][0-9]+){3}$/ {print $1 " " port}' >> "$candidates_file" || true
          ip route 2>/dev/null | awk -v port="${TF_VAR_proxy_host_port}" '/default/ && $3 ~ /^[0-9]+([.][0-9]+){3}$/ {print $3 " " port; exit}' >> "$candidates_file" || true
          printf '127.0.0.1 %s\n' "${TF_VAR_proxy_host_port}" >> "$candidates_file"
          route_ip=""
          route_port=""
          while read -r candidate candidate_port; do
            case "$candidate" in
              ''|*[!0-9.]*) continue ;;
            esac
            case "${candidate_port:-}" in
              ''|*[!0-9]*) continue ;;
            esac
            status="$(curl -sk --resolve "files.weave.local:${candidate_port}:$candidate" -o /dev/null -w '%{http_code}' "https://files.weave.local:${candidate_port}/status.php" || true)"
            if [ "$status" = "200" ]; then
              route_ip="$candidate"
              route_port="$candidate_port"
              break
            fi
          done < <(awk '!seen[$1":"$2]++' "$candidates_file")
          rm -f "$candidates_file"
          if [ -z "$route_ip" ]; then
            echo "reverse_proxy_route_ready=false"
            exit 2
          fi
          echo "WEAVE_LOOPBACK_RESOLVE_HOST=$route_ip" >> "$GITHUB_ENV"
          echo "WEAVE_PUBLIC_PROXY_PORT=$route_port" >> "$GITHUB_ENV"
          tmp_hosts="$(mktemp)"
          awk 'BEGIN { split("weave.local api.weave.local auth.weave.local files.weave.local matrix.weave.local", blocked, " "); for (i in blocked) deny[blocked[i]]=1 } { keep=1; for (i=2; i<=NF; i++) if ($i in deny) keep=0; if (keep) print }' /etc/hosts > "$tmp_hosts"
          printf '%s %s\n' "$route_ip" "$hosts" >> "$tmp_hosts"
          cat "$tmp_hosts" > /etc/hosts
          rm -f "$tmp_hosts"
          echo "public_weave_hostname_route=ready"
      - name: Verify deployed stack readiness
        working-directory: infra/weave-workspace
        run: bash ./operator-check.sh
      - name: Generate support-safe deployment handoff evidence
        if: always()
        run: |
          set -euo pipefail
          evidence_dir="${WEAVE_ACCEPTANCE_EVIDENCE_DIR:-$PWD/.weave-local-forgejo-e2e-evidence}"
          handoff="$evidence_dir/weave-control-local-deployment-handoff.json"
          mkdir -p "$evidence_dir"
          cat > "$handoff" <<EOF
          {
            "artifactKind": "weave-control-local-deployment-handoff-v1",
            "supportSafe": true,
            "source": "local-forgejo-actions",
            "lane": "local-forgejo-weave-control-deployment",
            "commit": "${GITHUB_SHA:-local-forgejo}",
            "runId": "${GITHUB_RUN_ID:-local-forgejo-run}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT:-1}",
            "pipeline_terminal_success": true,
            "server_infra_readiness_passed": true,
            "weave_control_ready": true,
            "client_bootstrap_handoff_ready": true,
            "separateClientLaneEvidence": "member_provider_neutral_join_passed and weave_client_e2e_passed are not emitted by this deployment workflow",
            "claimBoundary": "deployment_handoff_only_until_separate_client_e2e_passes"
          }
          EOF
      - name: Emit #665 concise terminal signals
        run: |
          set -euo pipefail
          echo "pipeline_terminal_success=true"
          echo "server_infra_readiness_passed=true"
          echo "weave_control_ready=true"
          echo "client_bootstrap_handoff_ready=true"
      - name: Destroy stack and scrub stale resources
        if: always()
        working-directory: infra/weave-workspace
        env:
          WEAVE_IAC_BIN: tofu
        run: bash ./teardown.sh
