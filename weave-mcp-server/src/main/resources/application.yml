server:
  port: ${WEAVE_MCP_PORT:8091}

spring:
  application:
    name: weave-mcp-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WEAVE_OIDC_ISSUER_URI:https://auth.weave.test/realms/weave}
          audiences:
            - ${WEAVE_OIDC_AUDIENCE:weave-mcp-server}
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        type: SYNC
        name: weave-domain-tools
        version: 0.2.0
        instructions: Use only approved Weave domain capabilities. Provider APIs and credentials are never MCP tools.
        tool-callback-converter: true
        annotation-scanner:
          enabled: true
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

weave:
  oidc:
    token-uri: ${WEAVE_OIDC_TOKEN_URI:https://auth.weave.test/realms/weave/protocol/openid-connect/token}
    mcp-client-id: ${WEAVE_MCP_CLIENT_ID:weave-mcp-server}
    mcp-client-secret: ${WEAVE_MCP_CLIENT_SECRET:}
    inbound-audience: ${WEAVE_OIDC_AUDIENCE:weave-mcp-server}
    inbound-authorized-party: ${WEAVE_MCP_INBOUND_AUTHORIZED_PARTY:weave-app}
    inbound-scope: ${WEAVE_MCP_INBOUND_SCOPE:weave:mcp}
    backend-audience: ${WEAVE_BACKEND_OIDC_AUDIENCE:weave-backend}
    backend-scope: ${WEAVE_MCP_BACKEND_SCOPE:weave:mcp-backend}
  server:
    base-url: ${WEAVE_SERVER_BASE_URL:http://localhost:8080}
