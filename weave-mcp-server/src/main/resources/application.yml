server:
  port: ${WEAVE_MCP_PORT:8091}

spring:
  application:
    name: weave-mcp-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WEAVE_OIDC_ISSUER_URI:https://auth.weave.test/realms/weave}
          audiences:
            - ${WEAVE_OIDC_AUDIENCE:weave-mcp-server}
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        type: SYNC
        name: weave-workload-tools
        version: 0.3.0
        instructions: Disabled until Agent Runtime Control validates a bound Weaver cell workload.
        tool-callback-converter: true
        annotation-scanner:
          enabled: true
        capabilities:
          tool: false
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
