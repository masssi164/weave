spring:
  config:
    activate:
      on-profile: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.weave.test/realms/weave
          jwk-set-uri: http://127.0.0.1:${WEAVE_KEYCLOAK_HOST_PORT:48080}/realms/weave/protocol/openid-connect/certs

weave:
  deployment:
    profile: dev
  mcp:
    resource-uri: https://api.weave.test/mcp
    resource-metadata-uri: https://api.weave.test/.well-known/oauth-protected-resource/mcp
    authorization-server: https://auth.weave.test/realms/weave
    token-uri: http://127.0.0.1:${WEAVE_KEYCLOAK_HOST_PORT:48080}/realms/weave/protocol/openid-connect/token
    backend-resource-uri: https://api.weave.test/api
    backend-files-uri: http://127.0.0.1:${WEAVE_BACKEND_HOST_PORT:48084}/dav/files
    exchange-client-jwk-file: ${WEAVE_MCP_EXCHANGE_CLIENT_JWK_FILE:}
