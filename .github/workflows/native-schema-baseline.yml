name: Native Schema Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/native-schema-baseline.yml'

permissions:
  contents: write
  actions: read

jobs:
  commit-baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
      - name: Download the independently generated PostgreSQL baseline
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-schema-baseline
          path: build/native-schema-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31288003656'
      - name: Verify and commit the exact generated Flyway baseline
        run: |
          set -euo pipefail
          cd build/native-schema-baseline
          sha256sum --check V1__native_schema_baseline.sql.sha256
          test "$(wc -l < V1__native_schema_baseline.sql)" -eq 1541
          cd ../..
          mkdir -p server/src/main/resources/db/migration
          cp build/native-schema-baseline/V1__native_schema_baseline.sql server/src/main/resources/db/migration/V1__native_schema_baseline.sql
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/main/resources/db/migration/V1__native_schema_baseline.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(persistence): commit generated native schema baseline'
          git push origin HEAD:${{ github.head_ref }}
