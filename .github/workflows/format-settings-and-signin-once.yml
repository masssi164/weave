name: Verify Dart formatting for scoped UI fixes
on:
  push:
    branches: [diagnostic/dual-ios-source-20261028]
    paths: [.github/workflows/format-settings-and-signin-once.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact sign-in patch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6d630230eb85813a500bb2d7e9a312e4a46187d8
          path: signin
          persist-credentials: false
      - name: Fetch exact Settings patch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1bfa8f2f2dba10482bc9066ef64fc19a003180c8
          path: settings
          persist-credentials: false
      - name: Prepare pinned Dart formatter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Report exact format-only patches
        shell: bash
        run: |
          set -euo pipefail
          dart format signin/client/test/features/auth/sign_in_semantics_geometry_test.dart
          dart format settings/client/lib/features/settings/presentation/settings_screen.dart settings/client/test/features/settings/settings_screen_test.dart
          echo 'BEGIN_SIGNIN_FORMAT_DIFF'
          git -C signin diff -- client/test/features/auth/sign_in_semantics_geometry_test.dart
          echo 'END_SIGNIN_FORMAT_DIFF'
          echo 'BEGIN_SETTINGS_FORMAT_DIFF'
          git -C settings diff -- client/lib/features/settings/presentation/settings_screen.dart client/test/features/settings/settings_screen_test.dart
          echo 'END_SETTINGS_FORMAT_DIFF'
