name: Selected domain JVM checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/domain-unit-checks.yml'
      - 'tools/domain_selection_*.py'
      - 'tools/domain_unit_workflow_test.py'
      - 'server/domains/**'
      - 'server/app/**'
      - 'server/core/**'
      - 'server/gradle/**'
      - 'server/build.gradle'
      - 'settings.gradle'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/matrix-protocol/rust-toolchain.toml'
      - 'rust/matrix-protocol/**'
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains (all or comma-separated names); empty uses a matching branch pin, then all'
        type: string
        required: false
      iteration:
        description: 'Check one selected aggregate or each selected domain with its declared dependencies'
        type: choice
        options: [selected, individual]
        default: selected
        required: false
  workflow_call:
    inputs:
      domains:
        description: 'Domains (all or comma-separated names); empty uses a matching branch pin, then all'
        type: string
        required: false
      iteration:
        description: 'selected or individual; individual rows include explicitly selected required domains'
        type: string
        default: selected
        required: false

permissions:
  contents: read

concurrency:
  group: domain-unit-checks-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.domains || 'default' }}-${{ inputs.iteration || 'selected' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve domain check matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Resolve domain check matrix
        id: selection
        shell: bash
        env:
          REQUESTED_DOMAINS: ${{ inputs.domains }}
          ITERATION: ${{ inputs.iteration || 'selected' }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          selection_args=(--root . --format matrix --iteration "$ITERATION" --domains "$REQUESTED_DOMAINS")
          if [[ "$SOURCE_REF" == refs/heads/* ]]; then
            selection_args+=(--source-branch "${SOURCE_REF#refs/heads/}" --source-commit "$SOURCE_COMMIT")
          fi
          resolved_matrix="$(python3 tools/domain_selection_resolver.py "${selection_args[@]}")"
          printf 'matrix=%s\n' "$resolved_matrix" >> "$GITHUB_OUTPUT"
          printf 'Domain check matrix: %s\n' "$resolved_matrix"

  domain_units:
    name: JVM checks (${{ matrix.domain }}; ${{ matrix.domains }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned Chat protocol toolchain
        if: contains(format(',{0},', matrix.domains), ',chat,')
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Run owning domain checks
        shell: bash
        env:
          SELECTED_DOMAINS: ${{ matrix.domains }}
          RESOLVED_SELECTION: ${{ matrix.selection }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf 'Checking domains %s from selection %s\n' "$SELECTED_DOMAINS" "$RESOLVED_SELECTION"
          ./gradlew --no-daemon --stacktrace :server:domains:check "-Pdomains=$SELECTED_DOMAINS"
      - name: Verify Gradle task selection and packaging guard
        if: github.event_name == 'pull_request' && matrix.domain == 'selected'
        run: python3 -m unittest tools.domain_selection_gradle_test -v
      - name: Preserve owning JVM test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: domain-check-results-${{ matrix.domain }}-${{ matrix.domains }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server/**/build/test-results/test/
            server/**/build/test-results/contextTest/
            server/**/build/reports/tests/test/
            server/**/build/reports/tests/contextTest/
          if-no-files-found: ignore
          retention-days: 7
