name: Verify password prompt budget repair
on:
  push:
    branches: [diagnostic/1770-password-prompt-budget]
    paths: [.github/workflows/password-prompt-budget-repair.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/diagnostic/1770-password-prompt-budget'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE: 4f4366bdc8098b974e6d8c325b9ab6aa5bbefa28
      TARGET: fix/1770-password-prompt-budget
    steps:
      - name: Check out the exact bounded diagnostic patch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3cdcaeb4c3183d6af2332aa71b8d5ae792fd24a7
          path: diagnostic
          persist-credentials: false
      - name: Check out the reviewed implementation baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 4f4366bdc8098b974e6d8c325b9ab6aa5bbefa28
          path: source
          persist-credentials: true
      - name: Verify exact inputs and demonstrate the regression before repair
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git hash-object ../diagnostic/.github/diagnostics/password-prompt-budget.patch)" = 78c1ad3060586bf57dedb3dbf7ba26ecee494749
          test "$(git hash-object client/tool/ios_browser_driver/BrowserDriver.swift)" = ebee494338b7792ab013e6ae146d01453a3bf6c2
          command -v swiftc
          git apply --check ../diagnostic/.github/diagnostics/password-prompt-budget.patch
          git apply --include=client/tool/native_qualification_test.py ../diagnostic/.github/diagnostics/password-prompt-budget.patch
          set +e
          python3 -m unittest client/tool/native_qualification_test.py -k test_password_prompt_settles_without_shortening_authentication_deadline -v > "$RUNNER_TEMP/prompt-baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/prompt-baseline.log"
          test "$result" = 1
          grep -F 'late unique prompt must retain the remaining authentication budget' "$RUNNER_TEMP/prompt-baseline.log"
          echo 'PASSWORD_PROMPT_BASELINE expectedFailure=true'
      - name: Apply the minimal repair and run native contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git apply --include=client/tool/ios_browser_driver/BrowserDriver.swift ../diagnostic/.github/diagnostics/password-prompt-budget.patch
          test "$(git hash-object client/tool/ios_browser_driver/BrowserDriver.swift)" = 16a7f59e52eb249ca2ec21da2e4a14008090c194
          test "$(git hash-object client/tool/native_qualification_test.py)" = 06f43f79c37c6bc1a9d7293ab9c54dbf0b5a61e7
          python3 client/tool/native_qualification_test.py -v
          python3 client/tool/dual_ios_collaboration_test.py -v
          git diff --check
      - name: Compile and exercise the existing native prompt tests on a hosted simulator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.5\nBuild version 17F42')"
          udid="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r,ds in d["devices"].items() if "iOS" in r for x in ds if x.get("isAvailable") and x["name"].startswith("iPhone")))')"
          xcodebuild test -project client/tool/ios_browser_driver/BrowserDriver.xcodeproj -scheme BrowserDriver \
            -destination "platform=iOS Simulator,id=$udid" -derivedDataPath "$RUNNER_TEMP/prompt-driver" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -only-testing:BrowserDriver/BrowserDriver/testPasswordDeclineRejectsMissingAndAmbiguousAlerts \
            -only-testing:BrowserDriver/BrowserDriver/testPasswordPromptWaitUsesFreshStateAndBoundedDeadline \
            -only-testing:BrowserDriver/BrowserDriver/testAmbiguousPasswordPromptSettlesWithoutSelectingEarly \
            -only-testing:BrowserDriver/BrowserDriver/testReadyPromptIsNotSelectedBeforeCompletionSettles \
            -only-testing:BrowserDriver/BrowserDriver/testReadyPromptYieldsToGenuineCompletionDuringSettling \
            -only-testing:BrowserDriver/BrowserDriver/testDisappearingObservedPromptSuppressesReturnRecovery \
            -only-testing:BrowserDriver/BrowserDriver/testReturnRecoveryRejectsChangedOrAmbiguousProviderState
      - name: Publish only the verified two-file change to the scoped feature branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$BASE"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf 'client/tool/ios_browser_driver/BrowserDriver.swift\nclient/tool/native_qualification_test.py')"
          git add client/tool/ios_browser_driver/BrowserDriver.swift client/tool/native_qualification_test.py
          git -c user.name='masssi164' -c user.email='95998874+masssi164@users.noreply.github.com' commit -m 'fix: preserve the authentication budget while the password prompt settles (#1770)'
          git push origin "HEAD:refs/heads/$TARGET"
          printf 'VERIFIED_REPAIR_COMMIT=%s\n' "$(git rev-parse HEAD)"
