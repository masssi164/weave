name: Temporary #1747 Dart format repair
on:
  push:
    branches: [feat/1742-collaboration-files-root]
    paths: [.github/workflows/1747-format-fix.yml]
permissions:
  contents: write
concurrency:
  group: files-format-1747
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/feat/1742-collaboration-files-root'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Format only the two CI-reported files
        run: |
          set -euo pipefail
          dart format \
            client/test/features/app/release_golden_paths_test.dart \
            client/test/release_1/release_golden_paths_test.dart
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'client/test/features/app/release_golden_paths_test.dart',
              'client/test/release_1/release_golden_paths_test.dart',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not changed or not changed <= expected:
              raise SystemExit(f'Unexpected format mutation set: {sorted(changed)}')
          PY
      - name: Publish formatting and retire this temporary workflow
        run: |
          set -euo pipefail
          git add -- \
            client/test/features/app/release_golden_paths_test.dart \
            client/test/release_1/release_golden_paths_test.dart
          git rm -- .github/workflows/1747-format-fix.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style(files): apply deterministic Dart formatting to migrated journeys'
          git push origin HEAD:refs/heads/feat/1742-collaboration-files-root
