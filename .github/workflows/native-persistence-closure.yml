name: Native Persistence Closure

on:
  pull_request:
    paths:
      - '.github/workflows/native-persistence-closure.yml'
      - 'server/**'
      - 'weave-persistence-jpa/**'
      - 'weave-files-core/**'
      - 'weave-application-core/**'
      - 'docs/devops/database-migrations.md'
      - 'docs/architecture/database-schema-authority.md'
      - 'docs/evidence/**'

permissions:
  contents: read

jobs:
  postgres-flyway:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave -d weave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WEAVE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/weave
      WEAVE_TEST_POSTGRES_USER: weave
      WEAVE_TEST_POSTGRES_PASSWORD: weave
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile persistence closure tests
        run: ./gradlew :server:compileJava :server:compileTestJava
      - name: PostgreSQL native-provider qualification
        run: |
          set -euo pipefail
          ./gradlew :server:test \
            --tests 'com.massimotter.weave.backend.calendar.adapter.NativeCalendarProviderAdapterTest' \
            --tests 'com.massimotter.weave.backend.matrix.MatrixE2eeStateServicePersistenceTest' \
            --tests 'com.massimotter.weave.backend.matrix.MatrixE2eeStateServiceSharedUsersTest' \
            --tests 'com.massimotter.weave.backend.matrix.MatrixE2eeStateServiceSignatureMergeTest' \
            --tests 'com.massimotter.weave.backend.matrix.MatrixE2eeStateServiceSyncSnapshotTest' \
            --tests 'com.massimotter.weave.backend.service.files.WeaveNativeFilesAdapterTest' \
            --tests 'com.massimotter.weave.backend.schema.*'
      - name: PostgreSQL schema-authority qualification
        run: |
          set -euo pipefail
          ./gradlew :server:postgresJpaTest \
            --tests 'com.massimotter.weave.backend.schema.SchemaAuthorityInitializerPostgresTest'
      - name: Migration authority invariants
        run: |
          set -euo pipefail
          test -s server/src/main/resources/db/migration/V1__native_schema_baseline.sql
          test -s server/src/main/resources/db/migration/V2__normalize_native_calendar_chat_state.sql
          test -s server/src/main/resources/db/migration/V3__complete_native_provider_authority.sql
          test -s server/src/main/resources/db/migration/V4__relax_legacy_calendar_timezone_projection.sql
          test -s server/src/main/resources/db/migration/V5__matrix_shared_user_change_journal.sql

          ! grep -R --line-number 'public\.' server/src/main/resources/db/migration

          # Production schema authority must remain Flyway-only and fail closed.
          ! grep -R --line-number -E 'baselineOnMigrate\(true\)|cleanDisabled\(false\)' server/src/main/java
          ! grep -R --line-number -E 'ddl-auto[=:][[:space:]]*(update|create|create-drop)' \
            server/src/main/resources/application.yml \
            server/src/main/resources/application-*.yml \
            --exclude='application-dev-h2.yml'
          grep -q 'ddl-auto:[[:space:]]*validate' server/src/main/resources/application.yml server/src/main/resources/application-*.yml || true

          # The historical V1 snapshot table is allowed only as migration history;
          # V3 must remove it and no current Java persistence authority may reference it.
          grep -q 'drop table if exists weave_matrix_e2ee_snapshots' \
            server/src/main/resources/db/migration/V3__complete_native_provider_authority.sql
          ! grep -R --line-number -E 'MatrixE2eeSnapshot(Store|JpaEntity|JpaRepository)' \
            server/src/main weave-persistence-jpa/src/main
