name: Physical iPhone Human Test
run-name: Physical iPhone Human Test ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact deployed dogfood lane commit"
        required: true
        type: string
      deployment_run_id:
        description: "Exact successful Test Stack Deploy run ID"
        required: true
        type: string
      ios_run_id:
        description: "Exact successful iOS Dogfood run ID for the installed build"
        required: true
        type: string
      protocol_json_base64:
        description: "Base64-encoded support-safe human submission; never include identity or credential values"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: physical-iphone-human-test-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  validate-human-protocol:
    name: Bind tester-confirmed protocol to immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ios-dogfood
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      IOS_RUN_ID: ${{ inputs.ios_run_id }}
      PROTOCOL_JSON_BASE64: ${{ inputs.protocol_json_base64 }}
    steps:
      - name: Validate bounded inputs
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$IOS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$PROTOCOL_JSON_BASE64" ]]

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.candidate_sha }}
          path: weave
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Verify exact delivery runs
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: weave
        run: |
          set -euo pipefail
          verify_run() {
            local run_id="$1" expected_name="$2" expected_path="$3"
            local payload
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r .name <<<"$payload")" == "$expected_name" && \
               "$(jq -r .path <<<"$payload")" == "$expected_path" && \
               "$(jq -r .conclusion <<<"$payload")" == success ]] || {
              echo "::error::Run ${run_id} is not the required successful ${expected_name} workflow." >&2
              exit 1
            }
          }
          verify_run "$DEPLOYMENT_RUN_ID" "Test Stack Deploy" ".github/workflows/test-stack-deploy.yml"
          verify_run "$IOS_RUN_ID" "iOS Dogfood" ".github/workflows/ios-dogfood.yml"

      - name: Download exact deployment and distribution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: weave
        run: |
          set -euo pipefail
          install -d -m 700 build/evidence/deployment build/evidence/ios build/evidence/physical
          gh run download "$DEPLOYMENT_RUN_ID" \
            --name weave-test-stack-evidence \
            --dir build/evidence/deployment
          gh run download "$IOS_RUN_ID" --dir build/evidence/ios
          test -s build/evidence/deployment/test-stack-manifest.json
          test -s build/evidence/deployment/dogfood-deployment-evidence.json
          mapfile -t distributions < <(
            find build/evidence/ios -name ios-dogfood-distribution.json -type f -print
          )
          [[ "${#distributions[@]}" -eq 1 ]] || {
            echo "::error::The selected iOS run must contain exactly one distribution evidence document." >&2
            exit 1
          }
          cp -- "${distributions[0]}" build/evidence/ios-dogfood-distribution.json

      - name: Bind the human submission
        working-directory: weave
        run: |
          set -euo pipefail
          manifest=build/evidence/deployment/test-stack-manifest.json
          deployment=build/evidence/deployment/dogfood-deployment-evidence.json
          distribution=build/evidence/ios-dogfood-distribution.json
          source_candidate="$(jq -er .sourceCandidateCommit "$manifest")"
          spec_commit="$(jq -er .specificationCommit "$manifest")"
          manifest_digest="$(jq -er .candidateManifestDigest "$manifest")"
          deployment_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID"
          distribution_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$IOS_RUN_ID"
          [[ "$(jq -r .laneCandidateCommit "$manifest")" == "$CANDIDATE_SHA" && \
             "$(jq -r .candidateCommit "$deployment")" == "$CANDIDATE_SHA" && \
             "$(jq -r .sourceCandidateCommit "$deployment")" == "$source_candidate" && \
             "$(jq -r .candidateManifestDigest "$deployment")" == "$manifest_digest" && \
             "$(jq -r .runUrl "$deployment")" == "$deployment_url" ]] || {
            echo "::error::Deployment evidence is not one exact manifest-bound candidate." >&2
            exit 1
          }
          [[ "$(jq -r .laneCandidateCommit "$distribution")" == "$CANDIDATE_SHA" && \
             "$(jq -r .sourceCandidateCommit "$distribution")" == "$source_candidate" && \
             "$(jq -r .candidateManifestDigest "$distribution")" == "$manifest_digest" && \
             "$(jq -r .deploymentRunId "$distribution")" == "$DEPLOYMENT_RUN_ID" && \
             "$(jq -r .deploymentRunUrl "$distribution")" == "$deployment_url" && \
             "$(jq -r .runUrl "$distribution")" == "$distribution_url" && \
             "$(jq -r .liveE2eRunUrl "$distribution")" == "$(jq -r .evidence.liveE2eRunUrl "$manifest")" ]] || {
            echo "::error::Distribution evidence is not bound to the selected deployment and live run." >&2
            exit 1
          }
          [[ "$(jq -er .specCorpus.gitCommit specs/weave-specs.lock.json)" == "$spec_commit" ]] || {
            echo "::error::Candidate source does not pin the deployed specification commit." >&2
            exit 1
          }
          printf '%s' "$PROTOCOL_JSON_BASE64" | base64 --decode \
            > build/evidence/physical/human-submission.json
          python3 tools/physical_iphone_human_evidence.py \
            --submission build/evidence/physical/human-submission.json \
            --distribution-evidence "$distribution" \
            --candidate-commit "$CANDIDATE_SHA" \
            --source-candidate-commit "$source_candidate" \
            --spec-commit "$spec_commit" \
            --candidate-manifest-digest "$manifest_digest" \
            --deployment-run-id "$DEPLOYMENT_RUN_ID" \
            --distribution-run-id "$IOS_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output build/evidence/physical/physical-iphone-human-evidence.json \
            --require-passed
          python3 tools/human_testing_automated_evidence.py scan \
            --path build/evidence/physical/physical-iphone-human-evidence.json

      - name: Upload exact support-safe physical evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: physical-iphone-human-evidence-${{ inputs.candidate_sha }}
          path: weave/build/evidence/physical/physical-iphone-human-evidence.json
          if-no-files-found: error
          retention-days: 90
