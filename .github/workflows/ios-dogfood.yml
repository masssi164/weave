name: Prepare Human Test
run-name: Prepare Human Test ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact dogfood commit with a successful Full Compose E2E run
        required: true
        type: string
      bootstrap_owner:
        description: Create or resend the first owner invitation in the empty dogfood realm
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  prepare-human-test:
    name: Deploy, invite, and update physical iPhone
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 90
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOGFOOD_COMMIT: ${{ inputs.candidate_sha }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_DOGFOOD_REVIEWED_ENV_FILE }}
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/weave-specs
      WEAVE_IOS_DEVICE_ID: ${{ secrets.WEAVE_IOS_DEVICE_ID }}
      WEAVE_DOGFOOD_OWNER_EMAIL: ${{ secrets.WEAVE_DOGFOOD_MEMBER_EMAIL }}
      WEAVE_DOGFOOD_OWNER_DISPLAY_NAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME }}
      WEAVE_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
      WEAVE_IOS_BUILD_NUMBER: ${{ github.run_number }}
      WEAVE_CANDIDATE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WEAVE_IOS_RESET_MODE: update_in_place
      WEAVE_IOS_INSTALL_TRANSPORT: wifi
      WEAVE_IOS_LOCAL_CA_TRUST_STATUS: trusted
      WEAVE_DOGFOOD_EVIDENCE_DIR: ${{ github.workspace }}/weave/build/evidence/prepare-human-test

    steps:
      - name: Verify bounded request
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]]
          [[ "$DOGFOOD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WEAVE_ENV_FILE:-}" == /* && -f "$WEAVE_ENV_FILE" && ! -L "$WEAVE_ENV_FILE" ]]
          : "${WEAVE_IOS_DEVICE_ID:?Configure the paired physical iPhone device identifier}"

      - name: Check out exact dogfood commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOGFOOD_COMMIT }}
          path: weave
          fetch-depth: 0

      - name: Verify current protected dogfood candidate
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse HEAD)" == "$DOGFOOD_COMMIT" ]]
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]

      - name: Verify successful Full Compose E2E for the exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: weave
        run: |
          set -euo pipefail
          e2e_run_id="$(python3 tools/verify_main_promotion_evidence.py \
            --repository "$GITHUB_REPOSITORY" --candidate-sha "$DOGFOOD_COMMIT" \
            --qualification-only)"
          read -r e2e_run_id e2e_run_attempt <<< "$e2e_run_id"
          echo "FULL_COMPOSE_E2E_RUN_ATTEMPT=$e2e_run_attempt" >> "$GITHUB_ENV"
          echo "FULL_COMPOSE_E2E_RUN_ID=$e2e_run_id" >> "$GITHUB_ENV"

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          commit="$(jq -er '.specCorpus.gitCommit | select(test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify capacity and Compose runtime
        working-directory: weave
        run: >-
          python3 tools/runner_capacity_preflight.py
          --path .
          --minimum-free-gib 20
          --require-docker

      - name: Verify physical preparation toolchain
        working-directory: weave
        run: |
          set -euo pipefail
          FLUTTER_BIN="${FLUTTER_BIN:-${HOME}/flutter/bin/flutter}"
          [[ -x "$FLUTTER_BIN" ]] || FLUTTER_BIN="$(command -v flutter || true)"
          [[ -n "$FLUTTER_BIN" && -x "$FLUTTER_BIN" ]]
          export FLUTTER_BIN
          flutter_directory="$(dirname "$FLUTTER_BIN")"
          PATH="$flutter_directory:$PATH"
          export PATH
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("client/tool").resolve()))
          from run_ios_simulator_product_acceptance import inspect_toolchain, run
          if Path(shutil.which("flutter") or "").resolve() != Path(os.environ["FLUTTER_BIN"]).resolve():
              raise SystemExit("Toolchain inspection must use the selected physical Flutter executable")
          metadata = inspect_toolchain()
          sdk = run(["xcrun", "--sdk", "iphoneos", "--show-sdk-version"]).strip()
          if sdk != metadata["iosSimulatorSdkVersion"]:
              raise SystemExit("Unsupported physical iPhone SDK for the pinned Xcode toolchain")
          metadata["iosDeviceSdkVersion"] = sdk
          rustup_directory = str(Path(shutil.which("rustup")).resolve().parent)
          with Path(os.environ["GITHUB_PATH"]).open("a") as output:
              output.write(rustup_directory + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write("PHYSICAL_TOOLCHAIN_JSON=" + json.dumps(metadata, separators=(",", ":")) + "\n")
              output.write("FLUTTER_BIN=" + os.environ["FLUTTER_BIN"] + "\n")
              output.write("RUSTUP_TOOLCHAIN=" + metadata["rustToolchain"] + "\n")
          PY

      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: weave/admin-console/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Start dogfood twice and prove TLS identity is stable
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]
          ./gradlew --no-daemon dogfoodUp
          python3 tools/dogfood_cert_persistence_smoke.py \
            --cert-dir "$(python3 tools/dogfood_handoff_bundle.py --print-context-json | python3 -c 'import json,sys; print(json.load(sys.stdin)["tlsRoot"])')" \
            --recreate-command "./gradlew --no-daemon dogfoodUp" \
            --output build/evidence/prepare-human-test/tls-persistence.json

      - name: Create first owner invitation in private Mailpit
        if: ${{ inputs.bootstrap_owner }}
        working-directory: weave
        env:
          REQUEST_FILE: ${{ runner.temp }}/dogfood-owner-bootstrap-request.json
          EVIDENCE_FILE: ${{ github.workspace }}/weave/build/evidence/prepare-human-test/owner-bootstrap.json
        run: |
          set -euo pipefail
          : "${WEAVE_DOGFOOD_OWNER_EMAIL:?Configure the dogfood owner email}"
          : "${WEAVE_DOGFOOD_OWNER_DISPLAY_NAME:?Configure the dogfood owner display name}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          email = os.environ["WEAVE_DOGFOOD_OWNER_EMAIL"].strip().lower()
          request = {
              "displayName": os.environ["WEAVE_DOGFOOD_OWNER_DISPLAY_NAME"].strip(),
              "email": email,
              "idempotencyKey": "owner-bootstrap-" + hashlib.sha256(email.encode()).hexdigest(),
          }
          path = Path(os.environ["REQUEST_FILE"])
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
              json.dump(request, stream, sort_keys=True)
              stream.write("\n")
          PY
          infra/weave-workspace/compose.sh dogfood bootstrap-owner \
            --request-file "$REQUEST_FILE" \
            --evidence-file "$EVIDENCE_FILE"
          rm -f -- "$REQUEST_FILE"
          jq -e '.mailMessageMatched == true and .bootstrapAuthorityAbsent == true and .supportSafe == true and .tokenAbsent == true' "$EVIDENCE_FILE" >/dev/null

      - name: Build, sign, install in place, and launch on physical iPhone
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]
          tools/dogfood_iphone_entry.sh \
            --run \
            --device-id "$WEAVE_IOS_DEVICE_ID" \
            --build-mode profile \
            --reset-mode update_in_place \
            --transport wifi \
            --local-ca-trust trusted \
            --run-id "human-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --handoff-ref "dogfood-${DOGFOOD_COMMIT}" \
            --evidence-dir "$WEAVE_DOGFOOD_EVIDENCE_DIR"

      - name: Record exact physical preparation
        working-directory: weave
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["DOGFOOD_COMMIT"]:
              raise SystemExit("Physical preparation source mismatch")
          spec = json.loads(Path("specs/weave-specs.lock.json").read_text())["specCorpus"]["gitCommit"]
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          output = Path("build/evidence/prepare-human-test/preparation-result.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              "schemaVersion": "weave.hil-preparation/v1", "candidateCommit": sha,
              "sourceTree": tree, "specificationCommit": spec,
              "qualificationRunId": int(os.environ["FULL_COMPOSE_E2E_RUN_ID"]),
              "qualificationRunAttempt": int(os.environ["FULL_COMPOSE_E2E_RUN_ATTEMPT"]),
              "toolchain": json.loads(os.environ["PHYSICAL_TOOLCHAIN_JSON"]),
              "status": "passed", "install": "update_in_place",
              "supportSafe": True, "containsSecretValues": False,
          }, indent=2) + "\n")
          PY

      - name: Summarize tester handoff
        working-directory: weave
        run: |
          set -euo pipefail
          mailpit_url="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('infra/weave-workspace/scripts').resolve()))
          from compose_env import load_context
          print(load_context('dogfood', Path('infra/weave-workspace').resolve()).env['WEAVE_MAILPIT_URL'])
          PY
          )"
          {
            echo "## Human test is ready"
            echo
            echo "- Compose, macOS and iOS qualification: passed for ${DOGFOOD_COMMIT} (run ${FULL_COMPOSE_E2E_RUN_ID})"
            echo "- Dogfood Compose: running"
            echo "- iPhone: updated in place with the development-signed build"
            echo "- Invitation inbox: ${mailpit_url}"
            echo "- Delivery path: direct development Compose and in-place signing"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PREPARE_HUMAN_TEST_RESULT status=passed commit=${DOGFOOD_COMMIT} install=update_in_place"

      - name: Remove private owner request after failure
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/dogfood-owner-bootstrap-request.json"

      - name: Upload support-safe preparation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: prepare-human-test-${{ env.DOGFOOD_COMMIT }}-attempt-${{ github.run_attempt }}
          path: weave/build/evidence/prepare-human-test
          if-no-files-found: error
          retention-days: 14
