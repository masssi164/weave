name: Prepare Human Test
run-name: Prepare Human Test ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact dogfood commit with a successful Full Compose E2E run
        required: true
        type: string
      bootstrap_owner:
        description: Create or resend the first owner invitation in the empty dogfood realm
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  prepare-human-test:
    name: Install qualified artifact and prepare physical iPhone
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 90
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOGFOOD_COMMIT: ${{ inputs.candidate_sha }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_DOGFOOD_REVIEWED_ENV_FILE }}
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/weave-specs
      WEAVE_IOS_DEVICE_ID: ${{ secrets.WEAVE_IOS_DEVICE_ID }}
      WEAVE_DOGFOOD_OWNER_EMAIL: ${{ secrets.WEAVE_DOGFOOD_MEMBER_EMAIL }}
      WEAVE_DOGFOOD_OWNER_DISPLAY_NAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME }}
      WEAVE_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
      WEAVE_CANDIDATE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WEAVE_IOS_RESET_MODE: update_in_place
      WEAVE_IOS_INSTALL_TRANSPORT: wifi
      WEAVE_IOS_LOCAL_CA_TRUST_STATUS: trusted
      WEAVE_DOGFOOD_EVIDENCE_DIR: ${{ github.workspace }}/weave/build/evidence/prepare-human-test

    steps:
      - name: Verify bounded request
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]]
          [[ "$DOGFOOD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WEAVE_ENV_FILE:-}" == /* && -f "$WEAVE_ENV_FILE" && ! -L "$WEAVE_ENV_FILE" ]]
          : "${WEAVE_IOS_DEVICE_ID:?Configure the paired physical iPhone device identifier}"

      - name: Initialize hosted artifact paths
        run: |
          set -euo pipefail
          [[ "${RUNNER_TEMP:-}" == /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]]
          [[ "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]
          printf 'WEAVE_BUILD_ARTIFACT_ROOT=%s/weave-physical-artifacts-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'WEAVE_CANDIDATE_COMPOSITION=%s/weave-physical-composition-%s-%s.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out exact dogfood commit
        id: exact_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOGFOOD_COMMIT }}
          path: weave
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate private candidate registry for this run
        working-directory: weave
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 tools/runtime_registry_auth.py setup

      - name: Initialize private physical diagnostics
        working-directory: weave
        run: |
          umask 077
          python3 - <<'PYPRIVATE'
          import os
          from pathlib import Path
          directory = Path("build/evidence/prepare-human-test")
          for path in (directory, *directory.parents):
              if path.is_symlink():
                  raise SystemExit("Physical diagnostic directory must not be a symlink")
          directory.mkdir(mode=0o700, parents=True, exist_ok=True)
          if directory.stat().st_uid != os.getuid():
              raise SystemExit("Physical diagnostic directory owner mismatch")
          directory.chmod(0o700)
          PYPRIVATE

      - name: Verify current protected dogfood candidate
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse HEAD)" == "$DOGFOOD_COMMIT" ]]
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]

      - name: Verify successful Full Compose E2E for the exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: weave
        run: |
          set -euo pipefail
          e2e_run_id="$(python3 tools/verify_main_promotion_evidence.py \
            --repository "$GITHUB_REPOSITORY" --candidate-sha "$DOGFOOD_COMMIT" \
            --qualification-only)"
          read -r e2e_run_id e2e_run_attempt <<< "$e2e_run_id"
          echo "FULL_COMPOSE_E2E_RUN_ATTEMPT=$e2e_run_attempt" >> "$GITHUB_ENV"
          echo "FULL_COMPOSE_E2E_RUN_ID=$e2e_run_id" >> "$GITHUB_ENV"

      - name: Release retired verified runtime images before capacity check
        working-directory: weave
        run: python3 tools/artifact_runtime_storage.py prune

      - name: Verify capacity before artifact consumption
        working-directory: weave
        run: >-
          python3 tools/runner_capacity_preflight.py
          --path .
          --minimum-free-gib 20
          --require-docker

      - name: Consume the qualified runtime and iPhone artifacts
        working-directory: weave
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/artifact_consumers.py fetch-composition \
            --qualified --candidate "$DOGFOOD_COMMIT" --run-id "$FULL_COMPOSE_E2E_RUN_ID" \
            --run-attempt "$FULL_COMPOSE_E2E_RUN_ATTEMPT" --output "$WEAVE_CANDIDATE_COMPOSITION"
          python3 tools/build_artifacts.py consume --composition "$WEAVE_CANDIDATE_COMPOSITION" \
            --components runtime-linux-amd64,ios-device --directory "$WEAVE_BUILD_ARTIFACT_ROOT"

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          commit="$(jq -er '.specCorpus.gitCommit | select(test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Start dogfood twice and prove TLS identity is stable
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]
          ./gradlew --no-daemon dogfoodUp
          python3 tools/dogfood_cert_persistence_smoke.py \
            --cert-dir "$(python3 tools/dogfood_handoff_bundle.py --print-context-json | python3 -c 'import json,sys; print(json.load(sys.stdin)["tlsRoot"])')" \
            --recreate-command "./gradlew --no-daemon dogfoodUp" \
            --output build/evidence/prepare-human-test/tls-persistence.json

      - name: Create first owner invitation in private Mailpit
        if: ${{ inputs.bootstrap_owner }}
        working-directory: weave
        env:
          REQUEST_FILE: ${{ runner.temp }}/dogfood-owner-bootstrap-request.json
          EVIDENCE_FILE: ${{ github.workspace }}/weave/build/evidence/prepare-human-test/owner-bootstrap.json
        run: |
          umask 077
          set -euo pipefail
          : "${WEAVE_DOGFOOD_OWNER_EMAIL:?Configure the dogfood owner email}"
          : "${WEAVE_DOGFOOD_OWNER_DISPLAY_NAME:?Configure the dogfood owner display name}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          email = os.environ["WEAVE_DOGFOOD_OWNER_EMAIL"].strip().lower()
          request = {
              "displayName": os.environ["WEAVE_DOGFOOD_OWNER_DISPLAY_NAME"].strip(),
              "email": email,
              "idempotencyKey": "owner-bootstrap-" + hashlib.sha256(email.encode()).hexdigest(),
          }
          path = Path(os.environ["REQUEST_FILE"])
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
              json.dump(request, stream, sort_keys=True)
              stream.write("\n")
          PY
          infra/weave-workspace/compose.sh dogfood bootstrap-owner \
            --request-file "$REQUEST_FILE" \
            --evidence-file "$EVIDENCE_FILE"
          rm -f -- "$REQUEST_FILE"
          jq -e '.mailMessageMatched == true and .bootstrapAuthorityAbsent == true and .supportSafe == true and .tokenAbsent == true' "$EVIDENCE_FILE" >/dev/null

      - name: Establish and verify current owner default Space access
        working-directory: weave
        run: |
          umask 077
          set -euo pipefail
          infra/weave-workspace/compose.sh dogfood bootstrap-space \
            --evidence-file "$WEAVE_DOGFOOD_EVIDENCE_DIR/owner-space.json"

      - name: Sign the hosted artifact, install in place, and observe ordinary startup
        working-directory: weave
        run: |
          umask 077
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]
          python3 tools/prepare_iphone_artifact.py \
            --candidate "$DOGFOOD_COMMIT" --device-id "$WEAVE_IOS_DEVICE_ID" \
            --qualification-run-id "$FULL_COMPOSE_E2E_RUN_ID" \
            --qualification-run-attempt "$FULL_COMPOSE_E2E_RUN_ATTEMPT" \
            --output "$WEAVE_DOGFOOD_EVIDENCE_DIR/preparation-result.json"

      - name: Bind the prepared owner Space to the installed artifact
        working-directory: weave
        run: |
          python3 - <<'PYRECORD'
          import json, os
          from pathlib import Path
          from tools.verify_main_promotion_evidence import owner_workspace_passed, preparation_passed
          output = Path("build/evidence/prepare-human-test/preparation-result.json")
          receipt = json.loads(output.read_text())
          workspace = json.loads(Path("build/evidence/prepare-human-test/owner-space.json").read_text())
          sha, tree, spec = (receipt[key] for key in ("candidateCommit", "sourceTree", "specificationCommit"))
          if not owner_workspace_passed(workspace, sha, tree, spec):
              raise SystemExit("Physical preparation requires current owner Space access")
          receipt["ownerWorkspace"] = workspace
          if not preparation_passed(receipt, sha, tree, spec,
                  int(os.environ["FULL_COMPOSE_E2E_RUN_ID"]), int(os.environ["FULL_COMPOSE_E2E_RUN_ATTEMPT"])):
              raise SystemExit("Installed artifact and ordinary startup do not match the qualified candidate")
          output.write_text(json.dumps(receipt, indent=2) + "\n")
          PYRECORD

      - name: Summarize tester handoff
        working-directory: weave
        run: |
          set -euo pipefail
          mailpit_url="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('infra/weave-workspace/scripts').resolve()))
          from compose_env import load_context
          print(load_context('dogfood', Path('infra/weave-workspace').resolve()).env['WEAVE_MAILPIT_URL'])
          PY
          )"
          {
            echo "## Human test is ready"
            echo
            echo "- Two ordinary iOS members: collaboration passed for ${DOGFOOD_COMMIT} (run ${FULL_COMPOSE_E2E_RUN_ID})"
            echo "- Dogfood Compose: running"
            echo "- Default Space: current owner access verified; temporary setup authority removed"
            echo "- iPhone: hosted artifact signed locally, updated in place, ordinary startup observed"
            echo "- Invitation inbox: ${mailpit_url}"
            echo "- Your test: normal sign-in if needed, then Chat, Files, Calendar and VoiceOver; owner acceptance is pending"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PREPARE_HUMAN_TEST_RESULT status=passed commit=${DOGFOOD_COMMIT} install=update_in_place"

      - name: Remove private owner request after failure
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/dogfood-owner-bootstrap-request.json"

      - name: Release retired verified runtime images after preparation
        if: always() && steps.exact_source.outcome == 'success'
        working-directory: weave
        run: python3 tools/artifact_runtime_storage.py prune

      - name: Remove run-scoped registry credentials
        if: always() && steps.exact_source.outcome == 'success'
        working-directory: weave
        run: python3 tools/runtime_registry_auth.py cleanup

      - name: Upload support-safe preparation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: prepare-human-test-${{ env.DOGFOOD_COMMIT }}-attempt-${{ github.run_attempt }}
          path: |
            weave/build/evidence/prepare-human-test/preparation-result.json
            weave/build/evidence/prepare-human-test/tls-persistence.json
            weave/build/evidence/prepare-human-test/owner-space.json
          if-no-files-found: error
          retention-days: 14
