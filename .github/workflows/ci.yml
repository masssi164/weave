name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle-ci:
    name: Gradle CI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Weave
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Run native-core CI
        run: ./gradlew ci --stacktrace
      - name: Upload sanitized CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weave-core-ci-evidence
          path: build/evidence
          if-no-files-found: warn

  release-notes-label-check:
    # Compatibility status context retained while branch protection still requires
    # this historical name. Native-core development has no release-signoff gate.
    name: Release Notes Label Check
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Native-core development does not require release-note confirmation.'
