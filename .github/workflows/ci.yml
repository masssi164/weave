name: Core CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'core' }}
  cancel-in-progress: true

jobs:
  core_architecture:
    name: Core architecture
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace coreArchitectureCi

  canonical_data:
    name: Canonical data
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace canonicalDataCi

  postgres_persistence:
    name: PostgreSQL persistence
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace postgresPersistenceCi

  protocol_foundation:
    name: Server protocol foundation
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified source-built S3 test fixture
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(infra/weave-workspace/scripts/build_runtime_state_image.sh)"
          docker tag "$image_id" weave-runtime-state:ci-s3
          echo 'WEAVE_MINIO_TEST_IMAGE=weave-runtime-state:ci-s3' >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon --stacktrace protocolFacadeFoundationCi

  mcp_foundation:
    name: MCP foundation
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace mcpFoundationCi

  core_docs:
    name: Core documentation
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python3 tools/core_docs_check.py
      - run: python3 tools/readme_release_notes_test.py

  generated_api:
    name: Generated API consumers
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Resolve locked consumer dependencies
        run: |
          npm ci --prefix admin-console
          cd client
          flutter pub get --enforce-lockfile
      - name: Check code-first exports and generated consumers
        run: ./gradlew --no-daemon --stacktrace generatedApiCi
      - name: Preserve schema/export diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: generated-api-diagnostics-${{ github.sha }}
          path: |
            build/openapi/
            server/build/reports/tests/openApiContractExport/
          if-no-files-found: ignore
          retention-days: 7

  gradle_ci:
    name: Gradle CI
    if: always() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled'))
    needs:
      - core_architecture
      - canonical_data
      - postgres_persistence
      - protocol_foundation
      - mcp_foundation
      - core_docs
      - generated_api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every real core foundation job
        run: |
          for result in \
            '${{ needs.core_architecture.result }}' \
            '${{ needs.canonical_data.result }}' \
            '${{ needs.postgres_persistence.result }}' \
            '${{ needs.protocol_foundation.result }}' \
            '${{ needs.mcp_foundation.result }}' \
            '${{ needs.core_docs.result }}' \
            '${{ needs.generated_api.result }}'; do
            if [ "$result" != 'success' ]; then
              echo "A required core foundation job finished as: $result" >&2
              exit 1
            fi
          done

  release_notes_label_check:
    name: Release Notes Label Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate temporary release-notes label context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
          PR_LABELS_JSON="$labels_json" ./gradlew --no-daemon releaseNotesLabelCheck
