name: Core CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'core' }}
  cancel-in-progress: true

jobs:
  core_architecture:
    name: Core architecture
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace coreArchitectureCi

  canonical_data:
    name: Canonical data
    needs: core_architecture
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace canonicalDataCi

  postgres_persistence:
    name: PostgreSQL persistence
    needs: canonical_data
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace postgresPersistenceCi

  protocol_foundation:
    name: Server protocol foundation
    needs: postgres_persistence
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified source-built S3 test fixture
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(infra/weave-workspace/scripts/build_runtime_state_image.sh)"
          docker tag "$image_id" weave-runtime-state:ci-s3
          echo 'WEAVE_MINIO_TEST_IMAGE=weave-runtime-state:ci-s3' >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon --stacktrace protocolFacadeFoundationCi

  mcp_foundation:
    name: MCP foundation
    needs: protocol_foundation
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon --stacktrace mcpFoundationCi

  core_docs:
    name: Core documentation
    needs: mcp_foundation
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python3 tools/core_docs_check.py
      - run: python3 tools/readme_release_notes_test.py
      - run: python3 -m unittest tools.test_verify_main_promotion_evidence -v

  api_contract:
    name: API contract freshness
    needs: core_docs
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify code-first API exports
        run: ./gradlew --no-daemon --stacktrace generatedApiContractCi
      - name: Preserve schema/export diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: api-contract-diagnostics-${{ github.sha }}
          path: |
            build/openapi/
            server/build/reports/tests/openApiContractExport/
          if-no-files-found: ignore
          retention-days: 7

  api_impact:
    name: API consumer impact
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      consumers: ${{ steps.impact.outputs.consumers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Resolve contract/generator impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *)
              echo "consumers=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "consumers=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$base"
          if git diff --quiet "$base" HEAD --             contracts/openapi             tools/generate_admin_api_client.py             tools/generate_client_user_api.py             tools/openapi_codegen_test.py             tools/normalize_openapi_contracts.py             gradle/tasks/verification.gradle             gradle/libs.versions.toml; then
            echo "consumers=false" >> "$GITHUB_OUTPUT"
            echo "Generated API consumer inputs are unchanged."
          else
            echo "consumers=true" >> "$GITHUB_OUTPUT"
            echo "Generated API consumer inputs changed."
          fi

  generated_api:
    name: Generated API consumers
    needs: [api_contract, api_impact]
    if: needs.api_contract.result == 'success' && needs.api_impact.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Resolve locked Flutter dependencies
        run: |
          cd client
          flutter pub get --enforce-lockfile
      - name: Verify only generated consumers
        run: ./gradlew --no-daemon --stacktrace generatedApiConsumerCi

  gradle_ci:
    # A label-only run must not publish a skipped result under the protected check name.
    name: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'Label-only aggregate (skipped)' || 'Gradle CI' }}
    if: always() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled'))
    needs:
      - core_architecture
      - canonical_data
      - postgres_persistence
      - protocol_foundation
      - mcp_foundation
      - core_docs
      - api_contract
      - api_impact
      - generated_api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every real core foundation job
        run: |
          for result in \
            '${{ needs.core_architecture.result }}' \
            '${{ needs.canonical_data.result }}' \
            '${{ needs.postgres_persistence.result }}' \
            '${{ needs.protocol_foundation.result }}' \
            '${{ needs.mcp_foundation.result }}' \
            '${{ needs.core_docs.result }}' \
            '${{ needs.api_contract.result }}' \
            '${{ needs.api_impact.result }}'; do
            if [ "$result" != 'success' ]; then
              echo "A required core foundation job finished as: $result" >&2
              exit 1
            fi
          done
          consumer_result='${{ needs.generated_api.result }}'
          consumer_impact='${{ needs.api_impact.outputs.consumers }}'
          if [[ "$consumer_impact" == 'true' && "$consumer_result" != 'success' ]]; then
            echo "Generated API consumers were impacted but finished as: $consumer_result" >&2
            exit 1
          fi
          if [[ "$consumer_impact" != 'true' && "$consumer_result" != 'skipped' ]]; then
            echo "Generated API consumers were not impacted but unexpectedly finished as: $consumer_result" >&2
            exit 1
          fi

  release_notes_label_check:
    name: Release Notes Label Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate temporary release-notes label context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
          PR_LABELS_JSON="$labels_json" ./gradlew --no-daemon releaseNotesLabelCheck
