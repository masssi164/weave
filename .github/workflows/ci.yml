name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      capture_marketing_screenshots:
        description: "Upload deterministic README/marketing screenshots produced by ./gradlew ci"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pull-requests: read

env:
  WEAVE_DOCS_VENV: build/docs-venv

jobs:
  gradle-ci:
    name: Gradle CI
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave
    steps:
      - name: Check out Weave
        uses: actions/checkout@v5
        with:
          path: weave
      - name: Resolve pinned specification corpus
        id: spec-corpus
        run: echo "commit=$(jq -r '.specCorpus.gitCommit' specs/weave-specs.lock.json)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec-corpus.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: weave/admin-console/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: weave/docs/requirements.txt
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - name: Install pinned dependencies
        run: |
          python -m pip install 'jsonschema[format]==4.23.0' 'PyYAML==6.0.3' 'rfc8785==0.1.4' 'cryptography==46.0.3'
          python -m venv "$WEAVE_DOCS_VENV"
          "$WEAVE_DOCS_VENV/bin/python" -m pip install -r docs/requirements.txt
          npm ci --prefix admin-console
          (cd client && flutter pub get)
      - name: Run root Gradle CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          PR_ACTION: ${{ github.event_name == 'pull_request' && github.event.action || '' }}
          PR_LABELS_JSON: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '' }}
        run: |
          labels_json="$PR_LABELS_JSON"
          if [ -n "$PR_NUMBER" ]; then
            labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
            if [ "$PR_ACTION" = "opened" ] && [ "$labels_json" = "[]" ]; then
              # `gh pr create --label ...` can emit the opened event before the label
              # is visible to the workflow. Give GitHub a short propagation window,
              # then validate the live PR labels instead of the stale event payload.
              for _ in 1 2 3; do
                sleep 10
                labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
                [ "$labels_json" != "[]" ] && break
              done
            fi
          fi
          PR_LABELS_JSON="$labels_json" ./gradlew ci
      - name: Upload sanitized CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-ci-evidence
          path: |
            weave/build/evidence
            weave/build/docs
          if-no-files-found: warn
      - name: Upload marketing screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_marketing_screenshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weave-marketing-screenshots
          path: |
            weave/docs/assets/marketing
            weave/docs/assets/roadmap
          if-no-files-found: error

  release-notes-label-check:
    name: Release Notes Label Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release notes label through Gradle
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
          if [ "$PR_ACTION" = "opened" ] && [ "$labels_json" = "[]" ]; then
            # `gh pr create --label ...` can emit the opened event before the label
            # is visible to the workflow. Give GitHub a short propagation window,
            # then validate the live PR labels instead of the stale event payload.
            for _ in 1 2 3; do
              sleep 10
              labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
              [ "$labels_json" != "[]" ] && break
            done
          fi
          PR_LABELS_JSON="$labels_json" ./gradlew releaseNotesLabelCheck
