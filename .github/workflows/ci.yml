name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      capture_marketing_screenshots:
        description: "Upload deterministic README/marketing screenshots produced by ./gradlew ci"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  WEAVE_DOCS_VENV: build/docs-venv

jobs:
  gradle-ci:
    name: Gradle CI
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - name: Install pinned dependencies
        run: |
          python -m venv "$WEAVE_DOCS_VENV"
          "$WEAVE_DOCS_VENV/bin/python" -m pip install -r docs/requirements.txt
          npm ci --prefix admin-console
          (cd client && flutter pub get)
      - name: Run root Gradle CI
        env:
          PR_LABELS_JSON: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '' }}
        run: ./gradlew ci
      - name: Upload sanitized CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-ci-evidence
          path: |
            build/evidence
            build/docs
          if-no-files-found: warn
      - name: Upload marketing screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_marketing_screenshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weave-marketing-screenshots
          path: |
            docs/assets/marketing
            docs/assets/roadmap
          if-no-files-found: error

  release-notes-label-check:
    name: Release Notes Label Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release notes label through Gradle
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: ./gradlew releaseNotesLabelCheck
