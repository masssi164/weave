name: Existing test-member activation diagnosis
on:
  push:
    branches: [diagnostic/dual-ios-source-20261028]
    paths: [.github/workflows/member-activation-state-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/diagnostic/dual-ios-source-20261028'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      WEAVE_CANDIDATE_COMMIT: 190799c721343a2f21e1b68181f39cb8c87bea6a
      WEAVE_ENV_FILE: ${{ vars.WEAVE_DOGFOOD_REVIEWED_ENV_FILE }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read only activation flags for the two exact retained plan addresses
        working-directory: weave
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          from dogfood_prepare import private_read, ledger_for, load_context, operator_plan
          from compose_runtime import _dogfood_session_lock
          def run(args, data=None):
              r = subprocess.run(args, input=data, capture_output=True, text=True, timeout=20)
              if r.returncode or len(r.stdout)>1024*1024: raise ValueError()
              return r.stdout
          def quote(value):
              if not isinstance(value,str) or len(value)>1000 or '\0' in value: raise ValueError()
              return "'"+value.replace("'","''")+"'"
          stage = 'preflight'
          try:
              assert os.environ.get('RUNNER_NAME') == 'weave-live-mac-mini'
              assert run(['git','rev-parse','HEAD']).strip() == os.environ['WEAVE_CANDIDATE_COMMIT']
              context = load_context('dogfood',Path.cwd()/'infra/weave-workspace',os.environ['WEAVE_ENV_FILE'])
              with _dogfood_session_lock(context):
                  fixture = Path.home()/'.weave/dogfood/functional-smoke-identities.json'
                  ledger = private_read(ledger_for(fixture),65536)
                  plan = operator_plan(ledger['plan'],context)
                  ids = run(['docker','ps','--filter','label=com.docker.compose.project=weave-dogfood',
                      '--filter','label=com.docker.compose.service=postgres','-q','--no-trunc']).splitlines()
                  assert len(ids)==1 and re.fullmatch('[0-9a-f]{64}',ids[0])
                  record = json.loads(run(['docker','inspect',ids[0]]))[0]
                  assert record['Config']['Labels']['com.massimotter.weave.candidate-commit'] == os.environ['WEAVE_CANDIDATE_COMMIT']
                  name = context.env.get('WEAVE_KEYCLOAK_DB_NAME','weave_keycloak')
                  assert re.fullmatch('[A-Za-z_][A-Za-z0-9_]{0,62}',name)
                  stage = 'activation-query'
                  for member in plan['members']:
                      sql = "SELECT coalesce(json_agg(json_build_object('enabled',u.enabled,'emailVerified',u.email_verified,'displayNameMatches',trim(concat(u.first_name,' ',u.last_name))="+quote(member['displayName'])+",'requiredActionCount',(select count(*) from user_required_action a where a.user_id=u.id),'credentialCount',(select count(*) from credential c where c.user_id=u.id),'passwordCredentialCount',(select count(*) from credential c where c.user_id=u.id and c.type='password'))),'[]'::json) FROM user_entity u JOIN realm r ON u.realm_id=r.id WHERE r.name='weave' AND lower(u.email)=lower("+quote(member['email'])+");"
                      rows = json.loads(run(['docker','exec','-i','-e','PGOPTIONS=-c default_transaction_read_only=on',ids[0],
                          'sh','-c','exec psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1"','sh',name],
                          'BEGIN READ ONLY; SET LOCAL statement_timeout=5000; '+sql+' ROLLBACK;'))
                      assert isinstance(rows,list) and len(rows)<=2
                      state=ledger.get('registrationState',{}).get(member['slot'])
                      assert state in {None,'activation-started','email-verification-required','registration-complete'}
                      print(json.dumps({'slot':member['slot'],'registrationState':state,'activation':rows,'readOnly':True,'supportSafe':True},sort_keys=True))
          except Exception:
              print(json.dumps({'status':'blocked','stage':stage,'supportSafe':True}))
              raise SystemExit(1)
          PY
