name: Full Compose E2E
run-name: Full Compose E2E ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [dev, dogfood]
  pull_request:
    branches: [dev, dogfood]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: full-compose-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-compose-e2e:
    name: Full Compose E2E
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 90
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      WEAVE_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WEAVE_IMAGE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WEAVE_TEST_APP_RUN_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      WEAVE_TEST_APP_OUTPUT_ROOT: ${{ github.workspace }}/weave/build/test-app

    steps:
      - name: Verify bounded runner
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]] || {
            echo "::error::Expected ${EXPECTED_RUNNER_NAME}; got ${RUNNER_NAME:-unknown}."
            exit 1
          }

      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.WEAVE_CANDIDATE_COMMIT }}
          path: weave
          fetch-depth: 0

      - name: Verify capacity and Compose runtime
        working-directory: weave
        run: >-
          python3 tools/runner_capacity_preflight.py
          --path .
          --minimum-free-gib 20
          --require-docker

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          commit="$(jq -er '.specCorpus.gitCommit | select(test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: weave/admin-console/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify exact clean checkout
        working-directory: weave
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$WEAVE_CANDIDATE_COMMIT" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Run full isolated product flow
        working-directory: weave
        run: ./gradlew --no-daemon specCorpusConformance testApp

      - name: Upload support-safe E2E evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: full-compose-e2e-${{ env.WEAVE_CANDIDATE_COMMIT }}
          path: weave/build/test-app/**
          if-no-files-found: warn
          retention-days: 14

  deploy-dogfood:
    name: Deploy dogfood with Compose
    needs: full-compose-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/dogfood'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 60
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOGFOOD_COMMIT: ${{ github.sha }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_DOGFOOD_REVIEWED_ENV_FILE }}
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/weave-specs

    steps:
      - name: Verify bounded dogfood deployment
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]]
          [[ "$DOGFOOD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WEAVE_ENV_FILE:-}" == /* && -f "$WEAVE_ENV_FILE" && ! -L "$WEAVE_ENV_FILE" ]]

      - name: Check out exact dogfood commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOGFOOD_COMMIT }}
          path: weave
          fetch-depth: 0

      - name: Verify protected dogfood ancestry
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse HEAD)" == "$DOGFOOD_COMMIT" ]]
          git merge-base --is-ancestor "$DOGFOOD_COMMIT" origin/dogfood

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          commit="$(jq -er '.specCorpus.gitCommit | select(test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify capacity and Compose runtime
        working-directory: weave
        run: >-
          python3 tools/runner_capacity_preflight.py
          --path .
          --minimum-free-gib 20
          --require-docker

      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: weave/admin-console/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and start exact dogfood source
        working-directory: weave
        run: |
          ./gradlew --no-daemon dogfoodUp
          echo "DOGFOOD_COMPOSE_DEPLOY_RESULT status=passed commit=${DOGFOOD_COMMIT}"

      - name: Upload support-safe deployment result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dogfood-compose-${{ env.DOGFOOD_COMMIT }}
          path: weave/build/evidence/dogfood-compose
          if-no-files-found: warn
          retention-days: 14
