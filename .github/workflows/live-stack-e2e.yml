name: Live Stack E2E

on:
  push:
    branches:
      - dogfood
  pull_request:
    branches:
      - dogfood
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      enable_isolated_runner:
        description: "Run only when a disposable runner with fully isolated Docker, state, ports, users, and cleanup is available"
        required: true
        default: false
        type: boolean
      weave_backend_image:
        description: "Backend image to boot inside the infra stack; ghcr.io/* is pulled, other refs are built from CI-built server JAR artifacts"
        required: false
        default: "weave-backend:live-stack-ci"
      weave_mcp_server_image:
        description: "MCP server image built from CI-built weave-mcp-server JAR artifacts; ghcr.io/* is pulled"
        required: false
        default: "weave-mcp-server:live-stack-ci"
  workflow_call:
    inputs:
      enable_isolated_runner:
        type: boolean
        required: false
        default: false
      weave_backend_image:
        type: string
        required: false
        default: "weave-backend:live-stack-ci"
      weave_mcp_server_image:
        type: string
        required: false
        default: "weave-mcp-server:live-stack-ci"

permissions:
  contents: read
  packages: read

concurrency:
  group: weave-disposable-live-stack-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  isolation-gate:
    name: Require isolated disposable runner
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed without isolated runtime approval
        env:
          ENABLE_ISOLATED_RUNNER: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_isolated_runner }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_ISOLATED_RUNNER" != "true" ]]; then
            echo "::error::Destructive Live Stack E2E is disabled until a disposable runner with isolated containers, networks, volumes, state, ports, users, and cleanup is available. It must never run on weave-live-mac-mini." >&2
            exit 1
          fi

  live-stack-e2e:
    name: Bootstrap Stack And Run App E2E
    needs: isolation-gate
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - weave-disposable-live-stack
    timeout-minutes: 75
    env:
      PERSISTENT_DOGFOOD_RUNNER_NAME: weave-live-mac-mini
      WEAVE_BACKEND_IMAGE: ${{ inputs.weave_backend_image || github.event.inputs.weave_backend_image || 'weave-backend:live-stack-ci' }}
      WEAVE_MCP_SERVER_IMAGE: ${{ inputs.weave_mcp_server_image || github.event.inputs.weave_mcp_server_image || 'weave-mcp-server:live-stack-ci' }}
      TF_VAR_db_admin_password: ci-db-admin-password
      TF_VAR_keycloak_admin_password: ci-keycloak-admin-password
      TF_VAR_keycloak_db_password: ci-keycloak-db-password
      TF_VAR_mas_db_password: ci-mas-db-password
      TF_VAR_synapse_db_password: ci-synapse-db-password
      TF_VAR_nextcloud_db_password: ci-nextcloud-db-password
      TF_VAR_nextcloud_admin_password: ci-nextcloud-admin-password
      TF_VAR_matrix_mas_client_secret: ci-matrix-mas-client-secret
      TF_VAR_mas_encryption_secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TF_VAR_mas_matrix_secret: ci-mas-matrix-secret
      TF_VAR_synapse_registration_shared_secret: ci-synapse-registration-shared-secret
      TF_VAR_synapse_macaroon_secret_key: ci-synapse-macaroon-secret-key
      TF_VAR_synapse_form_secret: ci-synapse-form-secret
      TF_VAR_create_test_user: 'false'
      TF_VAR_boards_runtime_enabled: 'true'
      TF_VAR_boards_provider: local-workspace
      TF_VAR_provider_stack_profile: local-live
      TF_VAR_provider_stack_readiness: ready
      TF_VAR_tenant_domain: weave.test
      TF_VAR_proxy_http_host_port: '44080'
      TF_VAR_proxy_host_port: '44443'
      TF_VAR_keycloak_host_port: '48080'
      TF_VAR_mas_host_port: '48082'
      TF_VAR_synapse_host_port: '48008'
      TF_VAR_nextcloud_host_port: '48083'
      TF_VAR_backend_host_port: '48084'
      WEAVE_RUNNER_HYGIENE: 'true'
      WEAVE_REMOVE_VOLUMES: 'true'
      WEAVE_CONFIRM_DESTRUCTIVE_RESET: weave
      WEAVE_E2E_STACK_SCOPE: isolated
      WEAVE_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      WEAVE_CANDIDATE_COMMIT: ${{ github.sha }}
      WEAVE_CANDIDATE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Verify isolated disposable live runner
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          if [[ -z "${RUNNER_NAME:-}" || "${RUNNER_NAME}" == "${PERSISTENT_DOGFOOD_RUNNER_NAME}" ]]; then
            echo "::error::Destructive Live Stack E2E must run on an isolated disposable runner, never ${PERSISTENT_DOGFOOD_RUNNER_NAME}; got ${RUNNER_NAME:-unknown}." >&2
            exit 1
          fi

      - name: Remove stale runner-owned Weave outputs
        run: |
          set -euo pipefail
          checkout_root="${GITHUB_WORKSPACE%/}/weave"
          remove_runner_output() {
            local path="$1"
            case "$path" in
              "$checkout_root"/*|"${RUNNER_TEMP%/}"/weave-live-stack-*)
                rm -rf -- "$path"
                ;;
              *)
                echo "::error::Refusing to remove non-runner-owned path: $path" >&2
                exit 1
                ;;
            esac
          }
          for path in \
            "$checkout_root/.gradle" \
            "$checkout_root/build" \
            "$checkout_root/client/.dart_tool" \
            "$checkout_root/client/build" \
            "$checkout_root/server/build" \
            "$checkout_root/weave-mcp-server/build" \
            "$RUNNER_TEMP/weave-live-stack-acceptance-evidence" \
            "$RUNNER_TEMP/weave-live-stack-e2e.log" \
            "$RUNNER_TEMP/weave-live-stack-docker-config" \
            "$RUNNER_TEMP/weave-live-stack-identities" \
            "$RUNNER_TEMP/weave-live-stack-emergency-reserve" \
            "$RUNNER_TEMP/weave-live-stack-emergency-reserve-released"; do
            remove_runner_output "$path"
          done
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          minimum_kib=$((10 * 1024 * 1024))
          runner_tool_cache="${RUNNER_TOOL_CACHE:-}"
          if [ -z "$runner_tool_cache" ] || [ "$runner_tool_cache" = "/" ] || [[ "$runner_tool_cache" != /* ]]; then
            echo "::error::RUNNER_TOOL_CACHE must name an absolute, non-root dedicated runner tool-cache directory." >&2
            exit 1
          fi
          flutter_tool_cache="${runner_tool_cache%/}/flutter"
          if (( available_kib < minimum_kib )) && [ -d "$flutter_tool_cache" ]; then
            echo "Reclaiming the restorable dedicated-runner Flutter tool cache for live-test headroom."
            rm -rf -- "$flutter_tool_cache"
          fi
          df -h "$RUNNER_TEMP"

      - name: Check out weave
        uses: actions/checkout@v5
        with:
          path: weave

      - name: Prepare acceptance evidence directory
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/weave-live-stack-acceptance-evidence"
          test_log="$RUNNER_TEMP/weave-live-stack-e2e.log"
          mkdir -p "$evidence_dir"
          : > "$test_log"
          echo "WEAVE_ACCEPTANCE_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "WEAVE_ACCEPTANCE_TEST_LOG=$test_log" >> "$GITHUB_ENV"

      - name: Prepare three disposable identity profiles
        working-directory: weave/infra/weave-workspace
        run: |
          set -euo pipefail
          integration_variables="$(
            WEAVE_E2E_OUTPUT_ROOT="$RUNNER_TEMP/weave-live-stack-identities" \
              ./isolated-e2e-identities.sh prepare --run-id "$WEAVE_E2E_RUN_ID"
          )"
          printf '%s\n' "$integration_variables" >> "$GITHUB_ENV"
          printf '%s\n' "$integration_variables" | sed -E 's#=(.*credentials.*)$#=[private-runner-path]#' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Docker auth without macOS Keychain
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_HOST:-}" ] && [ -S "$HOME/.orbstack/run/docker.sock" ]; then
            echo "DOCKER_HOST=unix://$HOME/.orbstack/run/docker.sock" >> "$GITHUB_ENV"
            export DOCKER_HOST="unix://$HOME/.orbstack/run/docker.sock"
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/weave-live-stack-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          auth_b64="$(printf '%s' "${GITHUB_ACTOR}:${GHCR_TOKEN}" | base64 | tr -d '\n')"
          cat > "$DOCKER_CONFIG/config.json" <<EOF
          {"auths":{"ghcr.io":{"auth":"${auth_b64}"}}}
          EOF
          chmod 600 "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          docker --config "$DOCKER_CONFIG" info >/dev/null

      - name: Remove orphaned live-runner Buildx resources
        run: bash weave/tools/cleanup_orphaned_buildx.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify runner disk headroom
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          minimum_kib=$((10 * 1024 * 1024))
          df -h "$RUNNER_TEMP"
          if (( available_kib < minimum_kib )); then
            echo "::error::Live Stack E2E requires at least 10 GiB free after stale-output cleanup and before tool and image setup; only $((available_kib / 1024)) MiB is available." >&2
            echo "Runner-owned tool cache sizes:" >&2
            du -sh "$RUNNER_TOOL_CACHE"/* 2>/dev/null | sort -h >&2 || true
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      - name: Build Java runtime artifacts
        working-directory: weave
        run: ./gradlew --no-daemon --max-workers=1 :server:bootJar :weave-mcp-server:bootJar

      - name: Ensure local Weave hostnames resolve on the runner
        run: |
          set -euo pipefail
          hosts=(weave.test api.weave.test auth.weave.test files.weave.test matrix.weave.test)
          missing=()
          for host in "${hosts[@]}"; do
            if ! dscacheutil -q host -a name "$host" | grep -q 'ip_address:'; then
              missing+=("$host")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            line="127.0.0.1 ${missing[*]}"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              printf '%s\n' "$line" | sudo tee -a /etc/hosts >/dev/null
              sudo dscacheutil -flushcache || true
            else
              echo "::error::Runner cannot resolve required Weave hostnames and passwordless sudo is unavailable. Configure weave.test DNS for this runner or add this fallback /etc/hosts line before rerunning: $line" >&2
              exit 1
            fi
          fi

          for host in "${hosts[@]}"; do
            resolved="$(dscacheutil -q host -a name "$host" || true)"
            printf '%s\n' "$resolved"
            printf '%s\n' "$resolved" | grep -q 'ip_address:' || {
              echo "::error::Runner still cannot resolve $host" >&2
              exit 1
            }
          done

      - name: Clean up stale stack state before bootstrap
        working-directory: weave/infra/weave-workspace
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$WEAVE_E2E_STARTUP_ENV_PATH"
          bash ./teardown.sh

      - name: Prepare backend image
        run: |
          set -euo pipefail
          if [[ "${WEAVE_BACKEND_IMAGE}" == ghcr.io/* ]]; then
            echo "Pulling published backend image for live-stack evidence."
            docker --config "${DOCKER_CONFIG}" pull "${WEAVE_BACKEND_IMAGE}"
          else
            echo "Building backend runtime image from CI-built server JAR artifact."
            docker buildx build --load -t "${WEAVE_BACKEND_IMAGE}" -f weave/server/Dockerfile weave
          fi

      - name: Prepare MCP server image
        run: |
          set -euo pipefail
          if [[ "${WEAVE_MCP_SERVER_IMAGE}" == ghcr.io/* ]]; then
            echo "Pulling published MCP server image for live-stack evidence."
            docker --config "${DOCKER_CONFIG}" pull "${WEAVE_MCP_SERVER_IMAGE}"
          else
            echo "Building MCP server runtime image from CI-built weave-mcp-server JAR artifact."
            docker buildx build --load -t "${WEAVE_MCP_SERVER_IMAGE}" -f weave/weave-mcp-server/Dockerfile weave
          fi

      - name: Release Buildx cache before stack tests
        run: bash weave/tools/cleanup_orphaned_buildx.sh

      - name: Bootstrap local stack
        working-directory: weave/infra/weave-workspace
        env:
          TF_VAR_weave_backend_image: ${{ env.WEAVE_BACKEND_IMAGE }}
          TF_VAR_weave_mcp_server_image: ${{ env.WEAVE_MCP_SERVER_IMAGE }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$WEAVE_E2E_STARTUP_ENV_PATH"
          ./install.sh

      - name: Verify local test hostnames resolve on the runner
        run: |
          set -euo pipefail
          for host in weave.test api.weave.test auth.weave.test files.weave.test matrix.weave.test; do
            dscacheutil -q host -a name "$host" | grep -q 'ip_address:' || {
              echo "Runner cannot resolve $host to loopback" >&2
              exit 1
            }
          done

      - name: Verify stack readiness before Flutter work
        working-directory: weave/infra/weave-workspace
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$WEAVE_E2E_STARTUP_ENV_PATH"
          bash ./operator-check.sh

      - name: Provision real Keycloak identities and verify runtime ReBAC
        working-directory: weave/infra/weave-workspace
        run: |
          set -euo pipefail
          ./isolated-e2e-identities.sh provision --run-id "$WEAVE_E2E_RUN_ID" \
            2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"

      - name: Prove missing-capability expired-token and revoked-session denials
        working-directory: weave
        env:
          WEAVE_E2E_STACK_SCOPE: isolated
        run: |
          set -euo pipefail
          infra/weave-workspace/isolated-e2e-authorization-probes.sh \
            --run-id "$WEAVE_E2E_RUN_ID" \
            --output-root "$WEAVE_E2E_OUTPUT_ROOT" \
            --credentials-env "$WEAVE_E2E_CREDENTIAL_ENV_PATH" \
            --startup-env "$WEAVE_E2E_STARTUP_ENV_PATH" \
            --identity-manifest "$WEAVE_E2E_IDENTITY_MANIFEST_PATH" \
            --stack-bootstrap-env "$WEAVE_E2E_STACK_BOOTSTRAP_ENV" \
            --authorization-evidence "$WEAVE_E2E_AUTHORIZATION_EVIDENCE_PATH" \
            2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
          test -s "$WEAVE_E2E_AUTHORIZATION_EVIDENCE_PATH"
          cp "$WEAVE_E2E_AUTHORIZATION_EVIDENCE_PATH" \
            "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-authorization.json"
          {
            echo "WEAVE_E2E_MISSING_CAPABILITY_VERIFIED=true"
            echo "WEAVE_E2E_EXPIRED_TOKEN_VERIFIED=true"
            echo "WEAVE_E2E_REVOKED_SESSION_VERIFIED=true"
          } >> "$GITHUB_ENV"

      - name: Expose generated local CA to Rust Matrix tests
        run: |
          set -euo pipefail
          CA_FILE="$GITHUB_WORKSPACE/weave/infra/weave-workspace/01-infrastructure/.generated/caddy/certs/weave-local-ca.pem"
          LEAF_FILE="$GITHUB_WORKSPACE/weave/infra/weave-workspace/01-infrastructure/.generated/caddy/certs/weave.test.pem"
          if [ ! -s "$CA_FILE" ]; then
            echo "::error::Weave local CA certificate not found at $CA_FILE"
            exit 1
          fi
          if [ ! -s "$LEAF_FILE" ]; then
            echo "::error::Weave local leaf certificate not found at $LEAF_FILE"
            exit 1
          fi
          openssl verify -CAfile "$CA_FILE" "$LEAF_FILE"
          echo "WEAVE_MATRIX_EXTRA_ROOT_CERTIFICATE_PATH=$CA_FILE" >> "$GITHUB_ENV"
          echo "WEAVE_MATRIX_LIVE_TEST_EXTRA_ROOT_ENABLED=true" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: weave/client
        run: flutter pub get

      - name: Generate l10n
        working-directory: weave/client
        run: flutter gen-l10n

      - name: Boot an isolated iPhone Simulator and trust the local CA
        run: |
          set -euo pipefail
          runtime_id="$(
            xcrun simctl list runtimes -j | jq -r '
              [.runtimes[]
                | select(.isAvailable == true and (.identifier | contains(".iOS-")))]
              | sort_by(.version | split(".") | map(tonumber))
              | last
              | .identifier // empty'
          )"
          device_type="$(
            xcrun simctl list devicetypes -j | jq -r '
              [.devicetypes[] | select(.name | startswith("iPhone"))]
              | first
              | .identifier // empty'
          )"
          [[ -n "$runtime_id" && -n "$device_type" ]] || {
            echo "::error::No available iOS runtime and iPhone device type are installed on the disposable runner." >&2
            exit 1
          }
          simulator_name="Weave E2E ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          simulator_udid="$(xcrun simctl create "$simulator_name" "$device_type" "$runtime_id")"
          [[ "$simulator_udid" =~ ^[0-9A-Fa-f-]{36}$ ]] || {
            echo "::error::The isolated iPhone Simulator could not be created." >&2
            exit 1
          }
          echo "WEAVE_E2E_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          open -g -a Simulator --args -CurrentDeviceUDID "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl keychain "$simulator_udid" add-root-cert "$WEAVE_MATRIX_EXTRA_ROOT_CERTIFICATE_PATH"
          echo "WEAVE_INTEGRATION_TEST_DEVICE=$simulator_udid" >> "$GITHUB_ENV"
          echo "WEAVE_MULTI_USER_TEST_DEVICE=$simulator_udid" >> "$GITHUB_ENV"
          echo "iPhone Simulator functional lane: ${simulator_udid}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live test disk headroom and reserve recovery space
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          minimum_kib=$((5 * 1024 * 1024))
          reserve="$RUNNER_TEMP/weave-live-stack-emergency-reserve"
          released_marker="$RUNNER_TEMP/weave-live-stack-emergency-reserve-released"
          rm -f "$reserve" "$released_marker"
          df -h "$RUNNER_TEMP"
          if (( available_kib < minimum_kib )); then
            echo "::error::Live Stack E2E requires at least 5 GiB before allocating its 1 GiB recovery reserve, preserving 4 GiB for native tests; only $((available_kib / 1024)) MiB is available." >&2
            exit 1
          fi
          mkfile 1g "$reserve"
          test "$(stat -f '%z' "$reserve")" -eq $((1024 * 1024 * 1024))
          echo "WEAVE_RUNNER_EMERGENCY_RESERVE=$reserve" >> "$GITHUB_ENV"
          echo "WEAVE_RUNNER_EMERGENCY_RESERVE_RELEASED=$released_marker" >> "$GITHUB_ENV"

      - name: Run live stack integration tests
        working-directory: weave/client
        env:
          WEAVE_BOOTSTRAP_ENV: ${{ github.workspace }}/weave/infra/weave-workspace/.generated/bootstrap.env
        run: |
          set -euo pipefail
          reserve="${WEAVE_RUNNER_EMERGENCY_RESERVE:?}"
          released_marker="${WEAVE_RUNNER_EMERGENCY_RESERVE_RELEASED:?}"
          calendar_outage_state="${WEAVE_E2E_OUTPUT_ROOT:?}/${WEAVE_E2E_RUN_NAMESPACE:?}/calendar-outage-state.json"
          monitor_pid=""
          calendar_outage_restored=false
          release_reserve() {
            if [ -n "$monitor_pid" ]; then
              kill "$monitor_pid" >/dev/null 2>&1 || true
              wait "$monitor_pid" >/dev/null 2>&1 || true
            fi
            rm -f "$reserve"
          }
          restore_calendar_outage() {
            local command_status
            if [ ! -s "$calendar_outage_state" ]; then
              return 0
            fi
            set +e
            WEAVE_E2E_CALENDAR_OUTAGE_STATE_FILE="$calendar_outage_state" \
              ../infra/weave-workspace/isolated-e2e-calendar-outage.sh restore \
                --state-file "$calendar_outage_state" \
                --startup-env "$WEAVE_E2E_STARTUP_ENV_PATH" \
                --stack-bootstrap-env "$WEAVE_E2E_STACK_BOOTSTRAP_ENV" \
                2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
            command_status=${PIPESTATUS[0]}
            set -e
            if [ "$command_status" -eq 0 ]; then
              cp "$calendar_outage_state" \
                "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-calendar-outage.json"
              calendar_outage_restored=true
            fi
            return "$command_status"
          }
          finalize_tests() {
            local original_status=$? restore_status=0
            trap - EXIT INT TERM
            if [ "$calendar_outage_restored" != true ] && [ -s "$calendar_outage_state" ]; then
              restore_calendar_outage || restore_status=$?
            fi
            release_reserve
            if [ "$original_status" -eq 0 ] && [ "$restore_status" -ne 0 ]; then
              original_status=$restore_status
            fi
            exit "$original_status"
          }
          trap finalize_tests EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          (
            while [ -e "$reserve" ]; do
              available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
              if (( available_kib < 2 * 1024 * 1024 )); then
                rm -f "$reserve"
                : > "$released_marker"
                exit 0
              fi
              sleep 2
            done
          ) &
          monitor_pid=$!
          # shellcheck disable=SC1090
          source "$WEAVE_E2E_CREDENTIAL_ENV_PATH"
          export WEAVE_TEST_USERNAME="$WEAVE_E2E_AUTHOR_USERNAME"
          export WEAVE_TEST_PASSWORD="$WEAVE_E2E_AUTHOR_PASSWORD"
          set +e
          make integration-test 2>&1 | tee "$WEAVE_ACCEPTANCE_TEST_LOG"
          single_user_status=${PIPESTATUS[0]}
          WEAVE_E2E_EXECUTION_MODE=collaboration \
            make integration-multi-user-e2e 2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
          collaboration_status=${PIPESTATUS[0]}

          WEAVE_E2E_CALENDAR_OUTAGE_STATE_FILE="$calendar_outage_state" \
            ../infra/weave-workspace/isolated-e2e-calendar-outage.sh begin \
              --state-file "$calendar_outage_state" \
              --startup-env "$WEAVE_E2E_STARTUP_ENV_PATH" \
              --stack-bootstrap-env "$WEAVE_E2E_STACK_BOOTSTRAP_ENV" \
              2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
          calendar_outage_begin_status=${PIPESTATUS[0]}

          calendar_containment_status=1
          if [ "$calendar_outage_begin_status" -eq 0 ]; then
            WEAVE_E2E_EXECUTION_MODE=calendar-failure-containment \
              make integration-multi-user-e2e 2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
            calendar_containment_status=${PIPESTATUS[0]}
          fi
          set -e

          calendar_outage_restore_status=0
          if restore_calendar_outage; then
            calendar_outage_restore_status=0
          else
            calendar_outage_restore_status=$?
          fi

          multi_user_status=0
          for status in \
            "$collaboration_status" \
            "$calendar_outage_begin_status" \
            "$calendar_containment_status" \
            "$calendar_outage_restore_status"; do
            if [ "$status" -ne 0 ]; then
              multi_user_status=1
            fi
          done
          echo "WEAVE_SINGLE_USER_TEST_STATUS=$single_user_status" >> "$GITHUB_ENV"
          echo "WEAVE_MULTI_USER_TEST_STATUS=$multi_user_status" >> "$GITHUB_ENV"
          if [ -e "$released_marker" ]; then
            echo "::error::Live Stack E2E consumed its emergency disk reserve; increase durable runner headroom before retrying." >&2
            exit 1
          fi

      - name: Clean disposable identities and retain only hashed evidence
        if: always()
        working-directory: weave/infra/weave-workspace
        run: |
          set -euo pipefail
          calendar_outage_state="${WEAVE_E2E_OUTPUT_ROOT:?}/${WEAVE_E2E_RUN_NAMESPACE:?}/calendar-outage-state.json"
          if [[ -s "$calendar_outage_state" ]]; then
            if ! jq -e '
              .state == "restored" and
              .recoveryRequired == false and
              .cachedHealth == {calendarStatus:2,filesStatus:2}
            ' "$calendar_outage_state" >/dev/null; then
              WEAVE_E2E_CALENDAR_OUTAGE_STATE_FILE="$calendar_outage_state" \
                ./isolated-e2e-calendar-outage.sh restore \
                  --state-file "$calendar_outage_state" \
                  --startup-env "$WEAVE_E2E_STARTUP_ENV_PATH" \
                  --stack-bootstrap-env "$WEAVE_E2E_STACK_BOOTSTRAP_ENV" \
                  2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
            fi
            jq -e '
              .state == "restored" and
              .recoveryRequired == false and
              .cachedHealth == {calendarStatus:2,filesStatus:2}
            ' "$calendar_outage_state" >/dev/null
            cp "$calendar_outage_state" \
              "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-calendar-outage.json"
          fi
          if [[ -s "${WEAVE_E2E_CREDENTIAL_ENV_PATH:-}" && -s "${WEAVE_E2E_STARTUP_ENV_PATH:-}" ]]; then
            ./isolated-e2e-identities.sh cleanup --run-id "$WEAVE_E2E_RUN_ID" \
              2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
          fi
          [[ -s "${WEAVE_E2E_IDENTITY_MANIFEST_PATH:-}" ]] && \
            cp "$WEAVE_E2E_IDENTITY_MANIFEST_PATH" "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-identities.json"
          [[ -s "${WEAVE_E2E_CLEANUP_EVIDENCE_PATH:-}" ]] && \
            cp "$WEAVE_E2E_CLEANUP_EVIDENCE_PATH" "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-cleanup.json"

      - name: Aggregate two-pass human-testing automation evidence
        if: always()
        working-directory: weave
        run: |
          set -o pipefail
          set +e
          python3 tools/multi_user_e2e_evidence.py \
            --candidate-commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --test-log "$WEAVE_ACCEPTANCE_TEST_LOG" \
            --identity-evidence "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-identities.json" \
            --authorization-evidence "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-authorization.json" \
            --calendar-outage-evidence "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-calendar-outage.json" \
            --cleanup-evidence "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/isolated-cleanup.json" \
            --output "$WEAVE_ACCEPTANCE_EVIDENCE_DIR/human-testing-automated-evidence.json" \
            --require-passed 2>&1 | tee -a "$WEAVE_ACCEPTANCE_TEST_LOG"
          aggregate_status=${PIPESTATUS[0]}
          set -e
          if [[ "${WEAVE_SINGLE_USER_TEST_STATUS:-1}" != 0 ]]; then
            echo "::error::The existing live AppShell/provider suite failed." >&2
            exit 1
          fi
          if [[ "${WEAVE_MULTI_USER_TEST_STATUS:-1}" != 0 || "$aggregate_status" != 0 ]]; then
            echo "::error::Three-user collaboration is blocked or failed; inspect the support-safe evidence artifact." >&2
            exit 1
          fi

      - name: Generate live stack acceptance evidence
        if: always()
        working-directory: weave/client
        run: |
          set -euo pipefail
          dart run tool/acceptance_contract.dart guard \
            --root .. \
            --features e2e/features \
            --mapping e2e/scenario_mappings.json \
            --out "$WEAVE_ACCEPTANCE_EVIDENCE_DIR" \
            --test-log "$WEAVE_ACCEPTANCE_TEST_LOG" \
            --append-summary "$GITHUB_STEP_SUMMARY" \
            --source live-stack-e2e \
            --lane dogfood-candidate-live-evidence \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Generate support-safe failure diagnostics
        if: failure()
        env:
          WEAVE_LIVE_STACK_FAILURE_DIAGNOSTICS_DIR: ${{ env.WEAVE_ACCEPTANCE_EVIDENCE_DIR }}/failure-diagnostics
          WEAVE_LIVE_STACK_SUPPORT_BUNDLE_LOG_LINES: '80'
        run: |
          set -euo pipefail
          bash weave/infra/weave-workspace/live-stack-failure-diagnostics.sh "$WEAVE_LIVE_STACK_FAILURE_DIAGNOSTICS_DIR"

      - name: Destroy stack and scrub stale resources
        if: always()
        working-directory: weave/infra/weave-workspace
        run: |
          set -euo pipefail
          if [[ -s "${WEAVE_E2E_STARTUP_ENV_PATH:-}" ]]; then
            # shellcheck disable=SC1090
            source "$WEAVE_E2E_STARTUP_ENV_PATH"
          fi
          bash ./teardown.sh

      - name: Upload live stack acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-live-stack-acceptance-evidence
          path: ${{ env.WEAVE_ACCEPTANCE_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Scrub current runner-owned Weave outputs
        if: always()
        run: |
          set -euo pipefail
          simulator_cleanup_status=0
          if [[ -n "${WEAVE_E2E_SIMULATOR_UDID:-}" ]]; then
            if [[ "$WEAVE_E2E_SIMULATOR_UDID" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              xcrun simctl shutdown "$WEAVE_E2E_SIMULATOR_UDID" >/dev/null 2>&1 || true
              xcrun simctl delete "$WEAVE_E2E_SIMULATOR_UDID" >/dev/null 2>&1 || simulator_cleanup_status=1
            else
              echo "::error::Refusing to delete an invalid simulator identifier." >&2
              simulator_cleanup_status=1
            fi
          fi
          checkout_root="${GITHUB_WORKSPACE%/}/weave"
          remove_runner_output() {
            local path="$1"
            case "$path" in
              "$checkout_root"/*|"${RUNNER_TEMP%/}"/weave-live-stack-*)
                rm -rf -- "$path"
                ;;
              *)
                echo "::error::Refusing to remove non-runner-owned path: $path" >&2
                exit 1
                ;;
            esac
          }
          for path in \
            "$checkout_root/.gradle" \
            "$checkout_root/build" \
            "$checkout_root/client/.dart_tool" \
            "$checkout_root/client/build" \
            "$checkout_root/server/build" \
            "$checkout_root/weave-mcp-server/build" \
            "${WEAVE_ACCEPTANCE_EVIDENCE_DIR:-$RUNNER_TEMP/weave-live-stack-acceptance-evidence}" \
            "${WEAVE_ACCEPTANCE_TEST_LOG:-$RUNNER_TEMP/weave-live-stack-e2e.log}" \
            "${DOCKER_CONFIG:-$RUNNER_TEMP/weave-live-stack-docker-config}" \
            "$RUNNER_TEMP/weave-live-stack-identities" \
            "${WEAVE_RUNNER_EMERGENCY_RESERVE:-$RUNNER_TEMP/weave-live-stack-emergency-reserve}" \
            "${WEAVE_RUNNER_EMERGENCY_RESERVE_RELEASED:-$RUNNER_TEMP/weave-live-stack-emergency-reserve-released}"; do
            remove_runner_output "$path"
          done
          for image_ref in "$WEAVE_BACKEND_IMAGE" "$WEAVE_MCP_SERVER_IMAGE"; do
            if [[ "$image_ref" != ghcr.io/* ]]; then
              docker image rm "$image_ref" >/dev/null 2>&1 || true
            fi
          done
          df -h "$RUNNER_TEMP"
          if (( simulator_cleanup_status != 0 )); then
            echo "::error::The runner-owned iPhone Simulator could not be deleted." >&2
            exit "$simulator_cleanup_status"
          fi
