name: Live Stack Product Flow

on:
  push:
    branches: [dogfood]
  pull_request:
    branches: [dogfood]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      enable_run_scoped_e2e:
        description: Run the isolated Fresh product proof
        required: true
        default: false
        type: boolean
      weave_backend_image:
        description: Optional exact Weave Server image digest
        required: false
        type: string
      weave_mcp_server_image:
        description: Optional exact Weave MCP Server image digest
        required: false
        type: string
  workflow_call:
    inputs:
      enable_run_scoped_e2e:
        type: boolean
        required: false
        default: true
      weave_backend_image:
        type: string
        required: false
        default: ""
      weave_mcp_server_image:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  isolation-gate:
    name: Require isolated Fresh product proof
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed without explicit isolation
        env:
          ENABLE_RUN_SCOPED_E2E: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_run_scoped_e2e }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_RUN_SCOPED_E2E" == "true" ]] || {
            echo "::error::The destructive product proof requires explicit isolated-run approval."
            exit 1
          }

  live-stack-e2e:
    name: Invitation, OIDC, WebDAV, ARC, and MCP
    needs: isolation-gate
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 75
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      REQUESTED_SERVER_IMAGE: ${{ inputs.weave_backend_image || github.event.inputs.weave_backend_image || '' }}
      REQUESTED_MCP_IMAGE: ${{ inputs.weave_mcp_server_image || github.event.inputs.weave_mcp_server_image || '' }}
      WEAVE_CANDIDATE_COMMIT: ${{ github.sha }}
      WEAVE_TEST_APP_RUN_ID: live-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Verify bounded runner
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]] || {
            echo "::error::Expected $EXPECTED_RUNNER_NAME; got ${RUNNER_NAME:-unknown}."
            exit 1
          }

      - name: Check out Weave
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: weave
          fetch-depth: 0

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          spec_commit="$(
            jq -er '.specCorpus.gitCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              specs/weave-specs.lock.json
          )"
          printf 'commit=%s\n' "$spec_commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Verify runtime prerequisites
        run: |
          set -euo pipefail
          for command in docker git java jq openssl python3 shasum; do
            command -v "$command" >/dev/null
          done
          docker info >/dev/null
          if [[ -n "$REQUESTED_SERVER_IMAGE" || -n "$REQUESTED_MCP_IMAGE" ]]; then
            [[ -n "$REQUESTED_SERVER_IMAGE" && -n "$REQUESTED_MCP_IMAGE" ]]
            [[ "$REQUESTED_SERVER_IMAGE" == *@sha256:* ]]
            [[ "$REQUESTED_MCP_IMAGE" == *@sha256:* ]]
          fi

      - name: Capture persistent dogfood resources
        working-directory: weave
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weave-fresh-proof"
          tools/persistent_dogfood_resource_guard.sh capture \
            "$RUNNER_TEMP/weave-fresh-proof/persistent-resources.txt"

      - name: Run the credential-free Fresh product proof
        working-directory: weave
        env:
          WEAVE_TEST_APP_OUTPUT_ROOT: ${{ runner.temp }}/weave-fresh-proof
          WEAVE_TEST_APP_SERVER_IMAGE: ${{ env.REQUESTED_SERVER_IMAGE }}
          WEAVE_TEST_APP_MCP_IMAGE: ${{ env.REQUESTED_MCP_IMAGE }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testApp

      - name: Verify persistent dogfood preservation
        working-directory: weave
        run: |
          set -euo pipefail
          tools/persistent_dogfood_resource_guard.sh verify \
            "$RUNNER_TEMP/weave-fresh-proof/persistent-resources.txt"
          evidence="$(find "$RUNNER_TEMP/weave-fresh-proof" -name weave-test-app-evidence.json -type f -print -quit)"
          [[ -n "$evidence" ]]
          jq -e '
            .schemaVersion == "weave.test-app-product-flow/v1" and
            .activation == "keycloak-required-actions-real-chromium" and
            .humanOAuth == "authorization_code_pkce_s256" and
            .workloadOAuth == "client_credentials_private_key_jwt" and
            .mcpTool == "files.search" and
            .postgresRestartObserved == true and
            .runtimeStateRestartObserved == true and
            .runtimeStateFixtureRestored == true and
            .sameJpaCellAfterRestart == true and
            .sameMcpCellAfterRestart == true and
            .credentialsIncluded == false and
            .actionLinksIncluded == false and
            .supportSafe == true
          ' "$evidence" >/dev/null

      - name: Upload support-safe product-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-fresh-product-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/weave-fresh-proof/*/weave-test-app-evidence.json
            ${{ runner.temp }}/weave-fresh-proof/*/persistence-restart-evidence.json
            ${{ runner.temp }}/weave-fresh-proof/*/runtime-image-evidence.json
            ${{ runner.temp }}/weave-fresh-proof/*/teardown-evidence.json
            ${{ runner.temp }}/weave-fresh-proof/persistent-resources.txt
          if-no-files-found: warn
          retention-days: 30
