name: Full Compose E2E
run-name: Full Compose E2E ${{ github.sha }}

on:
  push:
    branches: [dogfood]

permissions:
  actions: read
  contents: read

jobs:
  hosted-artifacts:
    name: Hosted build artifacts
    uses: ./.github/workflows/build-artifacts.yml
    with:
      candidate: ${{ github.sha }}

  full-compose-e2e:
    name: Full Compose E2E
    needs: hosted-artifacts
    if: github.ref == 'refs/heads/dogfood'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 120
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      WEAVE_CANDIDATE_COMMIT: ${{ github.sha }}
      WEAVE_TEST_APP_RUN_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      WEAVE_TEST_APP_MODE: member-collaboration
      WEAVE_TEST_APP_RELEASE_MCP: "false"
      WEAVE_TEST_APP_PUBLIC_DOMAIN: weave.localhost
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/weave-specs
      WEAVE_TEST_APP_NATIVE_RUNNER: ${{ github.workspace }}/weave/client/tool/run_native_qualification.py
      WEAVE_TEST_APP_OUTPUT_ROOT: ${{ github.workspace }}/weave/build/test-app
      WEAVE_BUILD_ARTIFACT_ROOT: ${{ runner.temp }}/weave-qualification-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
      WEAVE_CANDIDATE_COMPOSITION: ${{ runner.temp }}/weave-qualification-composition-${{ github.run_id }}-${{ github.run_attempt }}.json

    steps:
      - name: Verify bounded runner
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]] || {
            echo "::error::Expected ${EXPECTED_RUNNER_NAME}; got ${RUNNER_NAME:-unknown}."
            exit 1
          }

      - name: Check out exact source
        id: exact_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.WEAVE_CANDIDATE_COMMIT }}
          path: weave
          fetch-depth: 0
          persist-credentials: false

      - name: Release retired verified runtime images before capacity check
        working-directory: weave
        run: python3 tools/artifact_runtime_storage.py prune

      - name: Verify capacity before artifact consumption
        working-directory: weave
        run: >-
          python3 tools/runner_capacity_preflight.py
          --path .
          --minimum-free-gib 20
          --require-docker

      - name: Consume verified hosted runtime and iOS Simulator artifacts
        working-directory: weave
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/artifact_consumers.py fetch-composition \
            --candidate "$WEAVE_CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$WEAVE_CANDIDATE_COMPOSITION"
          python3 tools/build_artifacts.py consume --composition "$WEAVE_CANDIDATE_COMPOSITION" \
            --components runtime-linux-amd64,ios-simulator --directory "$WEAVE_BUILD_ARTIFACT_ROOT"

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          commit="$(jq -er '.specCorpus.gitCommit | select(test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify exact clean checkout
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin dogfood
          git merge-base --is-ancestor "$WEAVE_CANDIDATE_COMMIT" origin/dogfood
          [[ "$(git rev-parse HEAD)" == "$WEAVE_CANDIDATE_COMMIT" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Configure mandatory native acceptance
        run: |
          set -euo pipefail
          native_ca_root="$HOME/.local/share/weave/native-acceptance-ca"
          [[ -d "$native_ca_root" && ! -L "$native_ca_root" ]] || {
            echo "::error::The runner user's trusted native acceptance CA is unavailable."
            exit 1
          }
          echo "WEAVE_TEST_APP_NATIVE_CA_ROOT=$native_ca_root" >> "$GITHUB_ENV"

      - name: Run fresh collaboration between two ordinary iOS members
        working-directory: weave
        run: ./gradlew --no-daemon specCorpusConformance testApp

      - name: Finish exact isolated teardown
        if: always() && steps.exact_source.outcome == 'success'
        working-directory: weave
        run: |
          python3 -m unittest gradle/scripts/finalize_test_app_ci_test.py
          python3 gradle/scripts/finalize_test_app_ci.py

      - name: Record candidate artifact composition
        if: always() && steps.exact_source.outcome == 'success'
        working-directory: weave
        run: |
          mkdir -p build/test-app/artifacts
          cp "$WEAVE_CANDIDATE_COMPOSITION" build/test-app/artifacts/candidate-artifacts.json

      - name: Release retired verified runtime images after isolated teardown
        if: always() && steps.exact_source.outcome == 'success'
        working-directory: weave
        run: python3 tools/artifact_runtime_storage.py prune

      - name: Verify support-safe E2E diagnostics
        if: always()
        id: evidence_safety
        working-directory: weave
        run: |
          set -euo pipefail
          if [[ -d build/test-app ]]; then
            while IFS= read -r -d '' diagnostics_dir; do
              bash infra/weave-workspace/live-stack-failure-diagnostics.sh --verify "${diagnostics_dir}"
            done < <(find build/test-app -type d -name failure-diagnostics -print0)
          fi

      - name: Upload support-safe E2E evidence
        if: always() && steps.evidence_safety.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: full-compose-e2e-${{ env.WEAVE_CANDIDATE_COMMIT }}-attempt-${{ github.run_attempt }}
          path: weave/build/test-app/**
          if-no-files-found: error
          retention-days: 14

  deploy-dogfood:
    name: Deploy dogfood with Compose
    needs: full-compose-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/dogfood'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 60
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOGFOOD_COMMIT: ${{ github.sha }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_DOGFOOD_REVIEWED_ENV_FILE }}
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/weave-specs
      WEAVE_BUILD_ARTIFACT_ROOT: ${{ runner.temp }}/weave-deployment-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
      WEAVE_CANDIDATE_COMPOSITION: ${{ runner.temp }}/weave-deployment-composition-${{ github.run_id }}-${{ github.run_attempt }}.json

    steps:
      - name: Verify bounded dogfood deployment
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]]
          [[ "$DOGFOOD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WEAVE_ENV_FILE:-}" == /* && -f "$WEAVE_ENV_FILE" && ! -L "$WEAVE_ENV_FILE" ]]

      - name: Check out exact dogfood commit
        id: exact_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOGFOOD_COMMIT }}
          path: weave
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected dogfood ancestry
        working-directory: weave
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          [[ "$(git rev-parse HEAD)" == "$DOGFOOD_COMMIT" ]]
          [[ "$(git rev-parse origin/dogfood)" == "$DOGFOOD_COMMIT" ]]

      - name: Release retired verified runtime images before capacity check
        working-directory: weave
        run: python3 tools/artifact_runtime_storage.py prune

      - name: Verify capacity before artifact consumption
        working-directory: weave
        run: >-
          python3 tools/runner_capacity_preflight.py
          --path .
          --minimum-free-gib 20
          --require-docker

      - name: Consume the qualified hosted components
        working-directory: weave
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/artifact_consumers.py fetch-composition \
            --qualified --candidate "$DOGFOOD_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$WEAVE_CANDIDATE_COMPOSITION"
          python3 tools/build_artifacts.py consume --composition "$WEAVE_CANDIDATE_COMPOSITION" \
            --components runtime-linux-amd64,ios-simulator --directory "$WEAVE_BUILD_ARTIFACT_ROOT"

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          commit="$(jq -er '.specCorpus.gitCommit | select(test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Start Dogfood from the qualified runtime artifact
        working-directory: weave
        run: |
          ./gradlew --no-daemon dogfoodUp
          echo "DOGFOOD_COMPOSE_DEPLOY_RESULT status=passed commit=${DOGFOOD_COMMIT}"

      - name: Prepare and verify the two managed ordinary members
        working-directory: weave
        run: |
          umask 077
          infra/weave-workspace/compose.sh dogfood bootstrap-space \
            --evidence-file build/evidence/dogfood-compose/owner-space.json
          python3 tools/prepare_member_scenario.py --environment dogfood \
            --identity-file "$HOME/.weave/dogfood/functional-smoke-identities.json" \
            --output build/evidence/dogfood-compose/member-preparation.json

      - name: Verify ordinary direct Dogfood functional behavior
        working-directory: weave
        run: |
          umask 077
          python3 tools/dogfood_functional_smoke.py --stage deployment \
            --candidate "$DOGFOOD_COMMIT" \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --qualification-run-attempt "$WEAVE_QUALIFICATION_RUN_ATTEMPT" \
            --output build/evidence/dogfood-compose/functional-smoke.json

      - name: Record exact deployment identity
        working-directory: weave
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["DOGFOOD_COMMIT"]:
              raise SystemExit("Dogfood deployment source mismatch")
          output = Path("build/evidence/dogfood-compose/deployment-result.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              "schemaVersion": "weave.dogfood-deployment/v3", "candidateCommit": sha,
              "sourceTree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "specificationCommit": json.loads(Path("specs/weave-specs.lock.json").read_text())["specCorpus"]["gitCommit"],
              "qualificationRunId": int(os.environ["GITHUB_RUN_ID"]),
              "qualificationRunAttempt": int(os.environ["WEAVE_QUALIFICATION_RUN_ATTEMPT"]),
              "functionalSmoke": json.loads(Path("build/evidence/dogfood-compose/functional-smoke.json").read_text()),
              "artifactComposition": json.loads(Path(os.environ["WEAVE_CANDIDATE_COMPOSITION"]).read_text()),
              "status": "passed",
              "supportSafe": True, "containsSecretValues": False,
          }, indent=2) + "\n")
          PY

      - name: Release retired verified runtime images after deployment
        if: always() && steps.exact_source.outcome == 'success'
        working-directory: weave
        run: python3 tools/artifact_runtime_storage.py prune

      - name: Upload support-safe deployment result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dogfood-compose-${{ env.DOGFOOD_COMMIT }}-attempt-${{ github.run_attempt }}
          path: weave/build/evidence/dogfood-compose
          if-no-files-found: error
          retention-days: 14
