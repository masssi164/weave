name: Dogfood Pending Identity Recovery
run-name: Dogfood Pending Identity Recovery ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact dogfood commit with successful isolated Live Stack E2E evidence"
        required: true
        type: string
      retirement_confirmation:
        description: "After proving no backup is identity-restorable for the recorded subject, type retire-lost-pending-identity"
        required: true
        type: string
      bootstrap_retirement_confirmation:
        description: "After proving the restored realm contains only the obsolete disposable test identity, type retire-restored-test-bootstrap"
        required: true
        type: string
      weave_backend_image:
        description: "Backend image source; published ghcr.io inputs must be exact @sha256 refs, while local refs are rebuilt from the checked-out commit"
        required: false
        default: "weave-backend:pending-identity-recovery"
      weave_mcp_server_image:
        description: "MCP image source; published ghcr.io inputs must be exact @sha256 refs, while local refs are rebuilt from the checked-out commit"
        required: false
        default: "weave-mcp-server:pending-identity-recovery"

permissions:
  contents: read
  actions: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  recover-pending-identity:
    name: Recover Lost Pending Dogfood Identity
    environment: dogfood
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - weave-live
    timeout-minutes: 90
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DISPATCH_REF: ${{ github.ref_name }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WEAVE_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
      RETIREMENT_CONFIRMATION: ${{ inputs.retirement_confirmation }}
      BOOTSTRAP_RETIREMENT_CONFIRMATION: ${{ inputs.bootstrap_retirement_confirmation }}
      WEAVE_BACKEND_IMAGE: ${{ inputs.weave_backend_image }}
      WEAVE_MCP_IMAGE: ${{ inputs.weave_mcp_server_image }}
      WEAVE_ENVIRONMENT: dogfood
      WEAVE_E2E_STACK_SCOPE: persistent
      WEAVE_TENANT_DOMAIN: weave.test
      WEAVE_PROXY_HTTP_HOST_PORT: '44080'
      WEAVE_PROXY_HTTPS_HOST_PORT: '44443'
      WEAVE_KEYCLOAK_HOST_PORT: '48080'
      WEAVE_MAS_HOST_PORT: '48082'
      WEAVE_SYNAPSE_HOST_PORT: '48008'
      WEAVE_NEXTCLOUD_HOST_PORT: '48083'
      WEAVE_BACKEND_HOST_PORT: '48084'
      WEAVE_RUNNER_HYGIENE: 'false'
      WEAVE_REMOVE_VOLUMES: 'false'
      WEAVE_DOGFOOD_MEMBER_USERNAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_USERNAME }}
      WEAVE_DOGFOOD_MEMBER_EMAIL: ${{ secrets.WEAVE_DOGFOOD_MEMBER_EMAIL }}
      WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME }}
      WEAVE_DOGFOOD_MEMBER_GROUPS: ${{ vars.WEAVE_DOGFOOD_MEMBER_GROUPS }}
      WEAVE_KEYCLOAK_SUPERVISOR: ${{ vars.WEAVE_KEYCLOAK_SUPERVISOR }}
      WEAVE_KEYCLOAK_REVIEWED_ENV_FILE: ${{ vars.WEAVE_KEYCLOAK_REVIEWED_ENV_FILE }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_KEYCLOAK_REVIEWED_ENV_FILE }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify protected recovery request
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "${EXPECTED_RUNNER_NAME}" ]] || {
            echo "::error::Pending identity recovery must run on ${EXPECTED_RUNNER_NAME}." >&2
            exit 1
          }
          [[ "$DISPATCH_REF" == dogfood ]] || {
            echo "::error::Pending identity recovery must be dispatched from the protected dogfood branch." >&2
            exit 1
          }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Recovery requires an exact lowercase candidate SHA." >&2
            exit 1
          }
          [[ "$RETIREMENT_CONFIRMATION" == retire-lost-pending-identity ]] || {
            echo "::error::The exact pending-identity retirement confirmation was not supplied." >&2
            exit 1
          }
          [[ "$BOOTSTRAP_RETIREMENT_CONFIRMATION" == retire-restored-test-bootstrap ]] || {
            echo "::error::The exact restored-bootstrap retirement confirmation was not supplied." >&2
            exit 1
          }
          [[ "${WEAVE_KEYCLOAK_SUPERVISOR:-}" == /* && \
             "${WEAVE_KEYCLOAK_REVIEWED_ENV_FILE:-}" == /* && \
             "${WEAVE_ENV_FILE:-}" == "${WEAVE_KEYCLOAK_REVIEWED_ENV_FILE}" ]] || {
            echo "::error::Protected recovery requires externally installed Keycloak supervisor and reviewed environment paths." >&2
            exit 1
          }

      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Resolve pinned specification corpus
        id: spec-corpus
        run: |
          set -euo pipefail
          echo "commit=$(jq -er '.specCorpus.gitCommit | select(type == \"string\" and test(\"^[0-9a-f]{40}$\"))' specs/weave-specs.lock.json)" \
            >>"$GITHUB_OUTPUT"
          echo "WEAVE_SPEC_CORPUS_ROOT=$GITHUB_WORKSPACE/canonical-weave-specs" >>"$GITHUB_ENV"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec-corpus.outputs.commit }}
          path: canonical-weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify successful exact-candidate isolated E2E and dogfood containment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || {
            echo "::error::The checked-out commit does not match the requested recovery candidate." >&2
            exit 1
          }
          spec_corpus_commit="${{ steps.spec-corpus.outputs.commit }}"
          [[ "$(git -C canonical-weave-specs rev-parse HEAD)" == "$spec_corpus_commit" ]] || {
            echo "::error::The checked-out specification corpus does not match the implementation lock." >&2
            exit 1
          }
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/live-stack-e2e.yml/runs?head_sha=${CANDIDATE_SHA}&status=completed&per_page=30")"
          isolated_e2e_run_id="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' <<<"$runs")"
          [[ -n "$isolated_e2e_run_id" ]] || {
            echo "::error::No successful isolated Live Stack E2E run targets ${CANDIDATE_SHA}." >&2
            exit 1
          }
          git fetch origin dogfood --prune
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/dogfood || {
            echo "::error::Recovery candidate is not contained in origin/dogfood." >&2
            exit 1
          }
          echo "ISOLATED_E2E_RUN_ID=$isolated_e2e_run_id" >>"$GITHUB_ENV"
          echo "SPEC_CORPUS_COMMIT=$spec_corpus_commit" >>"$GITHUB_ENV"

      - name: Prepare support-safe recovery evidence
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/weave-pending-identity-recovery-evidence"
          rm -rf -- "$evidence_dir"
          mkdir -p "$evidence_dir"
          chmod 700 "$evidence_dir"
          echo "WEAVE_RECOVERY_EVIDENCE_DIR=$evidence_dir" >>"$GITHUB_ENV"

      - name: Resolve the protected dev image source
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          python3 tools/candidate_source_mapping.py \
            --repository . \
            --lane-candidate "$WEAVE_CANDIDATE_COMMIT" \
            --github-env "$GITHUB_ENV" \
            --output "$WEAVE_RECOVERY_EVIDENCE_DIR/candidate-source-mapping.json"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Ensure persistent dogfood hostnames resolve
        run: |
          set -euo pipefail
          hosts=(weave.test api.weave.test auth.weave.test files.weave.test matrix.weave.test admin.weave.test mail.weave.test)
          missing=()
          for hostname in "${hosts[@]}"; do
            if ! dscacheutil -q host -a name "$hostname" | grep -q 'ip_address:'; then
              missing+=("$hostname")
            fi
          done
          (( ${#missing[@]} == 0 )) || {
            echo "::error::Persistent dogfood DNS is missing: ${missing[*]}" >&2
            exit 1
          }

      - name: Validate protected member configuration
        run: |
          set -euo pipefail
          : "${WEAVE_DOGFOOD_MEMBER_USERNAME:?Configure the protected dogfood member username}"
          : "${WEAVE_DOGFOOD_MEMBER_EMAIL:?Configure the protected dogfood member email}"
          : "${WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME:?Configure the protected dogfood member display name}"
          [[ "$WEAVE_DOGFOOD_MEMBER_USERNAME" != test ]] || {
            echo "::error::The persistent human member cannot reuse the disposable test identity." >&2
            exit 1
          }

      - name: Build candidate runtime artifacts
        run: ./gradlew --no-daemon --max-workers=1 :server:bootJar :weave-mcp-server:bootJar

      - name: Prepare candidate images
        run: |
          set -euo pipefail
          backend_source="$WEAVE_BACKEND_IMAGE"
          mcp_source="$WEAVE_MCP_IMAGE"
          if [[ "$backend_source" == ghcr.io/* ]]; then
            [[ "$backend_source" =~ @sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Published backend input must be an exact digest reference." >&2
              exit 1
            }
            docker pull "$backend_source"
          else
            docker buildx build --load \
              --label "org.opencontainers.image.revision=$WEAVE_IMAGE_SOURCE_COMMIT" \
              -t "$backend_source" -f server/Dockerfile .
          fi
          if [[ "$mcp_source" == ghcr.io/* ]]; then
            [[ "$mcp_source" =~ @sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Published MCP input must be an exact digest reference." >&2
              exit 1
            }
            docker pull "$mcp_source"
          else
            docker buildx build --load \
              --label "org.opencontainers.image.revision=$WEAVE_IMAGE_SOURCE_COMMIT" \
              -t "$mcp_source" -f weave-mcp-server/Dockerfile .
          fi
          for image_ref in "$backend_source" "$mcp_source"; do
            revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$image_ref")"
            [[ "$revision" == "$WEAVE_IMAGE_SOURCE_COMMIT" ]] || {
              echo "::error::Runtime image does not identify the protected dev source candidate: $image_ref" >&2
              exit 1
            }
          done
          keycloak_source="weave-keycloak:pending-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build --load \
            --label "org.opencontainers.image.revision=$WEAVE_IMAGE_SOURCE_COMMIT" \
            -t "$keycloak_source" \
            -f infra/keycloak-event-listener/Dockerfile \
            infra/keycloak-event-listener
          keycloak_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$keycloak_source")"
          keycloak_version="$(docker image inspect --format '{{ index .Config.Labels "com.massimotter.weave.keycloak.version" }}' "$keycloak_source")"
          backend_id="$(docker image inspect --format '{{.Id}}' "$backend_source")"
          mcp_id="$(docker image inspect --format '{{.Id}}' "$mcp_source")"
          keycloak_id="$(docker image inspect --format '{{.Id}}' "$keycloak_source")"
          [[ "$keycloak_revision" == "$WEAVE_IMAGE_SOURCE_COMMIT" && "$keycloak_version" == 26.7.0 ]] || {
            echo "::error::Keycloak image is not bound to the protected dev source and pinned runtime version." >&2
            exit 1
          }
          for image_id in "$backend_id" "$mcp_id" "$keycloak_id"; do
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Candidate image did not resolve to an immutable local image ID." >&2
              exit 1
            }
          done
          {
            echo "WEAVE_BACKEND_IMAGE=$backend_id"
            echo "WEAVE_MCP_IMAGE=$mcp_id"
            echo "WEAVE_KEYCLOAK_IMAGE=$keycloak_id"
          } >>"$GITHUB_ENV"

      - name: Build the exact-candidate Keycloak sanitizer image
        run: |
          set -euo pipefail
          evidence="$WEAVE_RECOVERY_EVIDENCE_DIR/keycloak-sanitizer-image.json"
          image_id="$(python3 infra/weave-workspace/scripts/build_sanitizer_image.py \
            --root infra/weave-workspace \
            --candidate-commit "$WEAVE_IMAGE_SOURCE_COMMIT" \
            --output "$evidence")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Sanitizer build did not return an immutable image ID." >&2
            exit 1
          }
          echo "WEAVE_KEYCLOAK_SANITIZER_IMAGE=$image_id" >>"$GITHUB_ENV"

      - name: Bind immutable images to source and lane evidence
        run: |
          set -euo pipefail
          python3 tools/candidate_source_mapping.py \
            --repository . \
            --lane-candidate "$WEAVE_CANDIDATE_COMMIT" \
            --image "backend=$WEAVE_BACKEND_IMAGE" \
            --image "mcp=$WEAVE_MCP_IMAGE" \
            --image "keycloak=$WEAVE_KEYCLOAK_IMAGE" \
            --image "keycloak-sanitizer=$WEAVE_KEYCLOAK_SANITIZER_IMAGE" \
            --output "$WEAVE_RECOVERY_EVIDENCE_DIR/candidate-source-mapping.json"

      - name: Verify private pending-identity evidence before mutation
        run: |
          set -euo pipefail
          dogfood_root="$HOME/.weave/dogfood"
          subject_file="$dogfood_root/persistent-member.subject"
          prior_evidence="$dogfood_root/persistent-member-ensure.json"
          [[ -s "$subject_file" && -s "$prior_evidence" ]] || {
            echo "::error::Private subject or prior pending evidence is unavailable." >&2
            exit 1
          }
          subject_sha="$(tr -d '\r\n' <"$subject_file" | shasum -a 256 | awk '{print $1}')"
          jq -e --arg subjectSha "$subject_sha" '
            (.schemaVersion == "weave.dogfood.persistent-member.v1" or
              .schemaVersion == "weave.dogfood.persistent-member-recovery.v1") and
            .supportSafe == true and
            .state == "pending" and
            .subjectSha256 == $subjectSha and
            .activation.mode == "keycloak-required-actions-email" and
            .activation.mailSent == true and
            .activation.mailVisible == true and
            (.activation.requiredActions | index("VERIFY_EMAIL") != null) and
            (.activation.requiredActions | index("UPDATE_PASSWORD") != null)
          ' "$prior_evidence" >/dev/null || {
            echo "::error::Accepted evidence does not prove the recorded subject was never activated." >&2
            exit 1
          }
          jq -n --arg subjectSha256 "$subject_sha" \
            '{schemaVersion:"weave.dogfood.pending-recovery-precondition.v1",state:"pending",subjectSha256:$subjectSha256,privateEvidencePresent:true,supportSafe:true}' \
            >"$WEAVE_RECOVERY_EVIDENCE_DIR/precondition.json"

      - name: Bind the persistent Compose recovery workspace
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          coordinates="$(PYTHONPATH=./scripts python3 - <<'PY'
          import os
          import stat
          from pathlib import Path
          from compose_env import load_context

          reviewed = Path(os.environ["WEAVE_KEYCLOAK_REVIEWED_ENV_FILE"])
          metadata = reviewed.stat()
          if (not reviewed.is_absolute() or reviewed.is_symlink() or not reviewed.is_file()
                  or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) not in {0o444, 0o644}):
              raise SystemExit("reviewed dogfood environment must be root-owned mode 0444 or 0644")
          context = load_context("dogfood", Path("."), str(reviewed))
          print(context.generated_root)
          print(context.secret_root)
          print(context.tls_root)
          PY
          )"
          generated_root="$(sed -n '1p' <<<"$coordinates")"
          secret_root="$(sed -n '2p' <<<"$coordinates")"
          tls_root="$(sed -n '3p' <<<"$coordinates")"
          [[ "$generated_root" == /* && "$secret_root" == /* && "$tls_root" == /* ]] || {
            echo "::error::Persistent recovery state roots must be absolute." >&2
            exit 1
          }
          mkdir -p "$generated_root" "$secret_root" "$tls_root"
          chmod 700 "$generated_root" "$secret_root" "$tls_root"
          {
            echo "WEAVE_ENV_FILE=$WEAVE_KEYCLOAK_REVIEWED_ENV_FILE"
            echo "WEAVE_GENERATED_ROOT=$generated_root"
            echo "WEAVE_SECRET_ROOT=$secret_root"
            echo "WEAVE_TLS_ROOT=$tls_root"
          } >>"$GITHUB_ENV"

      - name: Create private pre-recovery backup and audit identity-restorability
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          backup_root="$HOME/.weave/dogfood/backups"
          marker="$RUNNER_TEMP/pending-identity-pre-recovery-backup-start"
          mkdir -p "$backup_root"
          chmod 700 "$backup_root"
          touch "$marker"
          WEAVE_BACKUP_ROOT="$backup_root" bash ./backup.sh dogfood
          backup_candidates=()
          while IFS= read -r backup_candidate; do
            [[ -n "$backup_candidate" ]] && backup_candidates+=("$backup_candidate")
          done < <(find "$backup_root" -mindepth 1 -maxdepth 1 -type d -name 'weave-dogfood-*' -newer "$marker" -print | sort)
          [[ ${#backup_candidates[@]} -eq 1 ]] || {
            echo "::error::Pre-recovery audit did not create exactly one private backup artifact set." >&2
            exit 1
          }
          audit_dir="$WEAVE_RECOVERY_EVIDENCE_DIR/private-backup-identity-audits"
          mkdir -p "$audit_dir"
          chmod 700 "$audit_dir"
          all_backups=()
          while IFS= read -r backup_candidate; do
            [[ -n "$backup_candidate" && -s "$backup_candidate/BackupManifest.json" ]] &&
              all_backups+=("$backup_candidate")
          done < <(find "$backup_root" -mindepth 1 -maxdepth 1 -type d -name 'weave-dogfood-*' -print | sort)
          [[ ${#all_backups[@]} -gt 0 ]] || {
            echo "::error::No private backup is available for identity-restorability audit." >&2
            exit 1
          }
          audit_index=0
          for backup_candidate in "${all_backups[@]}"; do
            audit_index=$((audit_index + 1))
            evidence_file="$audit_dir/audit-$(printf '%04d' "$audit_index").json"
            WEAVE_IDENTITY_AUDIT_EVIDENCE_FILE="$evidence_file" \
              ./audit-private-backup-identity.sh "$backup_candidate"
          done
          jq -s --slurpfile latest "$evidence_file" '
            {
              schemaVersion:"weave.dogfood.private-backup-identity-audit-set.v1",
              status:(if all(.[]; .status == "passed") then "passed" else "failed" end),
              auditedBackupCount:length,
              integrity:{allRequiredArtifactsVerified:all(.[]; .integrity.allRequiredArtifactsVerified == true)},
              isolatedDatabaseReplay:{
                status:(if all(.[]; .isolatedDatabaseReplay.status == "passed") then "passed" else "failed" end),
                persistentRuntimeMutated:any(.[]; .isolatedDatabaseReplay.persistentRuntimeMutated == true)
              },
              identity:{
                identityRestorableForRecordedMember:any(.[]; .identity.identityRestorableForRecordedMember == true),
                recoveryIdentityBoundaryAccepted:all(.[]; .identity.recoveryIdentityBoundaryAccepted == true),
                bootstrapRetirementRequired:$latest[0].identity.bootstrapRetirementRequired,
                latestHumanIdentityCount:$latest[0].identity.humanIdentityCount,
                maximumOtherHumanIdentityCount:([.[].identity.otherHumanIdentityCount] | max)
              },
              privateArtifactContentIncluded:any(.[]; .privateArtifactContentIncluded == true),
              supportSafe:all(.[]; .supportSafe == true)
            }
          ' "$audit_dir"/*.json >"$WEAVE_RECOVERY_EVIDENCE_DIR/private-backup-identity-audit.json"
          jq -e '
            .schemaVersion == "weave.dogfood.private-backup-identity-audit-set.v1" and
            .status == "passed" and
            .auditedBackupCount > 0 and
            .integrity.allRequiredArtifactsVerified == true and
            .isolatedDatabaseReplay.status == "passed" and
            .isolatedDatabaseReplay.persistentRuntimeMutated == false and
            .identity.identityRestorableForRecordedMember == false and
            .identity.recoveryIdentityBoundaryAccepted == true and
            (.identity.latestHumanIdentityCount == 0 or .identity.latestHumanIdentityCount == 1) and
            .identity.maximumOtherHumanIdentityCount == 0 and
            .privateArtifactContentIncluded == false and
            .supportSafe == true
          ' "$WEAVE_RECOVERY_EVIDENCE_DIR/private-backup-identity-audit.json" >/dev/null

      - name: Verify support-safe running recovery boundary
        run: |
          set -euo pipefail
          persistent_volumes=(
            weave_db_data
            weave_nextcloud_data
            weave_synapse_data
            weave_caddy_data
            weave_caddy_config
            weave_keycloak_data
            weave_mailpit_data
            weave_matrix_chat_appservice_runtime
          )
          for volume in "${persistent_volumes[@]}"; do
            docker volume inspect "$volume" >/dev/null 2>&1 || {
              echo "::error::Declared persistent recovery volume is unavailable." >&2
              exit 1
            }
          done
          persistent_containers=(
            weave-db weave-proxy weave-keycloak weave-mailpit weave-backend
            weave-mcp-server weave-mas weave-synapse weave-nextcloud
          )
          for container in "${persistent_containers[@]}"; do
            docker container inspect "$container" >/dev/null 2>&1 || {
              echo "::error::Declared persistent recovery container is unavailable." >&2
              exit 1
            }
          done
          source_evidence="$WEAVE_RECOVERY_EVIDENCE_DIR/private-backup-identity-audit.json"
          jq -e '
            .schemaVersion == "weave.dogfood.private-backup-identity-audit-set.v1" and
            .status == "passed" and
            .auditedBackupCount > 0 and
            .integrity.allRequiredArtifactsVerified == true and
            .isolatedDatabaseReplay.status == "passed" and
            .isolatedDatabaseReplay.persistentRuntimeMutated == false and
            .identity.identityRestorableForRecordedMember == false and
            .identity.recoveryIdentityBoundaryAccepted == true and
            (.identity.latestHumanIdentityCount == 0 or .identity.latestHumanIdentityCount == 1) and
            .identity.maximumOtherHumanIdentityCount == 0 and
            .privateArtifactContentIncluded == false and
            .supportSafe == true
          ' "$source_evidence" >/dev/null || {
            echo "::error::Private backup audit does not prove the exact pending-identity recovery boundary." >&2
            exit 1
          }

      - name: Prove the fixed desired state does not own human identities
        run: |
          set -euo pipefail
          jq -e '
            .apiVersion == "weave.keycloak-desired-state/v1" and
            (has("users") | not)
          ' canonical-weave-specs/contracts/examples/keycloak-desired-state.valid.json >/dev/null
          jq -n '{
            schemaVersion:"weave.dogfood.bootstrap-state-detachment.v2",
            authority:"keycloak-desired-state",
            humanIdentityManaged:false,
            providerMutationPerformed:false,
            retirementBoundary:"keycloak-admin-api-exact-subject",
            supportSafe:true
          }' >"$WEAVE_RECOVERY_EVIDENCE_DIR/bootstrap-state-detachment.json"

      - name: Bootstrap lost persistent runtime with the exact candidate
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          ./compose.sh dogfood secrets-init
          ./compose.sh dogfood render
          ./compose.sh dogfood config >"$WEAVE_RECOVERY_EVIDENCE_DIR/compose-model.json"
          ./compose.sh dogfood prepare
          ./compose.sh dogfood keycloak-apply
          ./compose.sh dogfood up
          ./compose.sh dogfood keycloak-verify
          cp "$WEAVE_GENERATED_ROOT/keycloak/report.json" \
            "$WEAVE_RECOVERY_EVIDENCE_DIR/keycloak-reconciliation-report.json"
          cp "$WEAVE_GENERATED_ROOT/keycloak/signed-receipt.json" \
            "$WEAVE_RECOVERY_EVIDENCE_DIR/keycloak-reconciliation-signed-receipt.json"

      - name: Verify bootstrapped stack readiness
        working-directory: infra/weave-workspace
        run: bash ./operator-check.sh

      - name: Retire the proven restored disposable bootstrap identity
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          dogfood_root="$HOME/.weave/dogfood"
          WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$dogfood_root/persistent-member.subject" \
            ./dogfood-member.sh retire-restored-bootstrap \
              --prior-evidence "$dogfood_root/persistent-member-ensure.json" \
              --evidence-file "$WEAVE_RECOVERY_EVIDENCE_DIR/restored-bootstrap-retirement.json" \
              --approval-ref "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --confirm-bootstrap-retirement "$BOOTSTRAP_RETIREMENT_CONFIRMATION"

      - name: Retire the proven lost pending subject and create one replacement
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          dogfood_root="$HOME/.weave/dogfood"
          subject_file="$dogfood_root/persistent-member.subject"
          prior_evidence="$dogfood_root/persistent-member-ensure.json"
          transition="$WEAVE_RECOVERY_EVIDENCE_DIR/pending-identity-transition.json"
          WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$subject_file" \
            ./dogfood-member.sh recover-lost-pending \
              --prior-evidence "$prior_evidence" \
              --evidence-file "$transition" \
              --approval-ref "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --confirm-retirement "$RETIREMENT_CONFIRMATION"

          private_recovery_dir="$dogfood_root/identity-recovery"
          mkdir -p "$private_recovery_dir"
          chmod 700 "$private_recovery_dir"
          cp "$prior_evidence" "$private_recovery_dir/${GITHUB_RUN_ID}-prior.json"
          cp "$transition" "$private_recovery_dir/${GITHUB_RUN_ID}-transition.json"
          cp "$transition" "$dogfood_root/persistent-member-ensure.json.tmp"
          chmod 600 "$private_recovery_dir/${GITHUB_RUN_ID}-prior.json" \
            "$private_recovery_dir/${GITHUB_RUN_ID}-transition.json" \
            "$dogfood_root/persistent-member-ensure.json.tmp"
          mv "$dogfood_root/persistent-member-ensure.json.tmp" "$dogfood_root/persistent-member-ensure.json"

      - name: Verify replacement remains pending and transition is support-safe
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          status_evidence="$WEAVE_RECOVERY_EVIDENCE_DIR/pending-member-status.json"
          WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$HOME/.weave/dogfood/persistent-member.subject" \
            ./dogfood-member.sh status --evidence-file "$status_evidence"
          jq -e --slurpfile status "$status_evidence" '
            .schemaVersion == "weave.dogfood.persistent-member-recovery.v1" and
            .state == "pending" and
            .action == "lost_pending_identity_retired_and_recreated" and
            .previousSubjectSha256 != .subjectSha256 and
            .retiredSubjectArchivedPrivately == true and
            .readiness.blocked == true and
            .supportSafe == true and
            $status[0].state == "pending" and
            $status[0].subjectSha256 == .subjectSha256 and
            $status[0].supportSafe == true
          ' "$WEAVE_RECOVERY_EVIDENCE_DIR/pending-identity-transition.json" >/dev/null
          jq -e '
            .schemaVersion == "weave.dogfood.restored-bootstrap-retirement.v1" and
            (.action == "restored_disposable_bootstrap_retired" or .action == "not_required_empty_human_boundary") and
            .protectedIdentityPresentBefore == false and
            (.humanIdentityCountBefore == 0 or .humanIdentityCountBefore == 1) and
            .humanIdentityCountAfter == 0 and
            ((.action == "restored_disposable_bootstrap_retired" and .deletionBoundary == "keycloak-admin-api-exact-subject") or
              (.action == "not_required_empty_human_boundary" and .deletionBoundary == "none" and .providerMutationPerformed == false)) and
            .supportSafe == true
          ' "$WEAVE_RECOVERY_EVIDENCE_DIR/restored-bootstrap-retirement.json" >/dev/null

      - name: Create private post-recovery backup and run restore smoke
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          backup_root="$HOME/.weave/dogfood/backups"
          marker="$RUNNER_TEMP/pending-identity-backup-start"
          mkdir -p "$backup_root"
          chmod 700 "$backup_root"
          touch "$marker"
          WEAVE_BACKUP_ROOT="$backup_root" bash ./backup.sh dogfood
          new_backups=()
          while IFS= read -r backup_candidate; do
            [[ -n "$backup_candidate" ]] && new_backups+=("$backup_candidate")
          done < <(find "$backup_root" -mindepth 1 -maxdepth 1 -type d -name 'weave-dogfood-*' -newer "$marker" -print | sort)
          [[ ${#new_backups[@]} -eq 1 ]] || {
            echo "::error::Recovery did not create exactly one private backup artifact set." >&2
            exit 1
          }
          backup_dir="${new_backups[0]}"
          WEAVE_RESTORE_RECEIPT_OUTPUT="$backup_dir/RestoreReceipt.json" \
            bash ./restore-smoke.sh "$backup_dir"
          manifest="$backup_dir/BackupManifest.json"
          receipt="$backup_dir/RestoreReceipt.json"
          jq -e '.supportSafe == false and (.artifacts | length) >= 8 and all(.artifacts[]; .bytes > 0)' "$manifest" >/dev/null
          jq -e '
            .supportSafe == true and
            .validationMode == "post_restore_live" and
            .status == "passed" and
            .destroyStep.performed == false and
            .provesRestoredDomainData == false and
            .releaseEligible == false
          ' "$receipt" >/dev/null
          backup_id_sha="$(jq -r '.backupId' "$manifest" | shasum -a 256 | awk '{print $1}')"
          artifact_count="$(jq '.artifacts | length' "$manifest")"
          jq -n --arg backupIdSha256 "$backup_id_sha" --argjson artifactCount "$artifact_count" '
            {
              schemaVersion:"weave.dogfood.pending-recovery-backup.v1",
              privateBackupCreated:true,
              backupIdSha256:$backupIdSha256,
              artifactCount:$artifactCount,
              artifactPreflightPassed:true,
              liveRestoreSmokePassed:true,
              restoredDomainDataProven:false,
              supportSafe:true
            }
          ' >"$WEAVE_RECOVERY_EVIDENCE_DIR/backup-restore-smoke.json"

      - name: Record support-safe recovery outcome
        if: ${{ always() && env.WEAVE_RECOVERY_EVIDENCE_DIR != '' }}
        run: |
          set -euo pipefail
          identity_audit_completed=false
          bootstrap_retirement_completed=false
          transition_completed=false
          backup_completed=false
          if [[ -s "$WEAVE_RECOVERY_EVIDENCE_DIR/private-backup-identity-audit.json" ]] && \
              jq -e '.status == "passed" and .auditedBackupCount > 0 and .integrity.allRequiredArtifactsVerified == true and .isolatedDatabaseReplay.status == "passed" and .identity.identityRestorableForRecordedMember == false and .identity.recoveryIdentityBoundaryAccepted == true and .supportSafe == true' \
                "$WEAVE_RECOVERY_EVIDENCE_DIR/private-backup-identity-audit.json" >/dev/null; then
            identity_audit_completed=true
          fi
          if [[ -s "$WEAVE_RECOVERY_EVIDENCE_DIR/restored-bootstrap-retirement.json" ]] && \
              jq -e '(.action == "restored_disposable_bootstrap_retired" or .action == "not_required_empty_human_boundary") and .humanIdentityCountAfter == 0 and .supportSafe == true' \
                "$WEAVE_RECOVERY_EVIDENCE_DIR/restored-bootstrap-retirement.json" >/dev/null; then
            bootstrap_retirement_completed=true
          fi
          if [[ -s "$WEAVE_RECOVERY_EVIDENCE_DIR/pending-identity-transition.json" ]] && \
              jq -e '.action == "lost_pending_identity_retired_and_recreated" and .supportSafe == true' \
                "$WEAVE_RECOVERY_EVIDENCE_DIR/pending-identity-transition.json" >/dev/null; then
            transition_completed=true
          fi
          if [[ -s "$WEAVE_RECOVERY_EVIDENCE_DIR/backup-restore-smoke.json" ]] && \
              jq -e '.privateBackupCreated == true and .artifactPreflightPassed == true and .liveRestoreSmokePassed == true' \
                "$WEAVE_RECOVERY_EVIDENCE_DIR/backup-restore-smoke.json" >/dev/null; then
            backup_completed=true
          fi

          recovery_state=not-completed
          overall_state=failed
          blockers='["protected-recovery-incomplete"]'
          if [[ "$identity_audit_completed" == true && "$bootstrap_retirement_completed" == true && "$transition_completed" == true && "$backup_completed" == true ]]; then
            recovery_state=completed
            overall_state=blocked
            blockers='["human-activation-required","active-session-required","two-install-dogfood-deployment-required"]'
          elif [[ "$identity_audit_completed" == true && "$bootstrap_retirement_completed" == true && "$transition_completed" == true ]]; then
            recovery_state=transition-completed-backup-incomplete
            blockers='["private-backup-or-restore-smoke-failed","human-activation-required","active-session-required","two-install-dogfood-deployment-required"]'
          fi

          jq -n \
            --arg candidateCommit "$CANDIDATE_SHA" \
            --arg specCorpusCommit "$SPEC_CORPUS_COMMIT" \
            --arg isolatedE2ERunId "$ISOLATED_E2E_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg identityAuditStatus "$([[ "$identity_audit_completed" == true ]] && printf passed || printf failed)" \
            --arg bootstrapRetirementStatus "$([[ "$bootstrap_retirement_completed" == true ]] && printf passed || printf failed)" \
            --arg recoveryState "$recovery_state" \
            --arg overallState "$overall_state" \
            --argjson blockers "$blockers" '
            {
              schemaVersion:"weave.dogfood.pending-identity-recovery-manifest.v1",
              candidateCommit:$candidateCommit,
              specCorpusCommit:$specCorpusCommit,
              isolatedE2ERunId:$isolatedE2ERunId,
              runUrl:$runUrl,
              privateBackupIdentityAuditStatus:$identityAuditStatus,
              restoredBootstrapRetirementStatus:$bootstrapRetirementStatus,
              recoveryState:$recoveryState,
              overallState:$overallState,
              blockers:$blockers,
              humanTestingReady:false,
              supportSafe:true
            }
          ' >"$WEAVE_RECOVERY_EVIDENCE_DIR/recovery-manifest.json"
          cat "$WEAVE_RECOVERY_EVIDENCE_DIR/recovery-manifest.json" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload support-safe recovery evidence
        if: ${{ always() && env.WEAVE_RECOVERY_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weave-pending-identity-recovery-evidence
          path: ${{ env.WEAVE_RECOVERY_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
