name: Dogfood Pending Identity Recovery (Guarded)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit requiring reviewed pending-identity recovery"
        required: true
        type: string
      guarded_recovery_confirmation:
        description: "Type acknowledge-recovery-is-guarded"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recovery-is-guarded:
    name: Refuse retired recovery authority
    runs-on: ubuntu-24.04
    steps:
      - name: Keep pending-identity recovery fail-closed
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GUARDED_RECOVERY_CONFIRMATION: ${{ inputs.guarded_recovery_confirmation }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Recovery requires one exact lowercase candidate SHA." >&2
            exit 1
          }
          [[ "$GUARDED_RECOVERY_CONFIRMATION" == acknowledge-recovery-is-guarded ]] || {
            echo "::error::The guarded recovery acknowledgement was not supplied." >&2
            exit 1
          }
          echo "::error::Pending-identity retirement is guarded. The retired root supervisor, sanitizer image, and custom Keycloak provider JAR are not valid recovery authorities. Use normal invitation resend and authenticated session reconciliation where applicable. A destructive retirement workflow may return only after it is implemented against an isolated e2e clone of the dogfood identity topology and proves private backup plus exact cleanup; it must never mutate persistent dogfood as a recovery shortcut." >&2
          exit 1
