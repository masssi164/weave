name: Test Stack Deploy
run-name: Test Stack Deploy ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}

on:
  workflow_run:
    workflows:
      - Live Stack E2E
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact dogfood commit with successful isolated Live Stack E2E evidence"
        required: true
        type: string
      dogfood_member_operation:
        description: "Optional persistent human member operation"
        required: false
        default: status
        type: choice
        options:
          - status
          - ensure
          - resend-activation
      weave_backend_image:
        description: "Backend image; ghcr.io/* is pulled, other refs are built locally from the checked-out commit"
        required: false
        default: "weave-backend:test-stack"
      weave_mcp_server_image:
        description: "MCP server image; ghcr.io/* is pulled, other refs are built locally from the checked-out commit"
        required: false
        default: "weave-mcp-server:test-stack"

permissions:
  contents: read
  actions: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  deploy-test-stack:
    name: Deploy Persistent LAN Test Stack
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'dogfood' &&
       github.event.workflow_run.conclusion == 'success')
    environment: dogfood
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - weave-live
    timeout-minutes: 90
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
      ISOLATED_E2E_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      WEAVE_BACKEND_IMAGE: ${{ inputs.weave_backend_image || 'weave-backend:test-stack' }}
      WEAVE_MCP_SERVER_IMAGE: ${{ inputs.weave_mcp_server_image || 'weave-mcp-server:test-stack' }}
      TF_VAR_create_test_user: 'false'
      TF_VAR_isolated_e2e_enabled: 'false'
      TF_VAR_boards_runtime_enabled: 'true'
      TF_VAR_boards_provider: local-workspace
      TF_VAR_provider_stack_profile: local-live
      TF_VAR_provider_stack_readiness: ready
      TF_VAR_tenant_domain: weave.test
      TF_VAR_proxy_http_host_port: '44080'
      TF_VAR_proxy_host_port: '44443'
      TF_VAR_keycloak_host_port: '48080'
      TF_VAR_mas_host_port: '48082'
      TF_VAR_synapse_host_port: '48008'
      TF_VAR_nextcloud_host_port: '48083'
      TF_VAR_backend_host_port: '48084'
      WEAVE_RUNNER_HYGIENE: 'false'
      WEAVE_REMOVE_VOLUMES: 'false'
      WEAVE_DOGFOOD_DEPLOYMENT_SCOPE: persistent-dogfood
      WEAVE_DOGFOOD_MEMBER_USERNAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_USERNAME }}
      WEAVE_DOGFOOD_MEMBER_EMAIL: ${{ secrets.WEAVE_DOGFOOD_MEMBER_EMAIL }}
      WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME }}
      WEAVE_DOGFOOD_MEMBER_GROUPS: ${{ vars.WEAVE_DOGFOOD_MEMBER_GROUPS }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify dedicated local runner
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Persistent deployment requires an exact lowercase candidate SHA." >&2
            exit 1
          }
          echo "runner=${RUNNER_NAME:-unknown}"
          if [[ "${RUNNER_NAME:-}" != "${EXPECTED_RUNNER_NAME}" ]]; then
            echo "::error::Persistent LAN test stack must deploy only on ${EXPECTED_RUNNER_NAME}; got ${RUNNER_NAME:-unknown}." >&2
            exit 1
          fi

      - name: Check out weave
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact-candidate isolated E2E source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            source_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ISOLATED_E2E_RUN_ID}")"
            [[ "$(jq -r '.name' <<<"$source_run")" == "Live Stack E2E" && \
               "$(jq -r '.conclusion' <<<"$source_run")" == success && \
               "$(jq -r '.head_sha' <<<"$source_run")" == "$CANDIDATE_SHA" ]] || {
              echo "::error::Deployment source is not successful exact-candidate Live Stack E2E evidence." >&2
              exit 1
            }
          else
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/live-stack-e2e.yml/runs?head_sha=${CANDIDATE_SHA}&status=completed&per_page=30")"
            ISOLATED_E2E_RUN_ID="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' <<<"$runs")"
            [[ -n "$ISOLATED_E2E_RUN_ID" ]] || {
              echo "::error::No successful isolated Live Stack E2E run targets ${CANDIDATE_SHA}." >&2
              exit 1
            }
            echo "ISOLATED_E2E_RUN_ID=$ISOLATED_E2E_RUN_ID" >> "$GITHUB_ENV"
          fi
          git fetch origin dogfood --prune
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/dogfood || {
            echo "::error::Persistent deployment candidate is not contained in origin/dogfood." >&2
            exit 1
          }

      - name: Prepare test-stack evidence directory
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/weave-test-stack-evidence"
          mkdir -p "$evidence_dir"
          echo "WEAVE_TEST_STACK_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      - name: Ensure local Weave hostnames resolve on the runner
        run: |
          set -euo pipefail
          hosts=(weave.test api.weave.test auth.weave.test files.weave.test matrix.weave.test admin.weave.test mail.weave.test)
          missing=()
          for host in "${hosts[@]}"; do
            if ! dscacheutil -q host -a name "$host" | grep -q 'ip_address:'; then
              missing+=("$host")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            line="127.0.0.1 ${missing[*]}"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              printf '%s\n' "$line" | sudo tee -a /etc/hosts >/dev/null
              sudo dscacheutil -flushcache || true
            else
              echo "::error::Runner cannot resolve required Weave hostnames and passwordless sudo is unavailable. Configure weave.test DNS or add: $line" >&2
              exit 1
            fi
          fi

      - name: Build Java runtime artifacts
        run: ./gradlew --no-daemon --max-workers=1 :server:bootJar :weave-mcp-server:bootJar

      - name: Prepare backend image
        run: |
          set -euo pipefail
          if [[ "${WEAVE_BACKEND_IMAGE}" == ghcr.io/* ]]; then
            docker pull "${WEAVE_BACKEND_IMAGE}"
          else
            docker buildx build --load -t "${WEAVE_BACKEND_IMAGE}" -f server/Dockerfile .
          fi

      - name: Prepare MCP server image
        run: |
          set -euo pipefail
          if [[ "${WEAVE_MCP_SERVER_IMAGE}" == ghcr.io/* ]]; then
            docker pull "${WEAVE_MCP_SERVER_IMAGE}"
          else
            docker buildx build --load -t "${WEAVE_MCP_SERVER_IMAGE}" -f weave-mcp-server/Dockerfile .
          fi

      - name: Assert persistent human member before deploy
        if: ${{ env.WEAVE_DOGFOOD_MEMBER_USERNAME != '' }}
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          evidence="$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-before.json"
          if curl --silent --fail --max-time 5 \
              --cacert "01-infrastructure/.generated/caddy/certs/weave-local-ca.pem" \
              "https://auth.weave.test:44443/realms/weave/.well-known/openid-configuration" >/dev/null 2>&1; then
            WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$HOME/.weave/dogfood/persistent-member.subject" \
              ./dogfood-member.sh status --evidence-file "${evidence}"
          else
            jq -n '{schemaVersion:"weave.dogfood.persistent-member.v1",state:"stack_unavailable_before_deploy",action:"not_observed",subjectSha256:null,supportSafe:true}' >"${evidence}"
            echo "Persistent member pre-deploy observation skipped because Keycloak is not running; post-deploy verification remains mandatory."
          fi

      - name: Restore persistent deployment workspace
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          dogfood_root="$HOME/.weave/dogfood"
          state_root="$dogfood_root/opentofu-state"
          generated_root="$dogfood_root/generated"
          cert_root="$generated_root/01-infrastructure/caddy/certs"
          mkdir -p "$state_root" "$generated_root"
          chmod 700 "$HOME/.weave" "$dogfood_root" "$state_root" "$generated_root"
          for stage in 01-infrastructure 02-keycloak-setup; do
            if [[ -s "$state_root/${stage}.tfstate" ]]; then
              cp "$state_root/${stage}.tfstate" "$stage/terraform.tfstate"
              chmod 600 "$stage/terraform.tfstate"
            fi
            mkdir -p "$generated_root/$stage"
            rm -rf "$stage/.generated"
            ln -s "$generated_root/$stage" "$stage/.generated"
          done
          {
            echo "TF_VAR_caddy_tls_cert_file=$cert_root/weave.test.pem"
            echo "TF_VAR_caddy_tls_key_file=$cert_root/weave.test-key.pem"
            echo "TF_VAR_caddy_tls_ca_file=$cert_root/weave-local-ca.pem"
          } >> "$GITHUB_ENV"

      - name: Capture persistent dogfood state before candidate deployment
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$HOME/.weave/dogfood/persistent-member.subject" \
            ./persistent-dogfood-observation.sh capture \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-dogfood-before.json"

      - name: Deploy or update persistent LAN test stack
        working-directory: infra/weave-workspace
        env:
          TF_VAR_weave_backend_image: ${{ env.WEAVE_BACKEND_IMAGE }}
          TF_VAR_weave_mcp_server_image: ${{ env.WEAVE_MCP_SERVER_IMAGE }}
        run: ./install.sh

      - name: Persist OpenTofu state
        if: ${{ always() }}
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          state_root="$HOME/.weave/dogfood/opentofu-state"
          mkdir -p "$state_root"
          chmod 700 "$HOME/.weave" "$HOME/.weave/dogfood" "$state_root"
          for stage in 01-infrastructure 02-keycloak-setup; do
            if [[ -s "$stage/terraform.tfstate" ]]; then
              temporary="$state_root/${stage}.tfstate.tmp"
              cp "$stage/terraform.tfstate" "$temporary"
              chmod 600 "$temporary"
              mv "$temporary" "$state_root/${stage}.tfstate"
            fi
          done

      - name: Verify persistent stack readiness non-destructively
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          bash ./operator-check.sh

      - name: Run requested persistent member operation
        if: ${{ github.event_name == 'workflow_dispatch' && env.WEAVE_DOGFOOD_MEMBER_USERNAME != '' }}
        working-directory: infra/weave-workspace
        env:
          DOGFOOD_MEMBER_OPERATION: ${{ inputs.dogfood_member_operation }}
        run: |
          set -euo pipefail
          WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$HOME/.weave/dogfood/persistent-member.subject" \
            ./dogfood-member.sh "${DOGFOOD_MEMBER_OPERATION}" \
            --evidence-file "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-operation.json"

      - name: Assert persistent human member after deploy
        if: ${{ env.WEAVE_DOGFOOD_MEMBER_USERNAME != '' }}
        working-directory: infra/weave-workspace
        run: WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$HOME/.weave/dogfood/persistent-member.subject" ./dogfood-member.sh status --evidence-file "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-after.json"

      - name: Verify persistent member subject is unchanged
        if: ${{ env.WEAVE_DOGFOOD_MEMBER_USERNAME != '' }}
        run: |
          set -euo pipefail
          before="$(jq -r '.subjectSha256' "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-before.json")"
          after="$(jq -r '.subjectSha256' "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-after.json")"
          [[ -n "$after" && "$after" != null ]] || {
            echo "::error::Persistent dogfood member has not been created. Dispatch this workflow with dogfood_member_operation=ensure." >&2
            exit 1
          }
          [[ -z "$before" || "$before" == null || "$before" == "$after" ]] || {
            echo "::error::Persistent dogfood member subject changed across deployment." >&2
            exit 1
          }

      - name: Apply the same candidate a second time non-destructively
        working-directory: infra/weave-workspace
        env:
          TF_VAR_weave_backend_image: ${{ env.WEAVE_BACKEND_IMAGE }}
          TF_VAR_weave_mcp_server_image: ${{ env.WEAVE_MCP_SERVER_IMAGE }}
        run: ./install.sh

      - name: Persist OpenTofu state after the second install
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          state_root="$HOME/.weave/dogfood/opentofu-state"
          mkdir -p "$state_root"
          chmod 700 "$HOME/.weave" "$HOME/.weave/dogfood" "$state_root"
          for stage in 01-infrastructure 02-keycloak-setup; do
            [[ -s "$stage/terraform.tfstate" ]] || {
              echo "::error::Missing ${stage} state after second install." >&2
              exit 1
            }
            temporary="$state_root/${stage}.tfstate.tmp"
            cp "$stage/terraform.tfstate" "$temporary"
            chmod 600 "$temporary"
            mv "$temporary" "$state_root/${stage}.tfstate"
          done

      - name: Verify persistent stack non-destructively after the second install
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          bash ./operator-check.sh

      - name: Verify deployment is idempotent
        env:
          TF_VAR_weave_backend_image: ${{ env.WEAVE_BACKEND_IMAGE }}
          TF_VAR_weave_mcp_server_image: ${{ env.WEAVE_MCP_SERVER_IMAGE }}
        run: |
          set -euo pipefail
          idempotence_status=0
          verify_no_drift() {
            local stage="$1"
            local log_file="$RUNNER_TEMP/tofu-${stage}-second-plan.log"
            local rc
            set +e
            (cd "infra/weave-workspace/${stage}" && tofu plan -input=false -no-color -detailed-exitcode) >"${log_file}" 2>&1
            rc=$?
            set -e
            if [[ ${rc} -eq 0 ]]; then
              printf '{"stage":"%s","noChanges":true,"supportSafe":true}\n' "${stage}" >"$WEAVE_TEST_STACK_EVIDENCE_DIR/tofu-${stage}-idempotence.json"
              rm -f "${log_file}"
              return
            fi
            failure_kind=plan_failed
            if grep -Fq 'The plugin crashed!' "${log_file}"; then
              failure_kind=provider_crashed
              echo "::error::Pinned provider crashed during ${stage} idempotence plan. Raw log retained only on the protected runner: ${log_file}" >&2
            elif [[ ${rc} -eq 2 ]]; then
              failure_kind=drift_detected
              echo "::error::Second OpenTofu plan for ${stage} contains changes; deployment is not idempotent." >&2
            else
              echo "::error::Second OpenTofu plan for ${stage} failed with exit ${rc}. Raw log retained only on the protected runner." >&2
            fi
            printf '{"stage":"%s","noChanges":false,"failureKind":"%s","supportSafe":true}\n' \
              "${stage}" "${failure_kind}" >"$WEAVE_TEST_STACK_EVIDENCE_DIR/tofu-${stage}-idempotence.json"
            idempotence_status=1
          }
          verify_no_drift 01-infrastructure
          verify_no_drift 02-keycloak-setup
          echo "WEAVE_TOFU_IDEMPOTENCE_STATUS=$idempotence_status" >> "$GITHUB_ENV"

      - name: Compare persistent human Mailpit TLS and session invariants
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          WEAVE_DOGFOOD_MEMBER_SUBJECT_FILE="$HOME/.weave/dogfood/persistent-member.subject" \
            ./persistent-dogfood-observation.sh capture \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-dogfood-after.json"
          set +e
          ./persistent-dogfood-observation.sh compare \
            --before "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-dogfood-before.json" \
            --after "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-dogfood-after.json" \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-dogfood-comparison.json"
          comparison_status=$?
          set -e
          echo "WEAVE_PERSISTENT_COMPARISON_STATUS=$comparison_status" >> "$GITHUB_ENV"

      - name: Collect cached provider metrics without probing providers
        run: |
          set -euo pipefail
          metrics_url="http://127.0.0.1:${TF_VAR_backend_host_port}/actuator/metrics"
          deadline=$((SECONDS + 90))
          for capability in files calendar; do
            while true; do
              if curl --silent --show-error --fail --max-time 5 \
                  "${metrics_url}/weave.provider.health.cached.age.seconds?tag=capability:${capability}" \
                  | jq -e 'any(.measurements[]?; .statistic == "VALUE" and .value >= 0)' >/dev/null; then
                break
              fi
              if (( SECONDS >= deadline )); then
                echo "::error::Cached provider observation for ${capability} was not available within 90 seconds." >&2
                exit 1
              fi
              sleep 5
            done
          done
          set +e
          python3 tools/dogfood_deployment_evidence.py collect-provider-health \
            --actuator-metrics-url "$metrics_url" \
            --chat-state available \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/provider-health-summary.json" \
            2>&1 | tee "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment.log"
          provider_status=${PIPESTATUS[0]}
          set -e
          echo "WEAVE_PROVIDER_HEALTH_STATUS=$provider_status" >> "$GITHUB_ENV"

      - name: Generate a support bundle with sanitized cached health
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          WEAVE_PROVIDER_HEALTH_EVIDENCE_FILE="$WEAVE_TEST_STACK_EVIDENCE_DIR/provider-health-summary.json" \
          WEAVE_SUPPORT_BUNDLE_DIR="$WEAVE_TEST_STACK_EVIDENCE_DIR/support-bundle" \
          WEAVE_SUPPORT_BUNDLE_RUN_CHECKS=false \
            ./support-bundle.sh "$WEAVE_TEST_STACK_EVIDENCE_DIR/support-bundle"

      - name: Assemble exact-candidate dogfood deployment evidence
        run: |
          set -o pipefail
          set +e
          python3 tools/dogfood_deployment_evidence.py assemble \
            --candidate-commit "$CANDIDATE_SHA" \
            --backend-version "0.1.0" \
            --backend-build-number "$GITHUB_RUN_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --persistent-comparison "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-dogfood-comparison.json" \
            --provider-health "$WEAVE_TEST_STACK_EVIDENCE_DIR/provider-health-summary.json" \
            --tofu-idempotence "$WEAVE_TEST_STACK_EVIDENCE_DIR/tofu-01-infrastructure-idempotence.json" \
            --tofu-idempotence "$WEAVE_TEST_STACK_EVIDENCE_DIR/tofu-02-keycloak-setup-idempotence.json" \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment-evidence.json" \
            --require-passed 2>&1 | tee -a "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment.log"
          evidence_status=${PIPESTATUS[0]}
          set -e
          echo "WEAVE_DOGFOOD_EVIDENCE_STATUS=$evidence_status" >> "$GITHUB_ENV"

      - name: Map persistent dogfood runtime evidence
        if: always()
        working-directory: client
        run: |
          set -euo pipefail
          if [[ -s "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment.log" ]]; then
            flutter pub get
            dart run tool/acceptance_contract.dart guard \
              --root .. \
              --features e2e/features \
              --mapping e2e/scenario_mappings.json \
              --out "$WEAVE_TEST_STACK_EVIDENCE_DIR/acceptance-contract" \
              --test-log "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment.log" \
              --append-summary "$GITHUB_STEP_SUMMARY" \
              --source dogfood-deployment \
              --lane persistent-dogfood-verification \
              --commit "$CANDIDATE_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Write persistent test-stack manifest
        if: always()
        run: |
          set -euo pipefail
          manifest="$WEAVE_TEST_STACK_EVIDENCE_DIR/test-stack-manifest.json"
          cat > "$manifest" <<EOF
          {
            "schemaVersion": 1,
            "lane": "persistent-lan-test-stack",
            "branch": "dogfood",
            "commit": "${CANDIDATE_SHA}",
            "isolatedE2ERunId": "${ISOLATED_E2E_RUN_ID}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "runner": "${RUNNER_NAME:-unknown}",
            "productUrl": "https://weave.test:44443/",
            "platformConfigUrl": "https://api.weave.test:44443/api/platform/config",
            "caBootstrapUrl": "http://weave.test:44080/weave-local-ca.pem",
            "identityDataResetAllowed": false,
            "staticTestUserEnabled": false,
            "isolatedE2EEnabled": false,
            "supportSafe": true
          }
          EOF
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce persistent dogfood readiness gates
        if: always()
        run: |
          set -euo pipefail
          test -s "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment-evidence.json" || {
            echo "::error::Dogfood deployment evidence was not assembled." >&2
            exit 1
          }
          if [[ "${WEAVE_TOFU_IDEMPOTENCE_STATUS:-1}" != 0 || \
                "${WEAVE_PERSISTENT_COMPARISON_STATUS:-1}" != 0 || \
                "${WEAVE_PROVIDER_HEALTH_STATUS:-1}" != 0 || \
                "${WEAVE_DOGFOOD_EVIDENCE_STATUS:-1}" != 0 ]]; then
            echo "::error::Persistent dogfood is not ready; see explicit blockers in dogfood-deployment-evidence.json." >&2
            exit 1
          fi

      - name: Upload persistent test-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-test-stack-evidence
          path: ${{ env.WEAVE_TEST_STACK_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
