name: Test Stack Deploy
run-name: Test Stack Deploy ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}

on:
  workflow_run:
    workflows:
      - Live Stack Product Flow
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact dogfood commit with successful isolated Fresh product-flow evidence"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  deploy-test-stack:
    name: Deploy Persistent Test-Profile Stack
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'dogfood' &&
       github.event.workflow_run.conclusion == 'success')
    environment: dogfood
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - weave-live
    timeout-minutes: 60
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
      WEAVE_CANDIDATE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
      ISOLATED_E2E_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      WEAVE_ENVIRONMENT: test
      WEAVE_STACK_SCOPE: persistent
      WEAVE_E2E_STACK_SCOPE: persistent
      WEAVE_TEST_REVIEWED_ENV_FILE: ${{ vars.WEAVE_TEST_REVIEWED_ENV_FILE }}
      WEAVE_TEST_BACKUP_ROOT: ${{ vars.WEAVE_TEST_BACKUP_ROOT }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_TEST_REVIEWED_ENV_FILE }}
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/canonical-weave-specs
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify protected persistent deployment request
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Persistent deployment requires an exact lowercase candidate SHA." >&2
            exit 1
          }
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]] || {
            echo "::error::Persistent deployment must run on $EXPECTED_RUNNER_NAME." >&2
            exit 1
          }
          [[ "${WEAVE_TEST_REVIEWED_ENV_FILE:-}" == /* && \
             "$WEAVE_ENV_FILE" == "$WEAVE_TEST_REVIEWED_ENV_FILE" ]] || {
            echo "::error::Persistent deployment requires one reviewed test-profile environment path." >&2
            exit 1
          }
          [[ "${WEAVE_TEST_BACKUP_ROOT:-}" == /* ]] || {
            echo "::error::Persistent deployment requires an absolute private backup root." >&2
            exit 1
          }

      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Resolve pinned specification corpus
        id: spec-corpus
        run: |
          set -euo pipefail
          spec_commit="$(
            jq -er '.specCorpus.gitCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              specs/weave-specs.lock.json
          )"
          printf 'commit=%s\n' "$spec_commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec-corpus.outputs.commit }}
          path: canonical-weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify successful exact-candidate isolated E2E source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            source_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ISOLATED_E2E_RUN_ID}")"
            [[ "$(jq -r '.name' <<<"$source_run")" == "Live Stack Product Flow" && \
               "$(jq -r '.conclusion' <<<"$source_run")" == success && \
               "$(jq -r '.head_sha' <<<"$source_run")" == "$CANDIDATE_SHA" ]] || {
              echo "::error::Deployment source is not successful exact-candidate Fresh product-flow evidence." >&2
              exit 1
            }
          else
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/live-stack-e2e.yml/runs?head_sha=${CANDIDATE_SHA}&status=completed&per_page=30")"
            ISOLATED_E2E_RUN_ID="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' <<<"$runs")"
            [[ -n "$ISOLATED_E2E_RUN_ID" ]] || {
              echo "::error::No successful isolated Fresh product-flow run targets ${CANDIDATE_SHA}." >&2
              exit 1
            }
            echo "ISOLATED_E2E_RUN_ID=$ISOLATED_E2E_RUN_ID" >>"$GITHUB_ENV"
          fi
          git fetch origin dogfood --prune
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/dogfood || {
            echo "::error::Persistent candidate is not contained in origin/dogfood." >&2
            exit 1
          }

      - name: Consume exact isolated image evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/weave-test-stack-evidence"
          source_dir="$RUNNER_TEMP/weave-isolated-source-evidence"
          rm -rf -- "$source_dir"
          mkdir -p "$evidence_dir" "$source_dir"
          export WEAVE_TEST_STACK_EVIDENCE_DIR="$evidence_dir"
          echo "WEAVE_TEST_STACK_EVIDENCE_DIR=$evidence_dir" >>"$GITHUB_ENV"
          gh run download "$ISOLATED_E2E_RUN_ID" \
            --name weave-live-stack-acceptance-evidence \
            --dir "$source_dir"
          expected_mapping="$source_dir/candidate-source-mapping.json"
          test -s "$expected_mapping" || {
            echo "::error::The isolated E2E run has no candidate image mapping." >&2
            exit 1
          }
          git fetch --no-tags --prune origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          python3 tools/candidate_source_mapping.py \
            --repository . \
            --lane-candidate "$WEAVE_CANDIDATE_COMMIT" \
            --expected-mapping "$expected_mapping" \
            --verify-local-images \
            --github-env "$GITHUB_ENV" \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/candidate-source-mapping.json"
          rm -rf -- "$source_dir"

      - name: Bind reviewed persistent test context
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          coordinates="$(PYTHONPATH=./scripts python3 - <<'PY'
          import os
          import stat
          from pathlib import Path
          from compose_env import load_context

          reviewed = Path(os.environ["WEAVE_TEST_REVIEWED_ENV_FILE"])
          metadata = reviewed.stat()
          if (not reviewed.is_absolute() or reviewed.is_symlink() or not reviewed.is_file()
                  or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) not in {0o444, 0o644}):
              raise SystemExit("reviewed test environment must be root-owned mode 0444 or 0644")
          context = load_context("test", Path("."), str(reviewed))
          if context.env["WEAVE_DEPLOYMENT_CONTEXT"] != "persistent-adoption":
              raise SystemExit("persistent dogfood requires test + persistent-adoption")
          print(context.generated_root)
          print(context.secret_root)
          print(context.tls_root)
          PY
          )"
          generated_root="$(sed -n '1p' <<<"$coordinates")"
          secret_root="$(sed -n '2p' <<<"$coordinates")"
          tls_root="$(sed -n '3p' <<<"$coordinates")"
          [[ "$generated_root" == /* && "$secret_root" == /* && "$tls_root" == /* ]] || {
            echo "::error::Persistent state roots must be absolute." >&2
            exit 1
          }
          mkdir -p "$generated_root" "$secret_root" "$tls_root"
          chmod 700 "$generated_root" "$secret_root" "$tls_root"
          {
            echo "WEAVE_GENERATED_ROOT=$generated_root"
            echo "WEAVE_SECRET_ROOT=$secret_root"
            echo "WEAVE_TLS_ROOT=$tls_root"
          } >>"$GITHUB_ENV"

      - name: Gate persistent resource adoption on private restore evidence
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          preflight="$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-adoption-preflight.json"
          ./compose.sh test adoption-check >"$preflight"
          jq -e '
            .schemaVersion == "weave.compose-adoption-preflight.v1" and
            .profile == "test" and
            .deploymentContext == "persistent-adoption" and
            .supportSafe == true and
            .containsSecretValues == false
          ' "$preflight" >/dev/null
          if jq -e '.adoptionRequired == true' "$preflight" >/dev/null; then
            jq -e '.databaseVolumePresent == true' "$preflight" >/dev/null || {
              echo "::error::Unowned persistent resources exist without the database required for a restore rehearsal." >&2
              exit 1
            }
            mkdir -p "$WEAVE_TEST_BACKUP_ROOT"
            chmod 700 "$WEAVE_TEST_BACKUP_ROOT"
            WEAVE_BACKUP_ROOT="$WEAVE_TEST_BACKUP_ROOT" \
              ./adoption-rehearsal.sh test
            receipt="$WEAVE_GENERATED_ROOT/adoption/adoption-receipt.json"
            jq -e \
              --arg candidate "$CANDIDATE_SHA" '
                .schemaVersion == "weave.compose-adoption-receipt.v1" and
                .profile == "test" and
                .candidateCommit == $candidate and
                .backupVerified == true and
                .isolatedRestoreVerified == true and
                .supportSafe == true and
                .containsSecretValues == false
              ' "$receipt" >/dev/null
            cp "$receipt" "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-adoption-receipt.json"
            echo "WEAVE_ADOPTION_RECEIPT=$receipt" >>"$GITHUB_ENV"
          fi

      - name: Ensure local Weave hostnames resolve
        run: |
          set -euo pipefail
          hosts=(weave.test api.weave.test auth.weave.test files.weave.test matrix.weave.test admin.weave.test mail.weave.test)
          missing=()
          for host in "${hosts[@]}"; do
            dscacheutil -q host -a name "$host" | grep -q 'ip_address:' || missing+=("$host")
          done
          if (( ${#missing[@]} > 0 )); then
            line="127.0.0.1 ${missing[*]}"
            sudo -n true 2>/dev/null || {
              echo "::error::Configure runner DNS or passwordless sudo for: $line" >&2
              exit 1
            }
            printf '%s\n' "$line" | sudo tee -a /etc/hosts >/dev/null
            sudo dscacheutil -flushcache || true
          fi

      - name: Apply and verify the persistent test profile
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          ./compose.sh test secrets-init
          ./compose.sh test render
          ./compose.sh test config >"$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-first.json"
          ./compose.sh test up
          ./compose.sh test identity-verify
          cp "$WEAVE_GENERATED_ROOT/identity-ops/identity-ops.json" \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/identity-first-verify.json"
          ./operator-check.sh test

      - name: Prove repeatability and an empty second identity plan
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          ./compose.sh test render
          ./compose.sh test config >"$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-second.json"
          cmp -s \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-first.json" \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-second.json" || {
              echo "::error::The normalized persistent Compose model drifted." >&2
              exit 1
            }
          ./compose.sh test identity-plan
          cp "$WEAVE_GENERATED_ROOT/identity-ops/identity-ops.json" \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/identity-second-plan.json"
          jq -e '.command == "plan" and .operationCount == 0' \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/identity-second-plan.json" >/dev/null || {
              echo "::error::The second Identity Ops plan is not empty." >&2
              exit 1
            }
          ./compose.sh test up
          ./compose.sh test identity-verify
          ./operator-check.sh test
          jq -n '{
            schemaVersion:"weave.persistent-test-idempotence.v1",
            runtimeProfile:"test",
            deploymentContext:"persistent-adoption",
            composeModelStable:true,
            identitySecondPlanEmpty:true,
            supportSafe:true,
            containsSecretValues:false
          }' >"$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-test-idempotence.json"

      - name: Generate support-safe diagnostics
        if: always()
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          if [[ -n "${WEAVE_TEST_STACK_EVIDENCE_DIR:-}" ]]; then
            WEAVE_SUPPORT_BUNDLE_RUN_CHECKS=false \
              ./support-bundle.sh test "$WEAVE_TEST_STACK_EVIDENCE_DIR/support-bundle"
          fi

      - name: Upload persistent test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weave-persistent-test-evidence
          path: ${{ env.WEAVE_TEST_STACK_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
