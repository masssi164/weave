name: Test Stack Deploy
run-name: Test Stack Deploy ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}

on:
  workflow_run:
    workflows:
      - Live Stack Product Flow
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact dogfood lane commit with successful manifest-bound live evidence"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  packages: read

concurrency:
  group: weave-live-mac-mini-exclusive
  cancel-in-progress: false

jobs:
  deploy-test-stack:
    name: Fresh Start and verify persistent dogfood
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'dogfood' &&
       github.event.workflow_run.conclusion == 'success')
    environment: dogfood
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 120
    env:
      EXPECTED_RUNNER_NAME: weave-live-mac-mini
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      LANE_CANDIDATE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
      ISOLATED_E2E_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      WEAVE_ENV_FILE: ${{ vars.WEAVE_DOGFOOD_REVIEWED_ENV_FILE || vars.WEAVE_KEYCLOAK_REVIEWED_ENV_FILE }}
      WEAVE_DOGFOOD_BACKUP_ROOT: ${{ vars.WEAVE_DOGFOOD_BACKUP_ROOT }}
      WEAVE_E2E_STACK_SCOPE: persistent
      WEAVE_DOGFOOD_MEMBER_USERNAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_USERNAME }}
      WEAVE_DOGFOOD_MEMBER_EMAIL: ${{ secrets.WEAVE_DOGFOOD_MEMBER_EMAIL }}
      WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME: ${{ vars.WEAVE_DOGFOOD_MEMBER_DISPLAY_NAME }}
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/canonical-weave-specs
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify protected persistent deployment request
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="$RUNNER_TEMP/weave-test-stack-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ ! -e "$evidence_dir" && ! -L "$evidence_dir" ]] || {
            echo "::error::The run-scoped persistent evidence root already exists." >&2
            exit 1
          }
          install -d -m 700 "$evidence_dir"
          jq -n \
            '{schemaVersion:"weave.test-stack-run-context.v1",phase:"initialized",supportSafe:true,containsSecretValues:false}' \
            > "$evidence_dir/run-context.json"
          echo "WEAVE_TEST_STACK_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          [[ "$LANE_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Persistent deployment requires an exact lowercase dogfood lane SHA." >&2
            exit 1
          }
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]] || {
            echo "::error::Persistent deployment must run on $EXPECTED_RUNNER_NAME." >&2
            exit 1
          }
          [[ "${WEAVE_ENV_FILE:-}" == /* ]] || {
            echo "::error::Persistent deployment requires one absolute reviewed dogfood environment path." >&2
            exit 1
          }
          receipt="$evidence_dir/.run-context.json.tmp"
          jq -n \
            --arg lane "$LANE_CANDIDATE_COMMIT" \
            '{schemaVersion:"weave.test-stack-run-context.v1",laneCandidateCommit:$lane,phase:"request-validated",supportSafe:true,containsSecretValues:false}' \
            > "$receipt"
          mv "$receipt" "$evidence_dir/run-context.json"

      - name: Check out exact dogfood lane candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.LANE_CANDIDATE_COMMIT }}
          fetch-depth: 0

      - name: Resolve pinned specification corpus
        id: spec-corpus
        run: |
          set -euo pipefail
          spec_commit="$(jq -er '.specCorpus.gitCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' specs/weave-specs.lock.json)"
          spec_digest="sha256:$(shasum -a 256 specs/weave-specs.lock.json | awk '{print $1}')"
          {
            printf 'commit=%s\n' "$spec_commit"
            printf 'digest=%s\n' "$spec_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec-corpus.outputs.commit }}
          path: canonical-weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify successful exact-lane isolated E2E source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            source_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ISOLATED_E2E_RUN_ID}")"
            [[ "$(jq -r .name <<<"$source_run")" == "Live Stack Product Flow" && \
               "$(jq -r .conclusion <<<"$source_run")" == success && \
               "$(jq -r .head_sha <<<"$source_run")" == "$LANE_CANDIDATE_COMMIT" ]] || {
              echo "::error::Deployment source is not successful exact-lane live evidence." >&2
              exit 1
            }
          else
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/live-stack-e2e.yml/runs?head_sha=${LANE_CANDIDATE_COMMIT}&status=completed&per_page=30")"
            ISOLATED_E2E_RUN_ID="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' <<<"$runs")"
            [[ -n "$ISOLATED_E2E_RUN_ID" ]] || {
              echo "::error::No successful isolated live run targets ${LANE_CANDIDATE_COMMIT}." >&2
              exit 1
            }
            echo "ISOLATED_E2E_RUN_ID=$ISOLATED_E2E_RUN_ID" >> "$GITHUB_ENV"
          fi
          git fetch --no-tags --prune origin \
            '+refs/heads/dev:refs/remotes/origin/dev' \
            '+refs/heads/dogfood:refs/remotes/origin/dogfood'
          git merge-base --is-ancestor "$LANE_CANDIDATE_COMMIT" origin/dogfood || {
            echo "::error::Persistent lane candidate is not contained in origin/dogfood." >&2
            exit 1
          }

      - name: Consume immutable manifest and exact isolated image evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="${WEAVE_TEST_STACK_EVIDENCE_DIR:?}"
          source_dir="$RUNNER_TEMP/weave-live-source-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ -d "$evidence_dir" && ! -L "$evidence_dir" ]] || {
            echo "::error::The run-scoped persistent evidence root is unsafe." >&2
            exit 1
          }
          [[ ! -e "$source_dir" && ! -L "$source_dir" ]] || {
            echo "::error::The run-scoped live-source evidence root already exists." >&2
            exit 1
          }
          install -d -m 700 "$source_dir"
          gh run download "$ISOLATED_E2E_RUN_ID" \
            --name weave-live-stack-acceptance-evidence \
            --dir "$source_dir"
          for required in candidate-source-mapping.json candidate-manifest.json candidate-manifest.json.sha256 weave-test-app-evidence.json teardown-evidence.json; do
            test -s "$source_dir/$required" || {
              echo "::error::The isolated live artifact is missing ${required}." >&2
              exit 1
            }
          done
          cp "$source_dir/candidate-manifest.json" "$source_dir/candidate-manifest.json.sha256" "$evidence_dir/"
          python3 tools/candidate_source_mapping.py \
            --repository . \
            --lane-candidate "$LANE_CANDIDATE_COMMIT" \
            --expected-mapping "$source_dir/candidate-source-mapping.json" \
            --verify-local-images \
            --output "$evidence_dir/candidate-source-mapping.json"
          ./gradlew --no-daemon dogfoodCandidateCheck \
            "-PcandidateManifest=$evidence_dir/candidate-manifest.json"
          source_candidate="$(jq -er .sourceCandidateCommit "$evidence_dir/candidate-source-mapping.json")"
          [[ "$(jq -er .commit "$evidence_dir/candidate-manifest.json")" == "$source_candidate" ]]
          manifest_sha="$(shasum -a 256 "$evidence_dir/candidate-manifest.json" | awk '{print $1}')"
          [[ "$(awk 'NR == 1 {print $1}' "$evidence_dir/candidate-manifest.json.sha256")" == "$manifest_sha" ]]
          component_ref() {
            jq -er --arg component "$1" '.images[] | select(.component == $component) | .reference' \
              "$evidence_dir/candidate-manifest.json"
          }
          generation="fresh-${source_candidate:0:12}"
          {
            echo "WEAVE_CANDIDATE_COMMIT=$source_candidate"
            echo "WEAVE_IMAGE_SOURCE_COMMIT=$source_candidate"
            echo "WEAVE_CANDIDATE_MANIFEST_DIGEST=sha256:$manifest_sha"
            echo "WEAVE_CANDIDATE_MANIFEST=$evidence_dir/candidate-manifest.json"
            echo "WEAVE_RESOURCE_GENERATION=$generation"
            echo "WEAVE_BACKEND_IMAGE=$(component_ref server)"
            echo "WEAVE_MCP_IMAGE=$(component_ref mcp-server)"
            echo "WEAVE_KEYCLOAK_IMAGE=$(component_ref keycloak-runtime)"
          } >> "$GITHUB_ENV"
          rm -rf -- "$source_dir"

      - name: Bind the reviewed persistent-dogfood context
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          coordinates="$(PYTHONPATH=./scripts python3 - <<'PY'
          import os
          import stat
          from pathlib import Path
          from compose_env import load_context

          reviewed = Path(os.environ["WEAVE_ENV_FILE"])
          metadata = reviewed.stat()
          if (not reviewed.is_absolute() or reviewed.is_symlink() or not reviewed.is_file()
                  or metadata.st_uid != os.getuid() or stat.S_IMODE(metadata.st_mode) != 0o600):
              raise SystemExit("reviewed dogfood environment must be a runner-owned regular mode-0600 file")
          context = load_context("dogfood", Path("."), str(reviewed))
          if context.env["WEAVE_DEPLOYMENT_CONTEXT"] != "persistent-dogfood":
              raise SystemExit("persistent dogfood requires the dogfood environment and persistent-dogfood context")
          print(context.generated_root)
          print(context.secret_root)
          print(context.tls_root)
          print(context.env["WEAVE_COMPOSE_PROJECT"])
          print(context.env["WEAVE_BACKEND_HOST_PORT"])
          PY
          )"
          generated_root="$(sed -n '1p' <<<"$coordinates")"
          secret_root="$(sed -n '2p' <<<"$coordinates")"
          tls_root="$(sed -n '3p' <<<"$coordinates")"
          compose_project="$(sed -n '4p' <<<"$coordinates")"
          backend_port="$(sed -n '5p' <<<"$coordinates")"
          [[ "$generated_root" == /* && "$secret_root" == /* && "$tls_root" == /* ]]
          mkdir -p "$generated_root" "$secret_root" "$tls_root"
          chmod 700 "$generated_root" "$secret_root" "$tls_root"
          {
            echo "WEAVE_GENERATED_ROOT=$generated_root"
            echo "WEAVE_SECRET_ROOT=$secret_root"
            echo "WEAVE_TLS_ROOT=$tls_root"
            echo "WEAVE_COMPOSE_PROJECT=$compose_project"
            echo "WEAVE_BACKEND_HOST_PORT=$backend_port"
          } >> "$GITHUB_ENV"

      - name: Create or reuse the exact private backup, restore proof, and Fresh Start plan
        id: fresh-plan
        run: |
          set -euo pipefail
          backup_root="${WEAVE_DOGFOOD_BACKUP_ROOT:-$HOME/.weave/dogfood/backups}"
          [[ "$backup_root" == /* ]]
          pending_root="$backup_root/fresh-start/pending/$LANE_CANDIDATE_COMMIT"
          private_root="$pending_root/private"
          receipt="$pending_root/FreshStartBackupRehearsal.json"
          plan="$pending_root/plan.json"
          mkdir -p "$private_root" "$pending_root"
          chmod 700 "$backup_root" "$backup_root/fresh-start" "$backup_root/fresh-start/pending" "$pending_root" "$private_root"
          if [[ ! -s "$receipt" ]]; then
            WEAVE_BACKUP_ROOT="$private_root" \
              ./gradlew --no-daemon freshStartBackupRehearsal \
                -PfreshStartBackupProfile=dogfood \
                "-PfreshStartBackupReceipt=$receipt"
          fi
          jq -e \
            --arg source "$WEAVE_CANDIDATE_COMMIT" \
            --arg manifest "$WEAVE_CANDIDATE_MANIFEST_DIGEST" '
              .schemaVersion == "weave.fresh-start-private-backup-rehearsal.v1" and
              .candidateCommit == $source and
              .candidateManifestDigest == $manifest and
              .backupVerified == true and
              .isolatedRestoreVerified == true and
              .recoveryBoundary == "private-backup-only-no-adoption" and
              .legacyStateMigrated == false and
              .adoptionAuthorized == false and
              .cleanupVerified == true and
              .supportSafe == true and
              .containsSecretValues == false
            ' "$receipt" >/dev/null
          operation_nonce="dogfood-fresh-${WEAVE_CANDIDATE_COMMIT:0:12}-${WEAVE_CANDIDATE_MANIFEST_DIGEST:7:12}"
          if [[ ! -s "$plan" ]]; then
            ./gradlew --no-daemon freshStartPlan \
              -PfreshStartEnvironment=persistent-dogfood \
              -PfreshStartScope=persistent \
              -PfreshStartStack=weave \
              -PfreshStartNamespace=weave \
              -PretiredGeneration=legacy-pre-fresh \
              "-PtargetGeneration=$WEAVE_RESOURCE_GENERATION" \
              "-PspecCommit=${{ steps.spec-corpus.outputs.commit }}" \
              "-PspecDigest=${{ steps.spec-corpus.outputs.digest }}" \
              "-PcandidateCommit=$WEAVE_CANDIDATE_COMMIT" \
              "-PcandidateManifestDigest=$WEAVE_CANDIDATE_MANIFEST_DIGEST" \
              "-PoperationNonce=$operation_nonce" \
              -PrecoveryDecision=verified-backup \
              "-PrecoveryEvidenceRef=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "-PrecoveryReceipt=$receipt" \
              "-PfreshStartManifest=$plan"
          fi
          plan_sha="$(shasum -a 256 "$plan" | awk '{print $1}')"
          [[ "$(awk 'NR == 1 {print $1}' "$plan.sha256")" == "$plan_sha" ]]
          jq -e \
            --arg source "$WEAVE_CANDIDATE_COMMIT" \
            --arg manifest "$WEAVE_CANDIDATE_MANIFEST_DIGEST" \
            --arg generation "$WEAVE_RESOURCE_GENERATION" \
            --arg nonce "$operation_nonce" '
              .schemaVersion == "weave.infra.fresh-start-plan.v1" and
              .environment == "persistent-dogfood" and
              .scope == "persistent" and
              .candidateCommit == $source and
              .candidateManifestDigest == $manifest and
              .targetGeneration == $generation and
              .operationNonce == $nonce and
              .recoveryDecision.decision == "verified-backup" and
              (.targets | length) > 0 and
              .supportSafe == true
            ' "$plan" >/dev/null
          cp "$plan" "$plan.sha256" "$receipt" "$WEAVE_TEST_STACK_EVIDENCE_DIR/"
          jq -n \
            --arg lane "$LANE_CANDIDATE_COMMIT" \
            --arg source "$WEAVE_CANDIDATE_COMMIT" \
            --arg manifest "$WEAVE_CANDIDATE_MANIFEST_DIGEST" \
            --arg planSha "sha256:$plan_sha" \
            --arg confirmation "DELETE_OLD_WEAVE:$plan_sha" \
            '{schemaVersion:"weave.fresh-start-plan-status.v1",laneCandidateCommit:$lane,sourceCandidateCommit:$source,candidateManifestDigest:$manifest,planSha256:$planSha,requiredConfirmation:$confirmation,backupVerified:true,isolatedRestoreVerified:true,mutationPerformed:false,legacyStateMigrated:false,adoptionAuthorized:false,supportSafe:true,containsSecretValues:false}' \
            > "$WEAVE_TEST_STACK_EVIDENCE_DIR/fresh-start-plan-status.json"
          {
            echo "plan=$plan"
            echo "plan_sha=$plan_sha"
            echo "confirmation=DELETE_OLD_WEAVE:$plan_sha"
            echo "receipt=$receipt"
            echo "pending_root=$pending_root"
          } >> "$GITHUB_OUTPUT"
          {
            echo "WEAVE_FRESH_START_PLAN=$plan"
            echo "WEAVE_FRESH_START_PLAN_SHA=$plan_sha"
            echo "WEAVE_FRESH_START_CONFIRMATION=DELETE_OLD_WEAVE:$plan_sha"
            echo "WEAVE_FRESH_START_PENDING_ROOT=$pending_root"
          } >> "$GITHUB_ENV"

      - name: Resolve exact destructive approval from delivery issue
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          comments="$RUNNER_TEMP/weave-fresh-start-comments.json"
          umask 077
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues/1266/comments?per_page=100" > "$comments"
          approval_id="$(jq -r \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg confirmation "$WEAVE_FRESH_START_CONFIRMATION" '
              [ .[]
                | select(.user.login == $owner)
                | select((.body | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | any(. == $confirmation)))
              ][-1].id // empty
            ' "$comments")"
          if [[ -z "$approval_id" ]]; then
            echo "Fresh Start remains plan-only; exact repository-owner confirmation is absent."
            exit 0
          fi
          approval="$WEAVE_FRESH_START_PENDING_ROOT/approval.json"
          APPROVAL_PATH="$approval" \
          APPROVAL_EVIDENCE_REF="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/1266" \
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          source = Path("infra/weave-workspace/fresh-start.py")
          spec = importlib.util.spec_from_file_location("fresh_start", source)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          plan = json.loads(Path(os.environ["WEAVE_FRESH_START_PLAN"]).read_text(encoding="utf-8"))
          payload = {
              "schemaVersion": "weave.infra.fresh-start-approval.v1",
              "supportSafe": True,
              "decision": "approved",
              "environment": plan["environment"],
              "planSha256": os.environ["WEAVE_FRESH_START_PLAN_SHA"],
              "operationNonce": plan["operationNonce"],
              "approverRole": "release-owner",
              "evidenceRef": os.environ["APPROVAL_EVIDENCE_REF"],
          }
          path = Path(os.environ["APPROVAL_PATH"])
          path.write_bytes(module.canonical_json_bytes(payload))
          path.chmod(0o600)
          PY
          cp "$approval" "$WEAVE_TEST_STACK_EVIDENCE_DIR/fresh-start-approval.json"
          {
            echo "approved=true"
            echo "approval=$approval"
          } >> "$GITHUB_OUTPUT"

      - name: Stop before mutation without exact Fresh Start approval
        if: steps.approval.outputs.approved != 'true'
        run: |
          echo "::error::AWAITING_DESTRUCTIVE_APPROVAL ${WEAVE_FRESH_START_CONFIRMATION}" >&2
          exit 1

      - name: Apply only the exact approved Fresh Start plan
        if: steps.approval.outputs.approved == 'true'
        run: |
          set -euo pipefail
          apply_evidence="$WEAVE_FRESH_START_PENDING_ROOT/apply-evidence.json"
          recreation_evidence="$WEAVE_FRESH_START_PENDING_ROOT/recreation-evidence.json"
          archive_root="$WEAVE_FRESH_START_PENDING_ROOT/archive"
          ./gradlew --no-daemon freshStartApply \
            "-PfreshStartManifest=$WEAVE_FRESH_START_PLAN" \
            "-Pconfirm=$WEAVE_FRESH_START_CONFIRMATION" \
            "-PapprovalEvidence=${{ steps.approval.outputs.approval }}" \
            "-PfreshStartEvidence=$apply_evidence" \
            "-PfreshStartApplyEvidence=$apply_evidence" \
            "-PcandidateManifest=$WEAVE_CANDIDATE_MANIFEST" \
            "-PfreshStartArchiveRoot=$archive_root" \
            "-PfreshStartRecreationEvidence=$recreation_evidence"
          cp "$apply_evidence" "$apply_evidence.sha256" "$recreation_evidence" "$recreation_evidence.sha256" \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/"

      - name: Ensure local Weave hostnames resolve
        if: steps.approval.outputs.approved == 'true'
        run: |
          set -euo pipefail
          hosts=(weave.test api.weave.test auth.weave.test files.weave.test matrix.weave.test admin.weave.test mail.weave.test)
          missing=()
          for host in "${hosts[@]}"; do
            dscacheutil -q host -a name "$host" | grep -q 'ip_address:' || missing+=("$host")
          done
          if (( ${#missing[@]} > 0 )); then
            line="127.0.0.1 ${missing[*]}"
            sudo -n true 2>/dev/null || {
              echo "::error::Configure runner DNS or passwordless sudo for: $line" >&2
              exit 1
            }
            printf '%s\n' "$line" | sudo tee -a /etc/hosts >/dev/null
            sudo dscacheutil -flushcache || true
          fi

      - name: Prove canonical lifecycle convergence and stable realm artifacts
        if: steps.approval.outputs.approved == 'true'
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          baseline="$WEAVE_GENERATED_ROOT/keycloak/import/weave-realm.json"
          migrations="$WEAVE_GENERATED_ROOT/keycloak/migrations/manifest.json"
          [[ -f "$baseline" && ! -L "$baseline" && \
             -f "$migrations" && ! -L "$migrations" ]] || {
            echo "::error::Rendered persistent realm artifacts are missing or unsafe." >&2
            exit 1
          }
          expected_baseline="$(jq -er .realmArtifacts.baselineDigest "$WEAVE_CANDIDATE_MANIFEST")"
          expected_migrations="$(jq -er .realmArtifacts.migrationBundleDigest "$WEAVE_CANDIDATE_MANIFEST")"
          actual_baseline="sha256:$(shasum -a 256 "$baseline" | awk '{print $1}')"
          actual_migrations="sha256:$(shasum -a 256 "$migrations" | awk '{print $1}')"
          [[ "$actual_baseline" == "$expected_baseline" && \
             "$actual_migrations" == "$expected_migrations" ]] || {
            echo "::error::Rendered persistent realm artifacts differ from the candidate manifest." >&2
            exit 1
          }
          ./compose.sh dogfood config > "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-first.json"
          cp "$baseline" \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/weave-realm-first.json"
          cp "$migrations" \
            "$WEAVE_TEST_STACK_EVIDENCE_DIR/realm-migrations-first.json"
          ./operator-check.sh dogfood
          ./install.sh dogfood
          ./compose.sh dogfood config > "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-second.json"
          cmp -s "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-first.json" "$WEAVE_TEST_STACK_EVIDENCE_DIR/compose-model-second.json"
          cmp -s "$WEAVE_TEST_STACK_EVIDENCE_DIR/weave-realm-first.json" \
            "$baseline"
          cmp -s "$WEAVE_TEST_STACK_EVIDENCE_DIR/realm-migrations-first.json" \
            "$migrations"
          ./operator-check.sh dogfood
          jq -n '{schemaVersion:"weave.persistent-test-idempotence.v3",runtimeProfile:"dogfood",deploymentContext:"persistent-dogfood",noChanges:true,composeModelStable:true,realmArtifactsUnchanged:true,supportSafe:true,containsSecretValues:false}' \
            > "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-test-idempotence.json"

      - name: Create a new invitation through the normal identity flow
        if: steps.approval.outputs.approved == 'true'
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          ./dogfood-member.sh ensure \
            --subject-file "$WEAVE_GENERATED_ROOT/dogfood-member.subject" \
            --evidence-file "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-invitation.json"
          jq -e '
            .schemaVersion == "weave.dogfood.persistent-member.v1" and
            .state == "pending" and
            .action == "created_and_activation_sent" and
            .activation.mailSent == true and
            .activation.mailVisible == true and
            .supportSafe == true
          ' "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-member-invitation.json" >/dev/null

      - name: Verify running image identities and assemble deployment evidence
        if: steps.approval.outputs.approved == 'true'
        run: |
          set -euo pipefail
          mapping="$WEAVE_TEST_STACK_EVIDENCE_DIR/candidate-source-mapping.json"
          runtime="$WEAVE_TEST_STACK_EVIDENCE_DIR/runtime-image-observation.json"
          observe() {
            local runtime_name="$1" container="$2" component="$3" expected observed reference source
            expected="$(jq -er --arg name "$runtime_name" '.images[$name]' "$mapping")"
            reference="$(jq -er --arg component "$component" '.images[] | select(.component == $component) | .reference' "$WEAVE_CANDIDATE_MANIFEST")"
            if [[ -n "$container" ]]; then
              observed="$(docker container inspect --format '{{.Image}}' "$container")"
            else
              observed="$(docker image inspect --format '{{.Id}}' "$reference")"
            fi
            source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$reference")"
            [[ "$expected" == "$observed" && "$source" == "$WEAVE_CANDIDATE_COMMIT" ]]
            jq -n --arg reference "$reference" --arg expected "$expected" --arg observed "$observed" --arg source "$source" \
              '{reference:$reference,expectedImageId:$expected,observedImageId:$observed,sourceCommit:$source,matches:true}'
          }
          jq -n \
            --arg source "$WEAVE_CANDIDATE_COMMIT" \
            --argjson backend "$(observe backend weave-backend server)" \
            --argjson keycloak "$(observe keycloak weave-keycloak keycloak-runtime)" \
            --argjson mcp "$(observe mcp weave-mcp-server mcp-server)" \
            '{schemaVersion:"weave.runtime-image-observation.v1",sourceCandidateCommit:$source,images:{backend:$backend,keycloak:$keycloak,mcp:$mcp},supportSafe:true,containsSecretValues:false}' \
            > "$runtime"
          python3 tools/dogfood_deployment_evidence.py collect-provider-health \
            --actuator-metrics-url "http://127.0.0.1:${WEAVE_BACKEND_HOST_PORT}/actuator/metrics" \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/provider-health-summary.json"
          jq -n \
            --arg lane "$LANE_CANDIDATE_COMMIT" \
            --arg source "$WEAVE_CANDIDATE_COMMIT" \
            --arg manifest "$WEAVE_CANDIDATE_MANIFEST_DIGEST" \
            --arg planSha "sha256:$WEAVE_FRESH_START_PLAN_SHA" '
              {schemaVersion:"weave.fresh-start-cut-report.v1",laneCandidateCommit:$lane,sourceCandidateCommit:$source,candidateManifestDigest:$manifest,planSha256:$planSha,status:"passed",schemaConverged:true,realmArtifactsVerified:true,imagesVerified:true,newInvitationPending:true,backupVerified:true,isolatedRestoreVerified:true,legacyStateMigrated:false,adoptionAuthorized:false,supportSafe:true,containsSecretValues:false}
            ' > "$WEAVE_TEST_STACK_EVIDENCE_DIR/fresh-start-cut-report.json"
          backend_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$WEAVE_BACKEND_IMAGE")"
          python3 tools/dogfood_deployment_evidence.py assemble \
            --candidate-commit "$LANE_CANDIDATE_COMMIT" \
            --candidate-manifest-digest "$WEAVE_CANDIDATE_MANIFEST_DIGEST" \
            --candidate-manifest "$WEAVE_CANDIDATE_MANIFEST" \
            --backend-version "$backend_version" \
            --backend-build-number "${WEAVE_CANDIDATE_COMMIT:0:12}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --fresh-start-cut-report "$WEAVE_TEST_STACK_EVIDENCE_DIR/fresh-start-cut-report.json" \
            --provider-health "$WEAVE_TEST_STACK_EVIDENCE_DIR/provider-health-summary.json" \
            --deployment-idempotence "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-test-idempotence.json" \
            --candidate-source-mapping "$mapping" \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/dogfood-deployment-evidence.json" \
            --require-passed
          python3 tools/test_stack_manifest.py \
            --candidate-source-mapping "$mapping" \
            --candidate-manifest "$WEAVE_CANDIDATE_MANIFEST" \
            --runtime-image-evidence "$runtime" \
            --fresh-start-cut-report "$WEAVE_TEST_STACK_EVIDENCE_DIR/fresh-start-cut-report.json" \
            --deployment-idempotence "$WEAVE_TEST_STACK_EVIDENCE_DIR/persistent-test-idempotence.json" \
            --provider-health "$WEAVE_TEST_STACK_EVIDENCE_DIR/provider-health-summary.json" \
            --compose-project "$WEAVE_COMPOSE_PROJECT" \
            --generation "$WEAVE_RESOURCE_GENERATION" \
            --live-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ISOLATED_E2E_RUN_ID" \
            --deployment-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$WEAVE_TEST_STACK_EVIDENCE_DIR/test-stack-manifest.json"

      - name: Generate support-safe diagnostics
        if: always()
        working-directory: infra/weave-workspace
        run: |
          set -euo pipefail
          if [[ -n "${WEAVE_TEST_STACK_EVIDENCE_DIR:-}" ]]; then
            WEAVE_SUPPORT_BUNDLE_RUN_CHECKS=false \
              ./support-bundle.sh dogfood "$WEAVE_TEST_STACK_EVIDENCE_DIR/support-bundle" || true
          fi

      - name: Upload persistent dogfood evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weave-test-stack-evidence
          path: ${{ env.WEAVE_TEST_STACK_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
