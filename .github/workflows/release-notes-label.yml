name: Release Notes Labels

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-notes-labels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_notes_label_check:
    name: Release Notes Label Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate temporary release-notes label context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels_json="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
          PR_LABELS_JSON="$labels_json" ./gradlew --no-daemon releaseNotesLabelCheck
