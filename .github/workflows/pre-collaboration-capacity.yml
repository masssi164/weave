name: Pre-collaboration Mac capacity
on:
  push:
    branches: [diagnostic/cache-prune-preflight-20261028]
    paths: [.github/workflows/pre-collaboration-capacity.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - name: Read host reserve and unreferenced Weave image identities only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          if os.environ.get('RUNNER_NAME') != 'weave-live-mac-mini' or os.environ.get('GITHUB_REPOSITORY') != 'masssi164/weave':
              raise SystemExit('Unexpected runner')
          def docker(*arguments):
              return subprocess.check_output(['docker', *arguments], text=True, timeout=30)
          context = docker('context', 'show').strip()
          endpoint = json.loads(docker('context', 'inspect', context))[0]['Endpoints']['docker']['Host']
          if not endpoint.startswith('unix:///') or os.environ.get('DOCKER_HOST', '').startswith(('tcp:', 'ssh:')):
              raise SystemExit('Only the selected local daemon is permitted')
          ids = docker('ps', '-aq', '--no-trunc').split()
          used = set()
          for identifier in ids:
              used.add(docker('inspect', '--format', '{{.Image}}', identifier).strip())
          rows = []
          for identifier in sorted(set(docker('image', 'ls', '-aq', '--no-trunc').split())):
              if identifier in used:
                  continue
              image = json.loads(docker('image', 'inspect', identifier))[0]
              tags = image.get('RepoTags') or []
              digests = image.get('RepoDigests') or []
              if not tags or digests or not all(re.fullmatch(r'weave-[a-z0-9-]+:[A-Za-z0-9_.-]+', tag) for tag in tags):
                  continue
              rows.append({'imageId': identifier, 'tags': tags, 'created': image.get('Created'),
                           'sizeBytes': image.get('Size'), 'architecture': image.get('Architecture')})
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          ca = Path.home() / '.local/share/weave/native-acceptance-ca'
          report = {'readOnly': True, 'freeBytes': shutil.disk_usage(workspace).free,
                    'nativeCaDirectoryAvailable': ca.is_dir() and not ca.is_symlink(),
                    'unreferencedLocalWeaveImages': rows, 'containerCount': len(ids)}
          print(json.dumps(report, sort_keys=True))
          PY
