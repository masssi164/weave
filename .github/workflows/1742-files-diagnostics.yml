name: Temporary Files diagnostics
on:
  push:
    branches: [feat/1742-collaboration-files-root]
    paths: [.github/workflows/1742-files-diagnostics.yml]
permissions:
  contents: read
concurrency:
  group: files-diagnostics-1742
  cancel-in-progress: false
jobs:
  files:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/feat/1742-collaboration-files-root'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Extend the verified preview boundary to its filename
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          screen = 'client/lib/features/files/presentation/files_screen.dart'
          tests = 'client/test/features/files/files_screen_test.dart'
          expected = {screen: '8cb0d99e26276562297f73ba79d263da16740bc2', tests: 'f2d0889c48ed28bf41b52e5e299c73539629724a'}
          sources = {}
          for name, digest in expected.items():
              path = Path(name)
              raw = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if path.is_symlink() or actual != digest:
                  raise SystemExit('Verified source changed; review before mutation')
              sources[name] = raw.decode()
          old = 'return AlertDialog(\n      title: Text(entry.name),'
          if sources[screen].count(old) != 1:
              raise SystemExit('Unique preview dialog title anchor changed')
          sources[screen] = sources[screen].replace(old, 'return AlertDialog(\n      title: Text(stillAvailable ? entry.name : l10n.filesScreenTitle),', 1)
          assertion = '''
                expect(
                  find.descendant(of: find.byType(AlertDialog), matching: find.text('preview.txt')),
                  findsNothing,
                );'''
          for message in ['Shared route preview bytes.', 'Late revoked preview bytes.']:
              old = f"expect(find.text('{message}'), findsNothing);"
              if sources[tests].count(old) != 1:
                  raise SystemExit('Preview negative assertion changed')
              sources[tests] = sources[tests].replace(old, old + assertion, 1)
          for name, text in sources.items():
              Path(name).write_text(text)
          PY
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Resolve pinned dependencies and format only the changed files
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cd client
          flutter pub get --enforce-lockfile
          cd ..
          dart format client/lib/features/files/presentation/files_screen.dart client/test/features/files/files_screen_test.dart
          git diff --check
      - name: Analyze the final source and test assertions
        working-directory: client
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: flutter analyze --fatal-infos
      - name: Require complete Files location and directory regressions
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          set -euo pipefail
          mkdir -p build/files-finalization
          cd client
          flutter test test/features/files/presentation/files_locations_screen_test.dart test/features/files/files_screen_test.dart --reporter expanded 2>&1 | tee ../build/files-finalization/tests.log
      - name: Publish only the tested redaction and retire temporary tools
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {'client/lib/features/files/presentation/files_screen.dart', 'client/test/features/files/files_screen_test.dart'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit('Unexpected mutation set; refusing publication')
          PY
          git add -- client/lib/features/files/presentation/files_screen.dart client/test/features/files/files_screen_test.dart
          git rm -- .github/workflows/1742-files-diagnostics.yml tools/1742_scoped_files_dialog_patch.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(files): redact revoked preview metadata and retire development helpers'
          git push origin HEAD:refs/heads/feat/1742-collaboration-files-root
          git rev-parse HEAD | tee build/files-finalization/source.txt
          git diff HEAD^ HEAD --stat
      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: files-finalization-${{ github.run_id }}
          path: build/files-finalization/
          if-no-files-found: warn
          retention-days: 3
