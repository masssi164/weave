name: Verify optional prompt workspace priority
on:
  push:
    branches: [diagnostic/1770-password-prompt-budget]
    paths: [.github/workflows/password-prompt-workspace-priority.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/diagnostic/1770-password-prompt-budget'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE: 16ebf90299695d3da2f19be88ad6bfd822c92c7a
      TARGET: fix/1770-password-prompt-budget
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: f1c421cee43727399fb4e777b16a90ea70952c2e
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 16ebf90299695d3da2f19be88ad6bfd822c92c7a
          path: source
          persist-credentials: true
      - name: Apply and test the exact two-file follow-up
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          patch=Path('../diagnostic/.github/diagnostics/password-prompt-workspace-priority.patch').read_text().replace('\n diff --git ', '\ndiff --git ')
          subprocess.run(['git','apply','--check','-'],input=patch,text=True,check=True)
          subprocess.run(['git','apply','-'],input=patch,text=True,check=True)
          PY
          test "$(git hash-object client/tool/ios_browser_driver/BrowserDriver.swift)" = 8a994a607e1ea401c9c3db8f951b30232e55b919
          test "$(git hash-object client/tool/native_qualification_test.py)" = 19661b84d2d3651d46646af300adc223b0ac9932
          python3 client/tool/native_qualification_test.py -v
          python3 client/tool/dual_ios_collaboration_test.py -v
          git diff --check
      - name: Compile the actual Apple XCTest driver without local integration-runner compilation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.5\nBuild version 17F42')"
          xcodebuild build-for-testing -project client/tool/ios_browser_driver/BrowserDriver.xcodeproj -scheme BrowserDriver \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/prompt-driver" CODE_SIGNING_ALLOWED=NO
      - name: Commit only to the existing scoped repair branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$BASE"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf 'client/tool/ios_browser_driver/BrowserDriver.swift\nclient/tool/native_qualification_test.py')"
          git add client/tool/ios_browser_driver/BrowserDriver.swift client/tool/native_qualification_test.py
          git -c user.name='masssi164' -c user.email='95998874+masssi164@users.noreply.github.com' commit -m 'fix: retain real workspace completion priority throughout optional prompt settling'
          git push origin "HEAD:refs/heads/$TARGET"
          printf 'VERIFIED_REPAIR_COMMIT=%s\n' "$(git rev-parse HEAD)"
