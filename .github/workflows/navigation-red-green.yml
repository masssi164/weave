name: Dual iOS navigation red-green regression
on:
  push:
    branches: [diagnostic/dual-ui-failure-20261028]
    paths: [.github/workflows/navigation-red-green.yml]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'masssi164/weave'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Select exact failing regression source and preserve the bounded repair
        run: |
          set -euo pipefail
          cp .github/diagnostics/navigation-tap.patch "$RUNNER_TEMP/repair.patch"
          git fetch --no-tags --depth=1 origin 4dc16728583ff2ad8b3f2faadc3f6348afee5110
          git checkout --detach 4dc16728583ff2ad8b3f2faadc3f6348afee5110
          test "$(git rev-parse HEAD)" = 4dc16728583ff2ad8b3f2faadc3f6348afee5110
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install the pinned native bridge compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Resolve dependencies and format only the new regression
        working-directory: client
        run: |
          flutter pub get
          dart format test/integration_harness/dual_navigation_tap_test.dart
      - name: Prove the unmodified tap fails at the observed framework ambiguity
        working-directory: client
        run: |
          set -euo pipefail
          if flutter test --reporter expanded test/integration_harness/dual_navigation_tap_test.dart > "$RUNNER_TEMP/red.log" 2>&1; then
            cat "$RUNNER_TEMP/red.log"
            echo '::error::The regression did not reproduce the existing failure.'
            exit 1
          fi
          cat "$RUNNER_TEMP/red.log"
          grep -Fq 'ambiguously found multiple matching widgets' "$RUNNER_TEMP/red.log"
          echo 'NAVIGATION_REGRESSION baseline=failed-as-expected reason=ambiguous-unfiltered-finder'
      - name: Apply the minimal repair and run navigation contracts
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
          git diff --check
          cd client
          dart format --output=none --set-exit-if-changed test/integration_harness/dual_navigation_tap_test.dart integration_test/dual_ios_collaboration_test.dart
          flutter test --reporter expanded test/integration_harness/dual_navigation_tap_test.dart test/integration_harness/dual_chat_readiness_test.dart test/features/shell/shell_destination_navigation_test.dart
      - name: Materialize the tested repair and formatter output without changing branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          implementation = 'client/integration_test/dual_ios_collaboration_test.dart'
          regression = 'client/test/integration_harness/dual_navigation_tap_test.dart'
          expected = '2f99b9cd1188ab26df7bef65cb57f199f24f517f'
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == {implementation, regression}
          assert subprocess.check_output(['git', 'hash-object', implementation], text=True).strip() == expected
          for path in (implementation, regression):
              digest = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              request = Request('https://api.github.com/repos/masssi164/weave/git/blobs',
                  data=json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urlopen(request, timeout=30) as response:
                  value = json.load(response)
              assert value['sha'] == digest
              print(json.dumps({'path': path, 'sha': digest, 'branchChanged': False,
                                'regression': 'red-before-green-after'}))
          print('FORMATTED_REGRESSION_SOURCE_BEGIN')
          print(Path(regression).read_text())
          print('FORMATTED_REGRESSION_SOURCE_END')
          PY
