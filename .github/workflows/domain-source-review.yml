name: Domain source review snapshot
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/domain-source-review.yml'
permissions:
  contents: read
jobs:
  source-review:
    if: github.head_ref == 'refactor/1745-domain-ownership' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked architecture inputs only
        shell: bash
        run: |
          git archive --format=zip --output="${RUNNER_TEMP}/domain-source.zip" HEAD \
            server weave-application-core weave-persistence-jpa \
            weave-runtime-provider-adapters weave-runtime-security-adapters \
            weave-mcp-server weave-product-e2e weave-user-api-client weave-admin-api-client \
            gradle gradlew gradlew.bat build.gradle settings.gradle tools docs .github \
            .agents AGENTS.md specs contracts infra mkdocs.yml
          git rev-parse HEAD > "${RUNNER_TEMP}/source-commit.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: domain-source-review
          path: |
            ${{ runner.temp }}/domain-source.zip
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
          if-no-files-found: error
