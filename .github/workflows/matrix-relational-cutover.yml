name: Matrix Relational Cutover

on:
  pull_request:
    paths:
      - '.github/workflows/matrix-relational-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python3 tools/matrix_relational_cutover.py
      - run: ./gradlew :server:compileJava
      - name: Commit cutover
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/main/java/com/massimotter/weave/backend/matrix/MatrixE2eeStateService.java
          git commit -m 'refactor(matrix): use normalized relational E2EE authority'
          git fetch origin ${{ github.head_ref }}
          git rebase origin/${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
