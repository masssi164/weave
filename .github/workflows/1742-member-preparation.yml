name: Temporary member preparation development
on:
  push:
    branches: [feat/1742-member-preparation]
    paths: [.github/workflows/1742-member-preparation.yml]
permissions:
  contents: read
concurrency:
  group: member-preparation-development-1742
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/feat/1742-member-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply all exact reviewed source edits atomically after preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('tools/1742-member-preparation-changes.json').read_text())
          allowed = {
              'docs/dogfood-auth-onboarding-plan.md',
              'infra/weave-workspace/scripts/compose_runtime.py',
              'infra/weave-workspace/tests/dogfood_reset_session_contract_test.py',
              'server/src/main/java/com/massimotter/weave/backend/dogfood/DogfoodPreparationService.java',
              'server/src/main/java/com/massimotter/weave/backend/service/OrganizationIdentityContextResolver.java',
              'server/src/main/java/com/massimotter/weave/backend/service/spaces/DefaultSpaceBootstrapService.java',
              'server/src/test/java/com/massimotter/weave/backend/dogfood/DogfoodPreparationServiceTest.java',
              'server/src/test/java/com/massimotter/weave/backend/service/OrganizationIdentityContextResolverTest.java',
              'server/src/test/java/com/massimotter/weave/backend/service/spaces/DefaultSpaceBootstrapServiceTest.java',
          }
          if len(data['changes']) != len(allowed) or {c['path'] for c in data['changes']} != allowed:
              raise SystemExit('Unexpected mutation scope')
          def blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          staged = {}
          for change in data['changes']:
              path = Path(change['path'])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Unsafe source target')
              raw = path.read_bytes()
              if blob(raw) != change['before']:
                  raise SystemExit('Reviewed source changed: ' + str(path))
              lines = raw.decode().splitlines(keepends=True)
              for edit in reversed(change['edits']):
                  lines[edit['start']:edit['end']] = [edit['text']]
              result = ''.join(lines).encode()
              if blob(result) != change['after']:
                  raise SystemExit('Reviewed result differs: ' + str(path))
              staged[path] = result
          for path, result in staged.items():
              path.write_bytes(result)
          print('Verified and applied all nine exact source changes.')
          PY
          git diff --check
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: masssi164/weave-specs
          ref: f049c0b1879414eb529a3df83a18224407f1a436
          path: .spec-corpus
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Run reset, preparation, restoration and scenario regressions
        env:
          WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/.spec-corpus
        run: |
          set -euo pipefail
          mkdir -p build/member-preparation-verification
          for test in \
            infra/weave-workspace/tests/dogfood_reset_session_contract_test.py \
            infra/weave-workspace/tests/compose_teardown_contract_test.py \
            infra/weave-workspace/tests/owner_bootstrap_lifecycle_contract_test.py \
            infra/weave-workspace/tests/default_space_bootstrap_contract_test.py \
            tools/dogfood_prepare_test.py \
            tools/prepare_member_scenario_test.py; do
            python3 "$test" 2>&1 | tee "build/member-preparation-verification/$(basename "$test").log"
          done
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Run affected JVM identity and declarative-client regressions without JNI
        run: |
          set -euo pipefail
          cat > /tmp/weave-member-preparation.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':server')
              server.tasks.register('memberPreparationRegression', Test) {
                  dependsOn server.tasks.named('testClasses')
                  testClassesDirs = server.sourceSets.test.output.classesDirs
                  classpath = server.sourceSets.test.runtimeClasspath
                  filter {
                      includeTestsMatching '*OrganizationIdentityContextResolverTest'
                      includeTestsMatching '*DogfoodPreparationServiceTest'
                      includeTestsMatching '*DogfoodPreparationProtocolTest'
                      includeTestsMatching '*DefaultSpaceBootstrapServiceTest'
                      includeTestsMatching '*KeycloakIdentityAdminClientTest'
                      includeTestsMatching '*KeycloakIdentityAdminOperationPolicyTest'
                  }
                  useJUnitPlatform { includeEngines 'junit-jupiter' }
                  testLogging { exceptionFormat = 'full' }
              }
          }
          GRADLE
          ./gradlew --no-daemon --init-script /tmp/weave-member-preparation.gradle :server:memberPreparationRegression 2>&1 | tee build/member-preparation-verification/jvm.log
      - name: Publish tested changes and remove temporary development machinery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected = {c['path'] for c in json.loads(Path('tools/1742-member-preparation-changes.json').read_text())['changes']}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected tracked mutation; refusing publication')
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
          git rm -- .github/workflows/1742-member-preparation.yml tools/1742-member-preparation-changes.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(dogfood): retire coherent fixture sessions and reuse verified identity contexts'
          git push origin HEAD:refs/heads/feat/1742-member-preparation
          git rev-parse HEAD | tee build/member-preparation-verification/source.txt
          git diff HEAD^ HEAD --stat
      - name: Preserve bounded test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: member-preparation-verification-${{ github.run_id }}
          path: |
            build/member-preparation-verification/
            server/build/test-results/memberPreparationRegression/
          if-no-files-found: warn
          retention-days: 3
