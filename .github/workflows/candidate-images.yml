name: Candidate Cut
run-name: Candidate Cut ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase commit SHA already contained in protected dev
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-cut-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/weave-server
  MCP_IMAGE: ghcr.io/${{ github.repository_owner }}/weave-mcp-server
  KEYCLOAK_RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/weave-keycloak-runtime

jobs:
  verify-source:
    name: Verify protected dev source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.source.outputs.candidate_sha }}
    env:
      WEAVE_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected candidate belongs to protected dev
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/dev" ]] || {
            echo "::error::Candidate Cut must be dispatched from protected dev." >&2
            exit 1
          }
          [[ "$WEAVE_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::candidate_sha must be a full lowercase commit SHA." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$WEAVE_CANDIDATE_COMMIT" ]] || {
            echo "::error::Checked-out source does not match candidate_sha." >&2
            exit 1
          }
          git fetch --no-tags origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          git merge-base --is-ancestor \
            "$WEAVE_CANDIDATE_COMMIT" refs/remotes/origin/dev || {
            echo "::error::candidate_sha is not contained in protected dev." >&2
            exit 1
          }
          printf 'candidate_sha=%s\n' "$WEAVE_CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Test, attest, and publish exact candidate
    needs: verify-source
    environment: candidate-cut
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      WEAVE_SPEC_CORPUS_ROOT: ${{ github.workspace }}/canonical-weave-specs
      WEAVE_CANDIDATE_COMMIT: ${{ needs.verify-source.outputs.candidate_sha }}
    outputs:
      server_digest: ${{ steps.server.outputs.digest }}
      mcp_digest: ${{ steps.mcp.outputs.digest }}
      keycloak_runtime_digest: ${{ steps.keycloak_runtime.outputs.digest }}
      candidate_manifest_digest: ${{ steps.manifest.outputs.digest }}

    steps:
      - name: Check out verified candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify-source.outputs.candidate_sha }}
          persist-credentials: false

      - name: Reverify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$WEAVE_CANDIDATE_COMMIT" ]]

      - name: Resolve pinned specification corpus
        id: spec
        run: |
          set -euo pipefail
          spec_commit="$(
            jq -er '.specCorpus.gitCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              specs/weave-specs.lock.json
          )"
          printf 'commit=%s\n' "$spec_commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: canonical-weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Keep the external specification checkout outside implementation source status
        shell: bash
        run: printf '/canonical-weave-specs/\n' >> .git/info/exclude

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive immutable build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          created="$(git show -s --format=%cI "$WEAVE_CANDIDATE_COMMIT")"
          version="0.1.0-dev.${WEAVE_CANDIDATE_COMMIT:0:12}"
          spec_digest="sha256:$(shasum -a 256 specs/weave-specs.lock.json | awk '{print $1}')"
          {
            echo "created=$created"
            echo "version=$version"
            echo "keycloak_version=26.7.0-weave.${WEAVE_CANDIDATE_COMMIT:0:12}"
            echo "spec_digest=$spec_digest"
            echo "tag_sha=sha-$WEAVE_CANDIDATE_COMMIT"
            echo "tag_run=candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Verify JVM and PostgreSQL candidate gates
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            serverCi \
            mcpCi \
            :weave-application-core:test \
            :weave-files-core:test \
            :weave-persistence-jpa:test \
            :weave-runtime-provider-adapters:test \
            :weave-runtime-security-adapters:test \
            :weave-product-e2e:test \
            :server:bootJar \
            :weave-mcp-server:bootJar

      - name: Build and publish Server
        id: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.identity.outputs.tag_sha }}
            ${{ env.SERVER_IMAGE }}:${{ steps.identity.outputs.tag_run }}
          build-args: |
            WEAVE_IMAGE_CREATED=${{ steps.identity.outputs.created }}
            WEAVE_IMAGE_REVISION=${{ needs.verify-source.outputs.candidate_sha }}
            WEAVE_IMAGE_VERSION=${{ steps.identity.outputs.version }}
            WEAVE_SPEC_DIGEST=${{ steps.identity.outputs.spec_digest }}
            WEAVE_SBOM_REFERENCE=embedded-buildkit-spdx
            WEAVE_PROVENANCE_REFERENCE=embedded-buildkit-slsa
          cache-from: type=gha,scope=candidate-server
          cache-to: type=gha,mode=max,scope=candidate-server

      - name: Build and publish MCP Server
        id: mcp
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: weave-mcp-server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.MCP_IMAGE }}:${{ steps.identity.outputs.tag_sha }}
            ${{ env.MCP_IMAGE }}:${{ steps.identity.outputs.tag_run }}
          build-args: |
            WEAVE_IMAGE_CREATED=${{ steps.identity.outputs.created }}
            WEAVE_IMAGE_REVISION=${{ needs.verify-source.outputs.candidate_sha }}
            WEAVE_IMAGE_VERSION=${{ steps.identity.outputs.version }}
            WEAVE_SPEC_DIGEST=${{ steps.identity.outputs.spec_digest }}
            WEAVE_SBOM_REFERENCE=embedded-buildkit-spdx
            WEAVE_PROVENANCE_REFERENCE=embedded-buildkit-slsa
          cache-from: type=gha,scope=candidate-mcp
          cache-to: type=gha,mode=max,scope=candidate-mcp

      - name: Prepare version-pinned Keycloak Runtime context
        id: keycloak_runtime_prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/candidate
          python3 infra/weave-workspace/scripts/build_keycloak_image.py \
            --root "$GITHUB_WORKSPACE" \
            --candidate-commit "$WEAVE_CANDIDATE_COMMIT" \
            --prepare-context "$GITHUB_WORKSPACE/build/candidate/keycloak-runtime-context" \
            --output "$GITHUB_WORKSPACE/build/candidate/keycloak-runtime-build.json"
          python3 infra/weave-workspace/scripts/verify_keycloak_build_evidence.py \
            --evidence "$GITHUB_WORKSPACE/build/candidate/keycloak-runtime-build.json" \
            --candidate-commit "$WEAVE_CANDIDATE_COMMIT" \
            --specification-commit "${{ steps.spec.outputs.commit }}"
          build_evidence_digest="$(
            jq -er '.canonicalBuildEvidenceDigest |
              select(test("^sha256:[0-9a-f]{64}$"))' \
              build/candidate/keycloak-runtime-build.json
          )"
          {
            echo "upstream_commit=$(jq -er .upstreamCommit build/candidate/keycloak-runtime-build.json)"
            echo "archive_sha256=$(jq -er .upstreamArchiveSha256 build/candidate/keycloak-runtime-build.json)"
            echo "stock_services_sha256=$(jq -er .stockServicesJarSha256 build/candidate/keycloak-runtime-build.json)"
            echo "patch_sha256=$(jq -er .patchSha256 build/candidate/keycloak-runtime-build.json)"
            echo "patched_services_sha256=$(jq -er .patchedServicesJarSha256 build/candidate/keycloak-runtime-build.json)"
            echo "build_evidence_digest=$build_evidence_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Keycloak Runtime
        id: keycloak_runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/candidate/keycloak-runtime-context
          file: build/candidate/keycloak-runtime-context/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.KEYCLOAK_RUNTIME_IMAGE }}:${{ steps.identity.outputs.tag_sha }}
            ${{ env.KEYCLOAK_RUNTIME_IMAGE }}:${{ steps.identity.outputs.tag_run }}
          build-args: |
            WEAVE_IMAGE_CREATED=${{ steps.identity.outputs.created }}
            WEAVE_IMAGE_REVISION=${{ needs.verify-source.outputs.candidate_sha }}
            WEAVE_IMAGE_VERSION=${{ steps.identity.outputs.keycloak_version }}
            WEAVE_SPEC_COMMIT=${{ steps.spec.outputs.commit }}
            WEAVE_SPEC_DIGEST=${{ steps.identity.outputs.spec_digest }}
            WEAVE_KEYCLOAK_UPSTREAM_COMMIT=${{ steps.keycloak_runtime_prepare.outputs.upstream_commit }}
            WEAVE_KEYCLOAK_ARCHIVE_SHA256=${{ steps.keycloak_runtime_prepare.outputs.archive_sha256 }}
            WEAVE_KEYCLOAK_STOCK_SERVICES_SHA256=${{ steps.keycloak_runtime_prepare.outputs.stock_services_sha256 }}
            WEAVE_KEYCLOAK_PATCH_SHA256=${{ steps.keycloak_runtime_prepare.outputs.patch_sha256 }}
            WEAVE_PATCHED_SERVICES_SHA256=${{ steps.keycloak_runtime_prepare.outputs.patched_services_sha256 }}
            WEAVE_KEYCLOAK_BUILD_EVIDENCE_DIGEST=${{ steps.keycloak_runtime_prepare.outputs.build_evidence_digest }}
            WEAVE_SBOM_REFERENCE=embedded-buildkit-spdx
            WEAVE_PROVENANCE_REFERENCE=embedded-buildkit-slsa
          cache-from: type=gha,scope=candidate-keycloak-runtime
          cache-to: type=gha,mode=max,scope=candidate-keycloak-runtime

      - name: Verify published OCI runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          image_label() {
            docker image inspect \
              --format "{{ index .Config.Labels \"$2\" }}" \
              "$1"
          }
          validate_published_image() {
            local image="$1"
            local title="$2"
            local module="$3"
            local runtime_user="$4"
            local dependency_platform="$5"
            docker pull "$image"
            [[ "$(docker image inspect --format '{{.Config.User}}' "$image")" == "$runtime_user" ]]
            [[ "$(image_label "$image" org.opencontainers.image.title)" == "$title" ]]
            [[ "$(image_label "$image" org.opencontainers.image.revision)" == "$WEAVE_CANDIDATE_COMMIT" ]]
            [[ "$(image_label "$image" com.massimotter.weave.spec-digest)" == "${{ steps.identity.outputs.spec_digest }}" ]]
            [[ "$(image_label "$image" com.massimotter.weave.module)" == "$module" ]]
            [[ "$(image_label "$image" com.massimotter.weave.runtime-user)" == "$runtime_user" ]]
            [[ "$(image_label "$image" com.massimotter.weave.dependency-platform)" == "$dependency_platform" ]]
          }
          validate_published_image \
            "${SERVER_IMAGE}@${{ steps.server.outputs.digest }}" \
            "Weave Server" \
            "server" \
            "10001:10001" \
            "java21-spring-boot-4.1"
          validate_published_image \
            "${MCP_IMAGE}@${{ steps.mcp.outputs.digest }}" \
            "Weave MCP Server" \
            "weave-mcp-server" \
            "10001:10001" \
            "java21-spring-boot-4.1-spring-ai-2.0"
          validate_published_image \
            "${KEYCLOAK_RUNTIME_IMAGE}@${{ steps.keycloak_runtime.outputs.digest }}" \
            "Weave Keycloak Runtime" \
            "keycloak-runtime" \
            "1000:0" \
            "keycloak-26.7.0-downstream-built-in-policy"
          [[ "$(image_label \
            "${KEYCLOAK_RUNTIME_IMAGE}@${{ steps.keycloak_runtime.outputs.digest }}" \
            com.massimotter.weave.provider-id)" == \
            "weave-workload-client-registration-enforcer" ]]
          [[ "$(image_label \
            "${KEYCLOAK_RUNTIME_IMAGE}@${{ steps.keycloak_runtime.outputs.digest }}" \
            com.massimotter.weave.keycloak-build-evidence-digest)" == \
            "${{ steps.keycloak_runtime_prepare.outputs.build_evidence_digest }}" ]]

      - name: Resolve exact OCI attestation digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/candidate
          python3 gradle/tasks/oci-attestation-digests.py \
            --image "${SERVER_IMAGE}@${{ steps.server.outputs.digest }}" \
            --output build/candidate/server-attestations.json
          python3 gradle/tasks/oci-attestation-digests.py \
            --image "${MCP_IMAGE}@${{ steps.mcp.outputs.digest }}" \
            --output build/candidate/mcp-attestations.json
          python3 gradle/tasks/oci-attestation-digests.py \
            --image "${KEYCLOAK_RUNTIME_IMAGE}@${{ steps.keycloak_runtime.outputs.digest }}" \
            --output build/candidate/keycloak-runtime-attestations.json

      - name: Create immutable candidate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          evidence_ref="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          realm_baseline="$GITHUB_WORKSPACE/build/candidate/keycloak/import/weave-realm.json"
          realm_migrations="$GITHUB_WORKSPACE/build/candidate/keycloak/migrations/manifest.json"
          [[ -f "$realm_baseline" && ! -L "$realm_baseline" && \
             -f "$realm_migrations" && ! -L "$realm_migrations" ]] || {
            echo "::error::Canonical rendered realm baseline or migration bundle is missing." >&2
            exit 1
          }
          ./gradlew createCandidateManifest \
            "-PcandidateCommit=$WEAVE_CANDIDATE_COMMIT" \
            "-PspecificationCommit=${{ steps.spec.outputs.commit }}" \
            "-PspecDigest=${{ steps.identity.outputs.spec_digest }}" \
            "-PbuildEvidenceRef=$evidence_ref" \
            "-PkeycloakRuntimeBuildEvidenceDigest=${{ steps.keycloak_runtime_prepare.outputs.build_evidence_digest }}" \
            "-PrealmBaselineArtifact=$realm_baseline" \
            "-PrealmMigrationBundleArtifact=$realm_migrations" \
            "-PserverImage=${SERVER_IMAGE}@${{ steps.server.outputs.digest }}" \
            "-PserverSbomDigest=$(jq -r .sbomDigest build/candidate/server-attestations.json)" \
            "-PserverProvenanceDigest=$(jq -r .provenanceDigest build/candidate/server-attestations.json)" \
            "-PmcpServerImage=${MCP_IMAGE}@${{ steps.mcp.outputs.digest }}" \
            "-PmcpServerSbomDigest=$(jq -r .sbomDigest build/candidate/mcp-attestations.json)" \
            "-PmcpServerProvenanceDigest=$(jq -r .provenanceDigest build/candidate/mcp-attestations.json)" \
            "-PkeycloakRuntimeImage=${KEYCLOAK_RUNTIME_IMAGE}@${{ steps.keycloak_runtime.outputs.digest }}" \
            "-PkeycloakRuntimeSbomDigest=$(jq -r .sbomDigest build/candidate/keycloak-runtime-attestations.json)" \
            "-PkeycloakRuntimeProvenanceDigest=$(jq -r .provenanceDigest build/candidate/keycloak-runtime-attestations.json)" \
            "-PcandidateManifest=$GITHUB_WORKSPACE/build/candidate/candidate-manifest.json"
          echo "digest=sha256:$(awk 'NR == 1 {print $1}' build/candidate/candidate-manifest.json.sha256)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-manifest-${{ needs.verify-source.outputs.candidate_sha }}
          path: |
            build/candidate/candidate-manifest.json
            build/candidate/candidate-manifest.json.sha256
            build/candidate/keycloak/import/weave-realm.json
            build/candidate/keycloak/migrations/manifest.json
            build/candidate/keycloak-runtime-build.json
            build/candidate/server-attestations.json
            build/candidate/mcp-attestations.json
            build/candidate/keycloak-runtime-attestations.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize immutable deployment inputs
        shell: bash
        run: |
          {
            echo "## Weave candidate"
            echo
            echo "- Commit: \`$WEAVE_CANDIDATE_COMMIT\`"
            echo "- Server: \`${SERVER_IMAGE}@${{ steps.server.outputs.digest }}\`"
            echo "- MCP: \`${MCP_IMAGE}@${{ steps.mcp.outputs.digest }}\`"
            echo "- Keycloak Runtime: \`${KEYCLOAK_RUNTIME_IMAGE}@${{ steps.keycloak_runtime.outputs.digest }}\`"
            echo "- Realm baseline: \`$(jq -r .realmArtifacts.baselineDigest build/candidate/candidate-manifest.json)\`"
            echo "- Realm migrations: \`$(jq -r .realmArtifacts.migrationBundleDigest build/candidate/candidate-manifest.json)\`"
            echo "- Deployment proof: candidate manifest digest, never a tag"
          } >> "$GITHUB_STEP_SUMMARY"

  fresh-product-proof:
    name: Fresh invitation, OIDC, MCP, provider, and cleanup proof
    needs: [verify-source, build-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    env:
      WEAVE_TEST_APP_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/weave-server@${{ needs.build-candidate.outputs.server_digest }}
      WEAVE_TEST_APP_MCP_IMAGE: ghcr.io/${{ github.repository_owner }}/weave-mcp-server@${{ needs.build-candidate.outputs.mcp_digest }}
      WEAVE_TEST_APP_KEYCLOAK_IMAGE: ghcr.io/${{ github.repository_owner }}/weave-keycloak-runtime@${{ needs.build-candidate.outputs.keycloak_runtime_digest }}
      WEAVE_TEST_APP_OUTPUT_ROOT: ${{ github.workspace }}/weave/build/test-app
      WEAVE_TEST_APP_RUN_ID: candidate-${{ github.run_id }}-${{ github.run_attempt }}
      WEAVE_CANDIDATE_COMMIT: ${{ needs.verify-source.outputs.candidate_sha }}
      WEAVE_CANDIDATE_MANIFEST_DIGEST: ${{ needs.build-candidate.outputs.candidate_manifest_digest }}
      WEAVE_CANDIDATE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WEAVE_TEST_APP_CANDIDATE_MANIFEST: ${{ github.workspace }}/weave/build/candidate-input/candidate-manifest.json

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: weave
          ref: ${{ needs.verify-source.outputs.candidate_sha }}
          persist-credentials: false

      - name: Resolve pinned specification corpus
        id: spec
        working-directory: weave
        run: |
          set -euo pipefail
          spec_commit="$(
            jq -er '.specCorpus.gitCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              specs/weave-specs.lock.json
          )"
          printf 'commit=%s\n' "$spec_commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Authenticate exact candidate pulls
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download the exact candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest-${{ needs.verify-source.outputs.candidate_sha }}
          path: weave/build/candidate-input

      - name: Run the isolated Fresh product proof
        working-directory: weave
        run: ./gradlew --no-daemon testApp

      - name: Upload support-safe Fresh evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fresh-product-proof-${{ needs.verify-source.outputs.candidate_sha }}
          path: |
            weave/build/test-app/*/weave-test-app-evidence.json
            weave/build/test-app/*/keycloak-dcr-live-proof.json
            weave/build/test-app/*/persistence-restart-evidence.json
            weave/build/test-app/*/runtime-image-evidence.json
            weave/build/test-app/*/teardown-evidence.json
            weave/build/test-app/*/failure-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
