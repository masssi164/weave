name: Native Collaboration Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/native-collaboration-qualification.yml'
      - 'server/gradle/tasks/native-runtime.gradle'
      - 'server/src/test/java/com/massimotter/weave/backend/matrix/**'
      - 'tools/native_collaboration_completion.py'
      - 'tools/matrix_relational_cutover.py'

permissions:
  contents: write

jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Apply native collaboration integration
        run: |
          set -euo pipefail
          python3 tools/native_collaboration_completion.py
          python3 tools/matrix_relational_cutover.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/src/main/java/com/massimotter/weave/backend/service/files/FilesystemBlobStore.java')
          s = p.read_text().replace(
              'private ApiErrorException map(RuntimeException error, String fallback)',
              'private ApiErrorException map(Throwable error, String fallback)')
          p.write_text(s)

          p = Path('server/src/main/java/com/massimotter/weave/backend/calendar/adapter/NativeCalendarProviderAdapter.java')
          s = p.read_text()
          marker = '''    NativeCalendarProviderAdapter(
                  CalendarCollectionJpaRepository collections,
                  CalendarEventJpaRepository events,
                  CalendarChangeJpaRepository changes,
                  CalendarSnapshotChangeRepository snapshotChanges,
                  NativeCalendarRelationalStore relationalStore,
                  Clock clock) {'''
          overload = '''    NativeCalendarProviderAdapter(
                  CalendarCollectionJpaRepository collections,
                  CalendarEventJpaRepository events,
                  CalendarChangeJpaRepository changes,
                  CalendarSnapshotChangeRepository snapshotChanges,
                  Clock clock) {
              this(collections, events, changes, snapshotChanges, null, clock);
          }

          '''
          if marker in s and overload not in s:
              s = s.replace(marker, overload + marker, 1)
          p.write_text(s)
          PY

      - name: Authority checks
        run: |
          set -euo pipefail
          grep -q 'org.apache.opendal.Operator' server/src/main/java/com/massimotter/weave/backend/service/files/FilesystemBlobStore.java
          grep -q 'org.apache.opendal.Operator' server/src/main/java/com/massimotter/weave/backend/service/files/S3BlobStore.java
          ! grep -q 'software.amazon.awssdk' server/src/main/java/com/massimotter/weave/backend/service/files/S3BlobStore.java
          test -d rust/matrix-protocol
          test -d rust/matrix-client
          test ! -d rust/matrix-core
          ! grep -R --line-number --exclude-dir=target -E 'matrix-sdk|matrix_sdk' rust/matrix-protocol
          grep -q 'ruma = ' rust/matrix-protocol/Cargo.toml
          grep -q "weave-matrix-protocol" server/gradle/tasks/native-runtime.gradle
          grep -q 'NativeCalendarRelationalStore' server/src/main/java/com/massimotter/weave/backend/calendar/adapter/NativeCalendarProviderAdapter.java
          grep -q 'net.fortuna.ical4j' server/src/main/java/com/massimotter/weave/backend/service/calendar/Ical4jRecurrenceEngine.java
          grep -q "cratePath: '../rust/matrix-client'" client/hook/build.dart

      - name: Java compile and native collaboration tests
        run: |
          set -euo pipefail
          ./gradlew :server:compileJava :server:test \
            --tests 'com.massimotter.weave.backend.service.files.FilesystemBlobStoreTest' \
            --tests 'com.massimotter.weave.backend.service.files.S3BlobStoreTest' \
            --tests 'com.massimotter.weave.backend.service.calendar.*' \
            --tests 'com.massimotter.weave.backend.calendar.*' \
            --tests 'com.massimotter.weave.backend.matrix.*'

      - name: Ruma server and Matrix client Rust tests
        run: |
          set -euo pipefail
          cargo test -p weave-matrix-protocol --all-features
          cargo test -p weave-matrix-client --all-features

      - name: Flutter client analysis
        working-directory: client
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze

      - name: Root integration gates
        run: |
          set -euo pipefail
          ./gradlew acceptanceContract

      - name: Commit qualified integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(native): complete OpenDAL Ruma iCal4j collaboration core'
          git fetch origin ${{ github.head_ref }}
          git rebase origin/${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
