name: Native Provider Gate

on:
  pull_request:
    paths:
      - '.github/workflows/native-provider-gate.yml'
      - 'gradle/**'
      - 'server/**'
      - 'weave-application-core/**'
      - 'weave-files-core/**'
      - 'weave-persistence-jpa/**'
      - 'rust/matrix-protocol/**'
      - 'rust/matrix-client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'client/hook/build.dart'
      - 'specs/weave-specs.lock.json'
      - 'docs/evidence/**'

permissions:
  contents: read

jobs:
  native-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified source-built S3 test fixture
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(infra/weave-workspace/scripts/build_runtime_state_image.sh)"
          docker tag "$image_id" weave-runtime-state:ci-s3
          echo 'WEAVE_MINIO_TEST_IMAGE=weave-runtime-state:ci-s3' >> "$GITHUB_ENV"
      - name: Compile server and focused native-provider tests
        run: |
          set -euo pipefail
          ./gradlew :server:compileJava :server:compileTestJava
          ./gradlew :server:test --stacktrace \
            --tests 'com.massimotter.weave.backend.service.files.*' \
            --tests 'com.massimotter.weave.backend.service.calendar.*' \
            --tests 'com.massimotter.weave.backend.calendar.*' \
            --tests 'com.massimotter.weave.backend.matrix.*'
      - name: Matrix server/client Rust boundaries
        run: |
          set -euo pipefail
          cargo test -p weave-matrix-protocol --all-features
          cargo test -p weave-matrix-client --all-features
      - name: Architecture invariants
        run: |
          set -euo pipefail
          test ! -d rust/matrix-core
          if grep -R --line-number --exclude-dir=target -E 'matrix-sdk|matrix_sdk' rust/matrix-protocol; then exit 1; fi
          if grep -R --line-number -E 'MatrixE2eeSnapshot(Store|JpaEntity|JpaRepository)' server/src/main weave-persistence-jpa/src/main; then exit 1; fi
          # The narrow matrix-protocol JNI library is current; the retired matrix-core coupling is not.
          if grep -R --line-number -E 'weave\.chat\.matrix-facade\.enabled|facadeEnabled|weave_matrix_core' server gradle rust Cargo.toml Cargo.lock; then exit 1; fi
          grep -q 'org.apache.opendal' server/src/main/java/com/massimotter/weave/backend/service/files/FilesystemBlobStore.java
          if grep -q 'software.amazon.awssdk' server/src/main/java/com/massimotter/weave/backend/service/files/FilesystemBlobStore.java; then exit 1; fi
          test ! -e server/src/main/java/com/massimotter/weave/backend/service/files/S3BlobStore.java
          test ! -e server/src/test/java/com/massimotter/weave/backend/service/files/S3BlobStoreTest.java
          if grep -R --line-number -E 'S3_COMPATIBLE|weave\.files\.native\.blob-store' server weave-files-core weave-application-core docs README.md; then exit 1; fi
