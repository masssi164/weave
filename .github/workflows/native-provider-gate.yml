name: Native Provider Gate

on:
  pull_request:
    paths:
      - '.github/workflows/native-provider-gate.yml'
      - 'gradle/**'
      - 'server/**'
      - 'weave-application-core/**'
      - 'weave-files-core/**'
      - 'weave-persistence-jpa/**'
      - 'rust/matrix-protocol/**'
      - 'rust/matrix-client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'client/hook/build.dart'
      - 'specs/weave-specs.lock.json'
      - 'docs/evidence/**'

permissions:
  contents: read

jobs:
  native-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile server and focused native-provider tests
        run: |
          set -euo pipefail
          ./gradlew :server:compileJava :server:compileTestJava
          ./gradlew :server:test --stacktrace \
            --tests 'com.massimotter.weave.backend.service.files.*' \
            --tests 'com.massimotter.weave.backend.service.calendar.*' \
            --tests 'com.massimotter.weave.backend.calendar.*' \
            --tests 'com.massimotter.weave.backend.matrix.*'
      - name: Matrix server/client Rust boundaries
        run: |
          set -euo pipefail
          cargo test -p weave-matrix-protocol --all-features
          cargo test -p weave-matrix-client --all-features
      - name: Architecture invariants
        run: |
          set -euo pipefail
          test ! -d rust/matrix-core
          ! grep -R --line-number --exclude-dir=target -E 'matrix-sdk|matrix_sdk' rust/matrix-protocol
          ! grep -R --line-number -E 'MatrixE2eeSnapshot(Store|JpaEntity|JpaRepository)' server/src/main weave-persistence-jpa/src/main
          ! grep -R --line-number -E 'weave\.chat\.matrix-facade\.enabled|facadeEnabled|weave\.matrix\.core\.library\.path|matrixCoreLibrary|weave_matrix_core' server gradle .github rust Cargo.toml Cargo.lock
          grep -q 'org.apache.opendal' server/src/main/java/com/massimotter/weave/backend/service/files/FilesystemBlobStore.java
          ! grep -q 'software.amazon.awssdk' server/src/main/java/com/massimotter/weave/backend/service/files/FilesystemBlobStore.java
          test ! -e server/src/main/java/com/massimotter/weave/backend/service/files/S3BlobStore.java
          test ! -e server/src/test/java/com/massimotter/weave/backend/service/files/S3BlobStoreTest.java
          ! grep -R --line-number -E 'S3_COMPATIBLE|weave\.files\.native\.blob-store' server weave-files-core weave-application-core docs README.md
