name: Temporary Weave generated-tag image inventory

on:
  push:
    branches: [diagnostic/runner-capacity-root-20261027]
    paths: [.github/workflows/runner-capacity-diagnostic.yml]

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/diagnostic/runner-capacity-root-20261027'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 5
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    steps:
      - name: Inspect source-bound generated tags and Docker storage totals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import fcntl
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess

          if os.environ.get('RUNNER_NAME') != 'weave-live-mac-mini':
              raise SystemExit('Unexpected runner')
          digest = re.compile(r'sha256:[0-9a-f]{64}')
          sha = re.compile(r'[0-9a-f]{40}')
          container = re.compile(r'[0-9a-f]{64}')
          known_modules = {'server', 'weave-mcp-server', 'keycloak-runtime'}

          def command(args, timeout=30):
              result = subprocess.run(['docker', *args], capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise SystemExit('Docker inventory unavailable at ' + ' '.join(args[:2]) + ': exit ' + str(result.returncode))
              return result.stdout

          def safe_private_file(path):
              if not path.is_absolute() or any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit('Private ledger path rejected')
              info = path.stat()
              if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid() or info.st_mode & 0o077 or info.st_nlink != 1 or info.st_size > 256 * 1024:
                  raise SystemExit('Private ledger safety check failed')

          ledger_path = Path.home() / '.weave/artifact-runtime-images/ledger.json'
          lock_path = ledger_path.with_suffix(ledger_path.suffix + '.lock')
          safe_private_file(lock_path)
          lock_descriptor = os.open(lock_path, os.O_RDWR | os.O_NOFOLLOW)
          fcntl.flock(lock_descriptor, fcntl.LOCK_EX | fcntl.LOCK_NB)
          retained = set()
          pending = set()
          retained_sets = 0
          # A missing or malformed ledger must never erase retained-set protection.
          safe_private_file(ledger_path)
          descriptor = os.open(ledger_path, os.O_RDONLY | os.O_NOFOLLOW)
          with os.fdopen(descriptor, 'r', encoding='utf-8') as stream:
              info = os.fstat(stream.fileno())
              if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid() or info.st_mode & 0o077 or info.st_nlink != 1 or info.st_size > 256 * 1024:
                  raise SystemExit('Private ledger safety check failed')
              value = json.load(stream)
          if (not isinstance(value, dict)
                  or set(value) != {'schemaVersion', 'ownerUid', 'retainedSets', 'pendingImageIds'}
                  or value['schemaVersion'] != 'weave.runtime-image-ledger/v1'
                  or type(value['ownerUid']) is not int or value['ownerUid'] != os.getuid()
                  or not isinstance(value['retainedSets'], list) or len(value['retainedSets']) != 2
                  or not isinstance(value['pendingImageIds'], list) or len(value['pendingImageIds']) > 2048
                  or not all(isinstance(v, str) and digest.fullmatch(v) for v in value['pendingImageIds'])
                  or len(set(value['pendingImageIds'])) != len(value['pendingImageIds'])):
              raise SystemExit('Private ledger schema rejected')
          retained_sets = len(value['retainedSets'])
          for entry in value['retainedSets']:
              if (not isinstance(entry, dict)
                      or set(entry) != {'sourceCommit', 'inputDigest', 'payloadSha256', 'images'}
                      or not isinstance(entry['sourceCommit'], str) or not sha.fullmatch(entry['sourceCommit'])
                      or any(not isinstance(entry[key], str) or not digest.fullmatch(entry[key]) for key in ('inputDigest', 'payloadSha256'))
                      or not isinstance(entry['images'], dict) or set(entry['images']) != {'backend', 'mcp', 'keycloak', 'runtimeState'}
                      or not all(isinstance(v, str) and digest.fullmatch(v) for v in entry['images'].values())):
                  raise SystemExit('Private retained set rejected')
              retained.update(entry['images'].values())
          pending.update(value['pendingImageIds'])

          containers = command(['container', 'ls', '--all', '--quiet', '--no-trunc']).split()
          if not all(container.fullmatch(v) for v in containers) or len(containers) > 1000:
              raise SystemExit('Container inventory rejected')
          used = set()
          for offset in range(0, len(containers), 50):
              used.update(command(['container', 'inspect', '--format', '{{.Image}}', *containers[offset:offset + 50]]).split())
          if not all(digest.fullmatch(v) for v in used):
              raise SystemExit('Container image identities rejected')

          image_ids = sorted(set(command(['image', 'ls', '--all', '--quiet', '--no-trunc', '--filter', 'label=org.opencontainers.image.source=https://github.com/masssi164/weave']).split()))
          if not all(digest.fullmatch(v) for v in image_ids) or len(image_ids) > 2000:
              raise SystemExit('Image inventory rejected')
          
          def generated_tag(tag, module, revision):
              if not isinstance(tag, str) or not isinstance(revision, str) or not sha.fullmatch(revision):
                  return False
              prefix = revision[:12]
              if module == 'keycloak-runtime':
                  return tag == 'weave-keycloak-runtime:' + prefix
              if module == 'weave-mcp-server':
                  return tag == 'weave-mcp:artifact-' + prefix
              if module == 'server':
                  return bool(re.fullmatch(r'weave-backend:artifact-' + prefix + r'(?:-[0-9a-f]{12})?', tag))
              return False
          
          rows = []
          layers_by_id = {}
          for offset in range(0, len(image_ids), 25):
              records = json.loads(command(['image', 'inspect', *image_ids[offset:offset + 25]]))
              if not isinstance(records, list):
                  raise SystemExit('Weave image inspection rejected')
              for value in records:
                  # Raw image configuration remains process-local. Emit only the closed projection below.
                  labels = (value.get('Config') or {}).get('Labels') or {}
                  image_id = value.get('Id')
                  size = value.get('Size')
                  tags = value.get('RepoTags') or []
                  references = value.get('RepoDigests') or []
                  source = labels.get('org.opencontainers.image.source')
                  revision = labels.get('org.opencontainers.image.revision')
                  module = labels.get('com.massimotter.weave.module')
                  spec = labels.get('com.massimotter.weave.spec-digest')
                  layers = (value.get('RootFS') or {}).get('Layers') or []
                  if source != 'https://github.com/masssi164/weave' or module not in known_modules:
                      continue
                  if (not isinstance(image_id, str) or not digest.fullmatch(image_id)
                          or type(size) is not int or size < 0
                          or not isinstance(tags, list) or not all(isinstance(tag, str) for tag in tags)
                          or not isinstance(references, list) or not all(isinstance(ref, str) for ref in references)
                          or not isinstance(layers, list) or not all(isinstance(layer, str) and digest.fullmatch(layer) for layer in layers)):
                      raise SystemExit('Weave image identity rejected')
                  valid_revision = isinstance(revision, str) and bool(sha.fullmatch(revision))
                  valid_spec = isinstance(spec, str) and bool(digest.fullmatch(spec))
                  recognized_tags = [tag for tag in tags if generated_tag(tag, module, revision)]
                  only_generated_tags = bool(tags) and len(recognized_tags) == len(tags)
                  reviewable = (valid_revision and valid_spec and only_generated_tags and not references
                                and image_id not in used and image_id not in retained)
                  layers_by_id[image_id] = set(layers)
                  rows.append({
                      'imageId': image_id, 'module': module, 'sourceCommit': revision if valid_revision else None,
                      'validSpecDigest': valid_spec, 'virtualBytes': size,
                      'tagCount': len(tags), 'recognizedGeneratedTags': recognized_tags,
                      'unrecognizedTagCount': len(tags) - len(recognized_tags),
                      'allTagsMatchCurrentOrLegacyBuilder': only_generated_tags,
                      'registryReferenceCount': len(references),
                      'referencedByAnyContainer': image_id in used,
                      'protectedByRetainedSet': image_id in retained,
                      'recordedForPrune': image_id in pending,
                      'reviewableUnusedBuilderImage': bool(reviewable),
                      'layerCount': len(layers),
                  })
          
          protected_layers = set().union(*(layers for image_id, layers in layers_by_id.items() if image_id in used or image_id in retained))
          layer_users = {}
          for image_id, layers in layers_by_id.items():
              for layer in layers:
                  layer_users.setdefault(layer, set()).add(image_id)
          for row in rows:
              layers = layers_by_id[row['imageId']]
              row['sharedLayerCountWithOtherWeaveImages'] = sum(len(layer_users[layer]) > 1 for layer in layers)
              row['layerCountSharedWithProtectedWeaveImages'] = len(layers & protected_layers)
          
          # Docker's formatter projects only IDs and numeric disk measures, not names, commands or paths.
          # Its sizes are rounded display values and never a promise of reclaimable host bytes.
          image_usage_available = False
          image_usage = {}
          usage_command = ['docker', 'system', 'df', '--verbose', '--format',
                           '{{range .Images}}{{.ID}}\t{{.Size}}\t{{.SharedSize}}\t{{.UniqueSize}}\t{{.Containers}}{{println}}{{end}}']
          result = subprocess.run(usage_command, capture_output=True, text=True, timeout=60)
          size_value = re.compile(r'(?:[0-9]+(?:\.[0-9]+)?\s*[kKMGTPE]?i?B|N/A|-1B)')
          if result.returncode == 0:
              for line in result.stdout.splitlines():
                  parts = line.split('\t')
                  if len(parts) != 5:
                      raise SystemExit('Docker image size projection rejected')
                  identity, virtual, shared, unique, count = parts
                  if not identity.startswith('sha256:'):
                      identity = 'sha256:' + identity
                  if not digest.fullmatch(identity) or not count.isdecimal() or not all(size_value.fullmatch(v.strip()) for v in (virtual, shared, unique)):
                      raise SystemExit('Docker image size projection rejected')
                  if identity in layers_by_id:
                      image_usage[identity] = {'virtualSizeReported': virtual, 'sharedSizeReported': shared,
                                              'uniqueSizeReported': unique, 'containerCountReported': int(count)}
              image_usage_available = True
          for row in rows:
              row['dockerDiskUsage'] = image_usage.get(row['imageId'])
          
          aggregate = []
          for line in command(['system', 'df', '--format', '{{json .}}'], timeout=60).splitlines():
              item = json.loads(line)
              kind = item.get('Type')
              if kind not in {'Images', 'Containers', 'Local Volumes', 'Build Cache'}:
                  raise SystemExit('Docker aggregate category rejected')
              projection = {'type': kind}
              for field in ('TotalCount', 'Active'):
                  value = item.get(field)
                  if not isinstance(value, str) or not value.isdecimal():
                      raise SystemExit('Docker aggregate count rejected')
                  projection[field] = int(value)
              for field in ('Size', 'Reclaimable'):
                  value = item.get(field)
                  if not isinstance(value, str) or not re.fullmatch(r'[0-9.]+\s*[kKMGTPE]?i?B(?:\s*\([0-9]+%\))?', value):
                      raise SystemExit('Docker aggregate size rejected')
                  projection[field] = value
              aggregate.append(projection)
          
          # Classify the active engine without printing Docker context names, endpoints or operator paths.
          engine_os = command(['info', '--format', '{{.OperatingSystem}}']).strip().lower()
          engine = 'orbstack' if 'orbstack' in engine_os else 'docker-desktop' if 'docker desktop' in engine_os else 'other'
          reviewable = [row for row in rows if row['reviewableUnusedBuilderImage']]
          usage = shutil.disk_usage(Path(os.environ['GITHUB_WORKSPACE']))
          print(json.dumps({
              'schemaVersion': 'weave.tagged-image-inventory/v1', 'mode': 'read-only',
              'supportSafe': True, 'containsSecretValues': False,
              'freeBytes': usage.free, 'minimumFreeBytes': 20 * 1024 ** 3,
              'engineClass': engine, 'dockerDiskUsage': aggregate,
              'imageUsageProjectionAvailable': image_usage_available,
              'installedWeaveImageCount': len(image_ids), 'containerCount': len(containers),
              'retainedSetCount': retained_sets, 'pendingImageCount': len(pending),
              'weaveImages': rows, 'reviewableBuilderImageCount': len(reviewable),
              'candidateVirtualBytesUpperBound': sum(row['virtualBytes'] for row in reviewable),
              'actualReclaimableHostBytes': None, 'buildCacheOwnership': 'not-proven',
              'ledgerModified': False, 'deleteAuthority': 'none-read-only-diagnostic',
          }, sort_keys=True))
          PY
