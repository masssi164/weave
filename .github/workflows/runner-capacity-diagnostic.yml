name: Temporary Weave owned image inventory

on:
  push:
    branches: [diagnostic/runner-capacity-root-20261027]
    paths: [.github/workflows/runner-capacity-diagnostic.yml]

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/diagnostic/runner-capacity-root-20261027'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 5
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    steps:
      - name: Inspect only Weave image provenance and current references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess

          if os.environ.get('RUNNER_NAME') != 'weave-live-mac-mini':
              raise SystemExit('Unexpected runner')
          digest = re.compile(r'sha256:[0-9a-f]{64}')
          sha = re.compile(r'[0-9a-f]{40}')
          container = re.compile(r'[0-9a-f]{64}')
          known_modules = {'server', 'weave-mcp-server', 'keycloak-runtime'}

          def command(args, timeout=30):
              result = subprocess.run(['docker', *args], capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise SystemExit('Docker inventory unavailable')
              return result.stdout

          def safe_private_file(path):
              if not path.is_absolute() or any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit('Private ledger path rejected')
              info = path.stat()
              if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid() or info.st_mode & 0o077 or info.st_nlink != 1 or info.st_size > 256 * 1024:
                  raise SystemExit('Private ledger safety check failed')

          ledger_path = Path.home() / '.weave/artifact-runtime-images/ledger.json'
          retained = set()
          pending = set()
          retained_sets = 0
          if ledger_path.exists():
              safe_private_file(ledger_path)
              value = json.loads(ledger_path.read_text())
              if value.get('schemaVersion') != 'weave.runtime-image-ledger/v1' or value.get('ownerUid') != os.getuid():
                  raise SystemExit('Private ledger schema rejected')
              retained_sets = len(value.get('retainedSets', []))
              for entry in value.get('retainedSets', []):
                  retained.update(entry.get('images', {}).values())
              pending.update(value.get('pendingImageIds', []))
              if not all(isinstance(v, str) and digest.fullmatch(v) for v in retained | pending):
                  raise SystemExit('Private ledger image identity rejected')

          containers = command(['container', 'ls', '--all', '--quiet', '--no-trunc']).split()
          if not all(container.fullmatch(v) for v in containers) or len(containers) > 1000:
              raise SystemExit('Container inventory rejected')
          used = set()
          for offset in range(0, len(containers), 50):
              used.update(command(['container', 'inspect', '--format', '{{.Image}}', *containers[offset:offset + 50]]).split())
          if not all(digest.fullmatch(v) for v in used):
              raise SystemExit('Container image identities rejected')

          image_ids = sorted(set(command(['image', 'ls', '--all', '--quiet', '--no-trunc']).split()))
          if not all(digest.fullmatch(v) for v in image_ids) or len(image_ids) > 2000:
              raise SystemExit('Image inventory rejected')
          # The projection deliberately omits environment values, commands, unrelated labels,
          # container names, operator paths, and private fixture/provisioning state.
          fields = [
              '{{json .Id}}', '{{json .Size}}', '{{json .RepoTags}}', '{{json .RepoDigests}}',
              '{{json (index .Config.Labels "org.opencontainers.image.source")}}',
              '{{json (index .Config.Labels "org.opencontainers.image.revision")}}',
              '{{json (index .Config.Labels "com.massimotter.weave.module")}}',
              '{{json (index .Config.Labels "com.massimotter.weave.spec-digest")}}',
          ]
          rows = []
          for offset in range(0, len(image_ids), 25):
              result = command(['image', 'inspect', '--format', '\t'.join(fields), *image_ids[offset:offset + 25]])
              for line in result.splitlines():
                  values = [json.loads(v) for v in line.split('\t')]
                  if len(values) != len(fields):
                      raise SystemExit('Image projection rejected')
                  image_id, size, tags, references, source, revision, module, spec = values
                  if source != 'https://github.com/masssi164/weave' or module not in known_modules:
                      continue
                  if not digest.fullmatch(image_id) or not isinstance(size, int) or size < 0:
                      raise SystemExit('Weave image identity rejected')
                  # Invalid old labels are reported only as boolean flags, never raw strings.
                  valid_revision = isinstance(revision, str) and bool(sha.fullmatch(revision))
                  valid_spec = isinstance(spec, str) and bool(digest.fullmatch(spec))
                  rows.append({
                      'imageId': image_id, 'module': module, 'virtualBytes': size,
                      'sourceCommit': revision if valid_revision else None,
                      'validSpecDigest': valid_spec,
                      'tagCount': len(tags or []), 'registryReferenceCount': len(references or []),
                      'referencedByAnyContainer': image_id in used,
                      'protectedByRetainedSet': image_id in retained,
                      'recordedForPrune': image_id in pending,
                      'unreferencedUntaggedOutsideRetainedSets': not tags and not references and image_id not in used and image_id not in retained,
                  })
          eligible = [v for v in rows if v['unreferencedUntaggedOutsideRetainedSets'] and v['sourceCommit'] and v['validSpecDigest']]
          usage = shutil.disk_usage(Path(os.environ['GITHUB_WORKSPACE']))
          print(json.dumps({
              'schemaVersion': 'weave.owned-image-inventory/v1', 'mode': 'read-only',
              'supportSafe': True, 'containsSecretValues': False,
              'freeBytes': usage.free, 'minimumFreeBytes': 20 * 1024 ** 3,
              'installedImageCount': len(image_ids), 'containerCount': len(containers),
              'retainedSetCount': retained_sets, 'pendingImageCount': len(pending),
              'weaveImages': rows,
              'candidateCount': len(eligible),
              'candidateVirtualBytesUpperBound': sum(v['virtualBytes'] for v in eligible),
              'actualReclaimableBytes': None,
              'buildCacheOwnership': 'not-proven',
          }, sort_keys=True))
          PY
