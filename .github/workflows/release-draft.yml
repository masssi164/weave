name: Release draft

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag or release name for the draft, for example v0.1.0"
        required: true
        type: string
      since:
        description: "Include PRs merged at or after this UTC date/datetime"
        required: false
        type: string
      until:
        description: "Include PRs merged at or before this UTC date/datetime"
        required: false
        type: string
      target_commitish:
        description: "Commitish for the draft release"
        required: false
        default: main
        type: string
      prerelease:
        description: "Mark the draft as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    name: Generate reviewable GitHub release draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from merged PR labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "${{ github.repository }}" --base main --output build/release-notes/unreleased.md)
          if [ -n "${{ inputs.since }}" ]; then args+=(--since "${{ inputs.since }}"); fi
          if [ -n "${{ inputs.until }}" ]; then args+=(--until "${{ inputs.until }}"); fi
          python3 tools/release_notes_generate.py "${args[@]}"

      - name: Inject generated notes into README review artifact
        run: python3 tools/readme_release_notes.py --update --source build/release-notes/unreleased.md

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-draft-review-${{ inputs.tag_name }}
          path: |
            build/release-notes/unreleased.md
            README.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_COMMITISH: ${{ inputs.target_commitish }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag=(--prerelease); fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft \
              --target "$TARGET_COMMITISH" \
              --notes-file build/release-notes/unreleased.md \
              "${prerelease_flag[@]}"
          else
            gh release create "$TAG_NAME" \
              --draft \
              --target "$TARGET_COMMITISH" \
              --title "$TAG_NAME" \
              --notes-file build/release-notes/unreleased.md \
              "${prerelease_flag[@]}"
          fi
