name: Main Promotion Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Commit SHA that should be eligible for main promotion"
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify-dev-dogfood-promotion:
    name: Verify dev → dogfood evidence before main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weave
    steps:
      - name: Check out Weave
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: weave
          fetch-depth: 0

      - name: Resolve pinned specification corpus
        id: spec-corpus
        run: |
          set -euo pipefail
          spec_commit="$(
            jq -er '.specCorpus.gitCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              specs/weave-specs.lock.json
          )"
          printf 'commit=%s\n' "$spec_commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Weave Specification Corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/weave-specs
          ref: ${{ steps.spec-corpus.outputs.commit }}
          path: weave-specs
          ssh-key: ${{ secrets.WEAVE_SPECS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Resolve candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CANDIDATE: ${{ inputs.candidate_sha }}
          PR_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            candidate="$DISPATCH_CANDIDATE"
          else
            candidate="$PR_CANDIDATE"
          fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Main promotion requires a full lowercase candidate SHA." >&2
            exit 1
          }
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: ${candidate}"

      - name: Resolve promotion lane
        id: lane
        env:
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "kind=hotfix" >> "$GITHUB_OUTPUT"
            echo "Main lane: hotfix"
          else
            echo "kind=promotion" >> "$GITHUB_OUTPUT"
            echo "Main lane: dev-dogfood promotion"
          fi

      - name: Verify dogfood lane and protected dev source identity
        if: steps.lane.outputs.kind == 'promotion'
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          git fetch origin dev dogfood main --prune
          git merge-base --is-ancestor "$candidate" origin/dogfood || {
            echo "::error::Lane candidate ${candidate} is not contained in origin/dogfood." >&2
            exit 1
          }
          git checkout --detach "$candidate"
          python3 tools/candidate_source_mapping.py \
            --repository . \
            --lane-candidate "$candidate" \
            --output "$RUNNER_TEMP/main-promotion-candidate-source-mapping.json"
          source_candidate="$(jq -er .sourceCandidateCommit "$RUNNER_TEMP/main-promotion-candidate-source-mapping.json")"
          git merge-base --is-ancestor "$source_candidate" origin/dev || {
            echo "::error::Resolved image source ${source_candidate} is not protected by origin/dev." >&2
            exit 1
          }
          echo "SOURCE_CANDIDATE_SHA=$source_candidate" >> "$GITHUB_ENV"
          if git merge-base --is-ancestor "$candidate" origin/main; then
            echo "Lane candidate is already contained in origin/main."
          fi

      - name: Verify hotfix is based on current main
        if: steps.lane.outputs.kind == 'hotfix'
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main "$candidate"; then
            echo "::error::Hotfix candidate ${candidate} is not based on current origin/main." >&2
            exit 1
          fi
          echo "Hotfix candidate is based on current origin/main and must be forward-merged to dev after merge."

      - name: Verify successful dogfood candidate Live Stack E2E for candidate
        if: steps.lane.outputs.kind == 'promotion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/live-stack-e2e.yml/runs?head_sha=${candidate}&status=completed&per_page=20")"
          count="$(python3 -c 'import json,sys; print(sum(1 for run in json.load(sys.stdin).get("workflow_runs", []) if run.get("conclusion") == "success"))' <<<"$runs_json")"
          if [[ "$count" == "0" ]]; then
            echo "::error::No successful Live Stack E2E workflow run found for ${candidate}." >&2
            echo "Open or update the dev -> dogfood promotion PR and wait for dogfood candidate Live Stack E2E evidence before promoting to main." >&2
            exit 1
          fi
          run_url="$(python3 -c 'import json,sys; runs=[run for run in json.load(sys.stdin).get("workflow_runs", []) if run.get("conclusion") == "success"]; print(runs[0].get("html_url", "") if runs else "")' <<<"$runs_json")"
          echo "Successful dogfood candidate Live Stack E2E evidence: ${run_url}"

      - name: Verify successful persistent test-stack deploy for candidate
        if: steps.lane.outputs.kind == 'promotion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/test-stack-deploy.yml/runs?status=completed&per_page=30")"
          found=false
          while read -r run_id run_url; do
            [[ -n "$run_id" ]] || continue
            temp_dir="$(mktemp -d)"
            if gh run download "$run_id" --name weave-test-stack-evidence --dir "$temp_dir" >/dev/null 2>&1 && \
               [[ "$(jq -r '.candidateCommit // empty' "$temp_dir/dogfood-deployment-evidence.json" 2>/dev/null)" == "$candidate" ]] && \
               [[ "$(jq -r '.deployment.stackStatus // empty' "$temp_dir/dogfood-deployment-evidence.json")" == passed ]]; then
              echo "Successful exact-candidate test-stack evidence: ${run_url}"
              found=true
              rm -rf "$temp_dir"
              break
            fi
            rm -rf "$temp_dir"
          done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | [.id, .html_url] | @tsv' <<<"$runs_json")
          if [[ "$found" != true ]]; then
            echo "::error::No successful Test Stack Deploy artifact targets ${candidate}." >&2
            echo "Push/merge the candidate to dogfood and wait for the persistent LAN stack deployment to pass before opening/promoting to main." >&2
            exit 1
          fi

      - name: Require exact-candidate ready human-testing manifest
        if: steps.lane.outputs.kind == 'promotion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          artifact_name="human-testing-readiness-${candidate}"
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/human-testing-readiness.yml/runs?status=completed&per_page=50")"
          found=false
          while read -r run_id run_url; do
            [[ -n "$run_id" ]] || continue
            artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty' <<<"$artifacts")"
            [[ -n "$artifact_id" ]] || continue
            temp_dir="$(mktemp -d)"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$temp_dir/readiness.zip"
            unzip -q "$temp_dir/readiness.zip" -d "$temp_dir/readiness"
            mapfile -t manifests < <(
              find "$temp_dir/readiness" -name human-testing-readiness.json -type f -print
            )
            if [[ "${#manifests[@]}" -eq 1 ]] && \
               manifest="${manifests[0]}" && \
               [[ "$(jq -r '.candidateCommit' "$manifest")" == "$candidate" ]] && \
               [[ "$(jq -r '.sourceCandidateCommit' "$manifest")" == "$SOURCE_CANDIDATE_SHA" ]] && \
               python3 tools/human_testing_readiness_manifest.py validate \
                 --manifest "$manifest" \
                 --provider-age-reference generated-at \
                 --require-ready; then
              echo "Ready human-testing evidence: ${run_url}"
              found=true
              rm -rf "$temp_dir"
              break
            fi
            rm -rf "$temp_dir"
          done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | [.id, .html_url] | @tsv' <<<"$runs")
          if [[ "$found" == "true" ]]; then
            exit 0
          fi

          blocking_run_id=""
          blocking_run_url=""
          blocking_workflow=""
          fallback_environment=""
          fallback_approver=""
          while IFS='|' read -r workflow environment approver; do
            waiting="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=50")"
            blocking_run_id="$(jq -r --arg candidate "$candidate" '[.workflow_runs[] | select((.status == "waiting" or .status == "queued" or .status == "in_progress") and (.display_title | contains($candidate)))][0].id // empty' <<<"$waiting")"
            if [[ -n "$blocking_run_id" ]]; then
              blocking_run_url="$(jq -r --argjson id "$blocking_run_id" '.workflow_runs[] | select(.id == $id) | .html_url' <<<"$waiting")"
              blocking_workflow="$workflow"
              fallback_environment="$environment"
              fallback_approver="$approver"
              break
            fi
          done <<'EOF'
          test-stack-deploy.yml|dogfood|Weave release owner or dogfood operator
          ios-dogfood.yml|ios-dogfood|Weave release owner plus client/iOS release owner
          physical-iphone-human-test.yml|ios-dogfood|Weave release owner plus client/iOS release owner
          human-testing-readiness.yml|dogfood|Weave release owner or dogfood operator
          EOF
          if [[ -n "$blocking_run_id" ]]; then
            pending="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${blocking_run_id}/pending_deployments" 2>/dev/null || printf '[]')"
            environment="$(jq -r --arg fallback "$fallback_environment" '.[0].environment.name // $fallback' <<<"$pending")"
            approver="$(jq -r --arg fallback "$fallback_approver" '.[0].reviewers[0].reviewer.name // .[0].reviewers[0].reviewer.login // $fallback' <<<"$pending")"
            echo "::error::human-testing readiness is blocked workflow=${blocking_workflow} environment=${environment} run=${blocking_run_url} commit=${candidate} requiredApprover=${approver}" >&2
          else
            echo "::error::human-testing readiness is blocked workflow=Human Testing Readiness environment=dogfood run=not-started commit=${candidate} requiredApprover=Weave release owner or dogfood operator reason=no-ready-manifest" >&2
          fi
          exit 1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Verify root contract authority checks still pass
        run: ./gradlew --no-daemon --max-workers=1 contractAuthorityArchitectureCheck --console=plain
