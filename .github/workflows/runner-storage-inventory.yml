name: Temporary Weave storage provenance inventory

on:
  push:
    branches: [diagnostic/runner-storage-provenance-20261027]
    paths: [.github/workflows/runner-storage-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'masssi164/weave' && github.ref == 'refs/heads/diagnostic/runner-storage-provenance-20261027'
    runs-on: [self-hosted, macOS, ARM64, weave-live]
    timeout-minutes: 5
    concurrency:
      group: weave-live-mac-mini-exclusive
      cancel-in-progress: false
    steps:
      - name: Read bounded cache and image provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Read-only cache and legacy image provenance; never authorize deletion from size."""
          import concurrent.futures
          import fcntl
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          
          GIB = 1024 ** 3
          SHA = re.compile(r"[0-9a-f]{40}\Z")
          DIGEST = re.compile(r"sha256:[0-9a-f]{64}\Z")
          ID = re.compile(r"[a-z0-9]{8,80}\Z")
          CONTAINER = re.compile(r"[0-9a-f]{64}\Z")
          NAMESPACE = re.compile(r"weave-e2e-[0-9a-f]{16}\Z")
          SOURCE = "https://github.com/masssi164/weave"
          REPOSITORIES = {SOURCE, SOURCE + ".git", "git@github.com:masssi164/weave", "git@github.com:masssi164/weave.git"}
          TITLES = {"weave-backend": "Weave Server", "weave-mcp-server": "Weave MCP Server"}
          LEGACY_TAG = re.compile(r"(weave-backend|weave-mcp-server):test-app-(weave-e2e-[0-9a-f]{16})\Z")
          STAGES = {"images", "ledger", "container-list", "container-inspect", "image-list", "image-inspect", "cache", "builder-inspect", "builder-list", "cache-records", "build-history"}
          REASONS = {"command-or-json-unavailable", "container-list-unavailable", "container-shape-rejected", "container-identities-incomplete", "image-list-unavailable", "image-shape-rejected", "builder-context-unproven", "cache-record-limit-or-json-unavailable", "cache-id-rejected", "cache-parents-rejected", "cache-size-rejected", "cache-states-rejected", "cache-description-rejected", "unexpected-shape"}
          
          
          class InventoryFailure(ValueError):
              def __init__(self, reason):
                  self.reason = reason if reason in REASONS else "unexpected-shape"
          
          
          def collect_section(name, collector):
              progress = {"status": "pending", "stage": name}
              try:
                  result = collector(progress)
                  if result.get("status") == "complete":
                      result.pop("stage", None)
                  return result
              except (OSError, ValueError, KeyError, TypeError, AttributeError, IndexError) as error:
                  progress["status"] = "unavailable"
                  progress["stage"] = progress.get("stage") if progress.get("stage") in STAGES else name
                  progress["reason"] = error.reason if isinstance(error, InventoryFailure) else "unexpected-shape"
                  return progress
          
          
          def command(arguments, timeout=15):
              """Capture raw output privately; print neither failed commands nor stderr."""
              try:
                  value = subprocess.run(arguments, capture_output=True, text=True, timeout=timeout)
              except (OSError, subprocess.SubprocessError):
                  return None
              return value.stdout if value.returncode == 0 and len(value.stdout.encode()) <= 2 * 1024 * 1024 else None
          
          
          def objects(value):
              if value is None:
                  return None
              try:
                  parsed = json.loads(value)
                  return parsed if isinstance(parsed, list) else [parsed]
              except ValueError:
                  try:
                      return [json.loads(line) for line in value.splitlines() if line.strip()]
                  except ValueError:
                      return None
          
          
          def digest(value):
              return hashlib.sha256(str(value).encode()).hexdigest()
          
          
          def private_ledger():
              path = Path.home() / ".weave/artifact-runtime-images/ledger.json"
              lock = path.with_suffix(".json.lock")
              for file in (path, lock):
                  if any(item.is_symlink() for item in (file, *file.parents)):
                      raise ValueError("ledger path rejected")
                  info = file.stat()
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid() or info.st_mode & 0o077 or info.st_nlink != 1 or info.st_size > 256 * 1024:
                      raise ValueError("ledger ownership rejected")
              with lock.open("rb") as stream:
                  fcntl.flock(stream, fcntl.LOCK_SH | fcntl.LOCK_NB)
                  value = json.loads(path.read_text())
              if value.get("schemaVersion") not in {"weave.runtime-image-ledger/v1", "weave.runtime-image-ledger/v2"} or value.get("ownerUid") != os.getuid():
                  raise ValueError("ledger schema rejected")
              retained = value.get("retainedSets")
              pending = value.get("pendingImageIds")
              if not isinstance(retained, list) or len(retained) > 2 or not isinstance(pending, list) or len(pending) > 2048 or any(not isinstance(item, str) or not DIGEST.fullmatch(item) for item in pending):
                  raise ValueError("ledger bounds rejected")
              image_ids = set()
              for item in retained:
                  if not isinstance(item, dict) or set(item.get("images", {})) != {"backend", "mcp", "keycloak", "runtimeState"}:
                      raise ValueError("retained images rejected")
                  for image in item["images"].values():
                      if not isinstance(image, str) or not DIGEST.fullmatch(image):
                          raise ValueError("retained identity rejected")
                      image_ids.add(image)
              return image_ids, {"status": "verified", "retainedSetCount": len(retained), "retainedImageIds": sorted(image_ids), "pendingImageCount": len(pending)}
          
          
          def image_inventory(progress):
              progress["stage"] = "ledger"
              try:
                  retained, ledger = private_ledger()
              except (OSError, ValueError, TypeError):
                  retained, ledger = set(), {"status": "unavailable", "deletionEligibility": "unknown"}
              progress["ledger"] = ledger
              progress["stage"] = "container-list"
              ids = command(["docker", "container", "ls", "--all", "--quiet", "--no-trunc"])
              if ids is None or len(ids.split()) > 1000 or any(not CONTAINER.fullmatch(item) for item in ids.split()):
                  raise InventoryFailure("container-list-unavailable")
              containers = []
              progress["containers"] = containers
              progress["containerInventoryComplete"] = False
              progress["stage"] = "container-inspect"
              for offset in range(0, len(ids.split()), 40):
                  batch = ids.split()[offset:offset + 40]
                  projection = '{"id":{{json .Id}},"image":{{json .Image}},"running":{{json .State.Running}},"namespace":{{json (index .Config.Labels "com.massimotter.weave.namespace")}}}'
                  records = objects(command(["docker", "container", "inspect", "--format", projection, *batch]))
                  if records is None:
                      raise InventoryFailure("command-or-json-unavailable")
                  if len(records) != len(batch) or any(not isinstance(item, dict) for item in records) or {item.get("id") for item in records} != set(batch):
                      raise InventoryFailure("container-identities-incomplete")
                  for item in records:
                      if not isinstance(item.get("id"), str) or not CONTAINER.fullmatch(item["id"]) or not isinstance(item.get("image"), str) or not DIGEST.fullmatch(item["image"]) or type(item.get("running")) is not bool:
                          raise InventoryFailure("container-shape-rejected")
                      row = {"id": item["id"], "imageId": item["image"], "running": item["running"]}
                      if isinstance(item.get("namespace"), str) and NAMESPACE.fullmatch(item["namespace"]):
                          row["isolatedWeaveNamespace"] = item["namespace"]
                      containers.append(row)
              progress["containerInventoryComplete"] = True
              used = {item["imageId"] for item in containers}
              progress["stage"] = "image-list"
              ids = command(["docker", "image", "ls", "--all", "--quiet", "--no-trunc", "--filter", "label=org.opencontainers.image.source=" + SOURCE])
              if ids is None or len(set(ids.split())) > 500 or any(not DIGEST.fullmatch(item) for item in ids.split()):
                  raise InventoryFailure("image-list-unavailable")
              image_ids = sorted(set(ids.split()))
              images = []
              progress["weaveImages"] = images
              progress["stage"] = "image-inspect"
              projection = '{"id":{{json .Id}},"bytes":{{json .Size}},"tags":{{json .RepoTags}},"references":{{json .RepoDigests}},"source":{{json (index .Config.Labels "org.opencontainers.image.source")}},"revision":{{json (index .Config.Labels "org.opencontainers.image.revision")}},"title":{{json (index .Config.Labels "org.opencontainers.image.title")}},"provenance":{{json (index .Config.Labels "com.massimotter.weave.provenance-reference")}}}'
              for offset in range(0, len(image_ids), 30):
                  records = objects(command(["docker", "image", "inspect", "--format", projection, *image_ids[offset:offset + 30]]))
                  if records is None:
                      raise InventoryFailure("command-or-json-unavailable")
                  for value in records:
                      identity = value.get("id", "")
                      tags, references = value.get("tags") or [], value.get("references") or []
                      if not DIGEST.fullmatch(identity) or value.get("source") != SOURCE or not isinstance(tags, list) or not isinstance(references, list):
                          raise InventoryFailure("image-shape-rejected")
                      matched = [LEGACY_TAG.fullmatch(tag) for tag in tags if isinstance(tag, str)]
                      matched = [match for match in matched if match]
                      revision = value.get("revision", "")
                      provenance = bool(matched) and len(matched) == len(tags) and not references and value.get("provenance") == "local-test-app-not-published" and all(value.get("title") == TITLES[match.group(1)] for match in matched) and isinstance(revision, str) and bool(SHA.fullmatch(revision))
                      images.append({
                          "id": identity, "virtualBytes": value.get("bytes"),
                          "legacyTags": [match.group(0) for match in matched],
                          "unknownTagCount": len(tags) - len(matched), "registryReferenceCount": len(references),
                          "sourceCommit": revision if isinstance(revision, str) and SHA.fullmatch(revision) else None,
                          "exactLegacyLabelTagProvenance": provenance, "referencedByAnyContainer": identity in used,
                          "protectedByRetainedSet": identity in retained if ledger["status"] == "verified" else None,
                          "legacyLabelsAndDirectReferenceChecksPass": provenance and identity not in used and ledger["status"] == "verified" and identity not in retained,
                          "runAssociationVerified": False, "hostBytesReclaimable": None,
                      })
              return {"status": "complete", "ledger": ledger, "containers": containers, "weaveImages": images}
          
          
          def cache_inventory(result):
              result["stage"] = "builder-inspect"
              context = command(["docker", "context", "show"])
              inspect = command(["docker", "buildx", "inspect", "--timeout", "5s"])
              fields = {}
              for line in (inspect or "").splitlines():
                  key, separator, value = line.partition(":")
                  if separator:
                      fields.setdefault(key.strip(), []).append(value.strip())
              result.update({"cacheRecordOwnership": "not-proven", "builderExclusiveOwnership": "not-proven"})
              result["stage"] = "builder-list"
              builders = objects(command(["docker", "buildx", "ls", "--format", "{{json .Builder}}", "--timeout", "5s"]))
              result["builderListAvailable"] = builders is not None
              if builders is not None:
                  unique = {item.get("Name", ""): item for item in builders if isinstance(item, dict)}
                  result["builders"] = [{"identityHash": digest(name), "selected": fields.get("Name", [""])[0] == name,
                                         "driver": value.get("Driver") if value.get("Driver") in {"docker", "docker-container", "remote", "kubernetes"} else "unknown",
                                         "nodeCount": len(value.get("Nodes") or [])} for name, value in list(unique.items())[:12]]
              driver = fields.get("Driver", [""])[0]
              result["selectedDriver"] = driver if driver in {"docker", "docker-container", "remote", "kubernetes"} else "unknown"
              if context is None or driver != "docker" or fields.get("Endpoint") != [context.strip()]:
                  result["stage"] = "builder-inspect"
                  raise InventoryFailure("builder-context-unproven")
              result["sameActiveDockerContext"] = True
              result["selectedBuilderHash"] = digest(fields.get("Name", [""])[0])
              result["stage"] = "cache-records"
              records = objects(command(["docker", "buildx", "du", "--format=json", "--timeout", "5s"]))
              if records is None or len(records) > 300:
                  raise InventoryFailure("cache-record-limit-or-json-unavailable")
              rows = []
              result["cacheRecords"] = rows
              for item in records:
                  identity, parents, size = item.get("ID", ""), item.get("Parents") or [], str(item.get("Size", ""))
                  if not isinstance(identity, str) or not ID.fullmatch(identity):
                      raise InventoryFailure("cache-id-rejected")
                  if not isinstance(parents, list) or any(not isinstance(parent, str) or not ID.fullmatch(parent) for parent in parents):
                      raise InventoryFailure("cache-parents-rejected")
                  if not size.isdecimal():
                      raise InventoryFailure("cache-size-rejected")
                  if any(type(item.get(key)) is not bool for key in ("Mutable", "Reclaimable", "Shared")):
                      raise InventoryFailure("cache-states-rejected")
                  if not isinstance(item.get("Description"), str):
                      raise InventoryFailure("cache-description-rejected")
                  rows.append({"id": identity, "parents": parents, "bytes": int(size),
                               "reclaimable": item["Reclaimable"], "shared": item["Shared"], "mutable": item["Mutable"],
                               "type": item.get("Type") if item.get("Type") in {"internal", "frontend", "source.local", "source.git.checkout", "exec.cachemount", "regular"} else "unknown",
                               "descriptionSha256": digest(item["Description"]),
                               "descriptionContainsPublicWeaveSource": any(source in item["Description"] for source in REPOSITORIES),
                               "ownership": "not-proven"})
              result["cacheRecords"] = rows
              result["privateReclaimableBytesUpperBound"] = sum(row["bytes"] for row in rows if row["reclaimable"] and not row["shared"])
              result["stage"] = "build-history"
              history = objects(command(["docker", "buildx", "history", "ls", "--format", "json", "--no-trunc"]))
              result["historyAvailable"] = history is not None
              if history is not None:
                  selected = [item["ID"] for item in history[:40] if isinstance(item, dict) and isinstance(item.get("ID"), str) and ID.fullmatch(item["ID"])]
                  result["historyCount"] = len(history)
                  result["historySampledCount"] = len(selected)
          
                  def inspect_record(ref):
                      details = objects(command(["docker", "buildx", "history", "inspect", "--format", "json", ref], timeout=5))
                      if not details or len(details) != 1:
                          return {"id": ref, "status": "unavailable"}
                      value = details[0]
                      exact, revision = value.get("VCSRepository") in REPOSITORIES, value.get("VCSRevision", "")
                      return {"id": ref, "exactWeaveRepository": exact,
                              "weaveSourceCommit": revision if exact and isinstance(revision, str) and SHA.fullmatch(revision) else None,
                              "cacheRecordAssociationProven": False}
          
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                      result["buildHistory"] = list(pool.map(inspect_record, selected))
              result["status"] = "complete"
              return result
          
          
          def main():
              if os.environ.get("RUNNER_NAME") != "weave-live-mac-mini":
                  raise ValueError("runner identity rejected")
              workspace = Path(os.environ["GITHUB_WORKSPACE"])
              if not workspace.is_absolute() or not workspace.is_dir() or workspace.is_symlink():
                  raise ValueError("workspace rejected")
              result = {"schemaVersion": "weave.runner-storage-provenance/v1", "mode": "read-only",
                        "supportSafe": True, "containsSecretValues": False, "deleteAuthority": "none",
                        "minimumFreeBytes": 20 * GIB, "freeBytesBefore": shutil.disk_usage(workspace).free}
              result["images"] = collect_section("images", image_inventory)
              result["cache"] = collect_section("cache", cache_inventory)
              result["status"] = "complete" if all(result[name].get("status") == "complete" for name in ("images", "cache")) else "partial"
              result["freeBytesAfter"] = shutil.disk_usage(workspace).free
              print(json.dumps(result, sort_keys=True))
          
          
          if __name__ == "__main__":
              try:
                  main()
              except (OSError, ValueError, KeyError, TypeError, AttributeError, IndexError):
                  print(json.dumps({"schemaVersion": "weave.runner-storage-provenance/v1", "status": "unavailable", "stage": "runner-preflight", "reason": "invalid-context", "mode": "read-only", "deleteAuthority": "none", "supportSafe": True, "containsSecretValues": False}, sort_keys=True))
                  raise SystemExit(1) from None
          PYTHON
