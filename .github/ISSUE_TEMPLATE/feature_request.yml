name: Feature request
description: Propose a product capability, workflow, provider facade, or professionalization slice
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this for new or changed product behavior. Keep Weave domain-first: client/member UX should see Weave concepts, not raw provider administration.

        Quality Reset: product behavior and product claims require repo-local specs plus mapped Gherkin acceptance contracts before implementation/merge. Do not invent product meaning in this issue; link the spec work or mark it as required first.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user, admin, operator, or contributor outcome should improve?
      placeholder: "Example: Admin can dry-run replacing the Chat provider while members keep seeing Weave Chat."
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Primary Weave domain
      options:
        - chat
        - files/docs
        - calendar
        - boards/tasks
        - meetings
        - decisions
        - identity/IDM
        - admin/provider readiness
        - manuals/help
        - release/evidence
        - specs/dev workflow
        - weaver/AI runtime
        - cross-cutting
    validations:
      required: true
  - type: textarea
    id: spec-link
    attributes:
      label: Repo-local spec / Spec Kit link
      description: Link `specs/NNNN-slug/spec.md`, plan, tasks, or traceability entry. Product behavior changes must create/update this before implementation unless this is a pure bugfix with pragmatic acceptance notes.
      value: |
        Spec: TBD
        Plan/tasks: TBD
        Traceability: TBD
        Spec needed before implementation: yes/no
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Mapped Gherkin / evidence gate
      description: Name the Gherkin feature/scenario, scenario mapping, and evidence gate. Use canonical `evidenceMode` (`offline-spec` or `live-runtime`) and `realityLevel` when applicable; only `release_ready` may support customer-ready wording.
      value: |
        Gherkin scenario and mapping:
        -

        Evidence mode / reality level: offline-spec or live-runtime; contract_only/configured/live_read/live_write/migration_dry_run/migration_apply_ready/rollback_ready/release_ready when applicable
        Required gates:
        -
    validations:
      required: true
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture boundaries
      options:
        - label: Client/member UX stays Weave-domain-first and does not call raw provider/admin APIs directly.
        - label: Provider secrets, app passwords, bearer tokens, and raw provider errors stay out of client UX, logs, docs, and support bundles.
        - label: Admin/operator-only setup/readiness/migration details are separated from normal member flows.
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and localization considerations
      description: Keyboard, screen reader, semantics, visible focus, text scaling, localization, non-color-only states.

  - type: textarea
    id: risk-veto
    attributes:
      label: Risk, privacy, accessibility, and Fachveto
      description: Name the relevant review/veto owner for product/spec, architecture, security/privacy, accessibility, provider, release, or evidence risk. Small pure bugfixes may state a lightweight veto path.
      value: |
        Risk/privacy/a11y impact:
        -

        Fachveto owner/path:
        -

        Support-safe evidence constraints:
        - no secrets, raw tokens, raw provider payloads, raw endpoints, openclaw.json, or SecretRef/CredentialRef values
    validations:
      required: true
  - type: textarea
    id: monorepo-impact
    attributes:
      label: Monorepo / release impact
      description: Note affected areas such as client, server, infra, e2e, docs, release notes, README, manuals, or screenshots.
  - type: dropdown
    id: release-notes
    attributes:
      label: Expected release-notes label
      description: Pick the label the eventual PR should carry.
      options:
        - release-notes-feature
        - release-notes-bugfix
        - release-notes-skip
    validations:
      required: true
