plugins {
    id 'java-library'
}

group = 'com.massimotter.weave'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def keycloakVersion = '26.7.0'

dependencies {
    compileOnly "org.keycloak:keycloak-core:${keycloakVersion}"
    compileOnly "org.keycloak:keycloak-server-spi:${keycloakVersion}"
    compileOnly "org.keycloak:keycloak-server-spi-private:${keycloakVersion}"
    compileOnly "org.keycloak:keycloak-services:${keycloakVersion}"

    testImplementation platform(libs.spring.boot.bom)
    testImplementation "org.keycloak:keycloak-core:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-server-spi:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-server-spi-private:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-services:${keycloakVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar') {
    archiveBaseName = 'weave-workload-client-registration-provider'
    manifest {
        attributes(
            'Implementation-Title': 'Weave Keycloak Workload Client Registration Provider',
            'Implementation-Version': project.version,
            'Weave-Keycloak-Version': keycloakVersion,
            'Weave-Provider-Id': 'weave-workload-client-registration-enforcer'
        )
    }
}
