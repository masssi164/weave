site_name: Weave Documentation
site_description: Provider-neutral Weave product, operator, and developer documentation.
repo_url: https://github.com/masssi164/weave
repo_name: masssi164/weave
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/docs-site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - User Handbook: user-handbook.md
  - Admin/Operator Handbook: admin-operator-handbook.md
  - Developer Handbook:
      - Overview: developer-handbook.md
      - Weave operating model: weave-operating-model.md
      - Spec-driven development: spec-driven-development.md
      - Agent-team orchestration: agent-team-orchestration.md
      - Trunk-based PR and release workflow: gitflow-pr-workflow.md
      - Architecture: architecture.md
      - Canonical feature models: canonical-feature-models.md
      - Acceptance contracts: acceptance-contracts.md
      - Quality and evidence: quality-and-evidence.md
      - Build, evidence, and delivery system: build-evidence-delivery-system.md
      - Enterprise release foundation: enterprise-release-foundation.md
      - Sprint 1 completion report: sprint-1-completion-report.md
      - Sprint 3 closure report: sprint-3-closure-report.md
      - Sprint 4 plan: sprint-4-plan.md
      - Sprint 4 closure report: sprint-4-closure-report.md
      - Sprint 5 closure report: sprint-5-closure-report.md
      - Sprint 6 kickoff plan: sprint-6-kickoff-plan.md
      - Sprint 6 epic closure report: sprint-6-epic-closure-report.md
      - Sprint 6 closure report: sprint-6-closure-report.md
      - v0.1.0-rc.2 release evidence: release-v0.1-rc2-evidence.md
      - Accessibility release gate: accessibility-release-gate.md
      - ISO 9241-110 dogfood UX gate: iso-9241-110-dogfood-ux-gate.md
  - Product and Release Scope:
      - Product line and Weaver plan: product-line-and-weaver-plan.md
      - "Strategy sprint: organization embedding": strategy-sprint-org-embedding-plan.md
      - Organization embedding contract: organization-embedding-contract.md
      - Identity provisioning strategy: identity-provisioning-strategy.md
      - Admin-Suite readiness and setup contract: admin-suite-readiness-setup-contract.md
      - Provider replacement and anti-silo contract: provider-replacement-and-anti-silo-contract.md
      - Manuals and release notes integration: manuals-and-release-notes-integration.md
      - v0.1 dogfood plan: release-v0.1-dogfood-plan.md
      - v0.1 Golden Path readiness: v0.1-golden-path.md
      - Admin-provisioned first use: admin-provisioned-first-use.md
      - Product acceptance flows: product-acceptance-flows.md
      - Product flow activity diagrams: product-flow-activity-diagrams.md
      - Calendar, E2EE, and boards scope: product-calendar-e2ee-boards-scope.md
      - Roadmap and guarded surfaces: roadmap-and-guarded-surfaces.md
      - Interop gateway and external collaboration: interop-gateway-and-external-collaboration.md
      - Control plane and infra bootstrap: control-plane-infra-bootstrap.md
  - Diagrams:
      - Overview: diagrams/index.md
      - Facade architecture source: diagrams/architecture_facade.mmd
      - Chat ER source: diagrams/er_chat.mmd
      - Files and docs ER source: diagrams/er_files_docs.mmd
      - Calendar and meetings ER source: diagrams/er_calendar_meetings.mmd
      - Boards and tasks ER source: diagrams/er_boards_tasks.mmd
      - Identity/admin ER source: diagrams/er_identity_admin.mmd
  - Release Notes:
      - Process: release-notes/index.md
